<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celebration Suite Platform Admin</title><style>
:root{--ink:#2e1836;--cream:#fbf8f2;--paper:#fff;--sage:#adbea0;--line:#ded5df;--muted:#746c78;--red:#a63d4b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.top{background:var(--ink);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.top b{font-size:18px}.btn{border:1px solid #cfc5d2;border-radius:10px;background:#fff;padding:9px 12px;font-weight:750;cursor:pointer;color:var(--ink);text-decoration:none}.btn.primary{background:var(--sage)}.shell{max-width:1500px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 8px 24px #2e18360d}.stat strong{display:block;font-size:28px;margin-top:6px}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:750;cursor:pointer}.tab.active{background:var(--ink);color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}.badge{display:inline-block;border-radius:999px;background:#f0ece8;padding:4px 8px;font-size:12px;font-weight:800}.bad{background:#f7d6d9;color:#7d2531}.good{background:#dcebd6;color:#315535}.warn{background:#f9e6bd;color:#75500c}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,96vw);background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 35px #2e183622;padding:20px;overflow:auto;z-index:20}.hidden{display:none}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.shell{padding:12px}}
</style><script src="/assets/tenant-branding.js"></script></head><body><header class="top"><div><b>Celebration Suite · Platform Admin</b><div style="font-size:12px;opacity:.75">Owner support, access and diagnostics</div></div><div><a class="btn" href="/commercial-admin.html">Commercial Launch</a> <a class="btn" href="/launch-readiness.html">Launch Readiness</a> <a class="btn" href="/launch-health.html">System Health</a> <button class="btn" id="logoutBtn">Sign out</button></div></header><main class="shell">
<div class="stats"><div class="card stat"><span class="muted">Tenants</span><strong id="sTenants">—</strong></div><div class="card stat"><span class="muted">Users</span><strong id="sUsers">—</strong></div><div class="card stat"><span class="muted">Open support</span><strong id="sSupport">—</strong></div><div class="card stat"><span class="muted">Active licenses</span><strong id="sLicenses">—</strong></div><div class="card stat"><span class="muted">Recent errors</span><strong id="sErrors">—</strong></div></div>
<div class="toolbar"><input id="search" style="min-width:320px" placeholder="Search business, user, email, event, ticket…"><select id="tenantFilter"><option value="">All tenants</option></select><button class="btn primary" id="refreshBtn">Refresh</button><span class="muted" id="stamp"></span></div>
<div class="tabs"><button class="tab active" data-view="health">Account Health</button><button class="tab" data-view="tenants">Tenants</button><button class="tab" data-view="users">Users</button><button class="tab" data-view="support">Support</button><button class="tab" data-view="audit">Activity Logs</button><button class="tab" data-view="integrations">Integrations</button><button class="tab" data-view="licenses">Licenses</button><button class="tab" data-view="errors">Errors</button><button class="tab" data-view="fulfillment">License Fulfillment</button></div>
<section class="card"><div id="view"></div></section>
</main><aside id="drawer" class="drawer hidden"><button class="btn" id="closeDrawer">Close</button><div id="drawerBody"></div></aside>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={base:null,obs:null,health:null,view:'health'};
async function j(url,opt){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opt?.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
const tenantName=id=>state.obs?.tenants?.find(x=>x.id===id)?.business_name||id||'—',fmt=v=>v?new Date(v).toLocaleString():'Never';
async function load(){try{await j('/.netlify/functions/platform-auth-session');const [base,obs,health]=await Promise.all([j('/.netlify/functions/platform-admin').catch(()=>({tenants:[],licenses:[],codes:[],orders:[]})),j('/.netlify/functions/platform-observability'),j('/.netlify/functions/platform-health').catch(()=>({summary:{tenants:0,healthy:0,attention:0},tenants:[]}))]);state.base=base;state.obs=obs;state.health=health;stamp.textContent='Updated '+new Date().toLocaleTimeString();hydrate();render()}catch(e){if(/Unauthorized/i.test(e.message)){location='/platform-login.html';return}view.innerHTML=`<div class="empty"><b>Could not load platform diagnostics.</b><br>${esc(e.message)}<br><br><button class="btn" onclick="load()">Retry</button></div>`}}
function hydrate(){const o=state.obs;sTenants.textContent=o.tenants.length;sUsers.textContent=o.users.length;sSupport.textContent=o.support.filter(x=>!['resolved','closed'].includes(String(x.status||'').toLowerCase())).length;sLicenses.textContent=(o.licenses||[]).filter(x=>['active','grace','past_due'].includes(String(x.status||'').toLowerCase())).length;sErrors.textContent=(o.errors||[]).filter(x=>!x.resolved_at).length;tenantFilter.innerHTML='<option value="">All tenants</option>'+o.tenants.map(t=>`<option value="${esc(t.id)}">${esc(t.business_name||t.name||t.id)}</option>`).join('')}
function filt(rows){const q=search.value.trim().toLowerCase(),tid=tenantFilter.value;return (rows||[]).filter(x=>(!tid||x.tenant_id===tid||x.id===tid)&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function render(){const o=state.obs||{},b=state.base||{},h=state.health||{tenants:[]};document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));if(state.view==='health'){const rows=filt(h.tenants||[]).map(x=>{const cls=x.score>=90?'good':x.score>=70?'warn':'bad';const ints=(x.integrations?.configured||[]).join(', ')||'None';const miss=(x.integrations?.missing||[]).join(', ')||'None';return `<tr><td><button class="btn" onclick="detailTenant('${esc(x.tenant_id)}')">${esc(x.business_name)}</button></td><td><span class="badge ${cls}">${esc(x.score)}%</span></td><td>${esc(x.license?.status||'No license')}</td><td>${esc(ints)}</td><td>${esc(miss)}</td><td>${esc((x.warnings||[]).join(' · ')||'Healthy')}</td><td>${esc(x.counts?.open_support||0)}</td><td>${esc(x.counts?.unresolved_errors||0)}</td></tr>`});view.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><span class="badge good">Healthy ${esc(h.summary?.healthy||0)}</span><span class="badge warn">Needs attention ${esc(h.summary?.attention||0)}</span><span class="badge">Tenants ${esc(h.summary?.tenants||0)}</span></div>${table(['Business','Health','License','Connected','Not configured','Warnings','Support','Errors'],rows)}`;return}if(state.view==='tenants'){const rows=filt(o.tenants).map(t=>`<tr><td><button class="btn" onclick="detailTenant('${esc(t.id)}')">${esc(t.business_name||t.name||'Tenant')}</button></td><td>${esc(t.status||'')}</td><td>${(o.users||[]).filter(u=>u.tenant_id===t.id).length}</td><td>${(o.events||[]).filter(e=>e.tenant_id===t.id).length}</td><td>${fmt(t.created_at)}</td></tr>`);view.innerHTML=table(['Business','Status','Users','Events','Created'],rows)}
else if(state.view==='users'){const rows=filt(o.users).map(u=>`<tr><td><button class="btn" onclick="detailUser('${esc(u.id)}')"><b>${esc(u.full_name||u.email||'User')}</b></button><br>${esc(u.email||'')}</td><td>${esc(tenantName(u.tenant_id))}</td><td>${esc(u.role||'')}</td><td>${esc(u.status||'')}</td><td>${fmt(u.last_login_at)}</td><td>${fmt(u.created_at||u.auth_created_at)}</td></tr>`);view.innerHTML=table(['User','Business','Role','Status','Last login','Created'],rows)}
else if(state.view==='support'){const rows=filt(o.support).map(x=>`<tr><td><button class="btn" onclick="detailSupport('${esc(x.id)}')">${esc(x.subject||x.title||x.id)}</button></td><td>${esc(tenantName(x.tenant_id))}</td><td><span class="badge">${esc(x.status||'open')}</span></td><td>${esc(x.priority||'')}</td><td>${fmt(x.created_at)}</td><td>${fmt(x.updated_at)}</td></tr>`);view.innerHTML=(o.missing?.support?'<p class="muted">No support-ticket table was detected in this deployment.</p>':'')+table(['Ticket','Business','Status','Priority','Opened','Updated'],rows)}
else if(state.view==='audit'){const rows=filt(o.audit).slice(0,1000).map(x=>`<tr><td>${fmt(x.created_at||x.occurred_at)}</td><td>${esc(tenantName(x.tenant_id))}</td><td>${esc(x.actor_email||x.user_email||x.actor_name||x.user_id||'System')}</td><td>${esc(x.action||x.event_type||x.activity_type||'Activity')}</td><td>${esc(x.entity_type||x.resource_type||'')}</td><td>${esc(x.entity_id||x.resource_id||'')}</td></tr>`);view.innerHTML=table(['Time','Business','Actor','Action','Resource','ID'],rows)}
else if(state.view==='integrations'){const rows=filt(o.integrations).map(x=>`<tr><td>${esc(tenantName(x.tenant_id))}</td><td>${esc(x.provider||x.kind||x.integration_type||x.type||'Integration')}</td><td><span class="badge ${x.status==='connected'||x.status==='configured'?'good':''}">${esc(x.status||(x.connected?'connected':'unknown'))}</span></td><td>${fmt(x.updated_at)}</td><td>${esc(x.last_error||x.error_message||'')}</td><td><button class="btn" onclick="disconnectIntegration('${esc(x.id)}')">Disconnect</button></td></tr>`);view.innerHTML=table(['Business','Integration','Status','Updated','Last error','Action'],rows)}
else if(state.view==='licenses'){const rows=filt(o.licenses).map(x=>`<tr><td>${esc(tenantName(x.tenant_id))}</td><td>${esc(x.plan_type||x.plan||'')}</td><td><span class="badge">${esc(x.status||'')}</span></td><td>${fmt(x.starts_at||x.created_at)}</td><td>${fmt(x.expires_at||x.current_period_end)}</td><td>${esc(x.source||'')}</td><td><button class="btn" onclick="extendLicense('${esc(x.id)}')">Extend</button></td></tr>`);view.innerHTML=table(['Business','Plan','Status','Started','Expires/Renews','Source','Action'],rows)}
else if(state.view==='errors'){const rows=filt(o.errors).map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(tenantName(x.tenant_id))}</td><td>${esc(x.level||x.severity||'error')}</td><td>${esc(x.message||x.error||x.title||'')}</td><td>${esc(x.path||x.page_path||x.function_name||x.source||'')}</td><td>${x.resolved_at?'<span class="badge good">Resolved</span>':`<button class="btn" onclick="resolveError('${esc(x.id)}')">Resolve</button>`}</td></tr>`);view.innerHTML=(o.missing?.errors?'<p class="muted">No centralized error-log table was detected. Audit and support logs are still available.</p>':'')+table(['Time','Business','Level','Message','Source','Action'],rows)}
else{const codes=b.codes||[],orders=b.orders||[];view.innerHTML=`<h2>License Fulfillment</h2><p class="muted">Create an activation code for a marketplace/manual order and keep fulfillment history in the platform console.</p><div class="card" style="margin:12px 0;background:#fbf8f2"><h3>Fulfill Marketplace Order</h3><div class="toolbar"><input id="mfName" placeholder="Buyer name"><input id="mfEmail" placeholder="Buyer email"><input id="mfOrder" placeholder="External order ID"><select id="mfPlan"><option value="single_event">Single event</option><option value="annual_unlimited">Annual unlimited</option></select><input id="mfDate" type="date" title="Event date for single-event licenses"><input id="mfAmount" type="number" min="0" step="0.01" placeholder="Amount"><button class="btn primary" id="mfSubmit">Create license code</button></div><div id="mfResult" class="muted"></div></div><p><a class="btn" href="/pricing.html">Pricing</a> <a class="btn" href="/billing.html">Billing</a></p>${table(['Recent order','Buyer','Plan','Status'],orders.slice(0,100).map(x=>`<tr><td>${esc(x.external_order_id||x.id)}</td><td>${esc(x.buyer_email||'')}</td><td>${esc(x.plan_type||'')}</td><td>${esc(x.status||'')}</td></tr>`))}${table(['Code','Plan','Source','Status'],codes.slice(0,200).map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${esc(x.plan_type||'')}</td><td>${esc(x.source||'')}</td><td>${x.redeemed_at?'Redeemed':'Available'}</td></tr>`))}`;const mfSubmit=document.getElementById('mfSubmit');if(mfSubmit)mfSubmit.onclick=async()=>{const result=document.getElementById('mfResult');result.textContent='Creating…';try{const d=await j('/.netlify/functions/marketplace-order',{method:'POST',body:JSON.stringify({buyer_name:document.getElementById('mfName').value,buyer_email:document.getElementById('mfEmail').value,external_order_id:document.getElementById('mfOrder').value,plan_type:document.getElementById('mfPlan').value,event_date:document.getElementById('mfDate').value||null,amount:Number(document.getElementById('mfAmount').value||0),source:'marketplace'})});result.innerHTML=`Created <b>${esc(d.license_code||'')}</b>${d.fulfillment?.activation_url?` · <a href="${esc(d.fulfillment.activation_url)}" target="_blank">Activation link</a>`:''}`;await load()}catch(e){result.textContent=e.message}}}}
function openDrawer(html){drawerBody.innerHTML=html;drawer.classList.remove('hidden')}
window.detailTenant=id=>{const o=state.obs,t=o.tenants.find(x=>x.id===id),us=o.users.filter(x=>x.tenant_id===id),ev=o.events.filter(x=>x.tenant_id===id),li=o.licenses.filter(x=>x.tenant_id===id),su=o.support.filter(x=>x.tenant_id===id);openDrawer(`<h2>${esc(t?.business_name||'Tenant')}</h2><div class="kv"><b>Tenant ID</b><code>${esc(id)}</code></div><div class="kv"><b>Status</b><span>${esc(t?.status||'')}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="setTenantStatus('${esc(id)}','active')">Activate</button><button class="btn" onclick="setTenantStatus('${esc(id)}','suspended')">Suspend</button><button class="btn" onclick="setTenantStatus('${esc(id)}','closed')">Close</button><button class="btn" onclick="setLaunchBlock('${esc(id)}',true)">Block launch</button><button class="btn" onclick="setLaunchBlock('${esc(id)}',false)">Clear launch block</button><button class="btn" onclick="exportTenant('${esc(id)}')">Export support snapshot</button></div><div id="tenantHealthDetail"></div><h3>Users</h3>${us.map(u=>`<p><button class="btn" onclick="detailUser('${esc(u.id)}')">${esc(u.full_name||u.email)}</button><br>${esc(u.email||'')} · ${esc(u.role||'')}<br><small>Last login: ${fmt(u.last_login_at)}</small></p>`).join('')||'<p class="muted">No users.</p>'}<h3>Licenses</h3>${li.map(x=>`<p>${esc(x.plan_type||x.plan||'')} · ${esc(x.status||'')} · ${fmt(x.expires_at||x.current_period_end)} <button class="btn" onclick="extendLicense('${esc(x.id)}')">Extend</button></p>`).join('')||'<p class="muted">No license rows.</p>'}<h3>Events</h3>${ev.map(x=>`<p>${esc(x.title||'Event')} · ${fmt(x.event_date)} · ${esc(x.status||'')}</p>`).join('')||'<p class="muted">No events.</p>'}<h3>Support</h3>${su.map(x=>`<p>${esc(x.subject||x.title||x.id)} · ${esc(x.status||'')}</p>`).join('')||'<p class="muted">No support tickets.</p>'}`);const hh=(state.health?.tenants||[]).find(x=>x.tenant_id===id),box=document.getElementById('tenantHealthDetail');if(box&&hh)box.innerHTML=`<h3>Account Health</h3><div class="kv"><b>Score</b><span>${esc(hh.score)}%</span></div><div class="kv"><b>Warnings</b><span>${esc((hh.warnings||[]).join(' · ')||'None')}</span></div><div class="kv"><b>Integrity</b><span>${esc(hh.counts?.integrity_warnings||0)} warnings</span></div><div class="kv"><b>Webhook failures</b><span>${esc(hh.counts?.webhook_failures_7d||0)} in 7 days</span></div>`};
window.detailUser=id=>{const u=state.obs.users.find(x=>String(x.id)===String(id));if(!u)return;openDrawer(`<h2>${esc(u.full_name||u.email||'User')}</h2><div class="kv"><b>Email</b><span>${esc(u.email||'')}</span></div><div class="kv"><b>Business</b><span>${esc(tenantName(u.tenant_id))}</span></div><div class="kv"><b>Role</b><span>${esc(u.role||'')}</span></div><div class="kv"><b>Status</b><span>${esc(u.status||'')}</span></div><div class="kv"><b>Last login</b><span>${fmt(u.last_login_at)}</span></div><div style="display:grid;gap:8px;margin-top:14px"><button class="btn primary" onclick="setUserStatus('${esc(u.id)}','${u.status==='disabled'?'active':'disabled'}')">${u.status==='disabled'?'Re-enable user':'Disable user'}</button><button class="btn" onclick="resetUserPassword('${esc(u.id)}')">Generate password-reset link</button></div><div id="userActionResult" class="muted" style="margin-top:12px"></div>`)};
window.setUserStatus=async(id,status)=>{if(!confirm(`Set this user to ${status}?`))return;try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'user',id,action:'set_status',status})});drawer.classList.add('hidden');await load()}catch(e){alert(e.message)}};
window.resetUserPassword=async id=>{try{const d=await j('/.netlify/functions/platform-observability',{method:'POST',body:JSON.stringify({kind:'user',id,action:'password_reset'})});const box=document.getElementById('userActionResult');if(box)box.innerHTML=d.action_link?`Reset link:<br><input style="width:100%;margin-top:6px" value="${esc(d.action_link)}" readonly onclick="this.select()">`:'Reset link created, but the provider did not return a URL.'}catch(e){alert(e.message)}};
window.exportTenant=async id=>{try{const d=await j('/.netlify/functions/platform-observability',{method:'POST',body:JSON.stringify({kind:'tenant',id,action:'export'})});const blob=new Blob([JSON.stringify(d.snapshot||{},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`celebration-suite-tenant-${id}-support-snapshot.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}};
window.setTenantStatus=async(id,status)=>{if(!confirm(`Set tenant status to ${status}?`))return;try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'tenant',id,status})});drawer.classList.add('hidden');await load()}catch(e){alert(e.message)}};
window.setLaunchBlock=async(id,blocked)=>{let reason='';if(blocked){reason=prompt('Reason for blocking launch:','Production readiness issue')||'';if(!reason)return}try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'tenant',id,action:'launch_block',blocked,reason})});drawer.classList.add('hidden');await load()}catch(e){alert(e.message)}};
window.extendLicense=async id=>{const days=prompt('Extend this license by how many days?','30');if(days===null)return;try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'license',id,action:'extend',days:Number(days)||30})});await load()}catch(e){alert(e.message)}};
window.disconnectIntegration=async id=>{if(!confirm('Disconnect this integration? The customer will need to reconnect it.'))return;try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'integration',id,action:'disconnect'})});await load()}catch(e){alert(e.message)}};
window.resolveError=async id=>{const resolution=prompt('Resolution / admin note:','Resolved after review');if(resolution===null)return;try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'error',id,action:'resolve',resolution})});await load()}catch(e){alert(e.message)}};
window.detailSupport=id=>{const x=state.obs.support.find(r=>String(r.id)===String(id));if(!x)return;openDrawer(`<h2>${esc(x.subject||x.title||'Support ticket')}</h2><p>${esc(x.description||x.message||x.body||'')}</p><div class="kv"><b>Business</b><span>${esc(tenantName(x.tenant_id))}</span></div><div class="kv"><b>Status</b><span>${esc(x.status||'open')}</span></div><div class="kv"><b>Priority</b><span>${esc(x.priority||'')}</span></div><div class="kv"><b>Opened</b><span>${fmt(x.created_at)}</span></div><h3>Update</h3><select id="ticketStatus"><option>open</option><option>in_progress</option><option>waiting_on_user</option><option>resolved</option><option>closed</option></select><textarea id="ticketResolution" style="width:100%;min-height:100px;margin:10px 0" placeholder="Resolution / admin notes">${esc(x.resolution||x.admin_notes||'')}</textarea><button class="btn primary" onclick="updateSupport('${esc(x.id)}')">Save support update</button>`)};
window.updateSupport=async id=>{try{await j('/.netlify/functions/platform-observability',{method:'PATCH',body:JSON.stringify({kind:'support',id,status:ticketStatus.value,resolution:ticketResolution.value,admin_notes:ticketResolution.value})});drawer.classList.add('hidden');await load()}catch(e){alert(e.message)}};
refreshBtn.onclick=load;search.oninput=render;tenantFilter.onchange=render;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;render()});closeDrawer.onclick=()=>drawer.classList.add('hidden');logoutBtn.onclick=async()=>{await j('/.netlify/functions/platform-auth-logout',{method:'POST'}).catch(()=>{});location='/platform-login.html'};load();
</script></body></html>
