<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Inventory & Packing</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Event Inventory & Packing</div></div><div class="top-actions"><a class="btn" id="back">← Event</a><a class="btn" href="/inventory-scan.html">Scan Items</a><button class="btn" onclick="window.print()">Print Packing List</button></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1 id="title">Inventory</h1><p id="meta" class="muted"></p></div></div><div class="grid cols-3"><div class="card"><h2>Add Inventory</h2><input id="search" placeholder="Search inventory"><div id="catalog" style="margin-top:12px;max-height:650px;overflow:auto"></div></div><div class="card" style="grid-column:span 2"><h2>Packing / Return List</h2><div id="reserved"></div></div></div></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');let data,event;const byId=()=>Object.fromEntries((data.items||[]).map(x=>[x.id,x]));function renderCatalog(){const q=search.value.toLowerCase(),used=new Set((data.reservations||[]).map(r=>r.inventory_item_id));catalog.innerHTML=(data.items||[]).filter(x=>!used.has(x.id)&&`${x.name} ${x.category} ${x.sku} ${x.storage_location}`.toLowerCase().includes(q)).slice(0,200).map(x=>`<div class="notice" style="margin-bottom:8px"><strong>${WLP.esc(x.name)}</strong><div class="muted">${WLP.esc(x.storage_location||'No location')} · ${x.quantity} owned</div><button class="btn" onclick="reserve('${x.id}')">Add</button></div>`).join('')||'<div class="empty">No matching available items.</div>'}function renderReserved(){const map=byId();reserved.innerHTML=(data.reservations||[]).length?`<div class="table-wrap"><table class="table"><thead><tr><th>Pack</th><th>Item</th><th>Qty</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody>${data.reservations.map(r=>{const x=map[r.inventory_item_id]||{};const status=r.checked_in_at?'Returned':r.checked_out_at?'Checked out':r.packed_at?'Packed':'Reserved';return`<tr><td><input type="checkbox" ${r.packed_at?'checked':''} onchange="pack('${r.id}',this.checked)"></td><td>${WLP.esc(x.name||'Item')}</td><td>${r.quantity}</td><td>${WLP.esc(x.storage_location||'—')}</td><td><span class="badge">${status}</span>${r.return_condition?`<br><small>${WLP.esc(r.return_condition)}</small>`:''}</td><td><div class="toolbar">${!r.checked_out_at?`<button class="btn" onclick="checkout('${r.id}')">Check Out</button>`:''}${r.checked_out_at&&!r.checked_in_at?`<button class="btn primary" onclick="checkin('${r.id}')">Check In</button>`:''}<button class="btn" onclick="removeR('${r.id}')">Remove</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No inventory reserved yet.</div>'}function render(){renderCatalog();renderReserved()}async function load(){back.href='/event.html?id='+encodeURIComponent(eventId);event=(await WLP.api('events?id='+encodeURIComponent(eventId))).event;title.textContent=event.title+' · Inventory';meta.textContent=`${WLP.fmtDate(event.event_date)} · ${event.venue||'Venue TBD'}`;data=await WLP.api('inventory?event_id='+encodeURIComponent(eventId));render()}async function reserve(itemId){const quantity=Number(prompt('Quantity to reserve','1')||0);if(!quantity)return;try{await WLP.api('inventory?action=reserve',{method:'POST',body:JSON.stringify({event_id:eventId,inventory_item_id:itemId,quantity})});load()}catch(e){alert(e.message)}}async function pack(id,packed){const notes=packed?prompt('Packing note (optional)','')||'':null;await WLP.api('inventory?action=pack',{method:'POST',body:JSON.stringify({reservation_id:id,packed,notes})});load()}async function checkout(id){const notes=prompt('Checkout note (optional)','')||'';await WLP.api('inventory?action=checkout',{method:'POST',body:JSON.stringify({reservation_id:id,notes})});load()}async function checkin(id){const condition=prompt('Return condition','good')||'good';await WLP.api('inventory?action=checkin',{method:'POST',body:JSON.stringify({reservation_id:id,return_condition:condition})});load()}async function removeR(id){if(!confirm('Remove this item from the event?'))return;await WLP.api('inventory?action=reserve&id='+encodeURIComponent(id),{method:'DELETE'});load()}search.oninput=renderCatalog;load().catch(e=>alert(e.message));
</script></body></html>
