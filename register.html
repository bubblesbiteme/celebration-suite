<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Create Account</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:620px;margin:50px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"><span>by Sage &amp; Celebration</span></div><div class="card"><h1>Create Your Planner Account</h1><p class="muted">Create your account with email/password. Once your account exists, you can also sign in with Google using the same email.</p><form id="form" class="grid"><div class="field"><label>Your name</label><input name="name" required></div><div class="field"><label>Business / event name</label><input name="business_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="10" required></div><label class="notice"><input type="checkbox" name="accept_legal" required> I agree to the <a href="/terms.html" target="_blank">Terms</a>, <a href="/privacy.html" target="_blank">Privacy Notice</a>, and <a href="/eula.html" target="_blank">Software License Agreement</a>.</label><button class="btn primary">Create Account</button><div id="msg"></div></form><p>Already have an account? <a href="/login.html">Sign in with email or Google</a></p></div></main><script src="/assets/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account…';try{const d=Object.fromEntries(new FormData(form));d.accept_legal=Boolean(form.elements.accept_legal.checked);await WLP.api('auth-register',{method:'POST',body:JSON.stringify(d)});const q=new URLSearchParams(location.search),code=q.get('code'),plan=q.get('plan');if(code)sessionStorage.setItem('pending_license_code',code);if(plan)sessionStorage.setItem('pending_plan',plan);location='/activate.html'+(code?'?code='+encodeURIComponent(code):(plan?'?plan='+encodeURIComponent(plan):''))}catch(err){msg.textContent=err.message}}</script></body></html>
