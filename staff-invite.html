<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Join Planning Team</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><div class="card"><div class="brand" style="margin-bottom:18px"><div class="brand-mark"><span class="brand-fallback">EP</span></div><div><h2 id="business" style="margin:0">Planning Team</h2><div class="muted">Team invitation</div></div></div><div id="inviteInfo">Loading invitation…</div><div id="choices" hidden><a id="googleBtn" class="btn" style="width:100%;justify-content:center;margin:14px 0">Join with Google</a><div style="text-align:center" class="muted">or create an email/password login</div></div><form id="form" class="grid" hidden style="margin-top:14px"><div class="field"><label>Your name</label><input name="full_name" id="fullName" required></div><div class="field"><label>Email</label><input id="email" disabled></div><div class="field"><label>Create password</label><input name="password" type="password" minlength="10" required><small class="muted">At least 10 characters.</small></div><button class="btn primary">Join Team</button><div id="msg"></div></form></div></main><script src="/assets/app.js"></script><script>const token=new URLSearchParams(location.search).get('token');async function load(){try{const d=await WLP.api('staff-invite?token='+encodeURIComponent(token));business.textContent=d.tenant.business_name;inviteInfo.innerHTML=`<p>You've been invited as <strong>${WLP.esc(d.invite.role)}</strong>. This invitation expires ${new Date(d.invite.expires_at).toLocaleString()}.</p>`;email.value=d.invite.email;fullName.value=d.invite.full_name||'';googleBtn.href='/.netlify/functions/google-auth-start?audience=staff_invite&invite='+encodeURIComponent(token)+'&return=%2Fapp.html';choices.hidden=false;form.hidden=false}catch(e){inviteInfo.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account…';try{await WLP.api('staff-invite?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/app.html'}catch(err){msg.textContent=err.message}};load();</script></body></html>
