<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Book</title><link rel="stylesheet" href="/assets/app.css"><style>@media print{.topbar,.no-print{display:none!important}body{background:#fff}main{max-width:none!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}.grid{display:block}.grid>.card{margin-bottom:12px}}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Final Event Book</div></div><div class="top-actions"><a class="btn" id="back">← Event</a><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div></header><main style="max-width:1100px;margin:auto"><div class="page-head"><div><h1 id="title">Loading…</h1><p id="meta" class="muted"></p></div></div><div id="body"></div></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});const section=(title,html)=>`<div class="card"><h2>${title}</h2>${html||'<p class="muted">None</p>'}</div>`;async function load(){back.href='/event.html?id='+encodeURIComponent(eventId);const d=await WLP.api('event-book?event_id='+encodeURIComponent(eventId)),e=d.event,w=e.workspace_data||{};title.textContent=e.title;meta.textContent=`${e.event_type||'Event'} · ${WLP.fmtDate(e.event_date)} · ${WLP.esc(e.venue||'Venue TBD')} · ${WLP.esc(e.client_name||'Client')}`;const inv=Object.fromEntries((d.inventory||[]).map(x=>[x.id,x]));const billed=(d.invoices||[]).filter(x=>x.status!=='void').reduce((s,x)=>s+Number(x.amount||0),0);body.innerHTML=`<div class="grid cols-2">${section('Event Details',`<p><strong>Client:</strong> ${WLP.esc(e.client_name||'—')}</p><p><strong>Email:</strong> ${WLP.esc(e.client_email||'—')}</p><p><strong>Venue:</strong> ${WLP.esc(e.venue||'—')}</p><p><strong>Date:</strong> ${WLP.fmtDate(e.event_date)}</p>`)}${section('Financial Snapshot',`<p><strong>Invoices:</strong> ${(d.invoices||[]).length}</p><p><strong>Total billed:</strong> ${money(billed)}</p><p><strong>Approved change orders:</strong> ${money((d.change_orders||[]).filter(x=>x.status==='approved').reduce((s,x)=>s+Number(x.amount_delta||0),0))}</p>`)}${section('Checklist',(w.checklist||[]).map(x=>`<p>${x.done?'☑':'☐'} ${WLP.esc(x.title||'')}${x.detail?` <span class="muted">— ${WLP.esc(x.detail)}</span>`:''}</p>`).join(''))}${section('Timeline',(w.timeline||[]).map(x=>`<p><strong>${WLP.esc(x.title||'')}</strong><br><span class="muted">${WLP.esc(x.date||x.time||x.detail||'')} ${x.owner?'· '+WLP.esc(x.owner):''}</span></p>`).join(''))}${section('Vendors',(d.vendors||[]).map(x=>`<p><strong>${WLP.esc(x.business_name)}</strong> · ${WLP.esc(x.category||'Vendor')}<br><span class="muted">${WLP.esc(x.contact_name||'')} ${WLP.esc(x.phone||'')} ${WLP.esc(x.email||'')}</span></p>`).join(''))}${section('Guests',`<p><strong>Total records:</strong> ${(d.guests||[]).length}</p><p><strong>Attending:</strong> ${(d.guests||[]).filter(x=>x.rsvp_status==='attending').reduce((s,x)=>s+Number(x.party_size||1),0)}</p><p><strong>Checked in:</strong> ${(d.guests||[]).filter(x=>x.checked_in_at).length}</p>`)}${section('Inventory / Packing',(d.reservations||[]).map(r=>{const x=inv[r.inventory_item_id]||{};return`<p>${r.packed_at?'☑':'☐'} <strong>${WLP.esc(x.name||'Item')}</strong> × ${r.quantity}<br><span class="muted">${WLP.esc(x.storage_location||'No storage location')} · ${r.checked_in_at?'Returned':r.checked_out_at?'Checked out':r.packed_at?'Packed':'Reserved'}</span></p>`}).join(''))}${section('Questionnaires',(d.questionnaires||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong> · ${WLP.esc(x.status)}</p>`).join(''))}${section('Design Board',(d.inspiration||[]).map(x=>`<div style="display:inline-block;width:145px;vertical-align:top;margin:5px"><img src="${WLP.esc(x.image_url)}" style="width:145px;height:115px;object-fit:cover;border-radius:8px"><strong style="display:block;font-size:.8rem">${WLP.esc(x.title||'Design item')}</strong><small>${WLP.esc(x.status||'idea')}${x.inventory_item_id?' · qty '+Number(x.requested_quantity||1):''}</small></div>`).join(''))}${section('Approvals',(d.approvals||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong> · ${WLP.esc(x.status)}</p>`).join(''))}${section('Documents',(d.documents||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong> · ${WLP.esc(x.category||'Document')}</p>`).join(''))}${section('Notes',(w.notes||[]).map(x=>`<p>${WLP.esc(x.title||x.body||'')}<br><span class="muted">${WLP.esc(x.detail||'')}</span></p>`).join(''))}</div>`}load().catch(e=>body.innerHTML='<div class="card"><h2>Unable to load event book</h2><p>'+WLP.esc(e.message)+'</p></div>');
</script><script src="/assets/ui-v019.js"></script></body></html>
