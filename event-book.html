<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Book</title><link rel="stylesheet" href="/assets/app.css"><style>@media print{.topbar,.no-print{display:none!important}body{background:#fff}main{max-width:none!important}.card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}.grid{display:block}.grid>.card{margin-bottom:12px}}.packet-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.packet-tabs button.active{background:var(--brand-primary)}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Final Event Book</div></div><div class="top-actions"><a class="btn" id="back">← Event</a><button class="btn primary" onclick="window.print()">Print / Save PDF</button></div></header><main style="max-width:1100px;margin:auto"><div class="page-head"><div><h1 id="title">Loading…</h1><p id="meta" class="muted"></p></div></div><div class="packet-tabs no-print"><button class="btn active" data-mode="staff">Staff Production Book</button><button class="btn" data-mode="vendor">Vendor Packet</button><button class="btn" data-mode="client">Client Final Details</button><button class="btn" data-mode="beo">BEO / Function Sheet</button></div><div id="body"></div></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');let data=null,mode='staff';const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});const section=(title,html)=>`<div class="card"><h2>${title}</h2>${html||'<p class="muted">None</p>'}</div>`;const esc=WLP.esc;function summary(){const d=data,e=d.event,w=e.workspace_data||{},inv=Object.fromEntries((d.inventory||[]).map(x=>[x.id,x])),billed=(d.invoices||[]).filter(x=>x.status!=='void').reduce((s,x)=>s+Number(x.amount||0),0),expenses=(d.expenses||[]).filter(x=>x.status!=='void'),costs=expenses.reduce((s,x)=>s+Number(x.actual_amount||x.estimated_amount||0),0);const common=[section('Event Details',`<p><strong>Client:</strong> ${esc(e.client_name||'—')}</p><p><strong>Email:</strong> ${esc(e.client_email||'—')}</p><p><strong>Venue:</strong> ${esc(e.venue||'—')}</p><p><strong>Date:</strong> ${WLP.fmtDate(e.event_date)}</p>`),section('Timeline',(w.timeline||[]).map(x=>`<p><strong>${esc(x.title||'')}</strong><br><span class="muted">${esc(x.date||x.time||x.detail||'')} ${x.owner?'· '+esc(x.owner):''}</span></p>`).join('')),section('Vendors',(d.vendors||[]).map(x=>`<p><strong>${esc(x.business_name)}</strong> · ${esc(x.category||'Vendor')}<br><span class="muted">${esc(x.contact_name||'')} ${esc(x.phone||'')} ${esc(x.email||'')}</span></p>`).join('')),section('Guests',`<p><strong>Total records:</strong> ${(d.guests||[]).length}</p><p><strong>Attending:</strong> ${(d.guests||[]).filter(x=>x.rsvp_status==='attending').reduce((s,x)=>s+Number(x.party_size||1),0)}</p><p><strong>Checked in:</strong> ${(d.guests||[]).filter(x=>x.checked_in_at).length}</p>`),section('Floor Plans',(d.floorplans||[]).map(x=>`<p><strong>${esc(x.name)}</strong> · ${esc(x.layout_type||'layout')} · ${(x.objects||[]).reduce((s,o)=>s+Number(o.seats||0),0)} seats${x.is_shared?' · shared':''}</p>`).join(''))];if(mode==='staff'){common.push(section('Checklist',(w.checklist||[]).map(x=>`<p>${x.done||x.status==='done'?'☑':'☐'} ${esc(x.title||'')}${x.detail?` <span class="muted">— ${esc(x.detail)}</span>`:''}</p>`).join('')),section('Staff / Labor',(d.assignments||[]).map(a=>`<p><strong>${esc(a.tenant_users?.full_name||a.tenant_users?.email||'Staff')}</strong> · ${esc(a.assignment_role||'team')}<br><span class="muted">${a.call_time?new Date(a.call_time).toLocaleString():'Call time TBD'} → ${a.shift_end?new Date(a.shift_end).toLocaleString():'TBD'} · ${a.actual_hours||a.planned_hours||0} hrs</span></p>`).join('')),section('Inventory / Packing',(d.reservations||[]).map(r=>{const x=inv[r.inventory_item_id]||{};return`<p>${r.packed_quantity>=r.quantity?'☑':'☐'} <strong>${esc(x.name||'Item')}</strong> × ${r.quantity}<br><span class="muted">${esc(x.storage_location||'No storage location')} · packed ${r.packed_quantity||0} · loaded ${r.loaded_quantity||0} · returned ${(r.return_good||0)+(r.return_damaged||0)+(r.return_repair||0)+(r.return_missing||0)}</span></p>`}).join('')),section('Internal Financial Snapshot',`<p><strong>Service fee:</strong> ${money(e.service_fee)}</p><p><strong>Client decor allowance:</strong> ${money(e.client_decor_budget)}</p><p><strong>Contract total:</strong> ${money(e.contract_total||billed)}</p><p><strong>Expenses:</strong> ${money(costs)}</p><p><strong>Estimated service profit:</strong> ${money(Number(e.service_fee||0)-expenses.filter(x=>!x.client_funded).reduce((s,x)=>s+Number(x.actual_amount||x.estimated_amount||0),0))}</p>`),section('Internal Notes',(w.notes||[]).map(x=>`<p>${esc(x.title||x.body||'')}<br><span class="muted">${esc(x.detail||'')}</span></p>`).join('')))}else if(mode==='vendor'){common.push(section('Operational Inventory',(d.reservations||[]).map(r=>{const x=inv[r.inventory_item_id]||{};return`<p><strong>${esc(x.name||'Item')}</strong> × ${r.quantity} · ${esc(x.storage_location||'')}</p>`}).join('')),section('Documents',(d.documents||[]).filter(x=>x.category!=='internal').map(x=>`<p><strong>${esc(x.title)}</strong> · ${esc(x.category||'Document')}</p>`).join('')))}else if(mode==='beo'){const meal=(d.questionnaires||[]).flatMap(q=>Object.entries(q.responses||{})).filter(([k])=>/meal|menu|food|diet/i.test(k)).map(([k,v])=>`${esc(k)}: ${esc(Array.isArray(v)?v.join(', '):String(v))}`).join('<br>');common.push(section('Function Overview',`<p><strong>Event:</strong> ${esc(e.title)}</p><p><strong>Date:</strong> ${WLP.fmtDate(e.event_date)}</p><p><strong>Venue:</strong> ${esc(e.venue||'TBD')}</p><p><strong>Guest count:</strong> ${(d.guests||[]).filter(x=>x.rsvp_status==='attending').reduce((s,x)=>s+Number(x.party_size||1),0)||e.guest_count||0}</p>`),section('Room Setup',(d.floorplans||[]).map(x=>`<p><strong>${esc(x.name)}</strong> · ${(x.objects||[]).reduce((s,o)=>s+Number(o.seats||0),0)} seats · ${esc(x.layout_type||'layout')}</p>`).join('')),section('Food / Beverage Notes',meal||'<p class="muted">No menu or dietary questionnaire details found.</p>'),section('Vendor Arrivals',(d.vendor_operations||[]).map(v=>`<p><strong>${esc(v.vendor_name||'Vendor')}</strong> · ${esc(v.role||'')}<br><span class="muted">${v.scheduled_arrival?new Date(v.scheduled_arrival).toLocaleString():'Arrival TBD'} · ${esc(v.assigned_area||'Area TBD')}</span></p>`).join('')),section('Staffing',(d.assignments||[]).map(a=>`<p><strong>${esc(a.tenant_users?.full_name||a.tenant_users?.email||'Staff')}</strong> · ${esc(a.assignment_role||'team')}<br><span class="muted">${a.call_time?new Date(a.call_time).toLocaleString():'Call TBD'} → ${a.shift_end?new Date(a.shift_end).toLocaleString():'End TBD'}</span></p>`).join('')))}else{common.push(section('Design Board',(d.inspiration||[]).filter(x=>['approved','shortlisted'].includes(x.status)).map(x=>`<div style="display:inline-block;width:145px;vertical-align:top;margin:5px"><img src="${esc(x.image_url)}" style="width:145px;height:115px;object-fit:cover;border-radius:8px"><strong style="display:block;font-size:.8rem">${esc(x.title||'Design item')}</strong><small>${esc(x.status||'idea')}</small></div>`).join('')),section('Approvals',(d.approvals||[]).filter(x=>x.status==='approved').map(x=>`<p><strong>${esc(x.title)}</strong> · Approved</p>`).join('')),section('Payment Status',`<p><strong>Total billed:</strong> ${money(billed)}</p><p><strong>Invoices:</strong> ${(d.invoices||[]).map(x=>`${esc(x.invoice_number)} · ${esc(x.status)} · ${money(x.amount)}`).join('<br>')||'None'}</p>`),section('Shared Documents',(d.documents||[]).filter(x=>x.visibility==='client'||x.client_visible).map(x=>`<p><strong>${esc(x.title)}</strong> · ${esc(x.category||'Document')}</p>`).join('')))}body.innerHTML=`<div class="grid cols-2">${common.join('')}</div>`}
async function load(){back.href='/event.html?id='+encodeURIComponent(eventId);data=await WLP.api('event-book?event_id='+encodeURIComponent(eventId));const e=data.event;title.textContent=e.title;meta.textContent=`${e.event_type||'Event'} · ${WLP.fmtDate(e.event_date)} · ${esc(e.venue||'Venue TBD')} · ${esc(e.client_name||'Client')}`;summary()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));summary()});load().catch(e=>body.innerHTML='<div class="card"><h2>Unable to load event book</h2><p>'+esc(e.message)+'</p></div>');
</script><script src="/assets/ui-v019.js"></script></body></html>
