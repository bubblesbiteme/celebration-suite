<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Approvals</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">A</span></div><div><div id="biz" class="brand-title">Approvals</div><small>Client decisions and sign-offs</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addApproval()">+ Approval</button></div></header><main><div class="page-head"><div><h1>Approvals</h1><p class="muted">Send design, budget, menu, or production decisions to clients for approval.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"></select></div><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],rows=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Approvals'}async function refresh(){if(!eventFilter.value){rows=[];render();return}rows=(await WLP.api('approvals?event_id='+encodeURIComponent(eventFilter.value))).approvals||[];render()}function render(){list.innerHTML=rows.length?'<div class="grid cols-2">'+rows.map(a=>`<div class="card"><div class="page-head"><div><h3>${WLP.esc(a.title)}</h3><span class="badge">${WLP.esc(a.status)}</span></div></div><p>${WLP.esc(a.description||'')}</p>${a.client_note?`<p><strong>Client note:</strong> ${WLP.esc(a.client_note)}</p>`:''}<div class="toolbar"><button class="btn" onclick="copyLink('${a.public_token}')">Copy Client Link</button><button class="btn" onclick="removeApproval('${a.id}')">Remove</button></div></div>`).join('')+'</div>':'<div class="empty">No approval requests yet.</div>'}async function addApproval(){if(!eventFilter.value)return alert('Choose an event first.');const title=prompt('Approval title');if(!title)return;const description=prompt('What should the client review?','');await WLP.api('approvals',{method:'POST',body:JSON.stringify({event_id:eventFilter.value,title,description})});await refresh()}async function removeApproval(id){if(!confirm('Remove this approval request?'))return;await WLP.api('approvals?id='+encodeURIComponent(id),{method:'DELETE'});await refresh()}async function copyLink(token){const url=location.origin+'/approval-public.html?token='+encodeURIComponent(token);await navigator.clipboard.writeText(url);alert('Client approval link copied.')}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh()}eventFilter.onchange=refresh;load();
</script><script src="/assets/ui-v019.js"></script></body></html>
