<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Team & Permissions</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="shell"><header class="topbar"><div class="brand"><div class="brand-mark"><img id="brandLogo" hidden><span id="brandFallback" class="brand-fallback">EP</span></div><div><div id="businessName" class="brand-title">Planner Workspace</div><small>Team & Permissions</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/staff-operations.html">Staff Scheduling</a><a class="btn primary" href="/time-tracking.html">Labor & Time</a></div></header><main><div class="page-head"><div><h1>Team</h1><p class="muted">Invite staff, control roles and assign people to events.</p></div><button class="btn primary" id="inviteBtn">+ Invite Team Member</button></div><div class="grid cols-4" id="stats"></div><section class="card" style="margin-top:16px"><h2>Team Members</h2><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th>Assignments</th><th></th></tr></thead><tbody id="teamBody"></tbody></table></div></section><section class="card" style="margin-top:16px"><h2>Pending Invitations</h2><div id="invites"></div></section></main></div>
<div id="inviteModal" class="modal"><div class="modal-card"><button class="btn close" onclick="inviteModal.classList.remove('open')">Close</button><h2>Invite Team Member</h2><form id="inviteForm" class="grid"><div class="grid cols-2"><div class="field"><label>Name</label><input name="full_name"></div><div class="field"><label>Email</label><input name="email" type="email" required></div></div><div class="field"><label>Role</label><select name="role"><option value="staff">Staff</option><option value="planner">Planner</option><option value="admin">Admin</option></select></div><button class="btn primary">Create Invitation</button><div id="inviteMsg"></div></form></div></div>
<div id="editModal" class="modal"><div class="modal-card"><button class="btn close" onclick="editModal.classList.remove('open')">Close</button><h2>Edit Team Member</h2><form id="editForm" class="grid"><input type="hidden" name="id"><div class="grid cols-3"><div class="field"><label>Role</label><select name="role"><option value="staff">Staff</option><option value="planner">Planner</option><option value="admin">Admin</option></select></div><div class="field"><label>Status</label><select name="status"><option value="active">Active</option><option value="disabled">Disabled</option></select></div><div class="field"><label>Hourly labor rate</label><input name="hourly_rate" type="number" min="0" step="0.01"></div></div><h3>Permissions</h3><div class="permission-grid" id="permissions"></div><h3>Event assignments</h3><div id="eventAssignments" class="grid"></div><button class="btn primary">Save Permissions</button><div id="editMsg"></div></form></div></div>
<script src="/assets/app.js"></script><script>
let data={},editing=null;const roleDefaults={admin:['*'],planner:['manage_events','manage_clients','manage_leads','manage_vendors','manage_inventory','manage_guests','manage_approvals','manage_floorplans','event_day','time_tracking'],staff:['manage_guests','event_day','time_tracking']};const perms=[['manage_events','Manage events'],['manage_clients','Clients'],['manage_leads','Lead CRM'],['manage_proposals','Proposals/contracts'],['manage_financials','Financials'],['manage_vendors','Vendors'],['manage_inventory','Inventory'],['manage_guests','Guests/registration'],['manage_approvals','Approvals'],['manage_floorplans','Floor plans'],['event_day','Event Day'],['time_tracking','Time tracking']];
function brand(t){businessName.textContent=t.business_name;const b=t.branding||{};document.documentElement.style.setProperty('--brand-primary',b.primary||'#A9B89A');document.documentElement.style.setProperty('--brand-secondary',b.secondary||'#37243F');if(b.logo_url){brandLogo.src=b.logo_url;brandLogo.hidden=false;brandFallback.hidden=true}}
function assignmentsFor(uid){return (data.assignments||[]).filter(a=>a.user_id===uid)}
function render(){stats.innerHTML=`<div class="card stat"><span class="muted">Active team</span><strong>${data.users.filter(x=>x.status==='active').length}</strong></div><div class="card stat"><span class="muted">Admins</span><strong>${data.users.filter(x=>['owner','admin'].includes(x.role)).length}</strong></div><div class="card stat"><span class="muted">Planners</span><strong>${data.users.filter(x=>x.role==='planner').length}</strong></div><div class="card stat"><span class="muted">Pending invites</span><strong>${data.invites.filter(x=>!x.accepted_at&&new Date(x.expires_at)>new Date()).length}</strong></div>`;teamBody.innerHTML=data.users.map(u=>`<tr><td><strong>${WLP.esc(u.full_name)}</strong><br><span class="muted">${WLP.esc(u.email)}</span></td><td>${WLP.esc(u.role)}</td><td>${WLP.esc(u.status)}</td><td>${u.last_login_at?new Date(u.last_login_at).toLocaleString():'Never'}</td><td>${assignmentsFor(u.id).length}</td><td>${u.role==='owner'?'<span class="badge">Owner</span>':`<button class="btn" onclick="editUser('${u.id}')">Edit</button>`}</td></tr>`).join('');invites.innerHTML=data.invites.length?data.invites.map(i=>`<div class="notice"><strong>${WLP.esc(i.email)}</strong> · ${WLP.esc(i.role)} · ${i.accepted_at?'Accepted':new Date(i.expires_at)<new Date()?'Expired':'Pending'}</div>`).join(''):'<div class="empty">No invitations yet.</div>'}
async function load(){const b=await WLP.api('bootstrap');brand(b.tenant);data=await WLP.api('team');render()}
inviteBtn.onclick=()=>inviteModal.classList.add('open');inviteForm.onsubmit=async e=>{e.preventDefault();inviteMsg.textContent='Creating…';try{const r=await WLP.api('team?action=invite',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(inviteForm)))});inviteMsg.innerHTML=r.email_sent?'Invitation emailed.':`Invitation created. Copy this link:<br><input value="${WLP.esc(r.invite_url)}" readonly onclick="this.select()">`;await load()}catch(err){inviteMsg.textContent=err.message}};
window.editUser=id=>{editing=data.users.find(x=>x.id===id);editForm.elements.id.value=editing.id;editForm.elements.role.value=editing.role;editForm.elements.status.value=editing.status;editForm.elements.hourly_rate.value=editing.hourly_rate||0;permissions.innerHTML=perms.map(([k,l])=>{const explicit=editing.permissions?.[k],effective=explicit===undefined?((roleDefaults[editing.role]||[]).includes(k)||(roleDefaults[editing.role]||[]).includes('*')):explicit;return `<label class="notice"><input type="checkbox" data-perm="${k}" ${effective?'checked':''}> ${l}</label>`}).join('');eventAssignments.innerHTML=data.events.map(e=>{const on=assignmentsFor(id).some(a=>a.event_id===e.id);return `<label class="notice"><input type="checkbox" data-event="${e.id}" ${on?'checked':''}> ${WLP.esc(e.title)} ${e.event_date?'· '+WLP.fmtDate(e.event_date):''}</label>`}).join('')||'<div class="empty">No events.</div>';editModal.classList.add('open')};
editForm.onsubmit=async e=>{e.preventDefault();editMsg.textContent='Saving…';try{const permissionMap={};document.querySelectorAll('[data-perm]').forEach(x=>permissionMap[x.dataset.perm]=x.checked);await WLP.api('team',{method:'PATCH',body:JSON.stringify({id:editing.id,role:editForm.elements.role.value,status:editForm.elements.status.value,hourly_rate:editForm.elements.hourly_rate.value,permissions:permissionMap})});const current=new Set(assignmentsFor(editing.id).map(a=>a.event_id)),desired=new Set([...document.querySelectorAll('[data-event]')].filter(x=>x.checked).map(x=>x.dataset.event));for(const event_id of desired)if(!current.has(event_id))await WLP.api('team?action=assign',{method:'POST',body:JSON.stringify({user_id:editing.id,event_id})});for(const event_id of current)if(!desired.has(event_id))await WLP.api('team?action=unassign',{method:'POST',body:JSON.stringify({user_id:editing.id,event_id})});editModal.classList.remove('open');await load()}catch(err){editMsg.textContent=err.message}};load().catch(e=>{document.querySelector('main').innerHTML=`<div class="notice warn">${WLP.esc(e.message)}</div>`});
</script><script src="/assets/ui-v019.js"></script></body></html>
