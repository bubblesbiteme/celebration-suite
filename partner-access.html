<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Referral Partner Access</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">R</span></div><div><div class="brand-title">Referral Partner Access</div><small>Limited commission transparency</small></div></div><div class="top-actions"><a class="btn" href="/referrals.html">← Referrals</a><button class="btn primary" onclick="createLink()">+ Partner Link</button></div></header><main><div class="page-head"><div><h1>Partner Portal Links</h1><p class="muted">Partners can see only their own referral commission records and event names—never your full financials or client portal.</p></div></div><div class="card"><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
let links=[];function render(){list.innerHTML=links.length?`<table class="table"><thead><tr><th>Partner</th><th>Email</th><th>Status</th><th>Last viewed</th><th></th></tr></thead><tbody>${links.map(x=>`<tr><td><strong>${WLP.esc(x.partner_name)}</strong></td><td>${WLP.esc(x.partner_email||'')}</td><td>${x.active?'Active':'Disabled'}</td><td>${x.last_viewed_at?new Date(x.last_viewed_at).toLocaleString():'Never'}</td><td><button class="btn" onclick="copyLink('${x.token}')">Copy Link</button> <button class="btn" onclick="toggle('${x.id}',${!x.active})">${x.active?'Disable':'Enable'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No partner portal links yet.</div>'}async function createLink(){const partner_name=prompt('Partner name');if(!partner_name)return;const partner_email=prompt('Partner email (must match referral records)');if(!partner_email)return;const d=await WLP.api('partner-links',{method:'POST',body:JSON.stringify({partner_name,partner_email})});await navigator.clipboard?.writeText(d.url).catch(()=>{});alert('Partner link created and copied:\n'+d.url);await load()}async function copyLink(token){const url=location.origin+'/partner-portal.html?token='+encodeURIComponent(token);await navigator.clipboard?.writeText(url).catch(()=>{});alert(url)}async function toggle(id,active){await WLP.api('partner-links',{method:'PATCH',body:JSON.stringify({id,active})});await load()}async function load(){links=(await WLP.api('partner-links')).links||[];render()}load();
</script></body></html>
