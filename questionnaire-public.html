<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Questionnaire</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:850px;margin:30px auto"><div class="card"><div id="brand" class="brand-title">Questionnaire</div><h1 id="title">Loading…</h1><p id="meta" class="muted"></p><form id="form" class="grid"></form><div id="done" hidden class="notice"><h2>Thank you</h2><p>Your answers were submitted successfully.</p></div></div></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let q;function field(x){const val=q.answers?.[x.id]||'';if(x.type==='textarea')return`<textarea name="${x.id}" ${x.required?'required':''}>${WLP.esc(val)}</textarea>`;if(['select','radio'].includes(x.type)&&x.options?.length){if(x.type==='select')return`<select name="${x.id}" ${x.required?'required':''}><option value="">Choose…</option>${x.options.map(o=>`<option ${o===val?'selected':''}>${WLP.esc(o)}</option>`).join('')}</select>`;return x.options.map(o=>`<label><input type="radio" name="${x.id}" value="${WLP.esc(o)}" ${o===val?'checked':''}> ${WLP.esc(o)}</label>`).join('<br>')}if(x.type==='checkbox'&&x.options?.length)return x.options.map(o=>`<label><input type="checkbox" name="${x.id}" value="${WLP.esc(o)}"> ${WLP.esc(o)}</label>`).join('<br>');return`<input name="${x.id}" type="${['date','number'].includes(x.type)?x.type:'text'}" value="${WLP.esc(val)}" ${x.required?'required':''}>`}async function load(){const d=await WLP.api('questionnaire-public?token='+encodeURIComponent(token));q=d.questionnaire;brand.textContent=d.tenant.business_name||'Event Questionnaire';title.textContent=q.title;meta.textContent=`${d.event?.title||'Your event'}${d.event?.event_date?' · '+WLP.fmtDate(d.event.event_date):''}`;const b=d.tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);if(['submitted','reviewed'].includes(q.status)){form.hidden=true;done.hidden=false;return}form.innerHTML=(q.questions||[]).map(x=>`<div class="field"><label>${WLP.esc(x.label)}${x.required?' *':''}</label>${field(x)}</div>`).join('')+'<button class="btn primary">Submit Questionnaire</button><div id="msg"></div>'}form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),answers={};for(const x of q.questions||[]){if(x.type==='checkbox')answers[x.id]=fd.getAll(x.id);else answers[x.id]=fd.get(x.id)||''}msg.textContent='Submitting…';try{await WLP.api('questionnaire-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({answers})});form.hidden=true;done.hidden=false}catch(err){msg.textContent=err.message}};load().catch(e=>document.querySelector('.card').innerHTML='<h1>Questionnaire unavailable</h1><p>'+WLP.esc(e.message)+'</p>');
</script></body></html>
