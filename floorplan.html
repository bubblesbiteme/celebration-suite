<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Floor Plan</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">F</span></div><div><div id="biz" class="brand-title">Floor Plan</div><small>Drag-and-drop event layouts</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn" onclick="addObj('table')">+ Table</button><button class="btn" onclick="addObj('chair')">+ Chair</button><button class="btn" onclick="addObj('arch')">+ Arch</button><button class="btn" onclick="addObj('label')">+ Label</button><button class="btn primary" onclick="save()">Save</button></div></header><main><div class="page-head"><div><h1>Floor Plan</h1><p class="muted">Create a simple visual layout that stays attached to the event.</p></div><select id="eventFilter"></select></div><div class="split"><section class="card"><div id="stage" class="floor-stage"></div></section><aside class="card"><h3>Selected Object</h3><div id="props" class="empty">Select an object to edit it.</div></aside></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],plan=null,objects=[],selected=null,drag=null;function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Floor Plan'}function render(){stage.innerHTML=objects.map(o=>`<div class="floor-object ${o.kind==='table'?'round':''} ${o.kind==='arch'?'arch':''} ${selected===o.id?'selected':''}" data-id="${o.id}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px">${WLP.esc(o.label||o.kind)}</div>`).join('');stage.querySelectorAll('.floor-object').forEach(el=>{el.onpointerdown=e=>{selected=el.dataset.id;drag={id:selected,ox:e.clientX,oy:e.clientY,start:{...objects.find(x=>x.id===selected)}};el.setPointerCapture(e.pointerId);renderProps();render()};el.onpointermove=e=>{if(!drag||drag.id!==el.dataset.id)return;const o=objects.find(x=>x.id===drag.id);o.x=Math.max(0,drag.start.x+e.clientX-drag.ox);o.y=Math.max(0,drag.start.y+e.clientY-drag.oy);render()};el.onpointerup=()=>drag=null});renderProps()}function renderProps(){const o=objects.find(x=>x.id===selected);if(!o){props.className='empty';props.textContent='Select an object to edit it.';return}props.className='';props.innerHTML=`<div class="field"><label>Label</label><input id="pLabel" value="${WLP.esc(o.label||'')}"></div><div class="grid cols-2" style="margin-top:10px"><div class="field"><label>Width</label><input id="pW" type="number" value="${o.w}"></div><div class="field"><label>Height</label><input id="pH" type="number" value="${o.h}"></div></div><button class="btn" style="margin-top:10px" onclick="applyProps()">Apply</button> <button class="btn" onclick="removeSelected()">Remove</button>`}function applyProps(){const o=objects.find(x=>x.id===selected);o.label=pLabel.value;o.w=Math.max(30,Number(pW.value)||o.w);o.h=Math.max(30,Number(pH.value)||o.h);render()}function removeSelected(){objects=objects.filter(x=>x.id!==selected);selected=null;render()}function addObj(kind){const map={table:[120,120,'Round Table'],chair:[55,55,'Chair'],arch:[100,140,'Arch'],label:[120,50,'Label']},m=map[kind]||[100,70,kind];objects.push({id:crypto.randomUUID(),kind,x:30+objects.length*12,y:30+objects.length*12,w:m[0],h:m[1],label:m[2]});render()}async function save(){if(!eventFilter.value)return alert('Choose an event first.');if(plan)await WLP.api('floorplans?event_id='+encodeURIComponent(eventFilter.value),{method:'PATCH',body:JSON.stringify({id:plan.id,name:plan.name,width:1200,height:800,objects})});else{const d=await WLP.api('floorplans?event_id='+encodeURIComponent(eventFilter.value),{method:'POST',body:JSON.stringify({name:'Main Floor Plan',width:1200,height:800,objects})});plan=d.floorplan}alert('Floor plan saved.')}async function refresh(){if(!eventFilter.value){plan=null;objects=[];render();return}const d=await WLP.api('floorplans?event_id='+encodeURIComponent(eventFilter.value));plan=d.floorplans?.[0]||null;objects=Array.isArray(plan?.objects)?plan.objects:[];selected=null;render()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh()}eventFilter.onchange=refresh;load();
</script></body></html>
