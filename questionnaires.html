<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionnaires</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title" id="biz">Questionnaires</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn" id="templateBtn">+ Template</button><button class="btn primary" id="assignBtn">+ Assign Questionnaire</button></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Client Questionnaires</h1><p class="muted">Build reusable questionnaires, assign them to events, and review client submissions.</p></div></div><div class="grid cols-3"><div class="card"><h2>Event</h2><select id="eventSel"></select><div style="height:10px"></div><div id="templateSummary" class="muted"></div></div><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>
let events=[],templates=[],rows=[];const requested=new URLSearchParams(location.search).get('event_id');function qFromText(text){return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>{const required=line.endsWith('*');const clean=required?line.slice(0,-1).trim():line;return{id:crypto.randomUUID(),label:clean,type:'text',required,options:[]}})}async function load(){const b=await WLP.api('bootstrap');biz.textContent=(b.tenant.business_name||'Celebration Suite')+' · Questionnaires';events=(await WLP.api('events')).events||[];templates=(await WLP.api('questionnaires?type=templates')).templates||[];eventSel.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requested&&events.some(e=>e.id===requested))eventSel.value=requested;else if(events[0])eventSel.value=events[0].id;templateSummary.textContent=`${templates.length} reusable template${templates.length===1?'':'s'}`;await refresh()}async function refresh(){if(!eventSel.value){rows=[];render();return}rows=(await WLP.api('questionnaires?event_id='+encodeURIComponent(eventSel.value))).questionnaires||[];render()}function render(){list.innerHTML=rows.length?rows.map(q=>`<div class="notice" style="margin-bottom:12px"><div class="page-head"><div><h3>${WLP.esc(q.title)}</h3><span class="badge">${WLP.esc(q.status)}</span></div><div class="toolbar"><button class="btn" onclick="copyLink('${q.public_token}')">Copy Client Link</button>${q.status==='draft'?`<button class="btn primary" onclick="send('${q.id}')">Mark Sent</button>`:''}${q.status==='submitted'?`<button class="btn primary" onclick="review('${q.id}')">Mark Reviewed</button>`:''}<button class="btn" onclick="removeQ('${q.id}')">Remove</button></div></div><p class="muted">${(q.questions||[]).length} questions</p>${q.submitted_at?`<p><strong>Submitted:</strong> ${new Date(q.submitted_at).toLocaleString()}</p>`:''}${['submitted','reviewed'].includes(q.status)?`<details><summary>View answers</summary>${(q.questions||[]).map(x=>`<p><strong>${WLP.esc(x.label)}</strong><br>${WLP.esc(Array.isArray(q.answers?.[x.id])?q.answers[x.id].join(', '):(q.answers?.[x.id]||'—'))}</p>`).join('')}</details>`:''}</div>`).join(''):'<div class="empty">No questionnaires assigned to this event.</div>'}async function copyLink(token){const url=location.origin+'/questionnaire-public.html?token='+encodeURIComponent(token);await navigator.clipboard.writeText(url);alert('Questionnaire link copied.')}async function send(id){await WLP.api('questionnaires',{method:'PATCH',body:JSON.stringify({id,status:'sent'})});refresh()}async function review(id){await WLP.api('questionnaires',{method:'PATCH',body:JSON.stringify({id,status:'reviewed'})});refresh()}async function removeQ(id){if(!confirm('Remove this questionnaire?'))return;await WLP.api('questionnaires?id='+encodeURIComponent(id),{method:'DELETE'});refresh()}templateBtn.onclick=async()=>{const name=prompt('Template name');if(!name)return;const event_type=prompt('Event type (optional)','');const description=prompt('Description (optional)','');const text=prompt('Enter one question per line. Add * at the end to make a question required.','Full name*\nPhone number\nWhat is most important to you for this event?*');if(!text)return;await WLP.api('questionnaires?type=template',{method:'POST',body:JSON.stringify({name,event_type,description,questions:qFromText(text)})});templates=(await WLP.api('questionnaires?type=templates')).templates||[];templateSummary.textContent=`${templates.length} reusable templates`;alert('Template saved.');};assignBtn.onclick=async()=>{if(!eventSel.value)return alert('Choose an event first.');let template_id='';if(templates.length){const names=templates.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const pick=prompt('Choose template number, or leave blank for a custom questionnaire:\n'+names,'1');if(pick){const t=templates[Number(pick)-1];if(t)template_id=t.id}}let title='';let questions=[];if(!template_id){title=prompt('Questionnaire title','Event Details Questionnaire');if(!title)return;const text=prompt('Enter one question per line. Add * at the end for required.','What are your event colors?*\nWhat style are you envisioning?\nAnything you definitely do not want?');if(!text)return;questions=qFromText(text)}await WLP.api('questionnaires',{method:'POST',body:JSON.stringify({event_id:eventSel.value,template_id,title,questions,send_now:true})});refresh()};eventSel.onchange=refresh;load().catch(()=>location='/login.html');
</script><script src="/assets/ui-v019.js"></script></body></html>
