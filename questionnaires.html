<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionnaires</title><link rel="stylesheet" href="/assets/app.css"><style>.q-card{margin-bottom:12px}.analysis{padding:12px;border-radius:12px;background:#f7f4ee;margin-top:10px}.analysis ul{margin:6px 0 0 18px}.q-actions{display:flex;gap:7px;flex-wrap:wrap}.drop{border:1px dashed #cfc4d1;border-radius:14px;padding:12px;background:#fffdfb}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title" id="biz">Questionnaires</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn" id="importBtn">Import Template CSV</button><button class="btn" id="templateBtn">+ Template</button><button class="btn primary" id="assignBtn">+ Assign Questionnaire</button></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Client Questionnaires</h1><p class="muted">Collect details, save drafts, analyze answers, and turn responses into planning tasks.</p></div></div><div class="grid cols-3"><div class="card"><h2>Event</h2><select id="eventSel"></select><div style="height:10px"></div><div id="templateSummary" class="muted"></div><hr><h3>Quick tools</h3><p class="muted">Templates can be imported in bulk from CSV with columns: <b>template_name,event_type,question,required,type,options</b>.</p><button class="btn" onclick="downloadTemplate()">Download CSV format</button></div><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><input id="csvFile" type="file" accept=".csv" hidden><script src="/assets/app.js"></script><script>
let events=[],templates=[],rows=[];const requested=new URLSearchParams(location.search).get('event_id');function qFromText(text){return String(text||'').split('\n').map(x=>x.trim()).filter(Boolean).map((line,i)=>{const required=line.endsWith('*');const clean=required?line.slice(0,-1).trim():line;return{id:crypto.randomUUID(),label:clean,type:'text',required,options:[]}})}function csvLine(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
async function load(){const b=await WLP.api('bootstrap');biz.textContent=(b.tenant.business_name||'Celebration Suite')+' · Questionnaires';events=(await WLP.api('events')).events||[];templates=(await WLP.api('questionnaires?type=templates')).templates||[];eventSel.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requested&&events.some(e=>e.id===requested))eventSel.value=requested;else if(events[0])eventSel.value=events[0].id;templateSummary.textContent=`${templates.length} reusable template${templates.length===1?'':'s'}`;await refresh()}
async function refresh(){if(!eventSel.value){rows=[];render();return}rows=(await WLP.api('questionnaires?event_id='+encodeURIComponent(eventSel.value))).questionnaires||[];render()}
function render(){list.innerHTML=rows.length?rows.map(q=>{const a=q.analysis||{},flags=a.flags||[],suggestions=a.suggestions||[];return`<div class="notice q-card"><div class="page-head"><div><h3>${WLP.esc(q.title)}</h3><span class="badge">${WLP.esc(q.status)}</span></div><div class="q-actions"><button class="btn" onclick="copyLink('${q.public_token}')">Client Link</button>${q.status==='draft'?`<button class="btn primary" onclick="sendQ('${q.id}')">Mark Sent</button>`:''}${q.status==='submitted'?`<button class="btn primary" onclick="review('${q.id}')">Mark Reviewed</button>`:''}<button class="btn" onclick="analyzeQ('${q.id}')">Analyze</button><button class="btn" onclick="createPlan('${q.id}')">Create Plan</button><button class="btn" onclick="printQR('${q.public_token}','${WLP.esc(q.title)}')">Print QR</button><button class="btn" onclick="removeQ('${q.id}')">Remove</button></div></div><p class="muted">${(q.questions||[]).length} questions${q.submitted_at?` · Submitted ${new Date(q.submitted_at).toLocaleString()}`:''}</p>${['submitted','reviewed'].includes(q.status)?`<details><summary>View answers</summary>${(q.questions||[]).map(x=>`<p><strong>${WLP.esc(x.label)}</strong><br>${WLP.esc(Array.isArray(q.answers?.[x.id])?q.answers[x.id].join(', '):(q.answers?.[x.id]||'—'))}</p>`).join('')}</details>`:''}${flags.length||suggestions.length?`<div class="analysis"><strong>Smart review</strong>${flags.length?`<div><small>Needs attention</small><ul>${flags.map(x=>`<li>${WLP.esc(x)}</li>`).join('')}</ul></div>`:''}${suggestions.length?`<div><small>Suggested planning tasks</small><ul>${suggestions.map(x=>`<li>${WLP.esc(x)}</li>`).join('')}</ul></div>`:''}${q.plan_created_at?`<p class="muted">Plan created ${new Date(q.plan_created_at).toLocaleString()}</p>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">No questionnaires assigned to this event.</div>'}
async function copyLink(token){const url=location.origin+'/questionnaire-public.html?token='+encodeURIComponent(token);await navigator.clipboard.writeText(url);alert('Questionnaire link copied.')}async function sendQ(id){await WLP.api('questionnaires',{method:'PATCH',body:JSON.stringify({id,status:'sent'})});refresh()}async function review(id){await WLP.api('questionnaires',{method:'PATCH',body:JSON.stringify({id,status:'reviewed'})});refresh()}async function analyzeQ(id){await WLP.api('questionnaire-tools?action=analyze',{method:'POST',body:JSON.stringify({questionnaire_id:id})});await refresh()}async function createPlan(id){const r=await WLP.api('questionnaire-tools?action=create-plan',{method:'POST',body:JSON.stringify({questionnaire_id:id})});alert(`Planning tasks created: ${r.created||0}`);await refresh()}async function removeQ(id){if(!confirm('Remove this questionnaire?'))return;await WLP.api('questionnaires?id='+encodeURIComponent(id),{method:'DELETE'});refresh()}
function printQR(token,title){const url=location.origin+'/questionnaire-public.html?token='+encodeURIComponent(token);const qr='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(url);const w=open('','_blank');w.document.write(`<html><body style="font-family:Arial;text-align:center;padding:40px"><h1>${title}</h1><img src="${qr}" style="width:320px;height:320px"><p>${url}</p><script>setTimeout(()=>print(),700)<\/script></body></html>`);w.document.close()}
function downloadTemplate(){const text='template_name,event_type,question,required,type,options\nWedding Details,Wedding,What are your colors?,true,text,\nWedding Details,Wedding,Meal choice?,false,select,"Chicken|Fish|Vegetarian"\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='questionnaire-template-import.csv';a.click();URL.revokeObjectURL(a.href)}
templateBtn.onclick=async()=>{const name=prompt('Template name');if(!name)return;const event_type=prompt('Event type (optional)','');const description=prompt('Description (optional)','');const text=prompt('Enter one question per line. Add * at the end to make a question required.','Full name*\nPhone number\nWhat is most important to you for this event?*');if(!text)return;await WLP.api('questionnaires?type=template',{method:'POST',body:JSON.stringify({name,event_type,description,questions:qFromText(text)})});templates=(await WLP.api('questionnaires?type=templates')).templates||[];templateSummary.textContent=`${templates.length} reusable templates`;alert('Template saved.')};
assignBtn.onclick=async()=>{if(!eventSel.value)return alert('Choose an event first.');let template_id='';if(templates.length){const names=templates.map((t,i)=>`${i+1}. ${t.name}`).join('\n');const pick=prompt('Choose template number, or leave blank for a custom questionnaire:\n'+names,'1');if(pick){const t=templates[Number(pick)-1];if(t)template_id=t.id}}let title='',questions=[];if(!template_id){title=prompt('Questionnaire title','Event Details Questionnaire');if(!title)return;const text=prompt('Enter one question per line. Add * at the end for required.','What are your event colors?*\nWhat style are you envisioning?\nAnything you definitely do not want?');if(!text)return;questions=qFromText(text)}await WLP.api('questionnaires',{method:'POST',body:JSON.stringify({event_id:eventSel.value,template_id,title,questions,send_now:true})});refresh()};
importBtn.onclick=()=>csvFile.click();csvFile.onchange=async()=>{const f=csvFile.files[0];if(!f)return;const lines=(await f.text()).split(/\r?\n/).filter(Boolean);if(lines.length<2)return alert('CSV has no rows.');const header=csvLine(lines[0]).map(x=>x.trim().toLowerCase()),groups={};for(const line of lines.slice(1)){const vals=csvLine(line),r=Object.fromEntries(header.map((h,i)=>[h,vals[i]||''])),name=(r.template_name||r.name||'Imported Template').trim();if(!groups[name])groups[name]={name,event_type:r.event_type||'',questions:[]};groups[name].questions.push({id:crypto.randomUUID(),label:r.question||r.label||'Question',required:/^(true|1|yes)$/i.test(r.required||''),type:['text','textarea','select','radio','checkbox','date','number'].includes(r.type)?r.type:'text',options:(r.options||'').split('|').map(x=>x.trim()).filter(Boolean)})}let count=0;for(const g of Object.values(groups)){await WLP.api('questionnaires?type=template',{method:'POST',body:JSON.stringify(g)});count++}templates=(await WLP.api('questionnaires?type=templates')).templates||[];templateSummary.textContent=`${templates.length} reusable templates`;alert(`Imported ${count} template${count===1?'':'s'}.`)};eventSel.onchange=refresh;load().catch(()=>location='/login.html');
</script><script src="/assets/ui-v019.js"></script></body></html>
