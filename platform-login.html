<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Celebration Suite Platform Admin</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:560px;margin:60px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"><span>Platform Administration</span></div><div class="card"><h1>Platform Admin Sign In</h1><a class="btn" style="width:100%;justify-content:center" href="/.netlify/functions/google-auth-start?audience=platform&return=%2Fplatform-admin.html">Continue with Google</a><div style="text-align:center;margin:16px 0" class="muted">or use email and password</div><form id="loginForm" class="grid"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn primary">Sign In</button><div id="loginMsg"></div></form><p><a href="/forgot-password.html?type=platform">Forgot password?</a></p><details style="margin-top:24px"><summary><strong>First-time owner setup</strong></summary><p class="muted">Use your private Platform Admin Key once to create an email/password owner login. Keep the key private.</p><form id="setupForm" class="grid"><div class="field"><label>Platform Admin Key</label><input name="admin_key" type="password" required></div><div class="field"><label>Name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Create password</label><input name="password" type="password" minlength="10" required></div><button class="btn">Create Owner Login</button><div id="setupMsg"></div></form></details></div></main><script src="/assets/app.js"></script><script>const eMsg=new URLSearchParams(location.search).get('error');if(eMsg)loginMsg.textContent=eMsg;loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.textContent='Signing in…';try{await WLP.api('platform-auth-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))});location='/platform-admin.html'}catch(er){loginMsg.textContent=er.message}};setupForm.onsubmit=async e=>{e.preventDefault();setupMsg.textContent='Creating owner login…';const d=Object.fromEntries(new FormData(setupForm));try{await WLP.api('platform-auth-bootstrap',{method:'POST',headers:{'x-platform-admin-key':d.admin_key},body:JSON.stringify({email:d.email,full_name:d.full_name,password:d.password})});location='/platform-admin.html'}catch(er){setupMsg.textContent=er.message}}</script></body></html>
