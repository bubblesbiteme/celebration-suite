<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Proposal</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:900px;margin:auto;padding-top:28px"><div id="wrap" class="card">Loading proposal…</div></main><script src="/assets/app.js"></script><script>const token=new URLSearchParams(location.search).get('token');let proposal,tenant;function applyBrand(){const b=tenant.branding||{};for(const [k,v] of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v)}function render(){applyBrand();const c=proposal.content||{};wrap.innerHTML=`<div class="page-head"><div><div class="brand" style="color:#111"><div class="brand-mark">${tenant.branding?.logo_url?`<img src="${WLP.esc(tenant.branding.logo_url)}" alt="">`:`<span class="brand-fallback">${WLP.esc((tenant.business_name||'P').slice(0,2).toUpperCase())}</span>`}</div><div><div class="brand-title">${WLP.esc(tenant.business_name)}</div><small>Proposal</small></div></div></div><span class="badge status-${proposal.status}">${WLP.esc(proposal.status)}</span></div><h1>${WLP.esc(proposal.title)}</h1><p><strong>${WLP.esc(proposal.client_name||'')}</strong></p><div class="grid cols-2"><div class="card"><span class="muted">Proposal total</span><h2>$${Number(proposal.amount||0).toFixed(2)}</h2></div><div class="card"><span class="muted">Deposit</span><h2>$${Number(proposal.deposit_amount||0).toFixed(2)}</h2></div></div>${proposal.valid_until?`<p class="muted">Valid through ${WLP.fmtDate(proposal.valid_until)}</p>`:''}<hr><h2>Summary</h2><p>${WLP.esc(c.summary||'').replaceAll('\n','<br>')}</p><h2>Scope of Work</h2><p>${WLP.esc(c.scope||'').replaceAll('\n','<br>')}</p><h2>Terms</h2><p>${WLP.esc(c.terms||'').replaceAll('\n','<br>')}</p>${proposal.status==='accepted'?'<div class="notice good"><strong>Accepted.</strong> This proposal has been accepted.</div>':`<button class="btn primary" id="acceptBtn">Accept Proposal</button><span id="msg"></span>`}`;if(proposal.status!=='accepted')acceptBtn.onclick=accept}async function accept(){if(!confirm('Accept this proposal?'))return;msg.textContent='Accepting…';try{await WLP.api('proposal-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'accept'})});await load()}catch(e){msg.textContent=e.message}}async function load(){try{const d=await WLP.api('proposal-public?token='+encodeURIComponent(token));proposal=d.proposal;tenant=d.tenant;render()}catch(e){wrap.textContent=e.message}}load();</script></body></html>
