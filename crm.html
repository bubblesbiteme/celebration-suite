<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Lead CRM</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">CRM</span></div><div><div class="brand-title">Lead CRM</div><small>Sales pipeline</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="newBtn">+ New Lead</button></div></header><main><div class="page-head"><div><h1>Sales Pipeline</h1><p class="muted">Drag leads between stages or open a lead to edit it manually.</p></div><div class="toolbar"><input id="search" placeholder="Search leads"></div></div><div id="board" class="kanban"></div></main>
<div class="modal" id="leadModal"><div class="modal-card"><button class="btn close" id="closeBtn">Close</button><h2 id="modalTitle">Lead</h2><form id="leadForm" class="grid"><input type="hidden" name="id"><div class="grid cols-2"><div class="field"><label>Name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="grid cols-2"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Source</label><input name="source"></div></div><div class="grid cols-3"><div class="field"><label>Stage</label><select name="stage"></select></div><div class="field"><label>Priority</label><select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select></div><div class="field"><label>Next follow-up</label><input name="next_follow_up" type="datetime-local"></div></div><div class="grid cols-3"><div class="field"><label>Event type</label><input name="event_type"></div><div class="field"><label>Event date</label><input name="event_date" type="date"></div><div class="field"><label>Guests</label><input name="guest_count" type="number"></div></div><div class="grid cols-2"><div class="field"><label>Budget</label><input name="estimated_budget" type="number" step="0.01"></div><div class="field"><label>Location</label><input name="location"></div></div><div class="field"><label>Inquiry details</label><textarea name="inquiry_details"></textarea></div><div class="toolbar"><button class="btn primary">Save Lead</button><button type="button" class="btn" id="emailBtn">Email Lead</button><button type="button" class="btn accent" id="convertBtn">Convert to Event</button></div><div id="leadMsg"></div><div><h3>Activity</h3><div id="activity" class="timeline-list"></div></div></form></div></div>
<script src="/assets/app.js"></script><script>
const stages=[['new_inquiry','New Inquiry'],['contacted','Contacted'],['consultation','Consultation'],['proposal_sent','Proposal Sent'],['negotiating','Negotiating'],['booked','Booked'],['lost','Lost']];let leads=[];let dragged=null;const f=leadForm;f.stage.innerHTML=stages.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
function label(v){return stages.find(x=>x[0]===v)?.[1]||v}function money(v){return v?`$${Number(v).toLocaleString()}`:''}function received(v){return v?new Date(v).toLocaleString():'—'}
function render(){const q=search.value.toLowerCase();board.innerHTML=stages.map(([key,name])=>{const arr=leads.filter(x=>x.stage===key&&`${x.full_name} ${x.email} ${x.event_type} ${x.location}`.toLowerCase().includes(q));return `<section class="kanban-col" data-stage="${key}"><div class="kanban-head"><span>${name}</span><span>${arr.length}</span></div><div class="kanban-cards">${arr.map(x=>`<div class="lead-card" draggable="true" data-id="${x.id}"><strong>${WLP.esc(x.full_name)}</strong><span>${WLP.esc(x.event_type||'Event TBD')}</span><small class="muted">${WLP.esc(x.email||x.phone||'No contact info')}</small><small>${WLP.fmtDate(x.event_date)} ${money(x.estimated_budget)}</small><small class="muted">Received ${received(x.created_at)}</small></div>`).join('')}</div></section>`}).join('');$$('.lead-card').forEach(c=>{c.ondragstart=()=>{dragged=c.dataset.id;c.classList.add('dragging')};c.ondragend=()=>c.classList.remove('dragging');c.onclick=()=>openLead(c.dataset.id)});$$('.kanban-col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('dragover')};col.ondragleave=()=>col.classList.remove('dragover');col.ondrop=async e=>{e.preventDefault();col.classList.remove('dragover');if(!dragged)return;const lead=leads.find(x=>x.id===dragged),old=lead.stage,next=col.dataset.stage;if(old===next)return;lead.stage=next;render();try{await WLP.api('leads',{method:'PATCH',body:JSON.stringify({id:lead.id,stage:next})})}catch(err){lead.stage=old;render();alert(err.message)}}})}
async function openLead(id){const d=await WLP.api('leads?id='+encodeURIComponent(id)),x=d.lead;for(const k of ['id','full_name','email','phone','source','stage','priority','event_type','event_date','guest_count','estimated_budget','location','inquiry_details'])if(f.elements[k])f.elements[k].value=x[k]??'';f.next_follow_up.value=x.next_follow_up?new Date(x.next_follow_up).toISOString().slice(0,16):'';modalTitle.textContent=x.full_name;activity.innerHTML=(d.activity||[]).length?(d.activity||[]).map(a=>`<div class="timeline-item"><strong>${WLP.esc(a.summary)}</strong><div class="muted">${new Date(a.created_at).toLocaleString()}</div></div>`).join(''):'<div class="muted">No activity yet.</div>';leadModal.classList.add('open')}
newBtn.onclick=()=>{f.reset();f.id.value='';f.stage.value='new_inquiry';f.priority.value='normal';modalTitle.textContent='New Lead';activity.innerHTML='';leadModal.classList.add('open')};closeBtn.onclick=()=>leadModal.classList.remove('open');search.oninput=render;
f.onsubmit=async e=>{e.preventDefault();leadMsg.textContent='Saving…';const data=Object.fromEntries(new FormData(f));try{if(data.id)await WLP.api('leads',{method:'PATCH',body:JSON.stringify(data)});else await WLP.api('leads',{method:'POST',body:JSON.stringify(data)});leadMsg.textContent='Saved.';await load();leadModal.classList.remove('open')}catch(err){leadMsg.textContent=err.message}};
emailBtn.onclick=async()=>{const to=f.email.value;if(!to)return alert('Add an email first.');const subject=prompt('Subject','Following up on your event inquiry');if(!subject)return;const body=prompt('Message');if(!body)return;try{await WLP.api('tenant-email',{method:'POST',body:JSON.stringify({to,subject,body})});if(f.id.value&&f.stage.value==='new_inquiry'){f.stage.value='contacted';await WLP.api('leads',{method:'PATCH',body:JSON.stringify({id:f.id.value,stage:'contacted',next_follow_up:new Date(Date.now()+3*86400000).toISOString()})})}alert('Email sent.');await load()}catch(e){alert(e.message)}};
convertBtn.onclick=async()=>{if(!f.id.value)return alert('Save the lead first.');if(!confirm('Convert this lead into a client and event?'))return;try{const d=await WLP.api('leads?action=convert',{method:'POST',body:JSON.stringify({id:f.id.value})});location='/event.html?id='+encodeURIComponent(d.event_id)}catch(e){alert(e.message)}};
async function load(){const d=await WLP.api('leads');leads=d.leads||[];render()}load().catch(e=>{alert(e.message);location='/app.html'});
</script></body></html>
