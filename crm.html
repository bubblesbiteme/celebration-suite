<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Lead CRM</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">CRM</span></div><div><div class="brand-title">Lead CRM</div><small>Sales pipeline, follow-up and conversion</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="newBtn">+ New Lead</button></div></header><main><div class="page-head"><div><h1>Sales Pipeline</h1><p class="muted">Drag leads between stages, track consultations, and keep follow-ups from falling through the cracks.</p></div><div class="toolbar"><input id="search" placeholder="Search leads"><select id="priorityFilter"><option value="">All priorities</option><option>urgent</option><option>high</option><option>normal</option><option>low</option></select><select id="tempFilter"><option value="">All temperatures</option><option>hot</option><option>warm</option><option>cold</option></select></div></div><div id="stats" class="grid cols-4"></div><div id="board" class="kanban"></div></main>
<div class="modal" id="leadModal"><div class="modal-card"><button class="btn close" id="closeBtn">Close</button><h2 id="modalTitle">Lead</h2><form id="leadForm" class="grid"><input type="hidden" name="id"><div class="grid cols-2"><div class="field"><label>Name</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email"></div></div><div class="grid cols-3"><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Source</label><input name="source"></div><div class="field"><label>Temperature</label><select name="temperature"><option>hot</option><option selected>warm</option><option>cold</option></select></div></div><div class="grid cols-3"><div class="field"><label>Stage</label><select name="stage"></select></div><div class="field"><label>Priority</label><select name="priority"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select></div><div class="field"><label>Next follow-up</label><input name="next_follow_up" type="datetime-local"></div></div><div class="grid cols-3"><div class="field"><label>Consultation</label><input name="consultation_at" type="datetime-local"></div><div class="field"><label>Event type</label><input name="event_type"></div><div class="field"><label>Event date</label><input name="event_date" type="date"></div></div><div class="grid cols-3"><div class="field"><label>Guests</label><input name="guest_count" type="number"></div><div class="field"><label>Budget</label><input name="estimated_budget" type="number" step="0.01"></div><div class="field"><label>Location</label><input name="location"></div></div><div class="field"><label>Tags (comma separated)</label><input name="tags"></div><div class="field"><label>Inquiry details</label><textarea name="inquiry_details"></textarea></div><div class="field"><label>Lost reason</label><textarea name="lost_reason" placeholder="Only needed when lead is lost"></textarea></div><div class="toolbar"><button class="btn primary">Save Lead</button><button type="button" class="btn" id="emailBtn">Email Lead</button><button type="button" class="btn" id="consultBtn">Schedule Consultation</button><button type="button" class="btn accent" id="convertBtn">Convert to Event</button></div><div id="leadMsg"></div><div><h3>Activity</h3><div id="activity" class="timeline-list"></div></div></form></div></div>
<script src="/assets/app.js"></script><script>
const stages=[['new_inquiry','New Inquiry'],['contacted','Contacted'],['consultation','Consultation'],['proposal_sent','Proposal Sent'],['negotiating','Negotiating'],['booked','Booked'],['lost','Lost']];let leads=[],dragged=null;const f=leadForm;f.stage.innerHTML=stages.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');const money=v=>v?`$${Number(v).toLocaleString()}`:'';function render(){const q=search.value.toLowerCase(),pf=priorityFilter.value,tf=tempFilter.value,now=Date.now();const filtered=leads.filter(x=>(!pf||x.priority===pf)&&(!tf||x.temperature===tf)&&`${x.full_name} ${x.email} ${x.event_type} ${x.location} ${(x.tags||[]).join(' ')}`.toLowerCase().includes(q));const active=filtered.filter(x=>!['booked','lost'].includes(x.stage));stats.innerHTML=[['Open Leads',active.length],['Overdue Follow-up',active.filter(x=>x.next_follow_up&&Date.parse(x.next_follow_up)<now).length],['Hot Leads',active.filter(x=>x.temperature==='hot').length],['Booked',filtered.filter(x=>x.stage==='booked').length]].map(([k,v])=>`<div class="card"><small class="muted">${k}</small><strong style="display:block;font-size:28px">${v}</strong></div>`).join('');board.innerHTML=stages.map(([key,name])=>{const arr=filtered.filter(x=>x.stage===key);return `<section class="kanban-col" data-stage="${key}"><div class="kanban-head"><span>${name}</span><span>${arr.length}</span></div><div class="kanban-cards">${arr.map(x=>`<div class="lead-card" draggable="true" data-id="${x.id}"><div class="toolbar"><strong>${WLP.esc(x.full_name)}</strong><span class="badge">${WLP.esc(x.temperature||'warm')}</span></div><span>${WLP.esc(x.event_type||'Event TBD')}</span><small class="muted">${WLP.esc(x.email||x.phone||'No contact info')}</small><small>${WLP.fmtDate(x.event_date)} ${money(x.estimated_budget)}</small>${x.next_follow_up?`<small class="${Date.parse(x.next_follow_up)<now?'warn':''}">Follow-up ${new Date(x.next_follow_up).toLocaleString()}</small>`:''}${x.consultation_at?`<small>Consultation ${new Date(x.consultation_at).toLocaleString()}</small>`:''}</div>`).join('')}</div></section>`}).join('');document.querySelectorAll('.lead-card').forEach(c=>{c.ondragstart=()=>dragged=c.dataset.id;c.onclick=()=>openLead(c.dataset.id)});document.querySelectorAll('.kanban-col').forEach(col=>{col.ondragover=e=>e.preventDefault();col.ondrop=async e=>{e.preventDefault();if(!dragged)return;const lead=leads.find(x=>x.id===dragged),old=lead.stage,next=col.dataset.stage;if(next==='lost'&&!lead.lost_reason){const reason=prompt('Why was this lead lost?');if(!reason)return;lead.lost_reason=reason}lead.stage=next;render();try{await WLP.api('leads',{method:'PATCH',body:JSON.stringify({id:lead.id,stage:next,lost_reason:lead.lost_reason})})}catch(err){lead.stage=old;render();alert(err.message)}}})}async function openLead(id){const d=await WLP.api('leads?id='+encodeURIComponent(id)),x=d.lead;for(const k of ['id','full_name','email','phone','source','stage','priority','temperature','event_type','event_date','guest_count','estimated_budget','location','inquiry_details','lost_reason'])if(f.elements[k])f.elements[k].value=x[k]??'';f.tags.value=(x.tags||[]).join(', ');for(const k of ['next_follow_up','consultation_at'])f.elements[k].value=x[k]?new Date(x[k]).toISOString().slice(0,16):'';modalTitle.textContent=x.full_name;activity.innerHTML=(d.activity||[]).map(a=>`<div class="timeline-item"><strong>${WLP.esc(a.summary)}</strong><div class="muted">${new Date(a.created_at).toLocaleString()}</div></div>`).join('')||'<div class="muted">No activity yet.</div>';leadModal.classList.add('open')}newBtn.onclick=()=>{f.reset();f.id.value='';f.stage.value='new_inquiry';f.priority.value='normal';f.temperature.value='warm';activity.innerHTML='';leadModal.classList.add('open')};closeBtn.onclick=()=>leadModal.classList.remove('open');[search,priorityFilter,tempFilter].forEach(x=>x.oninput=render);f.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));data.tags=data.tags.split(',').map(x=>x.trim()).filter(Boolean);try{await WLP.api('leads',{method:data.id?'PATCH':'POST',body:JSON.stringify(data)});await load();leadModal.classList.remove('open')}catch(err){leadMsg.textContent=err.message}};emailBtn.onclick=async()=>{if(!f.email.value)return alert('Add an email first.');const subject=prompt('Subject','Following up on your event inquiry');if(!subject)return;const body=prompt('Message');if(!body)return;await WLP.api('communications',{method:'POST',body:JSON.stringify({channel:'email',lead_id:f.id.value||null,recipient:f.email.value,subject,body})});if(f.id.value)await WLP.api('leads',{method:'PATCH',body:JSON.stringify({id:f.id.value,stage:f.stage.value==='new_inquiry'?'contacted':f.stage.value,next_follow_up:new Date(Date.now()+3*86400000).toISOString()})});alert('Email sent.');load()};consultBtn.onclick=async()=>{const starts=prompt('Consultation date/time','');if(!starts)return;const dt=new Date(starts);if(!Number.isFinite(dt.getTime()))return alert('Invalid date/time.');f.consultation_at.value=dt.toISOString().slice(0,16);f.stage.value='consultation';if(f.id.value)await WLP.api('leads',{method:'PATCH',body:JSON.stringify({id:f.id.value,consultation_at:dt.toISOString(),stage:'consultation'})});alert('Consultation saved.');load()};convertBtn.onclick=async()=>{if(!f.id.value)return alert('Save the lead first.');if(!confirm('Convert this lead into a client and event?'))return;const d=await WLP.api('leads?action=convert',{method:'POST',body:JSON.stringify({id:f.id.value})});location='/event.html?id='+encodeURIComponent(d.event_id)};async function load(){leads=(await WLP.api('leads')).leads||[];render()}load();
</script></body></html>
