<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decor Rentals</title><link rel="stylesheet" href="/assets/app.css"><style>
body{background:#f7f4ef}.store{max-width:1120px;margin:auto;padding:24px}.store-head{display:flex;gap:16px;align-items:center;margin-bottom:20px}.store-logo{width:64px;height:64px;object-fit:contain;border-radius:14px;background:white;padding:5px}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.rental-card{background:#fff;border:1px solid #e4ddd5;border-radius:16px;overflow:hidden}.rental-card img{width:100%;height:160px;object-fit:cover;background:#eee}.rental-body{padding:14px}.qty{width:84px}.summary{position:sticky;bottom:12px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;box-shadow:0 10px 30px #0002;margin-top:20px}.hidden{display:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12px}.success{background:#eef8ef;border:1px solid #bddcbe;padding:18px;border-radius:16px}
</style></head><body><main class="store"><div id="app"><p>Loading rental storefront…</p></div></main><script src="/assets/app.js"></script><script>
const app=document.getElementById('app'),q=new URLSearchParams(location.search),tenant=q.get('tenant'),token=q.get('token'),session_id=q.get('session_id');let data=null;
const money=n=>'$'+Number(n||0).toFixed(2),esc=WLP.esc;
function brand(t){const b=t.branding||{};document.documentElement.style.setProperty('--primary',b.primary||'#A9B89A');document.documentElement.style.setProperty('--secondary',b.secondary||'#37243F');document.documentElement.style.setProperty('--accent',b.accent||'#D9BE8C');document.title=`Decor Rentals — ${t.business_name}`}
async function load(){try{const p=new URLSearchParams();if(token)p.set('token',token);else if(tenant)p.set('tenant',tenant);if(session_id)p.set('session_id',session_id);data=await WLP.api('decor-rentals-public?'+p.toString());brand(data.tenant);token?renderOrder():renderStore()}catch(e){app.innerHTML=`<div class="card"><h1>Decor Rentals</h1><p>${esc(e.message)}</p></div>`}}
function header(){const t=data.tenant,b=t.branding||{},logo=b.logo_url||'/assets/celebration-suite-mark.svg';return `<div class="store-head"><img class="store-logo" src="${esc(logo)}" alt=""><div><h1 style="margin:0">${esc(t.business_name)}</h1><div class="muted">Decor Rentals</div></div></div>`}
function renderOrder(){const o=data.order;app.innerHTML=header()+`<div class="success"><h2>${data.payment_verified?'Rental reserved':'Rental request'}</h2><p><strong>${esc(o.customer_name)}</strong>, your rental request for ${esc(o.start_date)} through ${esc(o.end_date)} is ${esc(o.status)}.</p><p>Total: <strong>${money(o.subtotal)}</strong></p>${data.payment_verified?'<p>Your items are now reserved for those dates.</p>':'<p>If checkout was canceled, return to the rental storefront to submit a new request. Availability can change until payment is complete.</p>'}</div><div class="card"><h3>Items</h3>${(data.items||[]).map(x=>`<div>${esc(x.item_name)} × ${x.quantity} — ${money(x.line_total)}</div>`).join('')}</div>`}
async function refreshDates(){const start=document.getElementById('start').value,end=document.getElementById('end').value;if(!start||!end||start>end)return;const p=new URLSearchParams({tenant,start,end});data=await WLP.api('decor-rentals-public?'+p.toString());renderCatalog()}
function renderStore(){app.innerHTML=header()+`<div class="card"><p>${esc(data.settings.rental_intro||'Choose your rental dates, select available decor, and submit your reservation.')}</p><div class="dates"><div class="field"><label>Start date</label><input id="start" type="date"></div><div class="field"><label>End date</label><input id="end" type="date"></div></div><div class="toolbar"><button class="btn primary" id="check">Check availability</button></div></div><div id="catalog"></div>`;document.getElementById('check').onclick=refreshDates;renderCatalog()}
function renderCatalog(){const host=document.getElementById('catalog');if(!host)return;const start=document.getElementById('start')?.value,end=document.getElementById('end')?.value;if(!start||!end){host.innerHTML='<div class="card"><p class="muted">Choose dates to see exact availability.</p></div>';return}host.innerHTML=`<div class="catalog">${(data.items||[]).map(i=>{const img=i.images?.[0]?.public_url||i.images?.[0]?.url||i.image_url||'/assets/celebration-suite-mark.svg';return `<div class="rental-card"><img src="${esc(img)}" alt=""><div class="rental-body"><strong>${esc(i.name)}</strong><div>${money(i.rental_price)} / rental</div><div class="muted">${i.available_quantity} available</div><div class="field"><label>Quantity</label><input class="qty" data-id="${i.id}" type="number" min="0" max="${i.available_quantity}" value="0"></div></div></div>`}).join('')}</div><form id="checkout" class="summary"><h2>Request rentals</h2><div class="grid cols-2"><div class="field"><label>Name</label><input name="customer_name" required></div><div class="field"><label>Email</label><input name="customer_email" type="email" required></div><div class="field"><label>Phone</label><input name="customer_phone"></div><div class="field"><label>Notes</label><input name="notes"></div></div><p class="muted">${esc(data.settings.rental_terms||'Availability is held temporarily during checkout and is confirmed after payment.')}</p><button class="btn primary">Continue</button> <span id="msg"></span></form>`;document.getElementById('checkout').onsubmit=submitRental}
async function submitRental(e){e.preventDefault();const msg=document.getElementById('msg');try{msg.textContent='Creating request…';const f=Object.fromEntries(new FormData(e.target)),items=[...document.querySelectorAll('.qty')].map(x=>({inventory_item_id:x.dataset.id,quantity:Number(x.value)||0})).filter(x=>x.quantity>0);const r=await WLP.api('decor-rentals-public?tenant='+encodeURIComponent(tenant),{method:'POST',body:JSON.stringify({...f,start_date:document.getElementById('start').value,end_date:document.getElementById('end').value,items})});if(r.url)location.href=r.url;else location.href=`/decor-rentals.html?token=${encodeURIComponent(r.token)}`;}catch(err){msg.textContent=err.message}}
load();
</script></body></html>
