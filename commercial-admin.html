<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commercial Launch · Celebration Suite</title><style>body{font:14px system-ui;margin:0;background:#f6f5f2;color:#242024}.top{background:#37243F;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.shell{max-width:980px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin:5px 0 10px}.btn{border:1px solid #bbb;border-radius:9px;padding:9px 12px;background:#fff;cursor:pointer;text-decoration:none;color:inherit}.primary{background:#37243F;color:#fff}.msg{white-space:pre-wrap;margin-top:10px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>  <link rel="stylesheet" href="/assets/premium-experience.css">
</head><body><header class="top"><b>Celebration Suite · Commercial Launch</b><div><a class="btn" href="/launch-readiness.html">Launch Readiness</a> <a class="btn" href="/platform-admin.html">Platform Admin</a> <a class="btn" href="/beta-validation.html">Beta Validation</a></div></header><main class="shell"><div class="grid"><section class="card"><h2>Provision planner account</h2><label>Business name<input id="business"></label><label>Owner name<input id="owner"></label><label>Owner email<input id="email" type="email"></label><label>Plan<select id="plan"><option value="monthly_unlimited">Monthly Unlimited</option><option value="annual_unlimited">Annual Unlimited</option><option value="single_event">Single Event</option></select></label><label>Trial days<input id="trial" type="number" min="0" max="60" value="0"></label><button class="btn primary" id="provision">Provision account</button><div class="msg" id="provisionMsg"></div></section><section class="card"><h2>Publish release notice</h2><label>Version<input id="version" value="0.38.0"></label><label>Title<input id="title"></label><label>Severity<select id="severity"><option>info</option><option>important</option><option>maintenance</option></select></label><label>Message<textarea id="body" rows="7"></textarea></label><button class="btn primary" id="publish">Publish notice</button><div class="msg" id="noticeMsg"></div></section></div></main><script>async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'content-type':'application/json',...(opts.headers||{})},...opts});if(r.status===401){location='/platform-login.html';throw new Error('Unauthorized')}const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}provision.onclick=async()=>{provisionMsg.textContent='Working…';try{const d=await api('/.netlify/functions/platform-provision-tenant',{method:'POST',body:JSON.stringify({business_name:business.value,owner_name:owner.value,owner_email:email.value,plan_type:plan.value,trial_days:Number(trial.value||0)})});provisionMsg.textContent=`Provisioned. Tenant: ${d.tenant_id}\nSetup link: ${d.setup_url}`;}catch(e){provisionMsg.textContent=e.message}};publish.onclick=async()=>{noticeMsg.textContent='Publishing…';try{await api('/.netlify/functions/platform-release-notices',{method:'POST',body:JSON.stringify({version:version.value,title:title.value,severity:severity.value,body:body.value})});noticeMsg.textContent='Release notice published.';title.value='';body.value=''}catch(e){noticeMsg.textContent=e.message}}</script>  <script src="/assets/premium-experience.js" defer></script>
</body></html>
