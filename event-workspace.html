function timelineList(items){const sorted=[...items].sort((a,b)=>(a.milestone_date||'9999').localeCompare(b.milestone_date||'9999')||(a.start_time||'').localeCompare(b.start_time||''));return `<div class="timeline-list">${sorted.map(x=>`<div class="timeline-item ${esc(x.status)}"><div class="timeline-date">${x.milestone_date?fmt(x.milestone_date):'Date TBD'}${x.start_time?`<br><span class="muted">${timeFmt(x.start_time)}${x.end_time?'–'+timeFmt(x.end_time):''}</span>`:''}</div><div><h4>${esc(x.title)}</h4><div class="muted">${esc(labelize(x.category))} · ${esc(labelize(x.status))}</div>${x.notes?`<p>${esc(x.notes)}</p>`:''}<div class="calendar-actions">${x.milestone_date?`<a class="btn light small" target="_blank" rel="noopener" href="${esc(googleCalendarUrl(timelineCalendarItem(x).title,x.milestone_date,x.start_time,x.end_time,timelineCalendarItem(x).notes,eventLocation()))}">Google Calendar</a><button class="btn light small" type="button" data-download-timeline="${x.id}">Apple / Outlook</button>`:'<span class="muted">Add a date to enable calendar export.</span>'}</div><form class="timeline-edit-form hidden form-grid" data-timeline-edit-form="${x.id}" style="margin-top:12px"><input name="title" value="${esc(x.title)}" required><input name="milestone_date" type="date" value="${esc(x.milestone_date||'')}"><input name="start_time" type="time" value="${esc((x.start_time||'').slice(0,5))}"><input name="end_time" type="time" value="${esc((x.end_time||'').slice(0,5))}"><select name="category">${['planning','vendor','guest','design','operations','event_day'].map(v=>`<option value="${v}" ${x.category===v?'selected':''}>${labelize(v)}</option>`).join('')}</select><select name="status">${['upcoming','in_progress','completed','cancelled'].map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${labelize(v)}</option>`).join('')}</select><textarea class="full" name="notes" placeholder="Notes, location, owner or dependencies">${esc(x.notes||'')}</textarea><div class="quick full"><button class="btn sage small" type="submit">Save changes</button><button class="btn light small" type="button" data-close-timeline-edit="${x.id}">Cancel</button></div></form></div><div class="timeline-actions"><select class="timeline-status" data-timeline-id="${x.id}">${['upcoming','in_progress','completed','cancelled'].map(v=>`<option value="${v}" ${x.status===v?'selected':''}>${labelize(v)}</option>`).join('')}</select><button class="btn light small" type="button" data-edit-timeline="${x.id}">Edit</button><button class="icon-btn" data-delete-timeline="${x.id}" aria-label="Delete timeline item">×</button></div></div>`).join('')||'<div class="empty">No timeline items yet. Generate milestones or add your first item below.</div>'}</div>`}
function calendarPanel(items){const y=calendarCursor.getFullYear(),m=calendarCursor.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dayItems=items.filter(x=>x.milestone_date===ds);cells.push(`<div class="calendar-cell ${d.getMonth()!==m?'outside':''}"><div class="calendar-number">${d.getDate()}</div>${dayItems.map(x=>`<span class="calendar-event ${esc(x.category)}" title="${esc(x.notes||'')}">${x.start_time?timeFmt(x.start_time)+' ':''}${esc(x.title)}</span>`).join('')}</div>`)}return `<div class="calendar-head"><button class="btn light small" id="calPrev">← Previous</button><h3>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><button class="btn light small" id="calNext">Next →</button></div><div class="calendar-wrap"><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calendar-day-name">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function timeFmt(t){if(!t)return'';const [h,m]=t.slice(0,5).split(':').map(Number),d=new Date(2000,0,1,h,m);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
