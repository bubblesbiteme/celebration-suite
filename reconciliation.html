<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Accounting Reconciliation</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">$</span></div><div><div class="brand-title">Accounting Reconciliation</div><small>Celebration Suite vs QuickBooks</small></div></div><div class="top-actions"><a class="btn" href="/accounting.html">← QuickBooks</a><button class="btn primary" onclick="saveSnapshot()">Save Snapshot</button></div></header><main><div class="page-head"><div><h1>Reconciliation Center</h1><p class="muted">Compare receivables tracked in Celebration Suite with your connected QuickBooks company.</p></div></div><div id="notice"></div><div id="stats" class="grid cols-4"></div><div class="grid cols-2" style="margin-top:18px"><section class="card"><h2>Celebration Suite</h2><div id="local"></div></section><section class="card"><h2>QuickBooks</h2><div id="qb"></div></section></div><section class="card" style="margin-top:18px"><h2>Saved reconciliation snapshots</h2><div id="history"></div></section></main><script src="/assets/app.js"></script><script>
let data;const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0));function render(){const l=data.local,q=data.qb.summary||{},c=data.comparison;stats.innerHTML=`<div class="card stat"><small>Local billed</small><strong>${money(l.billed)}</strong></div><div class="card stat"><small>QB invoiced</small><strong>${money(q.total_invoiced)}</strong></div><div class="card stat"><small>Invoice delta</small><strong>${money(c.invoice_delta)}</strong></div><div class="card stat"><small>Balance delta</small><strong>${money(c.balance_delta)}</strong></div>`;local.innerHTML=`<p>Invoices: <strong>${l.invoice_count}</strong></p><p>Billed: <strong>${money(l.billed)}</strong></p><p>Collected: <strong>${money(l.collected)}</strong></p><p>Outstanding: <strong>${money(l.outstanding)}</strong></p>`;qb.innerHTML=data.qb.connected?`<p>Company: <strong>${WLP.esc(data.qb.company?.CompanyName||'Connected')}</strong></p><p>Invoices: <strong>${q.invoice_count||0}</strong></p><p>Total invoiced: <strong>${money(q.total_invoiced)}</strong></p><p>Open balance: <strong>${money(q.open_balance)}</strong></p>`:`<p class="muted">QuickBooks is not connected. <a href="/accounting.html">Connect it here.</a></p>`;history.innerHTML=data.history.length?`<table class="table"><thead><tr><th>Date</th><th>Invoice delta</th><th>Balance delta</th><th>Notes</th></tr></thead><tbody>${data.history.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${money(x.invoice_delta)}</td><td>${money(x.balance_delta)}</td><td>${WLP.esc(x.notes||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No snapshots saved yet.</div>'}async function saveSnapshot(){const notes=prompt('Optional reconciliation notes','');await WLP.api('reconciliation',{method:'POST',body:JSON.stringify({notes})});await load()}async function load(){try{data=await WLP.api('reconciliation');render()}catch(e){notice.textContent=e.message}}load();
</script><script src="/assets/ui-v019.js"></script></body></html>
