<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Change Client Password | Celebration Suite</title><link rel="stylesheet" href="/assets/app.css">  



  <link rel="stylesheet" href="/assets/premium-experience.css">
  <link rel="stylesheet" href="/assets/ultra-luxury.css">
</head><body><main class="public-shell"><div class="card" style="max-width:560px;margin:auto"><h1>Create a New Password</h1><p class="muted">Choose a password with at least 10 characters.</p><form id="form" class="grid"><div class="field"><label>New password</label><input name="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirm new password</label><input name="confirm" type="password" minlength="10" autocomplete="new-password" required></div><button class="btn primary">Save Password</button><div id="msg" role="status"></div></form><p><a href="/my-events.html">← Back to my events</a></p></div></main><script src="/assets/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{await WLP.api('client-change-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});msg.textContent='Password updated.';setTimeout(()=>location='/my-events.html',500)}catch(err){msg.textContent=err.message}}</script>  



  <script src="/assets/premium-experience.js" defer></script>
  <script src="/assets/ultra-luxury.js" defer></script>
</body></html>
