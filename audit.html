<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Activity History</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Activity History</div><small>Client and system change history</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main><div class="page-head"><div><h1>Audit & Client Activity</h1><p class="muted">See who changed what and when across your planning workspace.</p></div><div class="toolbar"><select id="eventFilter"><option value="">All events</option></select></div></div><div class="card"><div id="list">Loading…</div></div></main><script src="/assets/app.js"></script><script>
const {api,esc}=WLP;let events=[];async function loadEvents(){const b=await api('bootstrap');events=b.events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join('')}async function load(){const q=eventFilter.value?'?event_id='+encodeURIComponent(eventFilter.value):'';const d=await api('audit'+q);list.innerHTML=(d.entries||[]).length?(d.entries||[]).map(x=>`<div class="card" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${esc(x.summary||x.action)}</strong><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div><div class="muted">${esc(x.actor_name||x.actor_type||'system')} · ${esc(x.entity_type||'activity')} · ${esc(x.action)}</div></div>`).join(''):'<div class="empty">No activity recorded yet.</div>'}eventFilter.onchange=load;(async()=>{await loadEvents();await load()})().catch(e=>alert(e.message));</script><script src="/assets/ui-v019.js"></script></body></html>
