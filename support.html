<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Center</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Support Center</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1200px;margin:auto"><div class="page-head"><div><h1>Support & Issue Tracking</h1><p class="muted">Keep a record of product issues, questions, and resolutions inside your account.</p></div></div><div class="grid cols-3"><form id="form" class="card grid"><h2>New Ticket</h2><div class="field"><label>Subject</label><input name="subject" required></div><div class="field"><label>Category</label><select name="category"><option>general</option><option>billing</option><option>integration</option><option>bug</option><option>data</option></select></div><div class="field"><label>Priority</label><select name="priority"><option>normal</option><option>low</option><option>high</option><option>urgent</option></select></div><div class="field"><label>Description</label><textarea name="description" rows="8" required></textarea></div><button class="btn primary">Create Ticket</button><span id="msg"></span></form><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>let rows=[];function render(){list.innerHTML=rows.length?rows.map(x=>`<div class="notice" style="margin-bottom:12px"><div class="toolbar"><span class="badge">${WLP.esc(x.priority)}</span><span class="badge">${WLP.esc(x.status)}</span><strong>${WLP.esc(x.subject)}</strong></div><p>${WLP.esc(x.description)}</p>${x.resolution?`<p><strong>Resolution:</strong> ${WLP.esc(x.resolution)}</p>`:''}<small class="muted">${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<div class="empty">No support tickets yet.</div>'}async function load(){rows=(await WLP.api('support')).tickets||[];render()}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{await WLP.api('support',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();msg.textContent='Ticket created.';load()}catch(err){msg.textContent=err.message}};load().catch(()=>location='/login.html');</script><script src="/assets/ui-v019.js"></script></body></html>
