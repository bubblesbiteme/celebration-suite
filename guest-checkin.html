<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Guest Check-In</title><link rel="stylesheet" href="/assets/app.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>main{max-width:980px;margin:auto}.scan-hero{text-align:center}.big-code{font-size:18px;padding:15px!important}.person{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--cs-line)}.person.in{background:#eff7ec}#reader{max-width:520px;margin:12px auto}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">QR Guest Check-In</div><small>RSVP guests and ticket holders in one scanner</small></div><div class="top-actions"><a id="back" class="btn" href="/guests.html">← Guest Management</a><a id="tickets" class="btn" href="/registration.html">Ticket Sales</a></div></header><main><section class="card scan-hero"><h1>Scan a QR Code</h1><p class="muted">Point the camera at a guest invitation QR or event ticket.</p><div id="reader"></div><div class="toolbar" style="justify-content:center"><button id="startBtn" class="btn primary" onclick="startScanner()">Start Camera</button><button id="stopBtn" class="btn" onclick="stopScanner()" hidden>Stop Camera</button></div><p><strong>Or type/paste a code</strong></p><div class="toolbar" style="justify-content:center"><input id="code" class="big-code" placeholder="Guest or ticket code"><button class="btn primary" onclick="submitCode(code.value)">Check In</button></div><p id="result" aria-live="polite"></p></section><div id="stats" class="kpi-row" style="margin:16px 0"></div><section class="card"><div class="page-head"><h2>Everyone</h2><input id="search" placeholder="Search name, email, table, ticket code"></div><div id="list"></div></section></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');let guests=[],ticketsData={attendees:[],types:[]},scanner=null,busy=false;back.href='/guests.html?event_id='+encodeURIComponent(eventId||'');tickets.href='/registration.html?event_id='+encodeURIComponent(eventId||'');async function load(){if(!eventId)throw new Error('Choose an event first.');const [g,t]=await Promise.all([WLP.api('guests?event_id='+encodeURIComponent(eventId)),WLP.api('ticketing?event_id='+encodeURIComponent(eventId))]);guests=g.guests||[];ticketsData=t;render()}function render(){const all=[...guests.map(g=>({kind:'guest',id:g.id,name:g.full_name,email:g.email||'',detail:`RSVP · ${g.table_name||'No table'} · party ${g.party_size}`,code:g.invitation_code||g.checkin_code,in:!!g.checked_in_at})),...(ticketsData.attendees||[]).filter(a=>a.status==='active').map(a=>({kind:'ticket',id:a.id,name:[a.first_name,a.last_name].filter(Boolean).join(' '),email:a.email||'',detail:`Ticket · ${a.ticket_code}`,code:a.ticket_code,in:!!a.checked_in_at}))];const q=search.value.toLowerCase(),rows=all.filter(x=>!q||(x.name+' '+x.email+' '+x.detail+' '+x.code).toLowerCase().includes(q));const total=all.length,checked=all.filter(x=>x.in).length;stats.innerHTML=`<div class="card stat"><small>Total Expected</small><strong>${total}</strong></div><div class="card stat"><small>Checked In</small><strong>${checked}</strong></div><div class="card stat"><small>Remaining</small><strong>${Math.max(0,total-checked)}</strong></div><div class="card stat"><small>Ticket Holders</small><strong>${(ticketsData.attendees||[]).filter(a=>a.status==='active').length}</strong></div>`;list.innerHTML=rows.map(x=>`<div class="person ${x.in?'in':''}"><div><strong>${WLP.esc(x.name)}</strong><br><small>${WLP.esc(x.detail)}</small></div><button class="btn ${x.in?'primary':''}" onclick="manualToggle('${x.kind}','${x.id}',${x.in?'false':'true'})">${x.in?'Checked In':'Check In'}</button></div>`).join('')||'<div class="empty">No matching people.</div>'}async function submitCode(raw){if(busy||!raw)return;busy=true;try{const r=await WLP.api('qr-checkin',{method:'POST',body:JSON.stringify({event_id:eventId,code:raw})});result.textContent=`✓ ${r.person.full_name||[r.person.first_name,r.person.last_name].filter(Boolean).join(' ')} checked in`;code.value='';await load()}catch(e){result.textContent='⚠ '+e.message}finally{busy=false}}async function manualToggle(kind,id,on){if(kind==='guest')await WLP.api('guests?action=checkin',{method:'PATCH',body:JSON.stringify({id,checked_in:on})});else await WLP.api('ticketing?event_id='+eventId+'&action=checkin',{method:'PATCH',body:JSON.stringify({id,checked_in:on})});await load()}async function startScanner(){if(scanner)return;scanner=new Html5Qrcode('reader');const cams=await Html5Qrcode.getCameras();if(!cams.length)throw new Error('No camera found.');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},txt=>submitCode(txt));startBtn.hidden=true;stopBtn.hidden=false}async function stopScanner(){if(scanner){await scanner.stop().catch(()=>{});await scanner.clear().catch(()=>{});scanner=null}startBtn.hidden=false;stopBtn.hidden=true}search.oninput=render;code.addEventListener('keydown',e=>{if(e.key==='Enter')submitCode(code.value)});load().catch(e=>result.textContent=e.message);
</script><script src="/assets/ui-v019.js"></script></body></html>
