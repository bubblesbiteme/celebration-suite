<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guest Check-In</title><link rel="stylesheet" href="/assets/app.css"><style>main{max-width:900px;margin:auto}.check-card{padding:16px;border-bottom:1px solid var(--cs-line);display:flex;align-items:center;justify-content:space-between;gap:12px}.check-card.checked{background:#eef5e8}.big-search{font-size:18px;padding:16px!important}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Event-Day Guest Check-In</div></div><div class="top-actions"><a id="back" class="btn" href="/guests.html">← Guest Suite</a></div></header><main><div class="card"><input id="q" class="big-search" style="width:100%" placeholder="Search name, email, invitation code, or table" autofocus><div id="stats" class="kpi-row" style="margin-top:14px"></div></div><div id="list" class="card" style="margin-top:14px;padding:0;overflow:hidden"></div></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');let guests=[];back.href='/guests.html?event_id='+encodeURIComponent(eventId||'');async function load(){if(!eventId)throw new Error('Event required.');guests=(await WLP.api('guests?event_id='+encodeURIComponent(eventId))).guests||[];render()}function render(){const s=q.value.toLowerCase(),rows=guests.filter(g=>!s||(g.full_name+' '+(g.email||'')+' '+(g.invitation_code||'')+' '+(g.table_name||'')).toLowerCase().includes(s));stats.innerHTML=`<div class="card stat"><small>Expected</small><strong>${guests.filter(g=>g.rsvp_status==='attending').length}</strong></div><div class="card stat"><small>Checked In</small><strong>${guests.filter(g=>g.checked_in_at).length}</strong></div><div class="card stat"><small>Remaining</small><strong>${guests.filter(g=>g.rsvp_status==='attending'&&!g.checked_in_at).length}</strong></div>`;list.innerHTML=rows.map(g=>`<div class="check-card ${g.checked_in_at?'checked':''}"><div><strong style="font-size:18px">${WLP.esc(g.full_name)}</strong>${g.vip?' ★':''}<br><span class="muted">${g.party_size} guest${g.party_size==1?'':'s'} · ${WLP.esc(g.table_name||'No table')} · ${WLP.esc(g.rsvp_status)}</span></div><button class="btn ${g.checked_in_at?'':'primary'}" onclick="toggle('${g.id}',${g.checked_in_at?'false':'true'})">${g.checked_in_at?'Undo':'Check In'}</button></div>`).join('')||'<div class="empty">No matching guests.</div>'}async function toggle(id,checked){await WLP.api('guests?action=checkin',{method:'PATCH',body:JSON.stringify({id,checked_in:checked})});await load()}q.oninput=render;load().catch(e=>list.innerHTML='<div class="empty">'+WLP.esc(e.message)+'</div>');
</script></body></html>
