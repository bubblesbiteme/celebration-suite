<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Registration & Tickets</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">R</span></div><div><div id="biz" class="brand-title">Registration & Tickets</div><small>Free or paid event registration</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addType()">+ Ticket Type</button></div></header><main><div class="page-head"><div><h1>Registration & Tickets</h1><p class="muted">Create registration types and share public booking links.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"></select></div><div id="stats" class="kpi-row" style="margin:14px 0"></div><div id="types"></div><hr style="margin:24px 0"><h2>Registrations</h2><div id="regs" class="table-wrap"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],data={types:[],registrations:[]};function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Registration'}async function refresh(){if(!eventFilter.value){data={types:[],registrations:[]};render();return}data=await WLP.api('registrations?event_id='+encodeURIComponent(eventFilter.value));render()}function render(){const sold=(data.registrations||[]).reduce((s,r)=>s+Number(r.quantity||1),0),rev=(data.registrations||[]).filter(r=>r.payment_status==='paid').reduce((s,r)=>s+Number(r.amount||0),0),checked=(data.registrations||[]).filter(r=>r.checked_in_at).length;stats.innerHTML=`<div class="card stat"><small>Ticket Types</small><strong>${data.types.length}</strong></div><div class="card stat"><small>Registrations</small><strong>${sold}</strong></div><div class="card stat"><small>Paid Revenue</small><strong>$${rev.toFixed(2)}</strong></div><div class="card stat"><small>Checked In</small><strong>${checked}</strong></div><div class="card stat"><small>Pending Payment</small><strong>${data.registrations.filter(r=>r.payment_status==='pending').length}</strong></div>`;types.innerHTML=data.types.length?'<div class="grid cols-3">'+data.types.map(t=>`<div class="card"><h3>${WLP.esc(t.name)}</h3><p><strong>$${Number(t.price||0).toFixed(2)}</strong> ${t.capacity?`· Cap ${t.capacity}`:'· Unlimited capacity'}</p><button class="btn" onclick="copyLink('${t.public_token}')">Copy Registration Link</button></div>`).join('')+'</div>':'<div class="empty">No ticket or registration types yet.</div>';regs.innerHTML=data.registrations.length?`<table class="table"><thead><tr><th>Name</th><th>Qty</th><th>Amount</th><th>Payment</th><th>Check-in</th></tr></thead><tbody>${data.registrations.map(r=>`<tr><td>${WLP.esc(r.full_name)}<br><small>${WLP.esc(r.email||'')}</small></td><td>${r.quantity}</td><td>$${Number(r.amount||0).toFixed(2)}</td><td><span class="badge">${WLP.esc(r.payment_status)}</span></td><td><button class="btn ${r.checked_in_at?'primary':''}" onclick="checkin('${r.id}',${r.checked_in_at?'false':'true'})">${r.checked_in_at?'Checked In':'Check In'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No registrations yet.</div>'}async function addType(){if(!eventFilter.value)return alert('Choose an event first.');const name=prompt('Ticket / registration type name','General Admission');if(!name)return;const price=prompt('Price (0 for free)','0');const capacity=prompt('Capacity (blank for unlimited)','');await WLP.api('registrations?action=type',{method:'POST',body:JSON.stringify({event_id:eventFilter.value,name,price,capacity:capacity||null})});await refresh()}async function checkin(id,checked){await WLP.api('registrations?action=checkin',{method:'PATCH',body:JSON.stringify({id,checked_in:checked})});await refresh()}async function copyLink(token){await navigator.clipboard.writeText(location.origin+'/registration-public.html?token='+encodeURIComponent(token));alert('Registration link copied.')}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh()}eventFilter.onchange=refresh;load();
</script></body></html>
