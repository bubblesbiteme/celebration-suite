<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Setup</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt="Celebration Suite"></div><div><div class="brand-title">Celebration Suite</div><small>Setup Guide</small></div></div><div class="top-actions"><a class="btn" href="/app.html">Dashboard</a></div></header><main style="max-width:900px;margin:auto"><div class="page-head"><div><h1>Launch Your Workspace</h1><p class="muted">Complete these steps once, then your account is ready for real clients.</p></div></div><div class="card"><div id="progress" style="font-weight:950;font-size:22px;margin-bottom:14px">Checking setup…</div><div id="steps" class="grid"></div></div></main><script src="/assets/app.js"></script><script>
async function load(){try{const d=await WLP.api('onboarding'),o=d.onboarding;const rows=[['Business details','Add business name and reply-to email',o.business_complete,'/settings.html'],['Branding','Upload/logo-link and choose colors',o.brand_complete,'/settings.html'],['Email','Connect Resend or SMTP for client email',o.email_complete,'/settings.html#integrations'],['Payments','Optional: connect your Stripe account',o.payment_complete,'/settings.html'],['First event','Create your first event workspace',o.first_event_complete,'/app.html']];const done=rows.filter(x=>x[2]).length;progress.textContent=`${done} of ${rows.length} setup steps complete`;steps.innerHTML=rows.map(([t,desc,ok,url])=>`<div class="notice ${ok?'good':''}"><strong>${ok?'✓':'○'} ${WLP.esc(t)}</strong><div class="muted">${WLP.esc(desc)}</div><div style="margin-top:8px"><a class="btn ${ok?'':'primary'}" href="${url}">${ok?'Review':'Complete'}</a></div></div>`).join('')}catch(e){location='/login.html'}}load();
</script><script src="/assets/ui-v019.js"></script></body></html>
