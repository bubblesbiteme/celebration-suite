<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>API & Webhooks</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">API & Webhooks</div><small>Connect Celebration Suite to external systems</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main><div class="page-head"><div><h1>Integration Center</h1><p class="muted">Create tenant API credentials and outbound webhook endpoints. Secrets are shown only when created.</p></div></div><div class="grid cols-2"><div class="card"><h2>API Keys</h2><div class="toolbar"><input id="keyName" placeholder="Key name"><button class="btn primary" id="createKey">Create key</button></div><div id="keySecret" class="notice" hidden></div><div id="keys"></div></div><div class="card"><h2>Webhooks</h2><input id="hookName" placeholder="Webhook name"><input id="hookUrl" placeholder="https://example.com/webhook" style="margin-top:8px"><input id="hookEvents" value="event.updated,client.activity,invoice.paid" style="margin-top:8px"><button class="btn primary" id="createHook" style="margin-top:8px">Add webhook</button><div id="hookSecret" class="notice" hidden></div><div id="hooks"></div></div></div><div class="card" style="margin-top:16px"><h2>Recent deliveries</h2><div id="deliveries"></div></div></main><script src="/assets/app.js"></script><script>
const {api,esc}=WLP;async function load(){const d=await api('integration-center');keys.innerHTML=(d.api_keys||[]).map(k=>`<div class="card" style="margin:8px 0"><strong>${esc(k.name)}</strong><div class="muted">${esc(k.key_prefix)}… · ${k.active?'Active':'Disabled'}${k.last_used_at?' · last used '+new Date(k.last_used_at).toLocaleString():''}</div><button class="btn" onclick="toggle('key','${k.id}',${!k.active})">${k.active?'Disable':'Enable'}</button></div>`).join('')||'<div class="empty">No API keys.</div>';hooks.innerHTML=(d.webhooks||[]).map(h=>`<div class="card" style="margin:8px 0"><strong>${esc(h.name)}</strong><div class="muted">${esc(h.endpoint_url)}</div><div>${(h.event_types||[]).map(x=>`<span class="badge">${esc(x)}</span>`).join(' ')}</div><button class="btn" onclick="toggle('webhook','${h.id}',${!h.active})">${h.active?'Disable':'Enable'}</button></div>`).join('')||'<div class="empty">No webhooks.</div>';deliveries.innerHTML=(d.deliveries||[]).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><strong>${esc(x.event_type)}</strong> · ${x.success?'Delivered':'Failed'} · ${x.response_status||'—'} <span class="muted">${new Date(x.attempted_at).toLocaleString()}</span></div>`).join('')||'<div class="empty">No deliveries yet.</div>'}async function toggle(type,id,active){await api(`integration-center?type=${type}&id=${id}`,{method:'PATCH',body:JSON.stringify({active})});load()}createKey.onclick=async()=>{const d=await api('integration-center?type=key',{method:'POST',body:JSON.stringify({name:keyName.value})});keySecret.hidden=false;keySecret.textContent='Copy this key now: '+d.key;load()};createHook.onclick=async()=>{const d=await api('integration-center?type=webhook',{method:'POST',body:JSON.stringify({name:hookName.value,endpoint_url:hookUrl.value,event_types:hookEvents.value.split(',').map(x=>x.trim()).filter(Boolean)})});hookSecret.hidden=false;hookSecret.textContent='Signing secret (copy now): '+d.secret;load()};load().catch(e=>alert(e.message));</script><script src="/assets/ui-v019.js"></script></body></html>
