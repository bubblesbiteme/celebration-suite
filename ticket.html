<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Tickets</title><link rel="stylesheet" href="/assets/app.css"><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>.ticket{display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:center;border:2px solid var(--cs-line);border-radius:20px;padding:18px;margin:16px 0}.qr{width:220px;height:220px}@media(max-width:650px){.ticket{grid-template-columns:1fr}.qr{margin:auto}}</style></head><body><main class="public-shell"><section class="public-hero"><h1 id="event">Your Tickets</h1><p id="meta"></p></section><section class="card"><div id="status" class="muted">Loading tickets…</div><div id="tickets"></div><button class="btn" onclick="window.print()">Print Tickets</button></section></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token'),sessionId=new URLSearchParams(location.search).get('session_id');async function load(){try{const d=await WLP.api('ticket-public?token='+encodeURIComponent(token)+(sessionId?'&session_id='+encodeURIComponent(sessionId):''));event.textContent=d.event?.title||'Your Tickets';meta.textContent=[WLP.fmtDate(d.event?.event_date),d.event?.venue,d.tenant?.business_name].filter(Boolean).join(' · ');status.textContent=d.order.status==='pending'?'Payment is still processing.':'';tickets.innerHTML=d.attendees.map(a=>`<div class="ticket"><div><h2>${WLP.esc([a.first_name,a.last_name].filter(Boolean).join(' '))}</h2><p>${WLP.esc(a.ticket_type_name)}</p><p><code>${WLP.esc(a.ticket_code)}</code></p><p class="muted">${a.status==='active'?(a.checked_in_at?'Checked in':'Ready for check-in'):WLP.esc(a.status)}</p><button class="btn" data-save="${a.id}">Save QR</button></div><div class="qr" id="qr-${a.id}"></div></div>`).join('');for(const a of d.attendees){const host=document.getElementById('qr-'+a.id);new QRCode(host,{text:'CSTICKET:'+a.ticket_code,width:220,height:220});document.querySelector(`[data-save="${a.id}"]`).onclick=()=>{const c=host.querySelector('canvas'),i=host.querySelector('img'),src=c?c.toDataURL('image/png'):i?.src;if(!src)return;const x=document.createElement('a');x.href=src;x.download='ticket-'+a.ticket_code+'.png';x.click()}}}catch(e){status.textContent=e.message}}load();
</script></body></html>
