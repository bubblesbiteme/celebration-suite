<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Calendar & Availability</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg"></div><div><div class="brand-title">Celebration Suite</div><small>Calendar & Availability</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1180px;margin:auto"><div class="page-head"><div><h1>Calendar & Availability</h1><p class="muted">See booked events, block personal time and sync with Google Calendar.</p></div><div class="toolbar"><a id="connect" class="btn primary" href="/.netlify/functions/google-calendar-start">Connect Google Calendar</a><button id="sync" class="btn" hidden>Sync now</button></div></div><div id="notice"></div><div class="grid cols-3"><div class="card"><h2>Block time</h2><form id="blockForm" class="grid"><div class="field"><label>Title</label><input name="title" value="Unavailable"></div><div class="field"><label>Starts</label><input name="starts_at" type="datetime-local" required></div><div class="field"><label>Ends</label><input name="ends_at" type="datetime-local" required></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Add availability block</button><div id="msg"></div></form></div><div class="card" style="grid-column:span 2"><h2>Upcoming schedule</h2><div id="schedule" class="grid"></div></div></div></main><script src="/assets/app.js"></script><script>let data;const dt=v=>new Date(v).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});async function load(){try{data=await WLP.api('calendar');connect.hidden=data.google_connected;sync.hidden=!data.google_connected;const rows=[...(data.events||[]).filter(x=>x.event_date).map(x=>({kind:'event',when:x.event_date+'T12:00:00',title:x.title,sub:(x.venue||'')+' · Booked event'})),...(data.blocks||[]).map(x=>({kind:'block',when:x.starts_at,title:x.title,sub:`${dt(x.starts_at)} – ${dt(x.ends_at)} · ${x.source==='google'?'Google Calendar':'Blocked time'}`,id:x.id,source:x.source}))].sort((a,b)=>new Date(a.when)-new Date(b.when));schedule.innerHTML=rows.length?rows.map(r=>`<div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between;gap:10px"><div><strong>${WLP.esc(r.title)}</strong><div class="muted">${WLP.esc(r.sub)}</div></div>${r.kind==='block'&&r.source==='manual'?`<button class="btn" onclick="delBlock('${r.id}')">Remove</button>`:''}</div></div>`).join(''):'<p class="muted">No upcoming items.</p>'}catch(e){notice.textContent=e.message}}blockForm.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';const d=Object.fromEntries(new FormData(blockForm));try{await WLP.api('calendar?action=block',{method:'POST',body:JSON.stringify(d)});blockForm.reset();msg.textContent='Blocked.';load()}catch(e){msg.textContent=e.message}};async function delBlock(id){await WLP.api('calendar?action=block&id='+encodeURIComponent(id),{method:'DELETE'});load()}sync.onclick=async()=>{notice.textContent='Syncing Google Calendar…';try{const r=await WLP.api('calendar?action=sync',{method:'POST',body:'{}'});notice.textContent=`Sync complete. ${r.pushed||0} Celebration Suite events pushed.`;load()}catch(e){notice.textContent=e.message}};const qs=new URLSearchParams(location.search);if(qs.get('connected'))notice.textContent='Google Calendar connected.';if(qs.get('error'))notice.textContent=qs.get('error');load();</script><script src="/assets/ui-v019.js"></script></body></html>
