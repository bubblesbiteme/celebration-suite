<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Planner Sign In</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:520px;margin:70px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"><span>by Sage &amp; Celebration</span></div><div class="card"><h1>Planner Sign In</h1><p class="muted">Owners, admins, planners and team members can sign in below.</p><a class="btn" style="width:100%;justify-content:center;margin-bottom:16px" href="/.netlify/functions/google-auth-start?audience=tenant&return=%2Fapp.html">Continue with Google</a><div style="text-align:center" class="muted">or use email and password</div><form id="form" class="grid" style="margin-top:16px"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="field" id="otpWrap" hidden><label>Authenticator code</label><input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><button class="btn primary">Sign In</button><div id="msg"></div><div><a href="/forgot-password.html?type=tenant">Forgot password?</a></div></form><p>Need an account? <a href="/register.html">Create one</a></p><p class="muted" style="font-size:.9rem">Platform owner? <a href="/platform-login.html">Platform Admin Sign In</a></p></div></main><script src="/assets/app.js"></script><script>const err=new URLSearchParams(location.search).get('error');if(err)msg.textContent=err;form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';try{await WLP.api('auth-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/app.html'}catch(er){msg.textContent=er.message;if(/Authenticator code required/i.test(er.message)){otpWrap.hidden=false;form.elements.otp.required=true;form.elements.otp.focus()}}}</script></body></html>
