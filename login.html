<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Planner Sign In</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:520px;margin:70px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"><span>by Sage &amp; Celebration</span></div><div class="card"><h1>Planner Sign In</h1><form id="form" class="grid"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn primary">Sign In</button><div id="msg"></div></form><p>Need an account? <a href="/register.html">Create one</a></p></div></main><script src="/assets/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';try{await WLP.api('auth-login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location='/app.html'}catch(err){msg.textContent=err.message}}</script></body></html>
