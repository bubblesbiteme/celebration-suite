<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>RSVP</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><section id="hero" class="public-hero"><h1 id="title">RSVP</h1><p id="meta"></p></section><section class="card" style="margin-top:16px"><div class="grid cols-2"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Party size</label><input id="party" type="number" min="1" value="1"></div><div class="field"><label>Meal choice</label><input id="meal"></div></div><div class="field" style="margin-top:12px"><label>Dietary notes</label><textarea id="dietary"></textarea></div><div class="decision" style="margin-top:14px"><button class="btn primary" onclick="submitRsvp('attending')">Attending</button><button class="btn" onclick="submitRsvp('declined')">Unable to Attend</button></div><p id="msg" class="muted"></p></section></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let event;async function load(){const d=await WLP.api('rsvp-public?token='+encodeURIComponent(token));event=d.event;const b=event.tenants?.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);title.textContent=event.title;meta.textContent=`${WLP.fmtDate(event.event_date)} · ${event.venue||'Venue details to follow'} · Hosted by ${event.tenants?.business_name||''}`}async function submitRsvp(status){try{await WLP.api('rsvp-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({full_name:name.value,email:email.value,party_size:party.value,meal_choice:meal.value,dietary:dietary.value,rsvp_status:status})});msg.textContent=status==='attending'?'Your RSVP is confirmed.':'Your response has been recorded.'}catch(e){msg.textContent=e.message}}load();
</script></body></html>
