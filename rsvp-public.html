<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSVP</title><link rel="stylesheet" href="/assets/app.css"><style>body{min-height:100vh}.invite-shell{max-width:850px;margin:40px auto;padding:20px}.invite-card{text-align:center;padding:42px 28px;border:1px solid var(--cs-line);background:#fffdfc;box-shadow:0 18px 60px #37243f18}.invite-card.wedding h1{font-family:Georgia,serif;font-style:italic}.invite-card.birthday{background:linear-gradient(135deg,#fff8e6,#fff)}.invite-card.gala{background:linear-gradient(145deg,#fff,#f2edf5)}.invite-meta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0}.invite-meta span{padding:8px 12px;border-radius:999px;background:#f3efe7}.rsvp-form{text-align:left;max-width:620px;margin:26px auto 0}</style></head><body><main class="invite-shell"><div id="box" class="invite-card"><p>Loading invitation…</p></div></main><script src="/assets/app.js"></script><script>
const p=new URLSearchParams(location.search),event=p.get('event'),code=p.get('code'),token=p.get('token');let data;async function load(){const qs=event?'event='+encodeURIComponent(event)+(code?'&code='+encodeURIComponent(code):''):'token='+encodeURIComponent(token||'');data=await WLP.api('rsvp-public?'+qs);render()}function render(){const e=data.event,s=data.settings||{},g=data.guest,b=e.tenants?.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);const meals=s.meal_options||[];box.className='invite-card '+(s.style||'general');box.innerHTML=`<small>${WLP.esc(e.tenants?.business_name||'')}</small><h1>${WLP.esc(s.title||e.title)}</h1><p>${WLP.esc(s.welcome_message||'We would be delighted to celebrate with you.')}</p><div class="invite-meta"><span>${WLP.fmtDate(e.event_date)}${s.event_start_time?' · '+WLP.esc(s.event_start_time):''}</span><span>${WLP.esc(s.event_location||e.venue||'Location TBD')}</span>${s.rsvp_deadline?`<span>RSVP by ${WLP.fmtDate(s.rsvp_deadline)}</span>`:''}</div>${s.rsvp_open===false?'<div class="notice warn">RSVPs are currently closed. Please contact the host.</div>':`<form id="form" class="rsvp-form grid cols-2"><div class="field"><label>Name</label><input name="full_name" value="${WLP.esc(g?.full_name||'')}" ${g?'readonly':''} required></div><div class="field"><label>Email</label><input name="email" type="email" value="${WLP.esc(g?.email||'')}" ${g?'readonly':''} required></div><div class="field"><label>Will you attend?</label><select name="rsvp_status"><option value="attending">Joyfully accepts</option><option value="declined">Regretfully declines</option></select></div><div class="field"><label>Party size</label><input name="party_size" type="number" min="1" max="20" value="${g?.party_size||1}"></div>${s.allow_plus_one?'<div class="field"><label>Plus-one name</label><input name="plus_one_name" value="'+WLP.esc(g?.plus_one_name||'')+'"></div>':''}${meals.length?`<div class="field"><label>Meal selection(s)</label><input name="meal_choices" placeholder="${WLP.esc(meals.join(', '))}" value="${WLP.esc((g?.meal_choices||[]).join(', '))}"><small class="muted">Options: ${WLP.esc(meals.join(' · '))}</small></div>`:''}${s.ask_dietary!==false?'<div class="field"><label>Dietary notes</label><input name="dietary" value="'+WLP.esc(g?.dietary||'')+'"></div>':''}${s.ask_song?'<div class="field"><label>Song request</label><input name="song_request" value="'+WLP.esc(g?.song_request||'')+'"></div>':''}<div style="grid-column:1/-1"><button class="btn primary" style="width:100%">Submit RSVP</button><p id="msg" class="muted"></p></div></form>`}`;if(window.form)form.onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(form));d.meal_choices=(d.meal_choices||'').split(',').map(x=>x.trim()).filter(Boolean);const qs=event?'event='+encodeURIComponent(event)+(code?'&code='+encodeURIComponent(code):''):'token='+encodeURIComponent(token||'');try{await WLP.api('rsvp-public?'+qs,{method:'POST',body:JSON.stringify(d)});form.innerHTML='<div class="notice good"><h2>Thank you!</h2><p>Your RSVP has been recorded.</p></div>'}catch(e){msg.textContent=e.message}}}load().catch(e=>box.innerHTML='<h1>Invitation unavailable</h1><p>'+WLP.esc(e.message)+'</p>');
</script></body></html>
