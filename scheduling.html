<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Scheduling Settings</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">S</span></div><div><div class="brand-title">Scheduling</div><small>Client-bookable appointments and availability</small></div></div><div class="top-actions"><a class="btn" href="/appointments.html">Appointments</a><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1280px;margin:auto"><div class="page-head"><div><h1>Scheduling Settings</h1><p class="muted">Control what clients can book, when they can book it, and when you are unavailable.</p></div></div><div class="grid cols-3"><section class="card"><div class="page-head"><h2>Appointment Types</h2><button class="btn primary" onclick="newType()">+ Type</button></div><div id="types"></div></section><section class="card"><div class="page-head"><h2>Weekly Availability</h2><button class="btn primary" onclick="newAvailability()">+ Window</button></div><div id="availability"></div></section><section class="card"><div class="page-head"><h2>Blackout Periods</h2><button class="btn primary" onclick="newBlock()">+ Block</button></div><div id="blocks"></div></section></div></main><script src="/assets/app.js"></script><script>
let data={types:[],availability:[],blocks:[]};const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function draw(){types.innerHTML=data.types.map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${WLP.esc(x.name)}</strong> <span class="badge">${x.duration_minutes} min</span><br><small>${WLP.esc(x.meeting_mode)}${x.location?' · '+WLP.esc(x.location):''}</small><br><small>${x.client_bookable?'Client bookable':'Internal only'} · ${x.active?'Active':'Inactive'} · buffers ${x.buffer_before_minutes||0}/${x.buffer_after_minutes||0} min</small><div class="toolbar"><button class="btn" onclick="editType('${x.id}')">Edit</button><button class="btn" onclick="del('type','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No appointment types.</div>';availability.innerHTML=data.availability.map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${days[x.weekday]}</strong><br>${x.start_time?.slice(0,5)}–${x.end_time?.slice(0,5)} · ${x.active?'Active':'Off'}<div><button class="btn" onclick="del('availability','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No availability configured.</div>';blocks.innerHTML=data.blocks.map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${WLP.esc(x.title)}</strong><br><small>${new Date(x.starts_at).toLocaleString()} → ${new Date(x.ends_at).toLocaleString()}</small><div><button class="btn" onclick="del('block','${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No blackout periods.</div>'}
async function load(){data=await WLP.api('scheduling');draw()}
async function newType(){const name=prompt('Appointment type name','Consultation');if(!name)return;const duration_minutes=prompt('Duration in minutes','30');const meeting_mode=prompt('Meeting mode: video, phone, in_person, custom','video');const location=prompt('Default meeting link/location','');const buffer_before_minutes=prompt('Buffer before (minutes)','0');const buffer_after_minutes=prompt('Buffer after (minutes)','0');await WLP.api('scheduling?kind=type',{method:'POST',body:JSON.stringify({name,duration_minutes,meeting_mode,location,buffer_before_minutes,buffer_after_minutes,client_bookable:true})});load()}
async function editType(id){const x=data.types.find(v=>v.id===id);const name=prompt('Name',x.name);if(!name)return;const duration_minutes=prompt('Duration',x.duration_minutes);const location=prompt('Location/link',x.location||'');const client_bookable=confirm('Should clients be able to book this appointment type?');await WLP.api('scheduling?kind=type',{method:'PATCH',body:JSON.stringify({id,name,duration_minutes,location,client_bookable})});load()}
async function newAvailability(){const weekday=Number(prompt('Weekday number: Sunday=0, Monday=1 ... Saturday=6','1'));const start_time=prompt('Start time (HH:MM)','09:00');const end_time=prompt('End time (HH:MM)','17:00');await WLP.api('scheduling?kind=availability',{method:'POST',body:JSON.stringify({weekday,start_time,end_time})});load()}
async function newBlock(){const title=prompt('Reason/title','Unavailable');const starts_at=prompt('Start ISO/date-time','');if(!starts_at)return;const ends_at=prompt('End ISO/date-time','');if(!ends_at)return;await WLP.api('scheduling?kind=block',{method:'POST',body:JSON.stringify({title,starts_at,ends_at})});load()}
async function del(kind,id){if(!confirm('Delete this record?'))return;await WLP.api(`scheduling?kind=${kind}&id=${encodeURIComponent(id)}`,{method:'DELETE'});load()}load();
</script></body></html>
