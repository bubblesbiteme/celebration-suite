<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Approval</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><section id="hero" class="public-hero"><h1 id="title">Approval</h1><p id="biz"></p></section><section class="card" style="margin-top:16px"><p id="desc"></p><div class="field"><label>Optional note</label><textarea id="note"></textarea></div><div class="decision" style="margin-top:14px"><button class="btn primary" onclick="decide('approved')">Approve</button><button class="btn" onclick="decide('changes_requested')">Request Changes</button><button class="btn" onclick="decide('rejected')">Reject</button></div><p id="msg" class="muted"></p></section></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let approval;async function load(){const d=await WLP.api('approval-public?token='+encodeURIComponent(token));approval=d.approval;const t=approval.tenants||{},b=t.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);title.textContent=approval.title;biz.textContent=t.business_name||'';desc.textContent=approval.description||'Please review and choose a decision.';if(approval.status!=='pending')msg.textContent='Current decision: '+approval.status}async function decide(status){try{await WLP.api('approval-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({status,client_note:note.value})});msg.textContent='Your decision has been recorded: '+status.replace('_',' ')}catch(e){msg.textContent=e.message}}load();
</script></body></html>
