<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Vendor Reviews</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">★</span></div><div><div id="biz" class="brand-title">Vendor Reviews</div><small>Internal post-event quality history</small></div></div><div class="top-actions"><a class="btn" href="/vendors.html">← Vendors</a><button class="btn primary" onclick="addReview()">+ Review</button></div></header><main><div class="page-head"><div><h1>Vendor Performance</h1><p class="muted">Keep ratings private to your planning company and use them when choosing preferred vendors.</p></div></div><div class="card"><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
let tenant,vendors=[],events=[],reviews=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Vendor Reviews'}function stars(n){return '★'.repeat(Number(n||0))+'☆'.repeat(Math.max(0,5-Number(n||0)))}function render(){list.innerHTML=reviews.length?reviews.map(r=>`<div class="card" style="margin:10px 0"><div class="page-head"><div><h3>${WLP.esc(vendors.find(v=>v.id===r.vendor_id)?.business_name||'Vendor')}</h3><div style="font-size:20px">${stars(r.rating)}</div><small>${WLP.esc(events.find(e=>e.id===r.event_id)?.title||'General review')} · ${r.would_rehire?'Would rehire':'Would not rehire'}</small></div><button class="btn" onclick="removeReview('${r.id}')">Delete</button></div><p>${WLP.esc(r.notes||'No notes')}</p></div>`).join(''):'<div class="empty">No vendor reviews yet.</div>'}async function addReview(){if(!vendors.length)return alert('Add a vendor first.');const names=vendors.map((v,i)=>`${i+1}. ${v.business_name}`).join('\n'),idx=Number(prompt('Choose vendor number:\n'+names)||0)-1;if(idx<0||!vendors[idx])return;const rating=Number(prompt('Overall rating 1–5','5')||5),would_rehire=confirm('Would you hire this vendor again?'),notes=prompt('Private review notes','');let event_id=null;if(events.length){const ev=prompt('Optional event number:\n'+events.map((e,i)=>`${i+1}. ${e.title}`).join('\n'),'');if(ev)event_id=events[Number(ev)-1]?.id||null}await WLP.api('vendor-reviews',{method:'POST',body:JSON.stringify({vendor_id:vendors[idx].id,event_id,rating,would_rehire,notes})});await load()}async function removeReview(id){if(!confirm('Delete this review?'))return;await WLP.api('vendor-reviews',{method:'DELETE',body:JSON.stringify({id})});await load()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();[vendors,events,reviews]=await Promise.all([WLP.api('vendors').then(x=>x.vendors||[]),WLP.api('events').then(x=>x.events||[]),WLP.api('vendor-reviews').then(x=>x.reviews||[])]);render()}load();
</script></body></html>
