<body><header class="top"><div class="brand">SAGE & CELEBRATION · LIVE EVENT</div><div class="actions"><a id="backLink" class="btn small" href="/app.html">← Return to Workspace</a><button class="btn small" id="refresh">Refresh</button></div></header><main class="page"><section id="hero" class="hero"><div class="empty">Loading command center…</div></section><section id="content"></section></main>
<nav class="bottom-nav"><a href="#run">Run</a><a href="#arrivals">Arrivals</a><a href="#checklists">Lists</a><a href="#guests">Guests</a><a href="#inventory">Inventory</a><a href="#issues">Issues</a></nav><div id="toast" class="toast hidden"></div>
<script src="/assets/runtime-compat.js"></script><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const qs=new URLSearchParams(location.search);const id=qs.get('id')||qs.get('event_id')||qs.get('booking_id');let data=null;$('#backLink').href=`/event-workspace.html?id=${encodeURIComponent(id||'')}`;
function toast(m,bad=false){const t=$('#toast');t.textContent=m;t.style.background=bad?'#a33':'#171717';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
async function api(action='',body){const u='/.netlify/functions/event-workspace'+(action?'?action='+encodeURIComponent(action):'?booking_id='+encodeURIComponent(id));const r=await fetch(u,{method:body?'POST':'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify({...body,booking_id:id}):undefined,credentials:'include'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
const eventDate=b=>b.event_date||b.scheduled_date||b.preferred_date||'',fmtDate=v=>v?new Date(String(v).length===10?v+'T12:00:00':v).toLocaleString('en-US',String(v).length===10?{month:'short',day:'numeric',year:'numeric'}:{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Not set',time=v=>v?new Date(v).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'—';
function sameDay(v,d){if(!v||!d)return false;return String(v).slice(0,10)===String(d).slice(0,10)}
function taskList(rows,phase){return rows.filter(x=>x.event_day_phase===phase).map(x=>`<div class="item"><div class="item-row"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.assigned_to||'Unassigned')}${x.description?' · '+esc(x.description):''}</div></div><span class="pill ${esc(x.status)}">${x.status==='completed'?'Done':'Open'}</span></div>${x.status!=='completed'?`<div class="quick"><button class="btn primary small" data-complete-task="${x.id}">Complete</button></div>`:''}</div>`).join('')||`<div class="empty">No ${phase} items yet.</div>`}
function inventoryName(x){return (data.inventoryItems||[]).find(i=>i.id===x.inventory_item_id)?.name||'Inventory item'}
function render(){const b=data.booking||{},date=eventDate(b),tasks=data.tasks||[],timeline=(data.timelineItems||[]).filter(x=>x.category==='event_day'||sameDay(x.milestone_date,date)),ops=data.vendorOperations||[],inc=data.incidents||[],guests=(data.guests||[]).filter(g=>g.response!=='declined'),staff=data.eventDayStaff||[],inv=data.inventoryOperations||[],contacts=data.emergencyContacts||[];
const openTasks=tasks.filter(x=>x.status!=='completed'),onsite=ops.filter(x=>x.checked_in&&!x.checked_out),expected=guests.reduce((s,g)=>s+Number(g.response==='attending'?g.attending_count||0:0),0),arrived=guests.reduce((s,g)=>s+Number(g.checked_in_count||(g.checked_in?g.attending_count||1:0)),0),unresolved=inc.filter(x=>x.severity!=='resolved'),invOut=inv.reduce((s,x)=>s+Number(x.quantity_checked_out||0),0),invAccounted=inv.reduce((s,x)=>s+Number(x.quantity_checked_in||0)+Number(x.quantity_missing||0),0),loadoutDone=invOut>0&&invAccounted>=invOut;
$('#hero').innerHTML=`<div class="hero-row"><div><div class="eyebrow">Event-Day Command Center</div><h1>${esc(b.package_name||'Untitled Event')}</h1><div class="meta"><span>${esc(b.customer_name||'No client')}</span><span>${fmtDate(date)}</span><span>${esc(b.venue||b.address||'Venue not set')}</span></div></div><div class="actions"><a class="btn" href="tel:${esc(b.customer_phone||'')}">Call client</a><a class="btn" href="/guest-checkin.html?event_id=${encodeURIComponent(id||'')}">Guest check-in</a></div></div><div class="stats"><div class="stat"><b>${timeline.filter(x=>x.status!=='completed'&&x.status!=='cancelled').length}</b><small>Run items left</small></div><div class="stat"><b>${onsite.length}/${ops.length}</b><small>Vendors onsite</small></div><div class="stat"><b>${staff.filter(x=>x.actual_start&&!x.actual_end).length}/${staff.length}</b><small>Staff onsite</small></div><div class="stat"><b>${arrived}/${expected}</b><small>Guests arrived</small></div><div class="stat"><b>${unresolved.length}</b><small>Open issues</small></div><div class="stat"><b>${loadoutDone?'✓':invOut?`${invAccounted}/${invOut}`:'—'}</b><small>Inventory returned</small></div></div>`;
const vendorEmergency=ops.filter(v=>v.emergency_contact_name||v.emergency_contact_phone);
$('#content').innerHTML=`<div class="grid"><div>
<section class="card" id="run"><div class="card-head"><h2>Live run-of-show</h2><span class="pill in_progress">LIVE</span></div><div class="list">${timeline.map((x,i)=>`<div class="item ${x.status==='in_progress'?'current':''}"><div class="item-row"><div><div class="time">${esc(x.start_time||'Time TBD')} · ${esc(x.title)}</div><div class="muted">${esc(x.notes||'')}</div></div><span class="pill ${esc(x.status)}">${esc(String(x.status||'upcoming').replace('_',' '))}</span></div>${x.status!=='completed'?`<div class="quick"><button class="btn small" data-timeline-status="in_progress" data-id="${x.id}">Start</button><button class="btn primary small" data-timeline-status="completed" data-id="${x.id}">Complete</button></div>`:''}</div>`).join('')||'<div class="empty">No event-day timeline items. Add them in Timeline.</div>'}</div></section>
<section class="card" id="arrivals"><div class="card-head"><h2>Arrivals</h2></div><h3>Vendors</h3><div class="list">${ops.map(v=>{const late=v.scheduled_arrival&&!v.checked_in&&new Date(v.scheduled_arrival)<new Date();return `<div class="item vendor ${v.checked_in&&!v.checked_out?'onsite':late?'late':''}"><div class="item-row"><div><b>${esc(v.vendor_name)}</b><div class="muted">${esc(v.role||'Vendor')} · ${time(v.scheduled_arrival)}</div>${v.assigned_area?`<div>${esc(v.assigned_area)}</div>`:''}</div><span class="pill ${v.checked_out?'resolved':v.checked_in?'confirmed':late?'urgent':''}">${v.checked_out?'Left':v.checked_in?'Onsite':late?'Late':'Expected'}</span></div><div class="quick">${!v.checked_in?`<button class="btn primary small" data-vendor-in="${v.id}">Check in</button>`:''}${v.checked_in&&!v.checked_out?`<button class="btn small" data-vendor-out="${v.id}">Check out</button>`:''}${v.contact_phone?`<a class="btn small" href="tel:${esc(v.contact_phone)}">Call</a>`:''}</div></div>`}).join('')||'<div class="empty">No vendor arrival records.</div>'}</div><h3>Staff</h3><div class="list">${staff.map(s=>`<div class="item"><div class="item-row"><div><b>${esc(s.full_name)}${s.is_lead?' · Lead':''}</b><div class="muted">${esc(s.role)} · Call ${time(s.shift_start)}${s.shift_end?'–'+time(s.shift_end):''}</div></div><span class="pill ${s.actual_end?'resolved':s.actual_start?'confirmed':''}">${s.actual_end?'Off duty':s.actual_start?'Onsite':'Expected'}</span></div><div class="quick">${!s.actual_start?`<button class="btn primary small" data-staff-in="${s.id}">Clock/Check in</button>`:''}${s.actual_start&&!s.actual_end?`<button class="btn small" data-staff-out="${s.id}">Clock/Check out</button>`:''}${s.phone?`<a class="btn small" href="tel:${esc(s.phone)}">Call</a>`:''}</div></div>`).join('')||'<div class="empty">No staff assigned.</div>'}</div></section>
<section class="card" id="checklists"><div class="card-head"><h2>Setup & teardown</h2></div><h3>Setup checklist</h3><div class="list">${taskList(tasks,'setup')}</div><form class="form-grid" data-add-task="setup" style="margin-top:8px"><input class="full" name="title" placeholder="Add setup item" required><button class="btn small primary full">Add setup item</button></form><h3>Teardown checklist</h3><div class="list">${taskList(tasks,'teardown')}</div><form class="form-grid" data-add-task="teardown" style="margin-top:8px"><input class="full" name="title" placeholder="Add teardown item" required><button class="btn small primary full">Add teardown item</button></form></section>
<section class="card" id="guests"><div class="card-head"><h2>Guest check-in</h2><a class="btn small" href="/guest-checkin.html?event_id=${encodeURIComponent(id||'')}">Open full check-in</a></div><div class="progress"><span style="width:${expected?Math.min(100,arrived/expected*100):0}%"></span></div><p><b>${arrived}</b> arrived · <b>${Math.max(0,expected-arrived)}</b> remaining · <b>${expected}</b> expected</p><div class="list">${guests.filter(g=>!g.checked_in&&g.response==='attending').slice(0,8).map(g=>`<div class="item"><div class="item-row"><div><b>${esc([g.first_name,g.last_name].filter(Boolean).join(' ')||'Guest')}</b><div class="muted">${Number(g.attending_count||1)} guest${Number(g.attending_count||1)===1?'':'s'}${g.table_name?' · Table '+esc(g.table_name):''}</div></div><button class="btn lime small" data-guest-in="${g.id}" data-count="${Number(g.attending_count||1)}">Check in</button></div></div>`).join('')||'<div class="empty">Everyone expected is checked in, or no guest list is loaded.</div>'}</div></section>
<section class="card" id="inventory"><div class="card-head"><h2>Inventory load-out</h2><a class="btn small" href="/inventory-event-sheet.html?booking_id=${encodeURIComponent(id)}&mode=loadout" target="_blank">Print load-out</a></div><div class="list">${inv.map(o=>{const out=Number(o.quantity_checked_out||0),good=Number(o.quantity_checked_in||0),missing=Number(o.quantity_missing||0),accounted=good+missing;return `<div class="item"><div class="item-row"><div><b>${esc(inventoryName(o))}</b><div class="muted">Out ${out} · Returned ${good} · Missing ${missing}${Number(o.quantity_damaged||0)?' · Damaged '+Number(o.quantity_damaged):''}${Number(o.quantity_repair||0)?' · Repair '+Number(o.quantity_repair):''}</div></div><span class="pill ${out&&accounted>=out?'returned':out?'checked_out':''}">${out&&accounted>=out?'Accounted for':out?'Outstanding':'Not checked out'}</span></div>${out>0&&accounted<out?`<div class="quick"><button class="btn primary small" data-inv-good="${o.inventory_item_id}" data-qty="${out}">Confirm all returned good</button></div>`:''}</div>`}).join('')||'<div class="empty">No event inventory operations yet. Build the packing list from the Event Workspace Inventory tab.</div>'}</div></section>
</div><aside>
<section class="card" id="contacts"><div class="card-head"><h2>Emergency contacts</h2></div>${b.customer_phone?`<div class="item"><b>${esc(b.customer_name||'Client')}</b><div class="muted">Client</div><div class="contact-actions"><a class="btn small" href="tel:${esc(b.customer_phone)}">Call</a></div></div>`:''}${vendorEmergency.map(v=>`<div class="item"><b>${esc(v.emergency_contact_name||v.vendor_name)}</b><div class="muted">${esc(v.vendor_name)} emergency contact</div>${v.emergency_contact_phone?`<div class="contact-actions"><a class="btn small" href="tel:${esc(v.emergency_contact_phone)}">Call</a></div>`:''}</div>`).join('')}${contacts.map(c=>`<div class="item"><div class="item-row"><div><b>${esc(c.contact_name)}</b><div class="muted">${esc(c.role||'Emergency contact')}</div></div><button class="btn danger small" data-contact-delete="${c.id}">Delete</button></div><div class="contact-actions">${c.phone?`<a class="btn small" href="tel:${esc(c.phone)}">Call</a>`:''}${c.email?`<a class="btn small" href="mailto:${esc(c.email)}">Email</a>`:''}</div>${c.notes?`<div class="muted" style="margin-top:6px">${esc(c.notes)}</div>`:''}</div>`).join('')}<form id="contactForm" class="form-grid" style="margin-top:8px"><input name="contact_name" placeholder="Contact name" required><input name="role" placeholder="Role / relationship"><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><textarea class="full" name="notes" placeholder="Emergency notes"></textarea><button class="btn primary full">Add contact</button></form></section>

<section class="card"><h2>Critical documents</h2>${(data.documents||[]).filter(x=>/floor|layout|permit|contract|insurance|menu|timeline|run/i.test(`${x.title||''} ${x.category||''}`)).slice(0,10).map(x=>`<a class="doc-link" target="_blank" href="${esc(x.file_url||x.document_url||'#')}">${esc(x.title||x.file_name||'Document')}</a>`).join('')||'<div class="empty">No critical documents tagged yet.</div>'}</section>
</aside></div>`;bind()}
function bind(){
$$('[data-timeline-status]').forEach(x=>x.onclick=()=>mutate('timeline-update',{id:x.dataset.id,status:x.dataset.timelineStatus},'Run-of-show updated.'));
$$('[data-complete-task]').forEach(x=>x.onclick=()=>mutate('task-update',{id:x.dataset.completeTask,status:'completed'},'Checklist item completed.'));
$$('[data-vendor-in]').forEach(x=>x.onclick=()=>mutate('vendor-operation-checkin',{id:x.dataset.vendorIn},'Vendor checked in.'));
$$('[data-vendor-out]').forEach(x=>x.onclick=()=>mutate('vendor-operation-checkout',{id:x.dataset.vendorOut},'Vendor checked out.'));
$$('[data-staff-in]').forEach(x=>x.onclick=()=>mutate('staff-update',{id:x.dataset.staffIn,actual_start:new Date().toISOString()},'Staff checked in.'));
$$('[data-staff-out]').forEach(x=>x.onclick=()=>mutate('staff-update',{id:x.dataset.staffOut,actual_end:new Date().toISOString()},'Staff checked out.'));
$$('[data-guest-in]').forEach(x=>x.onclick=()=>mutate('guest-checkin',{id:x.dataset.guestIn,checked_in:true,checked_in_count:Number(x.dataset.count||1)},'Guest checked in.'));
$$('[data-inv-good]').forEach(x=>x.onclick=()=>mutate('inventory-operation-update',{inventory_item_id:x.dataset.invGood,operation:'checkin',good:Number(x.dataset.qty||0),damaged:0,missing:0,repair:0},'Inventory return confirmed.'));
$$('[data-contact-delete]').forEach(x=>x.onclick=async()=>{if(confirm('Delete this emergency contact?'))await mutate('emergency-delete',{id:x.dataset.contactDelete},'Contact deleted.')} );
$$('[data-add-task]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);await mutate('task-create',{title:fd.get('title'),status:'scheduled',priority:'high',client_visible:false,event_day_phase:f.dataset.addTask},`${f.dataset.addTask==='setup'?'Setup':'Teardown'} item added.`)});
$('#contactForm')?.addEventListener('submit',async e=>{e.preventDefault();await mutate('emergency-create',Object.fromEntries(new FormData(e.target)),'Emergency contact added.')});
$('#incidentForm')?.addEventListener('submit',async e=>{e.preventDefault();await mutate('incident-create',Object.fromEntries(new FormData(e.target)),'Issue logged.')});
$$('[data-resolve]').forEach(x=>x.onclick=async()=>{const resolution=prompt('Resolution notes (optional):')||'';await mutate('incident-update',{id:x.dataset.resolve,severity:'resolved',resolution},'Issue resolved.')});
}
async function mutate(action,body,msg){try{await api(action,body);toast(msg);await load()}catch(e){toast(e.message,true)}}
async function load(){if(!id){$('#hero').innerHTML='<div class="empty">Missing event ID.</div>';return}const cacheKey=`sc_event_day_${id}`;try{data=await api();localStorage.setItem(cacheKey,JSON.stringify({saved_at:new Date().toISOString(),data}));render()}catch(e){const cached=localStorage.getItem(cacheKey);if(cached){try{data=JSON.parse(cached).data;render();toast('Offline snapshot shown. Reconnect before making changes.',true);return}catch{}}$('#hero').innerHTML=`<div class="empty"><b>Could not load event.</b><br>${esc(e.message)}</div>`}}
$('#refresh').onclick=load;load();setInterval(()=>{if(!document.hidden)load()},45000);
</script><script src="/pwa.js" defer></script><script src="/admin-google-ui.js"></script></body></html>
