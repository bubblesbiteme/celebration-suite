<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referrals & Commissions</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Celebration Suite</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Referrals & Commissions</h1><p class="muted">Track referral partners, earned commissions and payouts privately.</p></div></div><div class="grid cols-3"><form id="form" class="card grid"><h2>Add Referral</h2><div class="field"><label>Partner</label><input name="partner_name" required></div><div class="field"><label>Email</label><input name="partner_email" type="email"></div><div class="field"><label>Event</label><select name="event_id" id="eventSel"><option value="">No event</option></select></div><div class="grid cols-2"><div class="field"><label>Commission</label><select name="commission_type"><option value="percent">Percent</option><option value="flat">Flat</option></select></div><div class="field"><label>Rate / amount</label><input name="commission_rate" type="number" step=".01"></div></div><div class="field"><label>Eligible revenue</label><input name="eligible_revenue" type="number" step=".01"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Add</button><span id="msg"></span></form><div class="card" style="grid-column:span 2"><div id="summary" class="grid cols-3"></div><div class="table-wrap"><table class="table"><thead><tr><th>Partner</th><th>Event</th><th>Revenue</th><th>Commission</th><th>Status</th><th></th></tr></thead><tbody id="body"></tbody></table></div></div></div></main><script src="/assets/app.js"></script><script>let data={referrals:[],events:[]};const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});function render(){eventSel.innerHTML='<option value="">No event</option>'+data.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');const em=Object.fromEntries(data.events.map(e=>[e.id,e.title]));const total=data.referrals.filter(x=>x.status!=='void').reduce((s,x)=>s+Number(x.commission_amount||0),0),paid=data.referrals.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.commission_amount||0),0);summary.innerHTML=`<div class="card stat"><span class="muted">Committed</span><strong>${money(total)}</strong></div><div class="card stat"><span class="muted">Paid</span><strong>${money(paid)}</strong></div><div class="card stat"><span class="muted">Outstanding</span><strong>${money(total-paid)}</strong></div>`;body.innerHTML=data.referrals.map(r=>`<tr><td>${WLP.esc(r.partner_name)}</td><td>${WLP.esc(em[r.event_id]||'—')}</td><td>${money(r.eligible_revenue)}</td><td>${money(r.commission_amount)}</td><td><span class="badge">${WLP.esc(r.status)}</span></td><td>${r.status!=='paid'?`<button class="btn" onclick="markPaid('${r.id}')">Mark paid</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">No referrals yet.</td></tr>'}async function load(){data=await WLP.api('referrals');render()}async function markPaid(id){await WLP.api('referrals',{method:'PATCH',body:JSON.stringify({id,status:'paid'})});load()}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{await WLP.api('referrals',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();msg.textContent='Saved.';load()}catch(err){msg.textContent=err.message}};load().catch(()=>location='/login.html');</script></body></html>
