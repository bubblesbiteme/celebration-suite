<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Inventory</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">I</span></div><div><div id="biz" class="brand-title">Inventory</div><small>Reusable event assets</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addItem()">+ Inventory Item</button></div></header><main><div class="page-head"><div><h1>Inventory</h1><p class="muted">Track quantities and reserve inventory against event dates.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"><option value="">Master inventory</option></select><input id="search" placeholder="Search inventory"></div><div id="notice"></div><div id="list" class="table-wrap"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],data={items:[],reservations:[],conflicts:[]};function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Inventory'}async function refresh(){data=await WLP.api('inventory'+(eventFilter.value?'?event_id='+encodeURIComponent(eventFilter.value):''));render()}function render(){const q=search.value.toLowerCase(),reserved=Object.fromEntries((data.reservations||[]).map(r=>[r.inventory_item_id,r])),conf=Object.fromEntries((data.conflicts||[]).map(r=>[r.inventory_item_id,r.other_reserved]));if(eventFilter.value){const n=(data.conflicts||[]).filter(c=>c.other_reserved>0).length;notice.innerHTML=n?`<div class="notice warn">${n} inventory item${n===1?'':'s'} already reserved by another event on this same date. Availability is enforced when you reserve.</div>`:''}else notice.innerHTML='';const rows=(data.items||[]).filter(i=>!q||(i.name+' '+(i.category||'')+' '+(i.sku||'')).toLowerCase().includes(q));list.innerHTML=rows.length?`<table class="table"><thead><tr><th>Item</th><th>Category</th><th>Owned</th>${eventFilter.value?'<th>Other same-date</th><th>This event</th>':''}<th>Value</th></tr></thead><tbody>${rows.map(i=>`<tr><td><strong>${WLP.esc(i.name)}</strong><br><small>${WLP.esc(i.sku||'')}</small></td><td>${WLP.esc(i.category||'')}</td><td>${i.quantity}</td>${eventFilter.value?`<td>${conf[i.id]||0}</td><td><input style="width:80px" type="number" min="0" value="${reserved[i.id]?.quantity||0}" onchange="reserve('${i.id}',this.value,'${reserved[i.id]?.id||''}')"></td>`:''}<td>$${Number(i.replacement_value||0).toFixed(2)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No inventory yet.</div>'}async function reserve(itemId,val,resId){const qty=Number(val)||0;try{if(qty<=0&&resId)await WLP.api('inventory?action=reserve&id='+encodeURIComponent(resId),{method:'DELETE'});else if(qty>0)await WLP.api('inventory?action=reserve',{method:'POST',body:JSON.stringify({event_id:eventFilter.value,inventory_item_id:itemId,quantity:qty})});await refresh()}catch(e){alert(e.message);await refresh()}}async function addItem(){const name=prompt('Inventory item name');if(!name)return;const category=prompt('Category','Decor');const sku=prompt('SKU / code','');const quantity=prompt('Quantity owned','1');const replacement_value=prompt('Replacement value per line item','0');await WLP.api('inventory',{method:'POST',body:JSON.stringify({name,category,sku,quantity,replacement_value})});await refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Master inventory</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)} · ${WLP.fmtDate(e.event_date)}</option>`).join('');await refresh()}eventFilter.onchange=refresh;search.oninput=render;load();
</script></body></html>
