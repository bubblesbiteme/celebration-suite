<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Events</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--cream:#fff9ef;--ink:#151515;--pink:#ff4fa3;--lime:#d8f36a;--blue:#3776ff;--sage:#9db9a6;--muted:#666}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:#fff;border-bottom:4px solid var(--ink)}.top img{width:145px}.top button,.top a{border:2px solid var(--ink);border-radius:999px;background:#fff;color:inherit;text-decoration:none;padding:9px 13px;font-weight:900;cursor:pointer}.shell{max-width:1200px;margin:auto;padding:34px 20px 70px}.hero{border:4px solid var(--ink);border-radius:28px;background:var(--sage);padding:30px;box-shadow:9px 9px 0 var(--blue)}h1,h2{font-family:"Archivo Black";text-transform:uppercase;line-height:.95}h1{font-size:clamp(2.8rem,8vw,6rem);margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:1.3px;font-weight:900;color:#d72b83}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 18px}.tabs button{border:3px solid var(--ink);border-radius:999px;padding:10px 16px;background:#fff;font-weight:900;cursor:pointer}.tabs button.active{background:var(--lime);box-shadow:4px 4px 0 var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.event{border:3px solid var(--ink);border-radius:22px;background:#fff;padding:22px;box-shadow:6px 6px 0 var(--ink)}.event.past{opacity:.78}.event h3{font-size:1.45rem;margin:7px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.meta div{background:var(--cream);border:2px solid var(--ink);border-radius:12px;padding:10px}.meta small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase}.btn{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:11px 17px;background:var(--pink);color:#fff;font-weight:900;text-decoration:none;box-shadow:4px 4px 0 var(--ink)}.empty,.loading{border:3px solid var(--ink);border-radius:18px;padding:20px;background:var(--lime);font-weight:800}.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:5px 9px;background:var(--lime);font-size:.8rem;font-weight:900;text-transform:uppercase}@media(max-width:720px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.top{padding:10px 12px}.top img{width:115px}.shell{padding-top:22px}}
</style><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#566c52"><link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"><link rel="stylesheet" href="/mobile-app.css"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="assets/mobile-hardening.css">
<link rel="stylesheet" href="assets/ux-polish.css">
<script src="/assets/runtime-compat.js"></script><script src="/assets/tenant-branding.js"></script></head><body><header class="top"><div style="display:flex;align-items:center;gap:12px"><div id="tenantMark" style="width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:var(--sage);font-weight:900">EP</div><img id="tenantLogo" hidden alt="Planner logo"><strong id="tenantName">Your planner</strong></div><div><a href="client-security.html">Account Security</a> <button id="logout">Sign out</button></div></header><main class="shell"><section class="hero"><div class="eyebrow">Client account</div><h1>My Events</h1><p>Every celebration booked with the same email address appears here. Open any event to view its private planning workspace.</p></section><div class="tabs"><button class="active" data-filter="upcoming">Upcoming</button><button data-filter="past">Past</button><button data-filter="archive">Archive</button><button data-filter="all">All Active</button></div><div id="loading" class="loading">Loading your events…</div><div id="events" class="grid" hidden></div></main><script>
const $=s=>document.querySelector(s), pretty=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'Date pending', money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100);let bookings=[],filter='upcoming';const archiveStatuses=['canceled','cancelled','expired','lost','abandoned'];
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function eventDate(b){return b.scheduled_date||b.event_date||b.preferred_date||''}function isPast(b){const d=eventDate(b);return d?new Date(d+'T23:59:59')<new Date():false}
function isArchived(b){return archiveStatuses.includes(String(b.status||'').toLowerCase())}function render(){const list=bookings.filter(b=>filter==='archive'?isArchived(b):filter==='all'?!isArchived(b):filter==='past'?!isArchived(b)&&isPast(b):!isArchived(b)&&!isPast(b));const box=$('#events');box.innerHTML=list.length?list.map(b=>`<article class="event ${isPast(b)?'past':''}"><span class="badge">${esc((b.status||'planning').replaceAll('_',' '))}</span><h3>${esc(b.package_name||b.holiday||'Celebration')}</h3><div class="meta"><div><small>Date</small><strong>${esc(pretty(eventDate(b)))}</strong></div><div><small>Reference</small><strong>${esc(b.reference)}</strong></div><div><small>Type</small><strong>${esc((b.booking_kind||'event').replaceAll('_',' '))}</strong></div><div><small>Paid</small><strong>${esc(money(b.amount_cents))}</strong></div></div><a class="btn" href="portal.html?booking=${encodeURIComponent(b.id)}">Open Planning Portal</a></article>`).join(''):`<div class="empty">No ${filter==='all'?'active':filter} events are connected to this email yet.</div>`}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
fetch('/.netlify/functions/client-data?view=list').then(async r=>{if(r.status===401){location.href='portal-login.html';return}const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load events');bookings=d.bookings||[];const t=d.tenant||{},brand=CSBrand.apply(t,{replaceShell:false}),name=brand.business_name||'Celebration Suite';$('#tenantName').textContent=name;const mark=$('#tenantMark'),img=$('#tenantLogo');img.src=brand.logo_url;img.hidden=false;mark.hidden=true;bookings=d.bookings||[];$('#loading').hidden=true;$('#events').hidden=false;render()}).catch(e=>{$('#loading').textContent=e.message});
$('#logout').onclick=async()=>{await fetch('/.netlify/functions/client-auth-logout',{method:'POST'});location.href='portal-login.html'};
</script><script src="/pwa.js" defer></script></body></html>
