<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Planning Portal</title><link rel="stylesheet" href="/assets/app.css"><style>
:root{--portal:#52644d}.shell{max-width:1450px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#fff,#f4f1ea);border:1px solid var(--border);border-radius:22px;padding:22px}.hero-row{display:flex;justify-content:space-between;gap:16px}.meta{display:flex;gap:8px;flex-wrap:wrap}.meta span{background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 9px}.portal{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px}.side{position:sticky;top:16px;align-self:start}.side button{width:100%;text-align:left;margin-bottom:6px}.side button.active{background:var(--brand-primary,#52644d);color:#fff}.next{border:2px solid var(--brand-primary,#52644d);background:#f4f8f1;border-radius:18px;padding:16px;margin-bottom:14px}.next h2{margin:0 0 6px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid var(--border);background:#fff;border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted)}.stat b{font-size:1.25rem}.task{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--border);padding:9px 0}.task input{width:auto;margin-top:3px}.notice-action{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--border);border-radius:13px;padding:12px;margin-bottom:8px}.floor-preview{position:relative;overflow:auto;border:1px solid var(--border);border-radius:14px;padding:10px;background:#eee}.floor-inner{position:relative;background:#fff;transform-origin:top left}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:100}.modal[hidden]{display:none}.modal-card{width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:.76rem;font-weight:800;margin-bottom:5px}@media(max-width:900px){.portal{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow:auto}.side button{width:auto;white-space:nowrap}.grid2,.stat-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.shell{padding:8px}.hero-row{display:block}.grid2,.stat-grid{grid-template-columns:1fr}.notice-action{display:block}.notice-action .btn{margin-top:8px}}
</style></head><body><header class="topbar"><div class="brand"><div class="brand-title" id="biz">Client Planning Portal</div><small id="eventName">Loading…</small></div><div class="top-actions"><a class="btn" href="/client-security.html">Security</a><a class="btn" href="/client-login.html">Sign out</a></div></header><main class="shell"><section class="hero"><div class="hero-row"><div><div class="eyebrow">YOUR EVENT</div><h1 id="title">Event</h1><div class="meta" id="meta"></div></div><div><span class="badge" id="statusBadge">Planning</span></div></div></section><div class="portal"><nav class="side card" id="nav"></nav><section><div id="nextAction"></div><div id="content"></div></section></div></main><div class="modal" id="modal" hidden><div class="modal-card"><div class="page-head"><h2 id="modalTitle"></h2><button class="btn" id="closeModal">Close</button></div><div id="modalBody"></div></div></div><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let D={},active='overview',lastRefresh=0,refreshPromise=null,messageDirty=false,draftTimer=null;const localDraftKey='cs:client-message:'+token;const $=WLP.$,esc=WLP.esc,money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});const defs=[['overview','Overview'],['planning','Planning'],['design','Design Board'],['guests','Invitations & Guests'],['floorplan','Floor Plan'],['appointments','Appointments'],['vendors','Vendor Options'],['questionnaires','Questionnaires'],['approvals','Approvals'],['financials','Financials'],['documents','Documents'],['messages','Messages']];
async function load(opts={}){if(!token)return location='/client-login.html';if(refreshPromise)return refreshPromise;if(messageDirty&&!opts.force){const bar=document.getElementById('draftState');if(bar)bar.textContent='Editing — refresh paused';return;}refreshPromise=(async()=>{try{const [portalData,draftData]=await Promise.all([WLP.api('client-portal?token='+encodeURIComponent(token)),WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message').catch(()=>({draft:null}))]);D=portalData;const localRaw=localStorage.getItem(localDraftKey);let localDraft=null;try{localDraft=localRaw?JSON.parse(localRaw):null}catch{localDraft=localRaw?{body:localRaw,updated_at:0}:null}const remoteDraft=draftData?.draft;const localTime=Date.parse(localDraft?.updated_at||0)||Number(localDraft?.updated_at||0)||0,remoteTime=Date.parse(remoteDraft?.updated_at||0)||0;D._messageDraft=localTime>=remoteTime?(localDraft?.body||''):(remoteDraft?.draft_data?.body||'');lastRefresh=Date.now();renderChrome();render()}catch(e){if(/sign-in|required|access/i.test(e.message))location='/client-login.html';else{document.body.innerHTML=`<main class="shell"><div class="card"><h1>Planning portal unavailable</h1><p>${esc(e.message)}</p></div></main>`}}finally{refreshPromise=null}})();return refreshPromise}
function perms(){return D.event?.workspace_data?.portal_permissions||{}}function allowed(k){const p=perms();if(k==='overview')return p.overview!==false;if(k==='planning')return p.planning!==false;if(k==='design')return p.design!==false;if(k==='guests')return p.guests!==false;if(k==='floorplan')return p.floorplan!==false;if(k==='questionnaires')return p.questionnaires!==false;if(k==='approvals')return p.approvals!==false;if(k==='financials')return p.financials!==false;if(k==='documents')return p.documents!==false;if(k==='messages')return p.messages!==false;return true}
function renderChrome(){const e=D.event,t=D.tenant||{};biz.textContent=(t.business_name||'Celebration Suite')+' · Client Portal';eventName.textContent=e.title;title.textContent=e.title;statusBadge.textContent=e.status||'Planning';meta.innerHTML=[e.event_date?WLP.fmtDate(e.event_date):'Date TBD',e.venue,e.event_type].filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join('');const allowedDefs=defs.filter(([k])=>allowed(k));if(!allowed(active))active='overview';nav.innerHTML=allowedDefs.map(([k,l])=>`<button class="btn ${active===k?'active':''}" onclick="active='${k}';render()">${l}${badgeFor(k)}</button>`).join('')}
function badgeFor(k){let n=0;if(k==='questionnaires')n=(D.questionnaires||[]).filter(x=>!['submitted','reviewed'].includes(x.status)).length;if(k==='approvals')n=(D.approvals||[]).filter(x=>x.status==='pending').length+(D.change_orders||[]).filter(x=>x.status==='sent').length;if(k==='financials')n=(D.invoices||[]).filter(x=>['sent','partial','overdue'].includes(x.status)).length;return n?` <span class="badge">${n}</span>`:''}
function tasks(){return D.event?.workspace_data?.checklist||[]}function next(){const q=(D.questionnaires||[]).find(x=>!['submitted','reviewed'].includes(x.status));if(q)return{title:'Complete your questionnaire',text:q.title,action:'questionnaires',button:'Open questionnaire'};const a=(D.approvals||[]).find(x=>x.status==='pending');if(a)return{title:'Review an approval',text:a.title,action:'approvals',button:'Review approvals'};const c=(D.change_orders||[]).find(x=>x.status==='sent');if(c)return{title:'Review a change order',text:c.title,action:'approvals',button:'Review change order'};const t=tasks().find(x=>!(x.done||['done','completed'].includes(x.status)));if(t)return{title:'Next planning task',text:t.title||t.text||'Planning task',action:'planning',button:'Open planning'};const i=(D.invoices||[]).find(x=>['sent','partial','overdue'].includes(x.status));if(i)return{title:'Payment due',text:`${i.invoice_number} · ${money(i.amount)}`,action:'financials',button:'View financials'};return{title:'You are caught up',text:'There is nothing waiting for you right now.',action:'overview',button:'View event overview'}}
function renderNext(){const x=next();nextAction.innerHTML=`<div class="next"><div class="eyebrow">DO THIS NEXT</div><h2>${esc(x.title)}</h2><p>${esc(x.text)}</p><button class="btn primary" onclick="active='${x.action}';render()">${esc(x.button)}</button></div>`}
function render(){renderChrome();renderNext();if(active==='overview')overview();if(active==='planning')planning();if(active==='design')design();if(active==='guests')guests();if(active==='floorplan')floorplan();if(active==='appointments')appointments();if(active==='vendors')vendors();if(active==='questionnaires')questionnaires();if(active==='approvals')approvals();if(active==='financials')financials();if(active==='documents')documents();if(active==='messages')messages()}
function overview(){const e=D.event,w=e.workspace_data||{},ts=tasks(),done=ts.filter(x=>x.done||['done','completed'].includes(x.status)).length,billed=(D.invoices||[]).reduce((s,x)=>s+Number(x.amount||0),0),paid=(D.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);content.innerHTML=`<div class="stat-grid"><div class="stat"><small>Planning complete</small><b>${ts.length?Math.round(done/ts.length*100):0}%</b></div><div class="stat"><small>Open tasks</small><b>${ts.length-done}</b></div><div class="stat"><small>Guest records</small><b>${(D.guests||[]).length}</b></div><div class="stat"><small>Balance</small><b>${money(Math.max(0,billed-paid))}</b></div></div><div class="grid2" style="margin-top:14px"><div class="card"><h2>Event Details</h2><p><b>${esc(e.title)}</b></p><p>${e.event_date?WLP.fmtDate(e.event_date):'Date TBD'}${e.venue?' · '+esc(e.venue):''}</p><p>${esc(e.event_type||'')}</p></div><div class="card"><h2>Recent Planning Activity</h2>${[...(w.messages||[])].slice(-4).reverse().map(m=>`<p><b>${m.sender==='client'?'You':'Planner'}:</b> ${esc(m.body||'')}</p>`).join('')||'<p class="muted">No recent messages.</p>'}</div></div>`}
function planning(){content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Planning Checklist</h2><p class="muted">Check off the items your planner has shared with you.</p></div></div>${tasks().length?tasks().map(t=>`<label class="task"><input type="checkbox" ${t.done||['done','completed'].includes(t.status)?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><span><b>${esc(t.title||t.text||'Task')}</b><br><small>${esc(t.description||'')}${t.due_date?' · Due '+WLP.fmtDate(t.due_date):''}</small></span></label>`).join(''):'<div class="empty">No shared planning tasks.</div>'}</div>`}
async function toggleTask(id,done){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'toggle-task',id,done})});await load()}
function design(){const items=D.inspiration||[];content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Design Board</h2><p class="muted">Review the ideas your planner has shared and leave feedback.</p></div></div>${items.length?`<div class="grid cols-3">${items.map(i=>`<div class="notice"><div style="aspect-ratio:4/3;background:#eee;border-radius:10px;overflow:hidden">${i.image_url?`<img src="${esc(i.image_url)}" style="width:100%;height:100%;object-fit:cover">`:''}</div><h3>${esc(i.title||'Design idea')}</h3><p>${esc(i.description||'')}</p><span class="badge">${esc(i.status||'idea')}</span><textarea data-design-note="${i.id}" placeholder="Feedback for your planner">${esc(i.client_note||'')}</textarea><div style="margin-top:8px"><button class="btn" onclick="saveDesignNote('${i.id}')">Save Note</button> ${['idea','shortlisted'].includes(i.status)?`<button class="btn primary" onclick="designDecision('${i.id}','approved')">Approve</button> <button class="btn" onclick="designDecision('${i.id}','rejected')">Pass</button>`:''}</div></div>`).join('')}</div>`:'<div class="empty">No design items shared yet.</div>'}</div>`}
async function designDecision(id,status){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'design-update',id,status})});load({force:true})}async function saveDesignNote(id){const note=document.querySelector(`[data-design-note="${id}"]`)?.value||'';await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'design-update',id,client_note:note})});load({force:true})}
function guests(){const gs=D.guests||[];content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Guest List</h2><p class="muted">Manage names and send individual RSVP invitations.</p></div><button class="btn primary" onclick="guestForm()">+ Guest</button></div>${gs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Guest</th><th>RSVP</th><th>Party</th><th>Table</th><th>Invitation</th><th></th></tr></thead><tbody>${gs.map(g=>`<tr><td><b>${esc(g.full_name)}</b><br><small>${esc(g.email||'')}</small></td><td>${esc(g.rsvp_status)}</td><td>${g.party_size}</td><td>${esc(g.table_name||'')}</td><td>${g.invitation_sent_at?'Sent':g.email?`<button class="btn" onclick="inviteGuest('${g.id}')">Send</button>`:'No email'}</td><td><button class="btn" onclick="guestForm('${g.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No guests yet.</div>'}</div>`}
function openM(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.hidden=false}closeModal.onclick=()=>modal.hidden=true;function guestForm(id=''){const g=(D.guests||[]).find(x=>x.id===id)||{};openM(id?'Edit Guest':'Add Guest',`<div class="form-grid"><div class="field full"><label>Name</label><input id="gName" value="${esc(g.full_name||'')}"></div><div class="field"><label>Email</label><input id="gEmail" value="${esc(g.email||'')}"></div><div class="field"><label>Phone</label><input id="gPhone" value="${esc(g.phone||'')}"></div><div class="field"><label>Household</label><input id="gHouse" value="${esc(g.household||'')}"></div><div class="field"><label>Party size</label><input id="gParty" type="number" min="1" value="${g.party_size||1}"></div><div class="field"><label>Table</label><input id="gTable" value="${esc(g.table_name||'')}"></div><div class="field full"><label>Notes</label><textarea id="gNotes">${esc(g.notes||'')}</textarea></div></div><button class="btn primary" id="saveG" style="margin-top:12px">Save Guest</button>${id?` <button class="btn danger" id="delG">Delete</button>`:''}`);saveG.onclick=async()=>{await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'guest-save',id:g.id,full_name:gName.value,email:gEmail.value,phone:gPhone.value,household:gHouse.value,party_size:gParty.value,table_name:gTable.value,notes:gNotes.value})});modal.hidden=true;load()};if(id)delG.onclick=async()=>{if(!confirm('Remove this guest?'))return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'guest-delete',id})});modal.hidden=true;load()}}
async function inviteGuest(id){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'guest-invite',id})});alert('Invitation sent.');load()}
function floorplan(){const plans=D.floorplans||[];content.innerHTML=plans.length?plans.map(p=>`<div class="card"><div class="page-head"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.layout_type||'Shared layout')} · version ${p.version_number||1}${p.shared_editable?' · Editable':' · View only'}</p></div></div><div class="floor-preview"><div class="floor-inner" style="width:${p.width}px;height:${p.height}px;transform:scale(.65);${p.background_url?`background-image:url('${esc(p.background_url)}');background-size:100% 100%;`:''}">${(p.objects||[]).map(o=>`<div style="position:absolute;left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;transform:rotate(${o.rotation||0}deg);border:2px solid #38223f;background:#fffdfc;display:flex;align-items:center;justify-content:center;font-size:11px">${esc(o.label||o.kind)}${o.seats?` · ${o.seats}`:''}</div>`).join('')}</div></div>${p.shared_editable?`<div class="card" style="margin-top:12px"><h3>Save layout changes</h3><p class="muted">Update shared labels, seat counts, assignments and setup notes.</p>${(p.objects||[]).filter(o=>o.kind!=='line').map(o=>`<div class="notice" style="margin-bottom:8px"><b>${esc(o.label||o.kind)}</b><div class="form-grid"><input data-fp-label="${o.id}" value="${esc(o.label||'')}" placeholder="Label"><input data-fp-seats="${o.id}" type="number" min="0" value="${Number(o.seats||0)}" placeholder="Seats"><input data-fp-assignment="${o.id}" value="${esc(o.assignment||'')}" placeholder="Assigned guest or vendor"><input data-fp-notes="${o.id}" value="${esc(o.setup_notes||'')}" placeholder="Setup notes"></div><button class="btn" onclick="saveFloorObject('${p.id}','${o.id}')">Save</button></div>`).join('')}</div>`:''}</div>`).join(''):'<div class="card"><div class="empty">Your planner has not shared a floor plan yet.</div></div>'}
async function saveFloorObject(planId,objId){const label=document.querySelector(`[data-fp-label="${objId}"]`)?.value||'',seats=document.querySelector(`[data-fp-seats="${objId}"]`)?.value||0,assignment=document.querySelector(`[data-fp-assignment="${objId}"]`)?.value||'',setup_notes=document.querySelector(`[data-fp-notes="${objId}"]`)?.value||'';await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'floorplan-object-update',floorplan_id:planId,object_id:objId,label,seats,assignment,setup_notes})});load({force:true})}
function appointments(){const appts=D.appointments||[],types=D.appointment_types||[];content.innerHTML=`<div class="grid2"><div class="card"><h2>Upcoming Appointments</h2>${appts.filter(a=>a.status!=='canceled'&&Date.parse(a.starts_at)>Date.now()).map(a=>`<div class="notice"><b>${esc(a.title)}</b><br>${new Date(a.starts_at).toLocaleString()}<br><span class="badge">${esc(a.status)}</span></div>`).join('')||'<p class="muted">No upcoming appointments.</p>'}</div><div class="card"><h2>Book a Meeting</h2>${types.length?'<p class="muted">Open the scheduling page to choose from current availability.</p><a class="btn primary" href="/scheduling.html">View available times</a>':'<p class="muted">Online scheduling is not enabled.</p>'}</div></div>`}
function vendors(){const qs=D.vendor_quotes||[],vs=D.vendors||[];content.innerHTML=`<div class="card"><h2>Vendor Options</h2>${qs.length?qs.map(q=>{const v=vs.find(x=>x.id===q.vendor_id);return`<div class="notice-action"><div><b>${esc(v?.business_name||q.label||'Vendor')}</b>${q.recommended?' <span class="badge">Recommended</span>':''}<br><small>${esc(q.category||'')} · ${money(Number(q.base_amount||0)+Number(q.tax_amount||0)+Number(q.service_fee||0)+Number(q.delivery_fee||0)+Number(q.other_fees||0))}</small></div></div>`}).join(''):'<div class="empty">No vendor options shared yet.</div>'}</div>`}
function questionnaires(){content.innerHTML=`<div class="card"><h2>Questionnaires</h2>${(D.questionnaires||[]).length?(D.questionnaires||[]).map(q=>`<div class="notice-action"><div><b>${esc(q.title)}</b><br><span class="badge">${esc(q.status)}</span></div>${!['submitted','reviewed'].includes(q.status)?`<a class="btn primary" target="_blank" href="/questionnaire-public.html?token=${encodeURIComponent(q.public_token)}">Complete</a>`:''}</div>`).join(''):'<div class="empty">No questionnaires currently assigned.</div>'}</div>`}
function approvals(){content.innerHTML=`<div class="grid2"><div class="card"><h2>Approvals</h2>${(D.approvals||[]).map(a=>`<div class="notice-action"><div><b>${esc(a.title)}</b><br><span class="badge">${esc(a.status)}</span><p>${esc(a.description||'')}</p></div>${a.status==='pending'?`<a class="btn primary" target="_blank" href="/approval-public.html?token=${encodeURIComponent(a.public_token)}">Review</a>`:''}</div>`).join('')||'<div class="empty">No approvals waiting.</div>'}</div><div class="card"><h2>Change Orders</h2>${(D.change_orders||[]).map(c=>`<div class="notice-action"><div><b>${esc(c.title)}</b><br>${money(c.amount_delta)} · <span class="badge">${esc(c.status)}</span></div>${c.status==='sent'?`<a class="btn primary" target="_blank" href="/change-order-public.html?token=${encodeURIComponent(c.public_token)}">Review</a>`:''}</div>`).join('')||'<div class="empty">No change orders.</div>'}</div></div>`}
function financials(){const billed=(D.invoices||[]).reduce((s,x)=>s+Number(x.amount||0),0),paid=(D.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);content.innerHTML=`<div class="stat-grid"><div class="stat"><small>Total billed</small><b>${money(billed)}</b></div><div class="stat"><small>Payments</small><b>${money(paid)}</b></div><div class="stat"><small>Balance</small><b>${money(Math.max(0,billed-paid))}</b></div><div class="stat"><small>Invoices</small><b>${(D.invoices||[]).length}</b></div></div><div class="card" style="margin-top:14px"><h2>Invoices</h2>${(D.invoices||[]).map(i=>`<div class="notice-action"><div><b>${esc(i.invoice_number)}</b><br>${money(i.amount)} · <span class="badge">${esc(i.status)}</span>${i.due_date?' · due '+i.due_date:''}</div>${i.stripe_payment_url?`<a class="btn primary" href="${esc(i.stripe_payment_url)}">Pay</a>`:''}</div>`).join('')||'<div class="empty">No invoices posted.</div>'}</div>`}
function documents(){content.innerHTML=`<div class="card"><h2>Shared Documents</h2>${(D.documents||[]).map(d=>`<p><a class="btn" target="_blank" href="${esc(d.file_url)}">${esc(d.title)}</a><br><small>${esc(d.category||'Document')}</small></p>`).join('')||'<div class="empty">No shared documents.</div>'}</div>`}
function messages(){const arr=D.event?.workspace_data?.messages||[],local=D._messageDraft||'';content.innerHTML=`<div class="card"><h2>Messages</h2>${arr.map(m=>`<p><b>${m.sender==='client'?'You':'Planner'}:</b> ${esc(m.body||'')}</p>`).join('')||'<p class="muted">No messages yet.</p>'}<textarea id="messageBody" placeholder="Send a message to your planner">${esc(local)}</textarea><small id="draftState" class="muted">Drafts autosave as you type.</small><br><button class="btn primary" style="margin-top:8px" onclick="sendMsg()">Send Message</button></div>`;messageBody.addEventListener('input',()=>{messageDirty=true;storeLocalDraft();clearTimeout(draftTimer);const run=()=>WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'PUT',body:JSON.stringify({draft_data:{body:messageBody.value}})}).then(()=>{draftState.textContent='Draft saved securely'}).catch(()=>{draftState.textContent='Local draft saved'});draftTimer=setTimeout(run,2500)})}
function storeLocalDraft(){localStorage.setItem(localDraftKey,JSON.stringify({body:messageBody?.value||'',updated_at:new Date().toISOString()}))}async function sendMsg(){if(!messageBody.value.trim())return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'message',body:messageBody.value.trim()})});localStorage.removeItem(localDraftKey);messageDirty=false;await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'DELETE'}).catch(()=>{});load({force:true})}window.toggleTask=toggleTask;window.designDecision=designDecision;window.saveDesignNote=saveDesignNote;window.guestForm=guestForm;window.inviteGuest=inviteGuest;window.saveFloorObject=saveFloorObject;window.sendMsg=sendMsg;window.addEventListener('focus',()=>load());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});setInterval(()=>{load()},45000);load();
</script></body></html>
