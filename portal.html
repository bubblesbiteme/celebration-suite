<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Portal</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><div id="biz" class="brand-title">Client Portal</div><small id="title">Loading…</small></div></div><div class="top-actions"><span id="syncStatus" class="muted" aria-live="polite">Connecting…</span><button class="btn" id="refreshPortal">Refresh</button><button class="btn" id="clientLogout">Sign Out</button></div></header><main style="max-width:1000px;margin:auto"><div class="page-head"><div><h1 id="h1">Your Event</h1><p id="meta" class="muted"></p></div></div><div class="grid cols-2"><div class="card"><h2>Checklist</h2><div id="tasks"></div></div><div class="card"><h2>Timeline</h2><div id="timeline"></div></div><div class="card"><h2>Messages</h2><div id="messages"></div><form id="msgForm" class="grid"><div class="field"><textarea id="messageBody" name="body" placeholder="Send a message to your planner"></textarea><small id="draftStatus" class="muted">Drafts autosave as you type.</small></div><button class="btn primary">Send Message</button></form></div><div class="card"><h2>Event Details</h2><div id="details"></div></div></div><div style="max-width:1100px;margin:12px auto 40px"><a class="btn" href="/client-security.html">Client Security & 2FA</a></div></main><script src="/assets/app.js"></script><script>const token=new URLSearchParams(location.search).get('token');let data,lastRefresh=0,refreshPromise=null,draftTimer=null,messageDirty=false;const localDraftKey='cs:client-message:'+token;function apply(t){const b=t.branding||{};for(const [k,v] of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=t.business_name;if(b.logo_url){logo.src=b.logo_url;logo.hidden=false;fallback.hidden=true}else{logo.hidden=true;fallback.hidden=false}}function render(){const e=data.event,w=e.workspace_data||{};title.textContent=e.title;h1.textContent=e.title;meta.textContent=`${e.event_type||'Event'} · ${WLP.fmtDate(e.event_date)}`;tasks.innerHTML=(w.checklist||[]).length?(w.checklist||[]).map(x=>`<label style="display:flex;gap:10px;padding:9px 0"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}',this.checked)"><span>${WLP.esc(x.title)}</span></label>`).join(''):'<p class="muted">No checklist items yet.</p>';timeline.innerHTML=(w.timeline||[]).length?(w.timeline||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong><br><span class="muted">${WLP.esc(x.detail||'')}</span></p>`).join(''):'<p class="muted">Timeline coming soon.</p>';messages.innerHTML=(w.messages||[]).map(x=>`<p><strong>${x.sender==='client'?'You':'Planner'}:</strong> ${WLP.esc(x.body||x.title||'')}</p>`).join('')||'<p class="muted">No messages yet.</p>';details.innerHTML=`<p><strong>Venue:</strong> ${WLP.esc(e.venue||'TBD')}</p><p><strong>Date:</strong> ${WLP.fmtDate(e.event_date)}</p>`}async function load({force=false,quiet=false}={}){if(!force&&Date.now()-lastRefresh<1500)return refreshPromise;if(refreshPromise)return refreshPromise;if(messageDirty&&document.activeElement===messageBody){syncStatus.textContent='Editing — refresh paused';return}if(!navigator.onLine){syncStatus.textContent='Offline';return}lastRefresh=Date.now();syncStatus.textContent='Syncing…';refreshPromise=(async()=>{try{data=await WLP.api('client-portal?token='+encodeURIComponent(token)+(force?'&fresh=1':''));apply(data.tenant);render();syncStatus.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(!quiet){};await restoreMessageDraft()}catch(e){if(/sign-in required|Unauthorized/i.test(e.message)){location='/client-login.html?token='+encodeURIComponent(token);return}document.body.innerHTML='<main><div class="card"><h1>Portal unavailable</h1><p>'+WLP.esc(e.message)+'</p></div><div style="max-width:1100px;margin:12px auto 40px"><a class="btn" href="/client-security.html">Client Security & 2FA</a></div></main>'}finally{refreshPromise=null}})();return refreshPromise}async function toggle(id,done){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'toggle-task',id,done})});load()}function storeLocalDraft(){try{localStorage.setItem(localDraftKey,JSON.stringify({body:messageBody.value,savedAt:Date.now()}))}catch{}}async function saveCloudDraft(immediate=false){clearTimeout(draftTimer);const run=async()=>{try{const out=await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'PUT',body:JSON.stringify({draft_data:{body:messageBody.value,savedAt:Date.now()}})});draftStatus.textContent='Draft saved securely '+new Date(out.updated_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch{draftStatus.textContent='Saved on this device — cloud draft unavailable'}};if(immediate)return run();draftTimer=setTimeout(run,2500)}async function restoreMessageDraft(){try{const local=JSON.parse(localStorage.getItem(localDraftKey)||'null');const remote=(await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message')).draft;const remoteTime=remote?.updated_at?Date.parse(remote.updated_at):0,localTime=Number(local?.savedAt||0);const chosen=localTime>=remoteTime?local:remote?.draft_data;if(chosen?.body&&!messageBody.value){messageBody.value=chosen.body;messageDirty=true;draftStatus.textContent=localTime>=remoteTime?'Recovered draft from this device':'Recovered secure cloud draft'}}catch{}}messageBody.addEventListener('input',()=>{messageDirty=true;storeLocalDraft();draftStatus.textContent='Saved on this device. Syncing shortly…';saveCloudDraft()});msgForm.onsubmit=async e=>{e.preventDefault();const body=new FormData(msgForm).get('body');if(!body)return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'message',body})});msgForm.reset();messageDirty=false;localStorage.removeItem(localDraftKey);await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'DELETE'}).catch(()=>{});draftStatus.textContent='Message sent. Draft cleared.';await load({force:true,quiet:true})};refreshPortal.onclick=()=>load({force:true});window.addEventListener('focus',()=>load({quiet:true}));window.addEventListener('online',()=>load({force:true,quiet:true}));window.addEventListener('offline',()=>syncStatus.textContent='Offline');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load({quiet:true});else if(messageDirty)saveCloudDraft(true)});setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)load({quiet:true})},45000);clientLogout.onclick=async()=>{if(messageDirty)await saveCloudDraft(true).catch(()=>{});await WLP.api('client-auth-logout',{method:'POST'}).catch(()=>{});location='/client-login.html?token='+encodeURIComponent(token)};load({force:true});</script></body></html>
