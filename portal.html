<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Portal</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><div id="biz" class="brand-title">Client Portal</div><small id="title">Loading…</small></div></div><div class="top-actions"><span id="syncStatus" class="muted" aria-live="polite">Connecting…</span><button class="btn" id="refreshPortal">Refresh</button><a class="btn" href="/client-security.html">Security</a><button class="btn" id="clientLogout">Sign Out</button></div></header><main style="max-width:1150px;margin:auto"><div class="page-head"><div><h1 id="h1">Your Event</h1><p id="meta" class="muted"></p></div></div><div class="tabs" id="tabs"></div><div id="content"></div></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let data,lastRefresh=0,refreshPromise=null,draftTimer=null,messageDirty=false,active='overview';const localDraftKey='cs:client-message:'+token;const defs=[['overview','Overview'],['planning','Planning'],['questionnaires','Questionnaires'],['approvals','Approvals'],['financials','Financials'],['documents','Documents'],['messages','Messages']];function apply(t){const b=t.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=t.business_name;if(b.logo_url){logo.src=b.logo_url;logo.hidden=false;fallback.hidden=true}else{logo.hidden=true;fallback.hidden=false}}const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});function card(title,body){return`<div class="card"><h2>${title}</h2>${body}</div>`}function render(){const e=data.event,w=e.workspace_data||{};title.textContent=e.title;h1.textContent=e.title;meta.textContent=`${e.event_type||'Event'} · ${WLP.fmtDate(e.event_date)} · ${WLP.esc(e.venue||'Venue TBD')}`;tabs.innerHTML=defs.map(([k,l])=>`<button class="btn ${active===k?'primary':''}" onclick="active='${k}';render()">${l}</button>`).join('');if(active==='overview'){const open=(w.checklist||[]).filter(x=>!x.done).length;content.innerHTML=`<div class="grid cols-3">${card('Next Actions',`<strong style="font-size:32px">${open}</strong><p class="muted">open planning task${open===1?'':'s'}</p>`)}${card('Questionnaires',`<strong style="font-size:32px">${(data.questionnaires||[]).filter(x=>!['submitted','reviewed'].includes(x.status)).length}</strong><p class="muted">awaiting your response</p>`)}${card('Approvals',`<strong style="font-size:32px">${(data.approvals||[]).filter(x=>x.status==='pending').length}</strong><p class="muted">pending decision${(data.approvals||[]).filter(x=>x.status==='pending').length===1?'':'s'}</p>`)}</div>`;return}if(active==='planning'){content.innerHTML=`<div class="grid cols-2">${card('Checklist',(w.checklist||[]).length?(w.checklist||[]).map(x=>`<label style="display:flex;gap:10px;padding:9px 0"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}',this.checked)"><span>${WLP.esc(x.title)}</span></label>`).join(''):'<p class="muted">No checklist items yet.</p>')}${card('Timeline',(w.timeline||[]).length?(w.timeline||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong><br><span class="muted">${WLP.esc(x.detail||'')}</span></p>`).join(''):'<p class="muted">Timeline coming soon.</p>')}</div>`;return}if(active==='questionnaires'){content.innerHTML=card('Questionnaires',(data.questionnaires||[]).length?(data.questionnaires||[]).map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${WLP.esc(x.title)}</strong> <span class="badge">${WLP.esc(x.status)}</span>${!['submitted','reviewed'].includes(x.status)?`<div><a class="btn primary" target="_blank" href="/questionnaire-public.html?token=${encodeURIComponent(x.public_token)}">Complete Questionnaire</a></div>`:''}</div>`).join(''):'<p class="muted">No questionnaires currently assigned.</p>');return}if(active==='approvals'){const a=(data.approvals||[]).map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${WLP.esc(x.title)}</strong> <span class="badge">${WLP.esc(x.status)}</span><p>${WLP.esc(x.description||'')}</p>${x.status==='pending'?`<a class="btn primary" target="_blank" href="/approval-public.html?token=${encodeURIComponent(x.public_token)}">Review</a>`:''}</div>`).join(''),c=(data.change_orders||[]).map(x=>`<div class="notice" style="margin-bottom:10px"><strong>${WLP.esc(x.title)}</strong> · ${money(x.amount_delta)} <span class="badge">${WLP.esc(x.status)}</span>${x.status==='sent'?`<div><a class="btn primary" target="_blank" href="/change-order-public.html?token=${encodeURIComponent(x.public_token)}">Review Change Order</a></div>`:''}</div>`).join('');content.innerHTML=`<div class="grid cols-2">${card('Approvals',a||'<p class="muted">No pending approvals.</p>')}${card('Change Orders',c||'<p class="muted">No change orders.</p>')}</div>`;return}if(active==='financials'){const billed=(data.invoices||[]).filter(x=>x.status!=='void').reduce((s,x)=>s+Number(x.amount||0),0),paid=(data.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0);content.innerHTML=`<div class="grid cols-3">${card('Total Billed',`<strong style="font-size:28px">${money(billed)}</strong>`)}${card('Payments',`<strong style="font-size:28px">${money(paid)}</strong>`)}${card('Balance',`<strong style="font-size:28px">${money(Math.max(0,billed-paid))}</strong>`)}</div>${card('Invoices',(data.invoices||[]).map(x=>`<p><strong>${WLP.esc(x.invoice_number)}</strong> · ${money(x.amount)} · <span class="badge">${WLP.esc(x.status)}</span>${x.due_date?` · due ${WLP.fmtDate(x.due_date)}`:''}</p>`).join('')||'<p class="muted">No invoices posted.</p>')}`;return}if(active==='documents'){content.innerHTML=card('Shared Documents',(data.documents||[]).length?(data.documents||[]).map(x=>`<p><a class="btn" target="_blank" rel="noopener" href="${WLP.esc(x.file_url)}">${WLP.esc(x.title)}</a><br><span class="muted">${WLP.esc(x.category||'Document')}</span></p>`).join(''):'<p class="muted">No shared documents yet.</p>');return}const arr=w.messages||[];content.innerHTML=card('Messages',`${arr.map(x=>`<p><strong>${x.sender==='client'?'You':'Planner'}:</strong> ${WLP.esc(x.body||x.title||'')}</p>`).join('')||'<p class="muted">No messages yet.</p>'}<form id="msgForm" class="grid"><div class="field"><textarea id="messageBody" name="body" placeholder="Send a message to your planner"></textarea><small id="draftStatus" class="muted">Drafts autosave as you type.</small></div><button class="btn primary">Send Message</button></form>`);bindMessage()}function bindMessage(){const messageBody=document.getElementById('messageBody'),form=document.getElementById('msgForm');if(!messageBody||!form)return;restoreMessageDraft();messageBody.addEventListener('input',()=>{messageDirty=true;storeLocalDraft();draftStatus.textContent='Saved on this device. Syncing shortly…';saveCloudDraft()});form.onsubmit=async e=>{e.preventDefault();const body=new FormData(form).get('body');if(!body)return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'message',body})});form.reset();messageDirty=false;localStorage.removeItem(localDraftKey);await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'DELETE'}).catch(()=>{});await load({force:true,quiet:true})}}async function load({force=false,quiet=false}={}){if(!force&&Date.now()-lastRefresh<1500)return refreshPromise;if(refreshPromise)return refreshPromise;if(messageDirty&&document.activeElement?.id==='messageBody'){syncStatus.textContent='Editing — refresh paused';return}lastRefresh=Date.now();syncStatus.textContent='Syncing…';refreshPromise=(async()=>{try{data=await WLP.api('client-portal?token='+encodeURIComponent(token)+(force?'&fresh=1':''));apply(data.tenant);render();syncStatus.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){if(/sign-in required|Unauthorized/i.test(e.message)){location='/client-login.html?token='+encodeURIComponent(token);return}content.innerHTML='<div class="card"><h1>Portal unavailable</h1><p>'+WLP.esc(e.message)+'</p></div>'}finally{refreshPromise=null}})();return refreshPromise}async function toggle(id,done){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'toggle-task',id,done})});load({force:true})}function storeLocalDraft(){const el=document.getElementById('messageBody');if(!el)return;try{localStorage.setItem(localDraftKey,JSON.stringify({body:el.value,savedAt:Date.now()}))}catch{}}async function saveCloudDraft(){clearTimeout(draftTimer);const run=async()=>{const el=document.getElementById('messageBody');if(!el)return;await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'PUT',body:JSON.stringify({draft_data:{body:el.value,savedAt:Date.now()}})}).catch(()=>{})};draftTimer=setTimeout(run,2500)}async function restoreMessageDraft(){const el=document.getElementById('messageBody');if(!el)return;try{const local=JSON.parse(localStorage.getItem(localDraftKey)||'null');const remote=(await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message')).draft;const remoteTime=remote?.updated_at?Date.parse(remote.updated_at):0,localTime=Number(local?.savedAt||0);const chosen=localTime>=remoteTime?local:remote?.draft_data;if(chosen?.body&&!el.value){el.value=chosen.body;messageDirty=true}}catch{}}refreshPortal.onclick=()=>load({force:true});clientLogout.onclick=async()=>{await WLP.api('client-auth-logout',{method:'POST'}).catch(()=>{});location='/client-login.html?token='+encodeURIComponent(token)};window.addEventListener('focus',()=>load({quiet:true}));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load({quiet:true})});window.addEventListener('online',()=>load({force:true,quiet:true}));setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)load({quiet:true})},45000);load({force:true});
</script></body></html>
