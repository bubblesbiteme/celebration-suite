function bindClientDesign(){let drag=null;const board=document.getElementById('clientMoodBoard'),canArrange=data.design_board?.client_can_arrange!==false;if(board&&canArrange){board.querySelectorAll('.client-pin').forEach(el=>{const item=(data.inspiration||[]).find(x=>x.id===el.dataset.id);if(item?.locked)return;el.onpointerdown=e=>{const r=board.getBoundingClientRect(),er=el.getBoundingClientRect();drag={el,id:el.dataset.id,r,dx:e.clientX-er.left,dy:e.clientY-er.top};el.setPointerCapture(e.pointerId)}});board.onpointermove=e=>{if(!drag)return;const left=Math.max(0,Math.min(94,(e.clientX-drag.r.left-drag.dx)/drag.r.width*100)),top=Math.max(0,Math.min(94,(e.clientY-drag.r.top-drag.dy)/drag.r.height*100));drag.el.style.left=left+'%';drag.el.style.top=top+'%'};board.onpointerup=async()=>{if(!drag)return;const left=parseFloat(drag.el.style.left),top=parseFloat(drag.el.style.top),id=drag.id;drag=null;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'design-update',id,x:left,y:top})});}}document.querySelectorAll('[data-save-design]').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.saveDesign,status=document.querySelector(`[data-design-status="${id}"]`).value,client_note=document.querySelector(`[data-design-note="${id}"]`).value;btn.disabled=true;try{await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'design-update',id,status,client_note})});await load({force:true,quiet:true})}catch(e){alert(e.message)}finally{btn.disabled=false}})}
function clientSlots(types,availability,blocks,appointments){const sel=document.getElementById('apptType')?.value||types[0]?.id,type=types.find(t=>t.id===sel)||types[0];if(!type)return[];const out=[],now=Date.now(),busy=(appointments||[]).filter(a=>a.status!=='canceled').map(a=>[Date.parse(a.starts_at)-(Number(type.buffer_before_minutes)||0)*60000,Date.parse(a.ends_at||a.starts_at)+(Number(type.buffer_after_minutes)||0)*60000]),bl=(blocks||[]).map(b=>[Date.parse(b.starts_at),Date.parse(b.ends_at)]);for(let d=1;d<=30;d++){const day=new Date(now+d*86400000);const wins=availability.filter(w=>Number(w.weekday)===day.getDay());for(const w of wins){const [sh,sm]=String(w.start_time).split(':').map(Number),[eh,em]=String(w.end_time).split(':').map(Number);let cur=new Date(day.getFullYear(),day.getMonth(),day.getDate(),sh,sm||0,0,0).getTime(),end=new Date(day.getFullYear(),day.getMonth(),day.getDate(),eh,em||0,0,0).getTime(),dur=(Number(type.duration_minutes)||30)*60000;while(cur+dur<=end){const a=cur-(Number(type.buffer_before_minutes)||0)*60000,b=cur+dur+(Number(type.buffer_after_minutes)||0)*60000;if(cur>now+3600000&&!busy.some(([x,y])=>a<y&&b>x)&&!bl.some(([x,y])=>a<y&&b>x))out.push({type_id:type.id,starts_at:new Date(cur).toISOString()});cur+=30*60000}}}return out}async function bookAppointment(type_id,starts_at){if(!confirm('Book this appointment time?'))return;try{await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'appointment-book',appointment_type_id:type_id,starts_at})});await load({force:true,quiet:true})}catch(e){alert(e.message)}}async function cancelAppointment(id){if(!confirm('Cancel this appointment?'))return;try{await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'appointment-cancel',id})});await load({force:true,quiet:true})}catch(e){alert(e.message)}}async function clientGuest(id){const g=(data.guests||[]).find(x=>x.id===id)||{},full_name=prompt('Guest name',g.full_name||'');if(!full_name)return;const email=prompt('Email',g.email||''),party_size=prompt('Party size',g.party_size||1),table_name=prompt('Table',g.table_name||'');await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'guest-save',id:g.id,full_name,email,party_size,table_name})});await load({force:true,quiet:true})}async function clientInvite(id){try{await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'guest-invite',id})});await load({force:true,quiet:true})}catch(e){alert(e.message)}}async function copyClientRsvp(id){const g=(data.guests||[]).find(x=>x.id===id);if(!g)return;await navigator.clipboard.writeText(location.origin+'/rsvp-public.html?event='+encodeURIComponent(data.event.id)+'&code='+encodeURIComponent(g.invitation_code));alert('Personal RSVP link copied.')}function bindMessage(){const messageBody=document.getElementById('messageBody'),form=document.getElementById('msgForm');if(!messageBody||!form)return;restoreMessageDraft();messageBody.addEventListener('input',()=>{messageDirty=true;storeLocalDraft();draftStatus.textContent='Saved on this device. Syncing shortly…';saveCloudDraft()});form.onsubmit=async e=>{e.preventDefault();const body=new FormData(form).get('body');if(!body)return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'message',body})});form.reset();messageDirty=false;localStorage.removeItem(localDraftKey);await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'DELETE'}).catch(()=>{});await load({force:true,quiet:true})}}async function load({force=false,quiet=false}={}){if(!force&&Date.now()-lastRefresh<1500)return refreshPromise;if(refreshPromise)return refreshPromise;if(messageDirty&&document.activeElement?.id==='messageBody'){syncStatus.textContent='Editing — refresh paused';return}lastRefresh=Date.now();syncStatus.textContent='Syncing…';refreshPromise=(async()=>{try{data=await WLP.api('client-portal?token='+encodeURIComponent(token)+(force?'&fresh=1':''));apply(data.tenant);render();syncStatus.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){if(/sign-in required|Unauthorized/i.test(e.message)){location='/client-login.html?token='+encodeURIComponent(token);return}content.innerHTML='<div class="card"><h1>Portal unavailable</h1><p>'+WLP.esc(e.message)+'</p></div>'}finally{refreshPromise=null}})();return refreshPromise}async function toggle(id,done){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'toggle-task',id,done})});load({force:true})}function storeLocalDraft(){const el=document.getElementById('messageBody');if(!el)return;try{localStorage.setItem(localDraftKey,JSON.stringify({body:el.value,savedAt:Date.now()}))}catch{}}async function saveCloudDraft(){clearTimeout(draftTimer);const run=async()=>{const el=document.getElementById('messageBody');if(!el)return;await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message',{method:'PUT',body:JSON.stringify({draft_data:{body:el.value,savedAt:Date.now()}})}).catch(()=>{})};draftTimer=setTimeout(run,2500)}async function restoreMessageDraft(){const el=document.getElementById('messageBody');if(!el)return;try{const local=JSON.parse(localStorage.getItem(localDraftKey)||'null');const remote=(await WLP.api('client-draft?token='+encodeURIComponent(token)+'&type=message')).draft;const remoteTime=remote?.updated_at?Date.parse(remote.updated_at):0,localTime=Number(local?.savedAt||0);const chosen=localTime>=remoteTime?local:remote?.draft_data;if(chosen?.body&&!el.value){el.value=chosen.body;messageDirty=true}}catch{}}refreshPortal.onclick=()=>load({force:true});clientLogout.onclick=async()=>{await WLP.api('client-auth-logout',{method:'POST'}).catch(()=>{});location='/client-login.html?token='+encodeURIComponent(token)};window.addEventListener('focus',()=>load({quiet:true}));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load({quiet:true})});window.addEventListener('online',()=>load({force:true,quiet:true}));setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)load({quiet:true})},45000);load({force:true});
