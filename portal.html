<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Portal</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><div id="biz" class="brand-title">Client Portal</div><small id="title">Loading…</small></div></div></header><main style="max-width:1000px;margin:auto"><div class="page-head"><div><h1 id="h1">Your Event</h1><p id="meta" class="muted"></p></div></div><div class="grid cols-2"><div class="card"><h2>Checklist</h2><div id="tasks"></div></div><div class="card"><h2>Timeline</h2><div id="timeline"></div></div><div class="card"><h2>Messages</h2><div id="messages"></div><form id="msgForm" class="grid"><div class="field"><textarea name="body" placeholder="Send a message to your planner"></textarea></div><button class="btn primary">Send Message</button></form></div><div class="card"><h2>Event Details</h2><div id="details"></div></div></div></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token');let data;
function apply(t){const b=t.branding||{};for(const [k,v] of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=t.business_name;if(b.logo_url){logo.src=b.logo_url;logo.hidden=false;fallback.hidden=true}else{logo.hidden=true;fallback.hidden=false}}
function render(){const e=data.event,w=e.workspace_data||{};title.textContent=e.title;h1.textContent=e.title;meta.textContent=`${e.event_type||'Event'} · ${WLP.fmtDate(e.event_date)}`;tasks.innerHTML=(w.checklist||[]).length?(w.checklist||[]).map(x=>`<label style="display:flex;gap:10px;padding:9px 0"><input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}',this.checked)"><span>${WLP.esc(x.title)}</span></label>`).join(''):'<p class="muted">No checklist items yet.</p>';timeline.innerHTML=(w.timeline||[]).length?(w.timeline||[]).map(x=>`<p><strong>${WLP.esc(x.title)}</strong><br><span class="muted">${WLP.esc(x.detail||'')}</span></p>`).join(''):'<p class="muted">Timeline coming soon.</p>';messages.innerHTML=(w.messages||[]).map(x=>`<p><strong>${x.sender==='client'?'You':'Planner'}:</strong> ${WLP.esc(x.body||x.title||'')}</p>`).join('')||'<p class="muted">No messages yet.</p>';details.innerHTML=`<p><strong>Venue:</strong> ${WLP.esc(e.venue||'TBD')}</p><p><strong>Date:</strong> ${WLP.fmtDate(e.event_date)}</p>`}
async function load(){try{data=await WLP.api('client-portal?token='+encodeURIComponent(token));apply(data.tenant);render()}catch(e){document.body.innerHTML='<main><div class="card"><h1>Portal unavailable</h1><p>'+WLP.esc(e.message)+'</p></div></main>'}}async function toggle(id,done){await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'toggle-task',id,done})});load()}msgForm.onsubmit=async e=>{e.preventDefault();const body=new FormData(msgForm).get('body');if(!body)return;await WLP.api('client-portal?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({action:'message',body})});msgForm.reset();load()};load();
</script></body></html>
