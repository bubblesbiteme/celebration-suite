<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Referral Partner Portal</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg"></div><div><div class="brand-title">Referral Partner Portal</div><small>Commission records</small></div></div></header><main style="max-width:1000px;margin:auto"><div class="page-head"><div><h1 id="title">Partner Access</h1><p class="muted">Read-only referral and commission information.</p></div></div><div id="stats" class="kpi-row"></div><div class="card"><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
const token=new URLSearchParams(location.search).get('token'),money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0));async function load(){try{const d=await WLP.api('partner-public?token='+encodeURIComponent(token));title.textContent=d.partner.name;const ev=Object.fromEntries((d.events||[]).map(x=>[x.id,x])),total=(d.referrals||[]).reduce((s,x)=>s+Number(x.commission_amount||0),0),paid=(d.referrals||[]).filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.commission_amount||0),0);stats.innerHTML=`<div class="card stat"><small>Total commission</small><strong>${money(total)}</strong></div><div class="card stat"><small>Paid</small><strong>${money(paid)}</strong></div><div class="card stat"><small>Outstanding</small><strong>${money(total-paid)}</strong></div>`;list.innerHTML=d.referrals.length?`<table class="table"><thead><tr><th>Event</th><th>Eligible revenue</th><th>Commission</th><th>Status</th><th>Paid</th></tr></thead><tbody>${d.referrals.map(r=>`<tr><td>${WLP.esc(ev[r.event_id]?.title||'Referral')}</td><td>${money(r.eligible_revenue)}</td><td>${money(r.commission_amount)}</td><td><span class="badge">${WLP.esc(r.status)}</span></td><td>${r.paid_at?new Date(r.paid_at).toLocaleDateString():'—'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No referral records are available.</div>'}catch(e){document.querySelector('main').innerHTML=`<div class="card"><h2>Access unavailable</h2><p>${WLP.esc(e.message)}</p></div>`}}load();
</script></body></html>
