<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Automation Center</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">EP</span></div><div><div class="brand-title">Automation Center</div><small>Recurring planner workflows</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="runBtn">Run Now</button></div></header><main><div class="page-head"><div><h1>Automations</h1><p class="muted">Automated follow-up, reminders, countdowns and post-event closeout. Email rules use your connected business email provider.</p></div></div><div class="grid cols-3" id="rules"></div><section class="card" style="margin-top:18px"><h2>Recent Runs</h2><div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Rule</th><th>Status</th><th>Detail</th></tr></thead><tbody id="runs"></tbody></table></div></section></main><div id="ruleModal" class="modal"><div class="modal-card"><button class="btn close" onclick="ruleModal.classList.remove('open')">Close</button><h2 id="ruleTitle">Automation</h2><form id="ruleForm" class="grid"><input type="hidden" name="id"><label class="notice"><input type="checkbox" name="enabled"> Enabled</label><div class="field"><label>Name</label><input name="name"></div><div id="configFields"></div><button class="btn primary">Save Rule</button><div id="ruleMsg"></div></form></div></div><script src="/assets/app.js"></script><script>
let data={},current=null;const labels={stale_lead:'Stale Lead Follow-up',overdue_invoice:'Payment Reminders',event_countdown:'Event Countdown',client_task_reminder:'Client Task Reminder',post_event_closeout:'Post-event Closeout',invoice_due:'Invoice Due Soon',overdue_task:'Overdue Task Alert',questionnaire_followup:'Questionnaire Follow-up',vendor_document_due:'Vendor Document Expiry',agreement_signed:'Agreement Signed Kickoff'};function configHtml(r){const c=r.config||{};if(r.rule_type==='stale_lead')return `<div class="field"><label>Days without activity</label><input name="days" type="number" min="1" value="${c.days||3}"></div>`;if(r.rule_type==='event_countdown')return `<div class="field"><label>Countdown days (comma separated)</label><input name="days_list" value="${(c.days||[30,14,7,1]).join(', ')}"></div><div class="field"><label>Recipient</label><select name="recipient"><option value="planner" ${c.recipient==='planner'?'selected':''}>Planner</option><option value="client" ${c.recipient==='client'?'selected':''}>Client</option><option value="both" ${c.recipient==='both'?'selected':''}>Both</option></select></div>`;if(r.rule_type==='client_task_reminder')return `<div class="field"><label>Days before due date</label><input name="days_before" type="number" min="0" value="${c.days_before??1}"></div>`;if(r.rule_type==='invoice_due'||r.rule_type==='vendor_document_due')return `<div class="field"><label>Days before due/expiry</label><input name="days_before" type="number" min="0" value="${c.days_before??7}"></div>`;if(r.rule_type==='questionnaire_followup')return `<div class="field"><label>Days after sent</label><input name="days" type="number" min="1" value="${c.days??3}"></div>`;if(r.rule_type==='overdue_task'||r.rule_type==='agreement_signed')return `<div class="notice">This milestone automation runs automatically and sends each matching alert once.</div>`;if(r.rule_type==='post_event_closeout')return `<div class="field"><label>Days after event</label><input name="days_after" type="number" min="0" value="${c.days_after??1}"></div>`;return `<div class="notice">Sends once per overdue invoice per day until the invoice is paid, voided, or no longer overdue.</div>`}function render(){rules.innerHTML=data.rules.map(r=>`<div class="card"><div class="event-meta"><span class="badge">${r.enabled?'Enabled':'Paused'}</span></div><h3>${WLP.esc(labels[r.rule_type]||r.name)}</h3><p class="muted">${WLP.esc(r.name)}</p><button class="btn primary" onclick="editRule('${r.id}')">Configure</button></div>`).join('');const byId=Object.fromEntries(data.rules.map(r=>[r.id,r]));runs.innerHTML=data.runs.map(x=>`<tr><td>${new Date(x.ran_at).toLocaleString()}</td><td>${WLP.esc(byId[x.rule_id]?.name||x.entity_type||'Automation')}</td><td><span class="badge">${WLP.esc(x.status)}</span></td><td>${WLP.esc(x.detail||'')}</td></tr>`).join('')||'<tr><td colspan="4">No automation runs yet.</td></tr>'}async function load(){data=await WLP.api('automations');render()}window.editRule=id=>{current=data.rules.find(x=>x.id===id);ruleForm.elements.id.value=current.id;ruleForm.elements.enabled.checked=current.enabled;ruleForm.elements.name.value=current.name;ruleTitle.textContent=labels[current.rule_type]||current.name;configFields.innerHTML=configHtml(current);ruleModal.classList.add('open')};ruleForm.onsubmit=async e=>{e.preventDefault();ruleMsg.textContent='Saving…';const fd=new FormData(ruleForm),cfg={...(current.config||{})};if(current.rule_type==='stale_lead')cfg.days=Number(fd.get('days'))||3;if(current.rule_type==='event_countdown'){cfg.days=String(fd.get('days_list')||'').split(',').map(x=>Number(x.trim())).filter(x=>Number.isFinite(x)&&x>=0);cfg.recipient=fd.get('recipient')||'planner'}if(current.rule_type==='client_task_reminder')cfg.days_before=Math.max(0,Number(fd.get('days_before'))||0);if(current.rule_type==='post_event_closeout')cfg.days_after=Math.max(0,Number(fd.get('days_after'))||0);if(current.rule_type==='invoice_due'||current.rule_type==='vendor_document_due')cfg.days_before=Math.max(0,Number(fd.get('days_before'))||0);if(current.rule_type==='questionnaire_followup')cfg.days=Math.max(1,Number(fd.get('days'))||3);try{await WLP.api('automations',{method:'PATCH',body:JSON.stringify({id:current.id,enabled:ruleForm.elements.enabled.checked,name:fd.get('name'),config:cfg})});ruleModal.classList.remove('open');await load()}catch(err){ruleMsg.textContent=err.message}};runBtn.onclick=async()=>{runBtn.disabled=true;runBtn.textContent='Running…';try{const r=await WLP.api('automations?action=run',{method:'POST',body:'{}'});alert(`Automation run complete. ${r.actions||0} action(s) evaluated.`);await load()}catch(e){alert(e.message)}finally{runBtn.disabled=false;runBtn.textContent='Run Now'}};load().catch(e=>document.querySelector('main').innerHTML=`<div class="notice warn">${WLP.esc(e.message)}</div>`);
</script><script src="/assets/ui-v019.js"></script></body></html>
