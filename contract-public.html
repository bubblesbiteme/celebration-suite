<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Agreement</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:900px;margin:auto;padding-top:28px"><div id="wrap" class="card">Loading agreement…</div></main><script src="/assets/app.js"></script><script>const token=new URLSearchParams(location.search).get('token');let contract,tenant;function applyBrand(){const b=tenant.branding||{};for(const [k,v] of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v)}function render(){applyBrand();wrap.innerHTML=`<div class="page-head"><div class="brand" style="color:#111"><div class="brand-mark">${tenant.branding?.logo_url?`<img src="${WLP.esc(tenant.branding.logo_url)}" alt="">`:`<span class="brand-fallback">${WLP.esc((tenant.business_name||'P').slice(0,2).toUpperCase())}</span>`}</div><div><div class="brand-title">${WLP.esc(tenant.business_name)}</div><small>Agreement</small></div></div><span class="badge status-${contract.status}">${WLP.esc(contract.status)}</span></div><h1>${WLP.esc(contract.title)}</h1><p>${WLP.esc(contract.body||'').replaceAll('\n','<br>')}</p>${contract.status==='signed'?`<div class="notice good"><strong>Signed.</strong><br>${WLP.esc(contract.signature_name||'')} · ${new Date(contract.signed_at).toLocaleString()}</div>`:`<hr><h2>Electronic Signature</h2><p class="muted">By typing your name and submitting, you acknowledge and agree to the agreement above.</p><form id="signForm" class="grid"><div class="grid cols-2"><div class="field"><label>Full legal name</label><input name="signature_name" required></div><div class="field"><label>Email</label><input name="signature_email" type="email" required value="${WLP.esc(contract.client_email||'')}"></div></div><button class="btn primary">Sign Agreement</button><div id="msg"></div></form>`}`;if(contract.status!=='signed')signForm.onsubmit=sign}async function sign(e){e.preventDefault();msg.textContent='Signing…';try{await WLP.api('contract-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(signForm)))});await load()}catch(err){msg.textContent=err.message}}async function load(){try{const d=await WLP.api('contract-public?token='+encodeURIComponent(token));contract=d.contract;tenant=d.tenant;render()}catch(e){wrap.textContent=e.message}}load();</script></body></html>
