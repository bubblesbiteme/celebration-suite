<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Inspiration Board</title><link rel="stylesheet" href="/assets/app.css"><style>#board{position:relative;min-height:720px;background:#f6f4ef;border:1px solid var(--border);border-radius:18px;overflow:hidden}.pin{position:absolute;background:white;border-radius:14px;box-shadow:0 8px 24px #0002;overflow:hidden;cursor:move}.pin img{width:100%;display:block}.pin .cap{padding:8px;font-size:.85rem}.pin .tools{display:flex;gap:5px;padding:0 8px 8px}.pin .tools button{padding:4px 7px}.inventory-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:360px;overflow:auto}.inv{border:1px solid var(--border);border-radius:12px;padding:8px;cursor:pointer}.inv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}</style></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg"></div><div><div class="brand-title">Celebration Suite</div><small>Inspiration Board</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1250px;margin:auto"><div class="page-head"><div><h1>Inspiration & Design Board</h1><p class="muted">Build a visual event concept with uploaded image links or items from inventory.</p></div><select id="eventSelect" style="min-width:260px"></select></div><div class="grid" style="grid-template-columns:300px 1fr"><aside class="grid"><div class="card"><h3>Add image</h3><form id="addForm" class="grid"><input name="image_url" placeholder="Image URL" required><input name="title" placeholder="Label"><button class="btn primary">Add to board</button></form><div id="msg"></div></div><div class="card"><h3>Inventory images</h3><div id="inventory" class="inventory-strip"></div></div></aside><section id="board"></section></div></main><script src="/assets/app.js"></script><script>let model={items:[],inventory:[]},drag=null;async function events(){const d=await WLP.api('events');eventSelect.innerHTML=(d.events||[]).map(e=>`<option value="${e.id}">${WLP.esc(e.title)} · ${WLP.fmtDate(e.event_date)}</option>`).join('');const q=new URLSearchParams(location.search).get('event_id');if(q)eventSelect.value=q;load()}async function load(){if(!eventSelect.value)return;model=await WLP.api('inspiration?event_id='+encodeURIComponent(eventSelect.value));render()}function render(){inventory.innerHTML=model.inventory.map(x=>`<div class="inv" onclick="addInv('${x.id}')"><img src="${WLP.esc(x.image_url)}"><strong>${WLP.esc(x.name)}</strong></div>`).join('')||'<span class="muted">Add image URLs to inventory to use them here.</span>';board.innerHTML=model.items.map(x=>`<div class="pin" data-id="${x.id}" style="left:${x.x}%;top:${x.y}%;width:${x.width}%;z-index:${x.z_index}"><img draggable="false" src="${WLP.esc(x.image_url)}"><div class="cap">${WLP.esc(x.title||'')}</div><div class="tools"><button class="btn" onclick="resizeItem(event,'${x.id}',-4)">−</button><button class="btn" onclick="resizeItem(event,'${x.id}',4)">+</button><button class="btn" onclick="front(event,'${x.id}')">Front</button><button class="btn" onclick="back(event,'${x.id}')">Back</button><button class="btn" onclick="removeItem(event,'${x.id}')">×</button></div></div>`).join('');document.querySelectorAll('.pin').forEach(el=>el.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;const r=board.getBoundingClientRect(),er=el.getBoundingClientRect();drag={el,id:el.dataset.id,dx:e.clientX-er.left,dy:e.clientY-er.top,r};el.setPointerCapture(e.pointerId)});board.onpointermove=e=>{if(!drag)return;drag.el.style.left=Math.max(0,Math.min(92,(e.clientX-drag.r.left-drag.dx)/drag.r.width*100))+'%';drag.el.style.top=Math.max(0,Math.min(92,(e.clientY-drag.r.top-drag.dy)/drag.r.height*100))+'%'};board.onpointerup=async e=>{if(!drag)return;const x=parseFloat(drag.el.style.left),y=parseFloat(drag.el.style.top),id=drag.id;drag=null;await patch(id,{x,y})}}async function patch(id,d){await WLP.api(`inspiration?event_id=${encodeURIComponent(eventSelect.value)}&id=${encodeURIComponent(id)}`,{method:'PATCH',body:JSON.stringify(d)});await load()}async function addInv(id){const x=model.inventory.find(i=>i.id===id);await WLP.api('inspiration?event_id='+encodeURIComponent(eventSelect.value),{method:'POST',body:JSON.stringify({inventory_item_id:id,image_url:x.image_url,title:x.name,z_index:model.items.length+1})});load()}addForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(addForm));await WLP.api('inspiration?event_id='+encodeURIComponent(eventSelect.value),{method:'POST',body:JSON.stringify({...d,z_index:model.items.length+1})});addForm.reset();load()};async function resizeItem(e,id,n){e.stopPropagation();const x=model.items.find(i=>i.id===id);await patch(id,{width:Math.max(10,Math.min(80,Number(x.width)+n))})}async function front(e,id){e.stopPropagation();await patch(id,{z_index:Math.max(...model.items.map(x=>x.z_index||1),1)+1})}async function back(e,id){e.stopPropagation();await patch(id,{z_index:Math.min(...model.items.map(x=>x.z_index||1),1)-1})}async function removeItem(e,id){e.stopPropagation();await WLP.api(`inspiration?event_id=${encodeURIComponent(eventSelect.value)}&id=${encodeURIComponent(id)}`,{method:'DELETE'});load()}eventSelect.onchange=load;events();</script></body></html>
