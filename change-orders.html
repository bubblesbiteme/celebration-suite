<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Orders</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Celebration Suite</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Change Orders</h1><p class="muted">Document scope and price changes and send them to clients for approval.</p></div></div><div class="grid cols-3"><form id="form" class="card grid"><h2>New Change Order</h2><div class="field"><label>Event</label><select name="event_id" id="eventSel" required></select></div><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Description</label><textarea name="description" rows="6"></textarea></div><div class="field"><label>Price change</label><input name="amount_delta" type="number" step=".01"></div><div class="field"><label>Client name</label><input name="client_name"></div><div class="field"><label>Client email</label><input name="client_email" type="email"></div><button class="btn primary">Create</button><span id="msg"></span></form><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>let d={change_orders:[],events:[]};const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});function render(){eventSel.innerHTML=d.events.map(e=>`<option value="${e.id}" data-name="${WLP.esc(e.client_name||'')}" data-email="${WLP.esc(e.client_email||'')}">${WLP.esc(e.title)}</option>`).join('');const em=Object.fromEntries(d.events.map(e=>[e.id,e.title]));list.innerHTML=d.change_orders.length?d.change_orders.map(x=>`<div class="notice" style="margin-bottom:12px"><div class="toolbar"><span class="badge">${WLP.esc(x.status)}</span><strong>${WLP.esc(x.title)}</strong><span>${money(x.amount_delta)}</span></div><div class="muted">${WLP.esc(em[x.event_id]||'')}</div><p>${WLP.esc(x.description||'')}</p>${['draft','sent'].includes(x.status)?`<button class="btn primary" onclick="send('${x.id}')">Send for approval</button>`:''}</div>`).join(''):'<div class="empty">No change orders yet.</div>'}async function load(){d=await WLP.api('change-orders');render()}eventSel.onchange=()=>{const o=eventSel.selectedOptions[0];if(o){form.client_name.value=o.dataset.name||'';form.client_email.value=o.dataset.email||''}};async function send(id){try{const r=await WLP.api('change-orders?action=send',{method:'POST',body:JSON.stringify({id})});alert('Sent. Approval link: '+r.link);load()}catch(e){alert(e.message)}}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{await WLP.api('change-orders',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});form.reset();msg.textContent='Created.';load()}catch(err){msg.textContent=err.message}};load().then(()=>eventSel.onchange()).catch(()=>location='/login.html');</script><script src="/assets/ui-v019.js"></script></body></html>
