<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Guests & RSVP</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">G</span></div><div><div id="biz" class="brand-title">Guests & RSVP</div><small>Guest lists, responses, meals, and check-in</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addGuest()">+ Guest</button></div></header><main><div class="page-head"><div><h1>Guests & RSVP</h1><p class="muted">Manage invited guests and share a public RSVP link.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"></select><input id="search" placeholder="Search guests"><button class="btn" id="copyRsvp">Copy RSVP Link</button></div><div id="stats" class="kpi-row" style="margin:14px 0"></div><div id="list" class="table-wrap"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],guests=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Guests'}async function refresh(){if(!eventFilter.value){guests=[];render();return}guests=(await WLP.api('guests?event_id='+encodeURIComponent(eventFilter.value))).guests||[];render()}function render(){const q=search.value.toLowerCase(),rows=guests.filter(g=>!q||(g.full_name+' '+(g.email||'')+' '+(g.table_name||'')).toLowerCase().includes(q));const attending=guests.filter(g=>g.rsvp_status==='attending').reduce((s,g)=>s+Number(g.party_size||1),0),pending=guests.filter(g=>g.rsvp_status==='pending').length,checked=guests.filter(g=>g.checked_in_at).length;stats.innerHTML=`<div class="card stat"><small>Invited</small><strong>${guests.length}</strong></div><div class="card stat"><small>Attending</small><strong>${attending}</strong></div><div class="card stat"><small>Pending</small><strong>${pending}</strong></div><div class="card stat"><small>Checked In</small><strong>${checked}</strong></div><div class="card stat"><small>Declined</small><strong>${guests.filter(g=>g.rsvp_status==='declined').length}</strong></div>`;list.innerHTML=rows.length?`<table class="table"><thead><tr><th>Name</th><th>RSVP</th><th>Party</th><th>Meal / Dietary</th><th>Table</th><th>Check-in</th><th></th></tr></thead><tbody>${rows.map(g=>`<tr><td><strong>${WLP.esc(g.full_name)}</strong><br><small>${WLP.esc(g.email||'')}</small></td><td><span class="badge">${WLP.esc(g.rsvp_status)}</span></td><td>${g.party_size}</td><td>${WLP.esc(g.meal_choice||'')}<br><small>${WLP.esc(g.dietary||'')}</small></td><td>${WLP.esc(g.table_name||'')}</td><td><button class="btn ${g.checked_in_at?'primary':''}" onclick="checkin('${g.id}',${g.checked_in_at?'false':'true'})">${g.checked_in_at?'Checked In':'Check In'}</button></td><td><button class="btn" onclick="editGuest('${g.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No guests yet.</div>'}async function addGuest(g={}){if(!eventFilter.value){alert('Choose an event first.');return}const full_name=prompt('Guest name',g.full_name||'');if(!full_name)return;const email=prompt('Email',g.email||'');const party_size=prompt('Party size',g.party_size||1);const rsvp_status=prompt('RSVP status: pending, attending, declined, waitlist',g.rsvp_status||'pending');const meal_choice=prompt('Meal choice',g.meal_choice||'');const dietary=prompt('Dietary notes',g.dietary||'');const table_name=prompt('Table / seating',g.table_name||'');const body={event_id:eventFilter.value,full_name,email,party_size,rsvp_status,meal_choice,dietary,table_name};if(g.id)body.id=g.id;await WLP.api('guests',{method:g.id?'PATCH':'POST',body:JSON.stringify(body)});await refresh()}function editGuest(id){addGuest(guests.find(g=>g.id===id))}async function checkin(id,checked){await WLP.api('guests?action=checkin',{method:'PATCH',body:JSON.stringify({id,checked_in:checked})});await refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh()}copyRsvp.onclick=async()=>{const ev=events.find(e=>e.id===eventFilter.value);if(!ev)return alert('Choose an event first.');const url=location.origin+'/rsvp-public.html?token='+encodeURIComponent(ev.client_portal_token);await navigator.clipboard.writeText(url);copyRsvp.textContent='Copied!';setTimeout(()=>copyRsvp.textContent='Copy RSVP Link',1200)};eventFilter.onchange=refresh;search.oninput=render;load();
</script></body></html>
