<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Intelligence</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Celebration Suite</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1400px;margin:auto"><div class="page-head"><div><h1>Business Intelligence</h1><p class="muted">Revenue, conversion, costs, inventory value and booking mix.</p></div></div><div id="metrics" class="grid cols-4"></div><div class="grid cols-2" style="margin-top:18px"><div class="card"><h2>Events by Type</h2><div id="types"></div></div><div class="card"><h2>Leads by Source</h2><div id="sources"></div></div></div></main><script src="/assets/app.js"></script><script>const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});function bars(obj){const entries=Object.entries(obj||{}),max=Math.max(1,...entries.map(x=>x[1]));return entries.length?entries.map(([k,v])=>`<div style="margin:12px 0"><div class="toolbar" style="justify-content:space-between"><strong>${WLP.esc(k)}</strong><span>${v}</span></div><div style="height:10px;background:#eee;border-radius:9px;overflow:hidden"><div style="height:100%;width:${v/max*100}%;background:var(--brand-primary,#A9B89A)"></div></div></div>`).join(''):'<div class="empty">No data yet.</div>'}async function load(){try{const d=await WLP.api('analytics'),m=d.metrics;const cards=[['Billed',money(m.billed)],['Collected',money(m.collected)],['Outstanding',money(m.outstanding)],['Vendor spend',money(m.vendor_spend)],['Referral commissions',money(m.referral_commissions)],['Inventory value',money(m.inventory_value)],['Lead conversion',m.lead_conversion.toFixed(1)+'%'],['Active events',m.active_events]];metrics.innerHTML=cards.map(([a,b])=>`<div class="card stat"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('');types.innerHTML=bars(d.by_type);sources.innerHTML=bars(d.by_source)}catch(e){if(e.message==='Unauthorized')location='/login.html';else metrics.innerHTML=`<div class="notice warn">${WLP.esc(e.message)}</div>`}}load();</script></body></html>
