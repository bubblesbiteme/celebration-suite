<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Business Intelligence</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Business Intelligence</div><small>Revenue, profit, conversion and utilization</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1500px;margin:auto"><div class="page-head"><div><h1>Owner Dashboard</h1><p class="muted">A business-level view of performance across events.</p></div></div><div id="metrics" class="grid cols-4"></div><div class="grid cols-2" style="margin-top:18px"><div class="card"><h2>Revenue by Month</h2><div id="months"></div></div><div class="card"><h2>Lead Sources</h2><div id="sources"></div></div></div><div class="card" style="margin-top:18px"><h2>Event Profitability</h2><div id="profits"></div></div><div class="grid cols-2" style="margin-top:18px"><div class="card"><h2>Inventory Utilization</h2><div id="util"></div></div><div class="card"><h2>Events by Type</h2><div id="types"></div></div></div></main><script src="/assets/app.js"></script><script>
const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'}),{api,esc}=WLP;function bars(obj,moneyMode=false){const entries=Array.isArray(obj)?obj:Object.entries(obj||{}).map(([name,value])=>({name,value})),max=Math.max(1,...entries.map(x=>Number(x.value??x.revenue??0)));return entries.length?entries.map(x=>{const name=x.name||x.month,val=Number(x.value??x.revenue??0);return`<div style="margin:12px 0"><div class="toolbar" style="justify-content:space-between"><strong>${esc(name)}</strong><span>${moneyMode?money(val):val}</span></div><div style="height:10px;background:#eee;border-radius:9px;overflow:hidden"><div style="height:100%;width:${val/max*100}%;background:var(--brand-primary,#A9B89A)"></div></div></div>`}).join(''):'<div class="empty">No data yet.</div>'}async function load(){const d=await api('analytics'),m=d.metrics;const cards=[['Billed',money(m.billed)],['Collected',money(m.collected)],['Outstanding',money(m.outstanding)],['Estimated profit',money(m.estimated_profit)],['Vendor spend',money(m.vendor_spend)],['Labor cost',money(m.labor_cost)],['Referral commissions',money(m.referral_commissions)],['Lead conversion',Number(m.lead_conversion||0).toFixed(1)+'%']];metrics.innerHTML=cards.map(([a,b])=>`<div class="card stat"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('');months.innerHTML=bars((d.monthly||[]).map(x=>({name:x.month,value:x.revenue})),true);sources.innerHTML=bars(d.by_source);types.innerHTML=bars(d.by_type);profits.innerHTML=(d.event_profitability||[]).length?`<div style="overflow:auto"><table style="width:100%"><thead><tr><th align="left">Event</th><th>Revenue</th><th>Costs</th><th>Profit</th><th>Margin</th></tr></thead><tbody>${d.event_profitability.map(x=>`<tr><td>${esc(x.title)}</td><td align="right">${money(x.revenue)}</td><td align="right">${money(x.costs)}</td><td align="right">${money(x.profit)}</td><td align="right">${Number(x.margin||0).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No event financial data yet.</div>';util.innerHTML=(d.inventory_utilization||[]).map(x=>`<div style="margin:12px 0"><div class="toolbar" style="justify-content:space-between"><strong>${esc(x.name)}</strong><span>${x.reserved}/${x.owned} · ${Number(x.utilization).toFixed(0)}%</span></div><div style="height:10px;background:#eee;border-radius:9px;overflow:hidden"><div style="height:100%;width:${x.utilization}%;background:var(--brand-primary,#A9B89A)"></div></div></div>`).join('')||'<div class="empty">No inventory reservations yet.</div>'}load().catch(e=>alert(e.message));</script><script src="/assets/ui-v019.js"></script></body></html>
