<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Event Workspace</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><div id="biz" class="brand-title">Event Workspace</div><small id="eventTitle">Loading…</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/proposals.html">Proposals</a><a class="btn" href="/financials.html">Financials</a><a class="btn" id="guestTools">Guest Tools</a><a class="btn" id="floorTools">Floor Plan</a><a class="btn" id="dayTools">Event Day</a><a class="btn" id="laborTools">Labor</a><a class="btn primary" id="portalLink" target="_blank">Client Portal</a><span id="saveStatus" class="muted" aria-live="polite">Up to date</span><button class="btn" id="saveBtn">Save</button></div></header><main><div class="page-head"><div><h1 id="h1">Event</h1><p class="muted" id="meta"></p></div></div><div class="tabs" id="tabs"></div><div id="content" class="card"></div></main><script src="/assets/app.js"></script><script>
const id=new URLSearchParams(location.search).get('id');let event,tenant,workspace={};let autosaveTimer=null,lastSavedSnapshot='',savePromise=null,dirty=false;const localDraftKey='cs:event-workspace:'+id;
const defs=[['checklist','Checklist'],['timeline','Timeline'],['guests','Guests'],['vendors','Vendors'],['budget','Budget'],['documents','Documents'],['questionnaires','Questionnaires'],['inspiration','Inspiration'],['approvals','Approvals'],['messages','Messages'],['notes','Notes']];let active='checklist';
function brand(){const b=tenant.branding||{};for(const [k,v] of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name;if(b.logo_url){logo.src=b.logo_url;logo.hidden=false;fallback.hidden=true}else{logo.hidden=true;fallback.hidden=false}}
function itemFields(key){return ({checklist:['Task','Due date'],timeline:['Time / date','Activity'],guests:['Guest name','RSVP / meal'],vendors:['Vendor','Category / contact'],documents:['Document','Link / note'],questionnaires:['Questionnaire','Status / link'],inspiration:['Idea','Link / note'],approvals:['Approval item','Status'],messages:['Message','From / note'],notes:['Note','']}[key]||['Item','Detail'])}
function render(){tabs.innerHTML=defs.map(([k,l])=>`<button class="btn ${k===active?'primary':''}" onclick="active='${k}';render()">${l}</button>`).join('');if(active==='messages'){const arr=workspace.messages||[];content.innerHTML=`<div class="page-head"><div><h2>Messages & Email</h2><p class="muted">Send through your connected business email account.</p></div><button class="btn primary" onclick="sendClientEmail()">Email Client</button></div>${arr.length?arr.map(x=>`<p><strong>${WLP.esc(x.sender||'Planner')}:</strong> ${WLP.esc(x.body||x.title||'')}</p>`).join(''):'<div class="empty">No saved messages yet.</div>'}`;return}if(active==='budget'){workspace.budget=workspace.budget||{items:[]};const items=workspace.budget.items||[];const total=items.reduce((s,x)=>s+(Number(x.amount)||0),0);content.innerHTML=`<div class="page-head"><div><h2>Budget</h2><p class="muted">Total tracked: $${total.toFixed(2)}</p></div><button class="btn primary" onclick="addBudget()">+ Add Item</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Amount</th><th>Paid?</th><th></th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${WLP.esc(x.label)}</td><td>$${Number(x.amount||0).toFixed(2)}</td><td>${x.paid?'Yes':'No'}</td><td><button class="btn" onclick="removeBudget(${i})">Remove</button></td></tr>`).join('')}</tbody></table></div>`;return}const arr=workspace[active]||[];const [a,b]=itemFields(active);content.innerHTML=`<div class="page-head"><div><h2>${defs.find(x=>x[0]===active)[1]}</h2><p class="muted">${arr.length} item${arr.length===1?'':'s'}</p></div><button class="btn primary" onclick="addItem()">+ Add</button></div>${arr.length?`<div class="table-wrap"><table class="table"><thead><tr><th>${a}</th><th>${b}</th><th></th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${active==='checklist'?`<input type="checkbox" ${x.done?'checked':''} onchange="workspace.checklist[${i}].done=this.checked;markDirty()"> `:''}${WLP.esc(x.title||x.name||x.body||x.label||'')}</td><td>${WLP.esc(x.detail||x.due||x.time||x.status||x.note||'')}</td><td><button class="btn" onclick="removeItem(${i})">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing here yet.</div>'}`}
function markDirty(){dirty=true;try{localStorage.setItem(localDraftKey,JSON.stringify({workspace,savedAt:Date.now()}))}catch{};saveStatus.textContent='Unsaved changes — autosaving…';clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>save({quiet:true}),2500)}function addItem(){const [a,b]=itemFields(active),title=prompt(a);if(!title)return;const detail=b?prompt(b)||'':'';workspace[active]=workspace[active]||[];const obj={id:crypto.randomUUID(),title,detail};if(active==='checklist'){obj.done=false;const m=String(detail).match(/\d{4}-\d{2}-\d{2}/);if(m)obj.due_date=m[0]}workspace[active].push(obj);markDirty();render()}
function removeItem(i){workspace[active].splice(i,1);markDirty();render()}function addBudget(){const label=prompt('Budget item');if(!label)return;const amount=Number(prompt('Amount')||0);workspace.budget.items.push({id:crypto.randomUUID(),label,amount,paid:false});markDirty();render()}function removeBudget(i){workspace.budget.items.splice(i,1);markDirty();render()}
async function sendClientEmail(){if(!event.client_email){alert('Add a client email to this event first.');return}const subject=prompt('Email subject',event.title+' planning update');if(!subject)return;const body=prompt('Message');if(!body)return;try{await WLP.api('tenant-email',{method:'POST',body:JSON.stringify({to:event.client_email,subject,body})});workspace.messages=workspace.messages||[];workspace.messages.push({id:crypto.randomUUID(),sender:'planner',body,created_at:new Date().toISOString()});await save();alert('Email sent from your connected email provider.')}catch(e){alert(e.message)}}
async function save({quiet=false}={}){clearTimeout(autosaveTimer);const snapshot=JSON.stringify(workspace);if(savePromise)return savePromise;if(snapshot===lastSavedSnapshot&&!dirty){saveStatus.textContent='Up to date';return}saveBtn.textContent='Saving…';saveStatus.textContent='Saving…';savePromise=(async()=>{try{await WLP.api('events?id='+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({id,workspace_data:workspace})});lastSavedSnapshot=JSON.stringify(workspace);dirty=false;try{localStorage.removeItem(localDraftKey)}catch{};saveBtn.textContent='Saved';saveStatus.textContent='Saved securely '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});setTimeout(()=>{if(!dirty)saveBtn.textContent='Save'},1400)}catch(e){saveBtn.textContent='Save';saveStatus.textContent='Saved on this device — cloud save failed';if(!quiet)alert(e.message)}finally{savePromise=null}})();return savePromise}
async function load(){try{const b=await WLP.api('bootstrap');tenant=b.tenant;brand();const d=await WLP.api('events?id='+encodeURIComponent(id));event=d.event;workspace=event.workspace_data||{};try{const local=JSON.parse(localStorage.getItem(localDraftKey)||'null');if(local?.workspace&&Number(local.savedAt||0)>Date.parse(event.updated_at||0)){workspace=local.workspace;dirty=true;saveStatus.textContent='Recovered unsaved changes — autosaving…';setTimeout(()=>save({quiet:true}),500)}}catch{};for(const [k] of defs)if(k!=='budget'&&!Array.isArray(workspace[k]))workspace[k]=[];workspace.budget=workspace.budget||{items:[]};eventTitle.textContent=event.title;h1.textContent=event.title;meta.textContent=`${event.event_type||'Event'} · ${WLP.fmtDate(event.event_date)} · ${event.venue||'Venue TBD'}${event.client_name?' · '+event.client_name:''}`;portalLink.href='/portal.html?token='+encodeURIComponent(event.client_portal_token);guestTools.href='/guests.html?event_id='+encodeURIComponent(id);floorTools.href='/floorplan.html?event_id='+encodeURIComponent(id);dayTools.href='/event-day.html?event_id='+encodeURIComponent(id);laborTools.href='/time-tracking.html?event_id='+encodeURIComponent(id);lastSavedSnapshot=JSON.stringify(workspace);render()}catch(e){alert(e.message);location='/app.html'}}saveBtn.onclick=()=>save();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)save({quiet:true})});load();
</script></body></html>
