<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Workspace</title><link rel="stylesheet" href="/assets/app.css"><style>
.page{max-width:1520px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#fff,#f4f1ea);border:1px solid var(--border);border-radius:20px;padding:20px}.hero-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-top:16px}.stat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:11px}.stat small{display:block;color:var(--muted)}.stat b{display:block;font-size:1.2rem;margin-top:4px}.primary-tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.workspace-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--bg,#f8f6f1);z-index:10;padding:4px 0}.more{position:relative}.more summary{list-style:none}.more-panel{position:absolute;right:0;top:42px;width:min(760px,88vw);background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 20px 60px #0002;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.more-panel strong{display:block;margin-bottom:6px}.more-panel a{display:block;padding:6px 0;color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,.75fr);gap:16px}.task-board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:10px;overflow:auto}.col{background:#f1eee8;border-radius:14px;padding:10px;min-height:260px}.task{background:#fff;border:1px solid var(--border);border-radius:11px;padding:10px;margin-bottom:8px}.timeline{border-left:2px solid #d9d3cb;margin-left:10px;padding-left:16px}.timeitem{position:relative;border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px;margin-bottom:9px}.timeitem:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--brand-primary,#52644d);left:-22px;top:18px}.budget-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:100}.modal[hidden]{display:none}.modal-card{width:min(780px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:.76rem;font-weight:800;margin-bottom:5px}.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tool-card{border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;text-decoration:none;color:inherit}.tool-card b{display:block}.tool-card small{color:var(--muted)}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.more-panel{grid-template-columns:1fr 1fr}.tool-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.page{padding:8px}.hero-row{display:block}.stats{grid-template-columns:1fr 1fr}.task-board{grid-template-columns:repeat(4,82vw)}.more-panel{grid-template-columns:1fr}.tool-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style></head><body><header class="topbar"><div class="brand"><div class="brand-title" id="biz">Event Workspace</div><small id="eventTitle">Loading…</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" id="portalLink" target="_blank">Client Portal</a><span class="muted" id="saveState">Up to date</span><button class="btn primary" id="saveBtn">Save</button></div></header><main class="page"><section class="hero"><div class="hero-row"><div><div class="eyebrow" id="eventType">EVENT WORKSPACE</div><h1 id="title">Event</h1><p id="meta" class="muted"></p></div><div class="tools"><a class="btn primary" id="floorQuick">Floor Plan</a><a class="btn" id="dayLink">Event Day</a><a class="btn" id="bookLink">Event Book</a><a class="btn" id="laborQuick">Labor</a><a class="btn" id="auditQuick">Activity</a></div></div><div id="stats" class="stats"></div></section><div class="workspace-nav"><div class="primary-tabs" id="tabs"></div><details class="more"><summary class="btn">More Tools ▾</summary><div class="more-panel" id="morePanel"></div></details></div><section id="content"></section></main>
<div class="modal" id="modal" hidden><div class="modal-card"><div class="page-head"><h2 id="modalTitle"></h2><button class="btn" id="closeModal">Close</button></div><div id="modalBody"></div></div></div><script src="/assets/app.js"></script><script>
const params=new URLSearchParams(window.location.search);const id=params.get('id')||params.get('event_id');let event={},tenant={},w={},active='overview',dirty=false,timelineView='list',timelineMonth=new Date();const localDraftKey='cs:event-workspace:'+id;const $=WLP.$,esc=WLP.esc,money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});
const biz=document.getElementById('biz'),eventTitle=document.getElementById('eventTitle'),portalLink=document.getElementById('portalLink'),saveState=document.getElementById('saveState'),saveBtn=document.getElementById('saveBtn'),eventType=document.getElementById('eventType'),titleEl=document.getElementById('title'),meta=document.getElementById('meta'),floorQuick=document.getElementById('floorQuick'),dayLink=document.getElementById('dayLink'),bookLink=document.getElementById('bookLink'),laborQuick=document.getElementById('laborQuick'),auditQuick=document.getElementById('auditQuick'),stats=document.getElementById('stats'),tabs=document.getElementById('tabs'),morePanel=document.getElementById('morePanel'),content=document.getElementById('content'),modal=document.getElementById('modal'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),closeModal=document.getElementById('closeModal');const primary=[['overview','Overview'],['checklist','Checklist'],['timeline','Timeline'],['budget','Budget'],['messages','Messages'],['client','Client Access']];const toolGroups=[['Plan & Design',[['Design Board','inspiration.html'],['Floor Plan','floorplan.html'],['Questionnaires','questionnaires.html'],['Approvals','approvals.html'],['Documents','documents.html']]],['People & Vendors',[['Guests & RSVP','guests.html'],['Tickets','registration.html'],['Vendor CRM','vendors.html'],['Vendor Ops','vendor-operations.html'],['Staff','staff-operations.html'],['Labor / Time','time-tracking.html']]],['Operations & Money',[['Inventory','event-inventory.html'],['Purchasing Gaps','purchasing.html'],['Financial Center','financials.html'],['Communications','communications.html'],['Tickets & Registration','registration.html'],['QR Check-In','guest-checkin.html'],['Activity History','audit.html'],['Closeout','event-closeout.html']]]];
function normalize(){w=w&&typeof w==='object'?w:{};w.checklist=Array.isArray(w.checklist)?w.checklist:[];w.timeline=Array.isArray(w.timeline)?w.timeline:[];w.messages=Array.isArray(w.messages)?w.messages:[];w.notes=Array.isArray(w.notes)?w.notes:[];w.budget=w.budget||{items:[]};w.budget.items=Array.isArray(w.budget.items)?w.budget.items:[];w.portal_permissions=w.portal_permissions||{overview:true,planning:true,design:true,guests:true,floorplan:true,questionnaires:true,approvals:true,financials:true,documents:true,messages:true,client_can_arrange:true}}
async function load(){if(!id)return location='/app.html';const [b,e]=await Promise.all([WLP.api('bootstrap'),WLP.api('events?id='+encodeURIComponent(id))]);tenant=b.tenant;event=e.event;w=event.workspace_data||{};normalize();biz.textContent=(tenant.business_name||'Celebration Suite')+' · Event Workspace';eventTitle.textContent=event.title;portalLink.href='/portal.html?token='+encodeURIComponent(event.client_portal_token||'');floorQuick.href='/floorplan.html?event_id='+id;dayLink.href='/event-day.html?event_id='+id;bookLink.href='/event-book.html?event_id='+id;laborQuick.href='/time-tracking.html?event_id='+id;auditQuick.href='/audit.html?event_id='+id;const local=localStorage.getItem(localDraftKey);if(local){try{const x=JSON.parse(local);if(x?.workspace&&Number(x.saved_at)>Date.parse(event.updated_at||0)){w=x.workspace;normalize();saveState.textContent='Recovered local draft'}}catch{}}render()}
function totals(){const tasks=w.checklist||[],done=tasks.filter(x=>x.done||x.status==='done'||x.status==='completed').length,items=w.budget.items||[],budget=items.reduce((s,x)=>s+Number(x.approved??x.amount??0),0),actual=items.reduce((s,x)=>s+Number(x.actual??0),0);return{done,open:tasks.length-done,total:tasks.length,budget,actual}}
function chrome(){eventType.textContent=event.event_type||'EVENT';titleEl.textContent=event.title||'Event';meta.textContent=[event.event_date?WLP.fmtDate(event.event_date):'Date TBD',event.venue,event.client_name,event.status].filter(Boolean).join(' · ');const t=totals();stats.innerHTML=`<div class="stat"><small>Planning complete</small><b>${t.total?Math.round(t.done/t.total*100):0}%</b></div><div class="stat"><small>Open tasks</small><b>${t.open}</b></div><div class="stat"><small>Service fee</small><b>${money(event.service_fee)}</b></div><div class="stat"><small>Décor budget</small><b>${money(event.client_decor_budget)}</b></div><div class="stat"><small>Planned budget</small><b>${money(t.budget)}</b></div><div class="stat"><small>Actual spend</small><b>${money(t.actual)}</b></div>`;tabs.innerHTML=primary.map(([k,l])=>`<button class="btn ${active===k?'primary':''}" onclick="active='${k}';render()">${l}</button>`).join('');morePanel.innerHTML=toolGroups.map(([name,links])=>`<div><strong>${name}</strong>${links.map(([label,path])=>`<a href="/${path}?${path==='event-inventory.html'?'id':'event_id'}=${id}">${label}</a>`).join('')}</div>`).join('')}
function render(){chrome();if(active==='overview')overview();if(active==='checklist')checklist();if(active==='timeline')timeline();if(active==='budget')budget();if(active==='messages')messages();if(active==='client')clientAccess()}
function nextTasks(){return [...w.checklist].filter(x=>!(x.done||['done','completed'].includes(x.status))).sort((a,b)=>String(a.due_date||'9999').localeCompare(String(b.due_date||'9999'))).slice(0,7)}
function overview(){content.innerHTML=`<div class="layout"><div><div class="card"><div class="page-head"><div><h2>Next Actions</h2><p class="muted">The work that needs attention next.</p></div><button class="btn primary" onclick="active='checklist';render()">Open Checklist</button></div>${nextTasks().map(x=>`<div class="notice" style="margin-bottom:8px"><b>${esc(x.title||x.text||'Task')}</b><br><small>${x.due_date?'Due '+WLP.fmtDate(x.due_date):'No due date'}${x.owner?' · '+esc(x.owner):''}</small></div>`).join('')||'<div class="empty">No open planning tasks.</div>'}</div><div class="card" style="margin-top:14px"><h2>Event Operations</h2><div class="tool-grid">${[['Design Board','Build the visual concept.','inspiration.html'],['Floor Plan','Layouts, seating and room setup.','floorplan.html'],['Guests & RSVP','Invitations, meals and check-in.','guests.html'],['Questionnaires','Collect and analyze client details.','questionnaires.html'],['Inventory','Reserve, pack and return items.','event-inventory.html'],['Financial Center','Contract, invoices, payments and costs.','financials.html']].map(([a,b,p])=>`<a class="tool-card" href="/${p}?${p==='event-inventory.html'?'id':'event_id'}=${id}"><b>${a}</b><small>${b}</small></a>`).join('')}</div></div></div><aside><div class="card"><h2>Client</h2><p><b>${esc(event.client_name||'No client name')}</b><br>${esc(event.client_email||'')}</p><a class="btn" href="mailto:${esc(event.client_email||'')}">Email Client</a><hr><h3>Internal Notes</h3><div id="noteList">${w.notes.slice(-5).reverse().map(n=>`<div class="notice" style="margin-bottom:7px">${esc(n.body||n.text||'')}<br><small>${n.created_at?new Date(n.created_at).toLocaleString():''}</small></div>`).join('')||'<p class="muted">No notes.</p>'}</div><button class="btn" onclick="noteForm()">+ Note</button></div></aside></div>`}
function checklist(){const statuses=[['todo','To Do'],['in_progress','In Progress'],['waiting','Waiting'],['done','Done']];content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Planning Checklist</h2><p class="muted">Planner and client tasks stay on the event record.</p></div><button class="btn primary" onclick="taskForm()">+ Task</button></div><div class="task-board">${statuses.map(([s,l])=>`<div class="col"><h3>${l}</h3>${w.checklist.filter(x=>(x.done?'done':x.status||'todo')===s).map(x=>`<div class="task"><b>${esc(x.title||x.text||'Task')}</b><br><small>${esc(x.description||'')}</small><div style="margin:6px 0"><span class="badge">${esc(x.priority||'normal')}</span>${x.due_date?` <span class="badge">${WLP.fmtDate(x.due_date)}</span>`:''}</div><select onchange="setTaskStatus('${x.id}',this.value)"><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="waiting">Waiting</option><option value="done">Done</option></select><div style="margin-top:7px"><button class="btn" onclick="taskForm('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteTask('${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No tasks.</p>'}</div>`).join('')}</div></div>`;w.checklist.forEach(x=>{const sel=[...document.querySelectorAll('.task select')].find(s=>s.onchange?.toString().includes(x.id));if(sel)sel.value=x.done?'done':x.status||'todo'})}
function timeline(){const rows=[...w.timeline].sort((a,b)=>String(a.date||a.time||'').localeCompare(String(b.date||b.time||'')));const list=`<div class="timeline">${rows.map(x=>`<div class="timeitem"><div class="page-head"><div><b>${esc(x.title)}</b><br><small>${esc(x.date||x.time||'Date/time TBD')}${x.owner?' · '+esc(x.owner):''}</small></div><span class="badge">${esc(x.status||'planned')}</span></div>${x.notes?`<p>${esc(x.notes)}</p>`:''}<button class="btn" onclick="timelineForm('${x.id}')">Edit</button> <button class="btn danger" onclick="deleteTimeline('${x.id}')">Delete</button></div>`).join('')||'<div class="empty">No timeline items.</div>'}</div>`;const y=timelineMonth.getFullYear(),m=timelineMonth.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7,cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=last.getDate();d++)cells.push(new Date(y,m,d));const dayItems=d=>rows.filter(x=>{const raw=x.date||x.time;if(!raw)return false;const z=new Date(raw);return !Number.isNaN(z)&&z.getFullYear()===d.getFullYear()&&z.getMonth()===d.getMonth()&&z.getDate()===d.getDate()});const calendar=`<div class="page-head"><button class="btn" onclick="timelineMonth=new Date(${y},${m-1},1);render()">←</button><h3>${timelineMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="btn" onclick="timelineMonth=new Date(${y},${m+1},1);render()">→</button></div><div style="display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));overflow:auto;border:1px solid var(--border)">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div style="padding:7px;font-weight:800;background:#f3efe8">${x}</div>`).join('')}${cells.map(d=>d?`<div style="min-height:105px;padding:7px;border-top:1px solid var(--border);border-right:1px solid var(--border)"><b>${d.getDate()}</b>${dayItems(d).map(x=>`<div style="margin-top:5px;padding:5px;border-radius:8px;background:#eef3e8;font-size:12px">${esc(x.title)}</div>`).join('')}</div>`:`<div style="min-height:105px;background:#faf8f4;border-top:1px solid var(--border);border-right:1px solid var(--border)"></div>`).join('')}</div>`;content.innerHTML=`<div class="layout"><div class="card"><div class="page-head"><div><h2>Timeline & Run of Show</h2><p class="muted">Planning milestones and event-day timing in one sequence.</p></div><div><button class="btn ${timelineView==='list'?'primary':''}" onclick="timelineView='list';render()">List</button> <button class="btn ${timelineView==='calendar'?'primary':''}" onclick="timelineView='calendar';render()">Calendar</button> <button class="btn primary" onclick="timelineForm()">+ Timeline Item</button></div></div>${timelineView==='calendar'?calendar:list}</div><aside class="card"><h2>Calendar</h2><p class="muted">Export this event or open the full operating calendar.</p><a class="btn" href="/calendar.html">Open Calendar</a><hr><button class="btn" onclick="downloadEventIcs()">Download Event .ics</button></aside></div>`}
function budget(){const items=w.budget.items||[];content.innerHTML=`<div class="layout"><div class="card"><div class="page-head"><div><h2>Working Budget</h2><p class="muted">Use this for planning estimates; the Financial Center remains the legal/transaction ledger.</p></div><button class="btn primary" onclick="budgetForm()">+ Budget Item</button></div>${items.length?items.map(x=>`<div class="budget-row"><div><b>${esc(x.label||x.name||'Budget item')}</b><br><small>${esc(x.category||'')}</small></div><div>${money(x.approved??x.amount)}</div><div>${money(x.actual||0)}</div><div>${x.paid?'Paid':'Open'}</div><button class="btn" onclick="budgetForm('${x.id}')">Edit</button></div>`).join(''):'<div class="empty">No working budget items yet.</div>'}</div><aside class="card"><h2>Financial Ledger</h2><p class="muted">Contract, invoices, payments, expenses and adjustments live in Financial Center.</p><a class="btn primary" href="/financials.html?event_id=${id}">Open Financial Center</a></aside></div>`}
function messages(){content.innerHTML=`<div class="layout"><div class="card"><div class="page-head"><h2>Event Messages</h2><a class="btn" href="/communications.html?event_id=${id}">Open Communications Center</a></div>${[...w.messages].reverse().map(m=>`<div class="notice" style="margin-bottom:8px"><b>${m.sender==='client'?'Client':'Planner'}</b><br>${esc(m.body||'')}<br><small>${m.created_at?new Date(m.created_at).toLocaleString():''}</small></div>`).join('')||'<div class="empty">No workspace messages.</div>'}</div><aside class="card"><h2>Add Internal Message</h2><textarea id="msgText" placeholder="Workspace message or note"></textarea><button class="btn primary" style="margin-top:8px" onclick="addMessage()">Add</button></aside></div>`}
function clientAccess(){const p=w.portal_permissions;content.innerHTML=`<div class="layout"><div class="card"><div class="page-head"><div><h2>Client Portal Permissions</h2><p class="muted">Choose exactly what the client can see and do.</p></div><button class="btn primary" onclick="saveClientAccess()">Save Access</button></div><div class="grid cols-2">${[['overview','Overview'],['planning','Planning checklist'],['design','Design board'],['guests','Guests & RSVP'],['floorplan','Floor plan'],['questionnaires','Questionnaires'],['approvals','Approvals'],['financials','Financials'],['documents','Documents'],['messages','Messages'],['client_can_arrange','Client can arrange design items']].map(([k,l])=>`<label class="notice"><input type="checkbox" data-perm="${k}" ${p[k]!==false?'checked':''}> ${l}</label>`).join('')}</div></div><aside class="card"><h2>Portal Preview</h2><p class="muted">Open the exact shared client workspace.</p><a class="btn primary" target="_blank" href="/portal.html?token=${encodeURIComponent(event.client_portal_token||'')}">Open Client Portal</a></aside></div>`}
function modalOpen(t,h){modalTitle.textContent=t;modalBody.innerHTML=h;modal.hidden=false}closeModal.onclick=()=>modal.hidden=true;
function taskForm(tid=''){const x=w.checklist.find(a=>a.id===tid)||{};modalOpen(tid?'Edit Task':'Add Task',`<div class="form-grid"><div class="field full"><label>Task</label><input id="tTitle" value="${esc(x.title||'')}"></div><div class="field full"><label>Description</label><textarea id="tDesc">${esc(x.description||'')}</textarea></div><div class="field"><label>Due date</label><input id="tDue" type="date" value="${x.due_date||''}"></div><div class="field"><label>Owner</label><input id="tOwner" value="${esc(x.owner||'')}"></div><div class="field"><label>Priority</label><select id="tPri"><option>normal</option><option>high</option><option>urgent</option></select></div></div><button class="btn primary" id="saveTask" style="margin-top:12px">Save Task</button>`);const tTitle=document.getElementById('tTitle'),tDesc=document.getElementById('tDesc'),tDue=document.getElementById('tDue'),tOwner=document.getElementById('tOwner'),tPri=document.getElementById('tPri'),saveTask=document.getElementById('saveTask');tPri.value=x.priority||'normal';saveTask.onclick=()=>{if(!tTitle.value)return;let due=tDue.value||'';const m=String(due).match(/\d{4}-\d{2}-\d{2}/);if(m)due=m[0];Object.assign(x,{id:x.id||crypto.randomUUID(),title:tTitle.value,description:tDesc.value,due_date:due,owner:tOwner.value,priority:tPri.value,status:x.status||'todo'});if(!tid)w.checklist.push(x);modal.hidden=true;mark();render()}}
function setTaskStatus(tid,s){const x=w.checklist.find(a=>a.id===tid);if(!x)return;x.status=s;x.done=s==='done';mark();render()}function deleteTask(tid){if(!confirm('Delete this task?'))return;w.checklist=w.checklist.filter(x=>x.id!==tid);mark();render()}
function timelineForm(tid=''){const x=w.timeline.find(a=>a.id===tid)||{};modalOpen(tid?'Edit Timeline Item':'Add Timeline Item',`<div class="form-grid"><div class="field full"><label>Activity</label><input id="lTitle" value="${esc(x.title||'')}"></div><div class="field"><label>Date / time</label><input id="lDate" type="datetime-local" value="${String(x.date||x.time||'').slice(0,16)}"></div><div class="field"><label>Owner / vendor</label><input id="lOwner" value="${esc(x.owner||'')}"></div><div class="field"><label>Status</label><select id="lStatus"><option>planned</option><option>confirmed</option><option>done</option></select></div><div class="field full"><label>Notes</label><textarea id="lNotes">${esc(x.notes||'')}</textarea></div></div><button class="btn primary" id="saveTimeline" style="margin-top:12px">Save</button>`);const lTitle=document.getElementById('lTitle'),lDate=document.getElementById('lDate'),lOwner=document.getElementById('lOwner'),lStatus=document.getElementById('lStatus'),lNotes=document.getElementById('lNotes'),saveTimeline=document.getElementById('saveTimeline');lStatus.value=x.status||'planned';saveTimeline.onclick=()=>{if(!lTitle.value)return;Object.assign(x,{id:x.id||crypto.randomUUID(),title:lTitle.value,date:lDate.value,owner:lOwner.value,status:lStatus.value,notes:lNotes.value});if(!tid)w.timeline.push(x);modal.hidden=true;mark();render()}}
function deleteTimeline(tid){if(!confirm('Delete this timeline item?'))return;w.timeline=w.timeline.filter(x=>x.id!==tid);mark();render()}
function budgetForm(bid=''){const x=w.budget.items.find(a=>a.id===bid)||{};modalOpen(bid?'Edit Budget Item':'Add Budget Item',`<div class="form-grid"><div class="field full"><label>Item</label><input id="bLabel" value="${esc(x.label||'')}"></div><div class="field"><label>Category</label><input id="bCat" value="${esc(x.category||'')}"></div><div class="field"><label>Proposed</label><input id="bProposed" type="number" step=".01" value="${x.proposed??x.amount??''}"></div><div class="field"><label>Approved</label><input id="bApproved" type="number" step=".01" value="${x.approved??x.amount??''}"></div><div class="field"><label>Actual</label><input id="bActual" type="number" step=".01" value="${x.actual||''}"></div><label><input id="bPaid" type="checkbox" ${x.paid?'checked':''}> Paid</label></div><button class="btn primary" id="saveBudget" style="margin-top:12px">Save</button>`);const bLabel=document.getElementById('bLabel'),bCat=document.getElementById('bCat'),bProposed=document.getElementById('bProposed'),bApproved=document.getElementById('bApproved'),bActual=document.getElementById('bActual'),bPaid=document.getElementById('bPaid'),saveBudget=document.getElementById('saveBudget');saveBudget.onclick=()=>{if(!bLabel.value)return;Object.assign(x,{id:x.id||crypto.randomUUID(),label:bLabel.value,category:bCat.value,proposed:Number(bProposed.value)||0,approved:Number(bApproved.value)||0,actual:Number(bActual.value)||0,paid:bPaid.checked});if(!bid)w.budget.items.push(x);modal.hidden=true;mark();render()}}
function noteForm(){modalOpen('Add Internal Note',`<textarea id="nBody" placeholder="Internal note"></textarea><button class="btn primary" id="saveNote" style="margin-top:10px">Save Note</button>`);const nBody=document.getElementById('nBody'),saveNote=document.getElementById('saveNote');saveNote.onclick=()=>{if(!nBody.value.trim())return;w.notes.push({id:crypto.randomUUID(),body:nBody.value.trim(),created_at:new Date().toISOString()});modal.hidden=true;mark();render()}}
function addMessage(){const msgText=document.getElementById('msgText');if(!msgText?.value.trim())return;w.messages.push({id:crypto.randomUUID(),sender:'planner',body:msgText.value.trim(),created_at:new Date().toISOString()});mark();render()}function saveClientAccess(){document.querySelectorAll('[data-perm]').forEach(x=>w.portal_permissions[x.dataset.perm]=x.checked);mark();save()}
let autosaveTimer=null;function mark(){dirty=true;saveState.textContent='Unsaved changes';localStorage.setItem(localDraftKey,JSON.stringify({saved_at:Date.now(),workspace:w}));clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>save({quiet:true}),2500)}async function save(){if(!dirty)return;saveBtn.disabled=true;saveState.textContent='Saving…';try{await WLP.api('events',{method:'PATCH',body:JSON.stringify({id:event.id,workspace_data:w})});dirty=false;localStorage.removeItem(localDraftKey);saveState.textContent='Saved securely'}catch(e){saveState.textContent='cloud save failed';throw e}finally{saveBtn.disabled=false}}saveBtn.onclick=()=>save();window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)save().catch(()=>{})});
function downloadEventIcs(){if(!event.event_date)return alert('Add an event date first.');const d=event.event_date.replaceAll('-',''),body=['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','UID:'+crypto.randomUUID()+'@celebrationsuite','DTSTART:'+d+'T090000','SUMMARY:'+String(event.title||'Event').replace(/,/g,'\\,'),'LOCATION:'+String(event.venue||'').replace(/,/g,'\\,'),'END:VEVENT','END:VCALENDAR'].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download=(event.title||'event')+'.ics';a.click();URL.revokeObjectURL(a.href)}
window.taskForm=taskForm;window.setTaskStatus=setTaskStatus;window.deleteTask=deleteTask;window.timelineForm=timelineForm;window.deleteTimeline=deleteTimeline;window.budgetForm=budgetForm;window.noteForm=noteForm;window.addMessage=addMessage;window.saveClientAccess=saveClientAccess;window.downloadEventIcs=downloadEventIcs;async function boot(){try{await load()}catch(err){console.error('Event workspace failed to load',err);eventTitle.textContent='Could not load event';titleEl.textContent='Event Workspace';meta.textContent='The event workspace could not finish loading.';content.innerHTML=`<div class="card"><h2>Could not load this event</h2><p class="muted">${esc(err?.message||'Unknown workspace error')}</p><button class="btn primary" id="retryWorkspace">Retry</button> <a class="btn" href="/app.html">Back to Events</a></div>`;document.getElementById('retryWorkspace')?.addEventListener('click',()=>window.location.reload())}}boot();
</script></body></html>
