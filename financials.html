<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Center</title><link rel="stylesheet" href="/assets/app.css"><style>
.page{max-width:1500px;margin:auto;padding:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.event-select{min-width:360px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px}.kpi small{display:block;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.kpi b{display:block;font-size:1.35rem;margin-top:4px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:var(--brand-primary,#52644d);color:#fff}.ledger{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.table-wrap{overflow:auto}.table td,.table th{vertical-align:top}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:100}.modal[hidden]{display:none}.modal-card{width:min(820px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:.76rem;font-weight:800;margin-bottom:5px}.split{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.ledger{grid-template-columns:1fr}.event-select{min-width:0}.form-grid,.split{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}@media(max-width:650px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="topbar"><div class="brand"><div class="brand-title" id="biz">Financial Center</div><small>Contracts, invoices, payments and event costs</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn" id="newPayment">Record Payment</button><button class="btn" id="newExpense">+ Expense</button><button class="btn primary" id="newInvoice">+ Invoice</button></div></header><main class="page"><div class="hero"><div><div class="eyebrow">EVENT FINANCIALS</div><h1>Financial Center</h1><p class="muted">The complete event ledger, matching the original Sage workflow.</p></div><div class="event-select"><label class="muted">EVENT</label><select id="eventSel"></select></div></div><div id="kpis" class="kpis"></div><div class="tabs" id="tabs"></div><section id="content"></section></main>
<div class="modal" id="modal" hidden><div class="modal-card"><div class="page-head"><h2 id="modalTitle">Record</h2><button class="btn" id="closeModal">Close</button></div><div id="modalBody"></div></div></div><script src="/assets/app.js"></script><script>
let D={events:[],invoices:[],payments:[],expenses:[],adjustments:[]},active='overview',selected='';const requested=new URLSearchParams(location.search).get('event_id');const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'}),$=WLP.$,esc=WLP.esc;const tabsDef=[['overview','Overview'],['invoices','Invoices'],['payments','Payments'],['expenses','Expenses'],['adjustments','Adjustments']];
async function load(){const b=await WLP.api('bootstrap');biz.textContent=(b.tenant.business_name||'Celebration Suite')+' · Financial Center';D=await WLP.api('financials?type=workspace');eventSel.innerHTML=(D.events||[]).map(e=>`<option value="${e.id}">${esc(e.event_date||'TBD')} — ${esc(e.title)} — ${esc(e.client_name||'Client')}</option>`).join('');if(requested&&D.events.some(e=>e.id===requested))selected=requested;else selected=selected&&D.events.some(e=>e.id===selected)?selected:D.events?.[0]?.id||'';eventSel.value=selected;render()}
function E(){return D.events.find(e=>e.id===selected)||{}}function inv(){return D.invoices.filter(x=>x.event_id===selected)}function pays(){const ids=new Set(inv().map(x=>x.id));return D.payments.filter(x=>ids.has(x.invoice_id))}function exps(){return D.expenses.filter(x=>x.event_id===selected)}function adjs(){return D.adjustments.filter(x=>x.event_id===selected)}function calc(){const e=E(),invoices=inv().filter(x=>x.status!=='void'),billed=invoices.reduce((s,x)=>s+Number(x.amount||0),0),paid=pays().reduce((s,x)=>s+Number(x.amount||0),0),business=exps().filter(x=>!x.client_funded&&x.status!=='void').reduce((s,x)=>s+Number(x.actual_amount||x.estimated_amount||0),0),decor=exps().filter(x=>x.client_funded&&x.status!=='void').reduce((s,x)=>s+Number(x.actual_amount||x.estimated_amount||0),0),adj=adjs().reduce((s,a)=>s+(['fee','tax'].includes(a.type)?Number(a.amount||0):-Number(a.amount||0)),0);return{service:Number(e.service_fee||0),decorBudget:Number(e.client_decor_budget||0),contract:Number(e.contract_total||0),billed,paid,balance:Math.max(0,billed-paid),business,decor,adj,profit:Number(e.service_fee||0)-business+adj}}
function render(){tabs.innerHTML=tabsDef.map(([k,l])=>`<button class="btn ${active===k?'active':''}" onclick="active='${k}';render()">${l}</button>`).join('');const c=calc();kpis.innerHTML=`<div class="kpi"><small>Contract</small><b>${money(c.contract)}</b></div><div class="kpi"><small>Collected</small><b>${money(c.paid)}</b></div><div class="kpi"><small>Outstanding</small><b>${money(c.balance)}</b></div><div class="kpi"><small>Business costs</small><b>${money(c.business)}</b></div><div class="kpi"><small>Décor spent</small><b>${money(c.decor)}</b></div><div class="kpi"><small>Service profit</small><b>${money(c.profit)}</b></div>`;if(active==='overview')renderOverview();if(active==='invoices')renderInvoices();if(active==='payments')renderPayments();if(active==='expenses')renderExpenses();if(active==='adjustments')renderAdjustments()}
function renderOverview(){const e=E(),c=calc();content.innerHTML=`<div class="ledger"><div class="card"><div class="page-head"><div><h2>Contract Breakdown</h2><p class="muted">Keep service/labor separate from the client-funded non-reusable décor allowance.</p></div><button class="btn primary" onclick="saveContract()">Save Contract</button></div><div class="split"><div class="field"><label>Service Fee / Labor</label><input id="serviceFee" type="number" step=".01" value="${c.service}"></div><div class="field"><label>Decor Allowance (client-funded)</label><input id="decorBudget" type="number" step=".01" value="${c.decorBudget}"></div></div><div class="notice" style="margin-top:12px"><b>Total contract: ${money(c.service+c.decorBudget)}</b><br><span class="muted">Décor remaining: ${money(Math.max(0,c.decorBudget-c.decor))} · Estimated service profit: ${money(c.profit)}</span></div></div><aside class="card"><h2>${esc(e.title||'Event')}</h2><p>${esc(e.client_name||'')}</p><p>${esc(e.client_email||'')}</p><p>${WLP.fmtDate(e.event_date)}${e.venue?' · '+esc(e.venue):''}</p><hr><button class="btn" onclick="newAdjustmentForm()">+ Adjustment</button></aside></div><div class="grid cols-2" style="margin-top:16px"><div class="card"><h2>Recent Invoices</h2>${inv().slice(0,5).map(invoiceRow).join('')||'<div class="empty">No invoices yet.</div>'}</div><div class="card"><h2>Recent Expenses</h2>${exps().slice(0,5).map(x=>`<p><b>${esc(x.description)}</b><br><span class="muted">${esc(x.category||'Other')} · ${money(x.actual_amount||x.estimated_amount||0)} · ${x.client_funded?'client-funded décor':'business cost'}</span></p>`).join('')||'<div class="empty">No expenses yet.</div>'}</div></div>`}
function invoiceRow(i){return `<div class="notice" style="margin-bottom:8px"><div class="page-head"><div><b>${esc(i.invoice_number)}</b> · ${money(i.amount)}<br><small>${esc(i.status)}${i.due_date?' · due '+i.due_date:''}</small></div><div><button class="btn" onclick="copyPayLink('${i.id}')">Payment Link</button> <button class="btn" onclick="invoiceForm('${i.id}')">Edit</button></div></div></div>`}
function renderInvoices(){content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Invoices</h2><p class="muted">Draft, send, collect and reconcile client invoices.</p></div><button class="btn primary" onclick="invoiceForm()">+ Invoice</button></div>${inv().length?inv().map(invoiceRow).join(''):'<div class="empty">No invoices yet.</div>'}</div>`}
function renderPayments(){content.innerHTML=`<div class="card"><div class="page-head"><h2>Payments</h2><button class="btn primary" onclick="paymentForm()">Record Payment</button></div>${pays().length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Invoice</th><th>Method</th><th>Reference</th><th>Amount</th><th></th></tr></thead><tbody>${pays().map(p=>{const i=D.invoices.find(x=>x.id===p.invoice_id);return`<tr><td>${new Date(p.paid_at).toLocaleDateString()}</td><td>${esc(i?.invoice_number||'')}</td><td>${esc(p.method||'manual')}</td><td>${esc(p.reference||'')}</td><td>${money(p.amount)}</td><td><button class="btn danger" onclick="delRec('payment','${p.id}')">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No payments recorded.</div>'}</div>`}
function renderExpenses(){content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Expenses</h2><p class="muted">Track business costs separately from client-funded décor spending.</p></div><button class="btn primary" onclick="expenseForm()">+ Expense</button></div>${exps().length?`<div class="table-wrap"><table class="table"><thead><tr><th>Expense</th><th>Funding</th><th>Due</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${exps().map(x=>`<tr><td><b>${esc(x.description)}</b><br><small>${esc(x.category||'Other')}</small></td><td>${x.client_funded?'Client décor':'Business'}</td><td>${x.due_date||'—'}</td><td>${money(x.actual_amount||x.estimated_amount||0)}</td><td>${esc(x.status)}</td><td><button class="btn" onclick="expenseForm('${x.id}')">Edit</button> <button class="btn danger" onclick="delRec('expense','${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses yet.</div>'}</div>`}
function renderAdjustments(){content.innerHTML=`<div class="card"><div class="page-head"><div><h2>Adjustments</h2><p class="muted">Discounts, credits, refunds, fees and taxes.</p></div><button class="btn primary" onclick="newAdjustmentForm()">+ Adjustment</button></div>${adjs().length?adjs().map(a=>`<div class="notice" style="margin-bottom:8px"><b>${esc(a.label)}</b> · ${esc(a.type)} · ${money(a.amount)} <button class="btn danger" style="float:right" onclick="delRec('adjustment','${a.id}')">Delete</button><br><small>${esc(a.notes||'')}</small></div>`).join(''):'<div class="empty">No adjustments.</div>'}</div>`}
async function saveContract(){await WLP.api('financials?type=contract',{method:'POST',body:JSON.stringify({event_id:selected,service_fee:serviceFee.value,client_decor_budget:decorBudget.value})});await load();alert('Contract breakdown saved.')}
function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.hidden=false}closeModal.onclick=()=>modal.hidden=true;
function invoiceForm(id=''){const i=D.invoices.find(x=>x.id===id)||{},e=E();openModal(id?'Edit Invoice':'Create Invoice',`<div class="form-grid"><div class="field full"><label>Invoice number</label><input id="fNumber" value="${esc(i.invoice_number||'')}"></div><div class="field full"><label>Client</label><input id="fClient" value="${esc(i.client_name||e.client_name||'')}"></div><div class="field full"><label>Email</label><input id="fEmail" value="${esc(i.client_email||e.client_email||'')}"></div><div class="field"><label>Amount</label><input id="fAmount" type="number" step=".01" value="${i.amount||''}"></div><div class="field"><label>Due date</label><input id="fDue" type="date" value="${i.due_date||''}"></div><div class="field"><label>Status</label><select id="fStatus"><option>draft</option><option>sent</option><option>partial</option><option>paid</option><option>overdue</option><option>void</option></select></div><div class="field full"><label>Notes</label><textarea id="fNotes">${esc(i.notes||'')}</textarea></div></div><button class="btn primary" id="saveInvoiceForm" style="margin-top:14px">Save Invoice</button>`);fStatus.value=i.status||'draft';saveInvoiceForm.onclick=async()=>{const d={id:i.id,event_id:selected,invoice_number:fNumber.value,client_name:fClient.value,client_email:fEmail.value,amount:fAmount.value,due_date:fDue.value,status:fStatus.value,notes:fNotes.value};if(i.id)await WLP.api('financials?type=invoice',{method:'PATCH',body:JSON.stringify(d)});else await WLP.api('financials?type=invoice',{method:'POST',body:JSON.stringify(d)});modal.hidden=true;load()}}
function paymentForm(){const options=inv().filter(x=>x.status!=='void').map(i=>`<option value="${i.id}">${esc(i.invoice_number)} — ${money(i.amount)}</option>`).join('');openModal('Record Payment',`<div class="form-grid"><div class="field full"><label>Invoice</label><select id="pInvoice">${options}</select></div><div class="field"><label>Amount</label><input id="pAmount" type="number" step=".01"></div><div class="field"><label>Paid on</label><input id="pDate" type="datetime-local"></div><div class="field"><label>Method</label><select id="pMethod"><option>card</option><option>cash</option><option>check</option><option>ACH</option><option>Zelle</option><option>manual</option></select></div><div class="field"><label>Reference</label><input id="pRef"></div></div><button class="btn primary" id="savePaymentForm" style="margin-top:14px">Record Payment</button>`);pDate.value=new Date().toISOString().slice(0,16);savePaymentForm.onclick=async()=>{await WLP.api('financials?type=payment',{method:'POST',body:JSON.stringify({invoice_id:pInvoice.value,amount:pAmount.value,paid_at:pDate.value,method:pMethod.value,reference:pRef.value})});modal.hidden=true;load()}}
function expenseForm(id=''){const x=D.expenses.find(e=>e.id===id)||{};openModal(id?'Edit Expense':'Add Expense',`<div class="form-grid"><div class="field"><label>Category</label><select id="xCategory">${['Venue','Catering','Florals','Rentals','Entertainment','Photography','Transportation','Staffing','Supplies','Travel','Marketing','Other'].map(v=>`<option>${v}</option>`).join('')}</select></div><div class="field"><label>Funding</label><select id="xFunding"><option value="business">Business / service cost</option><option value="decor">Client-funded non-reusable décor</option></select></div><div class="field full"><label>Description</label><input id="xDesc" value="${esc(x.description||'')}"></div><div class="field"><label>Estimated</label><input id="xEst" type="number" step=".01" value="${x.estimated_amount||''}"></div><div class="field"><label>Actual</label><input id="xActual" type="number" step=".01" value="${x.actual_amount||''}"></div><div class="field"><label>Status</label><select id="xStatus"><option>planned</option><option>committed</option><option>paid</option><option>void</option></select></div><div class="field"><label>Due date</label><input id="xDue" type="date" value="${x.due_date||''}"></div><div class="field full"><label>Notes</label><textarea id="xNotes">${esc(x.notes||'')}</textarea></div></div><button class="btn primary" id="saveExpenseForm" style="margin-top:14px">Save Expense</button>`);xCategory.value=x.category||'Other';xFunding.value=x.client_funded?'decor':'business';xStatus.value=x.status||'planned';saveExpenseForm.onclick=async()=>{const d={id:x.id,event_id:selected,category:xCategory.value,description:xDesc.value,estimated_amount:xEst.value,actual_amount:xActual.value,status:xStatus.value,due_date:xDue.value,notes:xNotes.value,client_funded:xFunding.value==='decor'};await WLP.api('financials?type=expense',{method:x.id?'PATCH':'POST',body:JSON.stringify(d)});modal.hidden=true;load()}}
function newAdjustmentForm(){openModal('Add Adjustment',`<div class="form-grid"><div class="field"><label>Type</label><select id="aType"><option>discount</option><option>refund</option><option>fee</option><option>credit</option><option>tax</option></select></div><div class="field"><label>Amount</label><input id="aAmount" type="number" step=".01"></div><div class="field full"><label>Label</label><input id="aLabel"></div><div class="field full"><label>Notes</label><textarea id="aNotes"></textarea></div></div><button class="btn primary" id="saveAdjustment" style="margin-top:14px">Save Adjustment</button>`);saveAdjustment.onclick=async()=>{await WLP.api('financials?type=adjustment',{method:'POST',body:JSON.stringify({event_id:selected,adjustment_type:aType.value,amount:aAmount.value,label:aLabel.value,notes:aNotes.value})});modal.hidden=true;load()}}
async function copyPayLink(id){try{const r=await WLP.api('invoice-checkout-create',{method:'POST',body:JSON.stringify({invoice_id:id})});await navigator.clipboard.writeText(r.url);alert('Secure Stripe payment link copied.')}catch(e){alert(e.message)}}async function delRec(type,id){if(!confirm('Delete this financial record?'))return;await WLP.api(`financials?type=${type}&id=${encodeURIComponent(id)}`,{method:'DELETE'});load()}window.invoiceForm=invoiceForm;window.paymentForm=paymentForm;window.expenseForm=expenseForm;window.newAdjustmentForm=newAdjustmentForm;window.copyPayLink=copyPayLink;window.delRec=delRec;newInvoice.onclick=()=>invoiceForm();newPayment.onclick=paymentForm;newExpense.onclick=()=>expenseForm();eventSel.onchange=()=>{selected=eventSel.value;render()};load().catch(()=>location='/login.html');
</script></body></html>
