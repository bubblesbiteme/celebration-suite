<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Financial Center</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">$</span></div><div><div class="brand-title">Financial Center</div><small>Invoices & payments</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="newInvoice">+ Invoice</button></div></header><main><div class="grid cols-4"><div class="card stat"><span class="muted">Billed</span><strong id="billed">$0</strong></div><div class="card stat"><span class="muted">Collected</span><strong id="collected">$0</strong></div><div class="card stat"><span class="muted">Outstanding</span><strong id="outstanding">$0</strong></div><div class="card stat"><span class="muted">Overdue</span><strong id="overdue">$0</strong></div></div><div class="page-head" style="margin-top:24px"><div><h1>Invoices</h1></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Due</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="invoiceRows"></tbody></table></div></main>
<div id="invoiceModal" class="modal"><div class="modal-card"><button class="btn close" onclick="invoiceModal.classList.remove('open')">Close</button><h2>Create Invoice</h2><form id="invoiceForm" class="grid"><div class="grid cols-2"><div class="field"><label>Invoice number</label><input name="invoice_number" placeholder="Auto if blank"></div><div class="field"><label>Due date</label><input name="due_date" type="date"></div></div><div class="grid cols-2"><div class="field"><label>Client name</label><input name="client_name"></div><div class="field"><label>Client email</label><input name="client_email" type="email"></div></div><div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Create Invoice</button><div id="invoiceMsg"></div></form></div></div>
<div id="paymentModal" class="modal"><div class="modal-card"><button class="btn close" onclick="paymentModal.classList.remove('open')">Close</button><h2>Record Payment</h2><form id="paymentForm" class="grid"><input type="hidden" name="invoice_id"><div class="field"><label>Amount</label><input name="amount" type="number" step="0.01" required></div><div class="field"><label>Method</label><input name="method" placeholder="Card, check, cash, bank transfer…"></div><div class="field"><label>Reference</label><input name="reference"></div><button class="btn primary">Record Payment</button><div id="paymentMsg"></div></form></div></div>
<script src="/assets/app.js"></script><script>let invoices=[];const cash=v=>'$'+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});function render(){invoiceRows.innerHTML=invoices.length?invoices.map(i=>`<tr><td><strong>${WLP.esc(i.invoice_number)}</strong></td><td>${WLP.esc(i.client_name||'—')}<br><small>${WLP.esc(i.client_email||'')}</small></td><td>${WLP.fmtDate(i.due_date)}</td><td class="money">${cash(i.amount)}</td><td><span class="badge status-${i.status}">${WLP.esc(i.status)}</span></td><td><div class="toolbar"><button class="btn" onclick="recordPayment('${i.id}',${Number(i.amount||0)})">Payment</button><button class="btn primary" onclick="stripeLink('${i.id}')">Stripe Link</button>${i.stripe_payment_url?`<button class="btn" onclick="copyUrl('${encodeURIComponent(i.stripe_payment_url)}')">Copy Link</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6" class="muted">No invoices yet.</td></tr>'}async function load(){const [s,l]=await Promise.all([WLP.api('financials'),WLP.api('financials?type=invoices')]);for(const [id,v] of Object.entries({billed:s.summary.billed,collected:s.summary.collected,outstanding:s.summary.outstanding,overdue:s.summary.overdue}))document.getElementById(id).textContent=cash(v);invoices=l.invoices||[];render()}newInvoice.onclick=()=>invoiceModal.classList.add('open');invoiceForm.onsubmit=async e=>{e.preventDefault();invoiceMsg.textContent='Creating…';try{await WLP.api('financials?type=invoice',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(invoiceForm)))});invoiceModal.classList.remove('open');invoiceForm.reset();await load()}catch(err){invoiceMsg.textContent=err.message}};function recordPayment(id,amount){paymentForm.invoice_id.value=id;paymentForm.amount.value=amount;paymentModal.classList.add('open')}paymentForm.onsubmit=async e=>{e.preventDefault();paymentMsg.textContent='Saving…';try{await WLP.api('financials?type=payment',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(paymentForm)))});paymentModal.classList.remove('open');paymentForm.reset();await load()}catch(err){paymentMsg.textContent=err.message}};async function stripeLink(id){try{const d=await WLP.api('invoice-checkout-create',{method:'POST',body:JSON.stringify({invoice_id:id})});await navigator.clipboard.writeText(d.url);alert('Stripe payment link created and copied.')}catch(e){alert(e.message)}}function copyUrl(v){navigator.clipboard.writeText(decodeURIComponent(v));alert('Payment link copied.')}async function verifyStripeReturn(){const sid=new URLSearchParams(location.search).get('stripe_session');if(!sid)return;try{const d=await WLP.api('invoice-checkout-verify?session_id='+encodeURIComponent(sid));if(d.paid){history.replaceState({},'',location.pathname);alert('Stripe payment verified and recorded.')}}catch(e){alert('Stripe verification: '+e.message)}}verifyStripeReturn().then(load).catch(e=>{alert(e.message);location='/app.html'});</script><script src="/assets/ui-v019.js"></script></body></html>
