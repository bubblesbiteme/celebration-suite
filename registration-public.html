<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Event Tickets</title><link rel="stylesheet" href="/assets/app.css"><style>.public-shell{max-width:900px}.ticket-choice{display:grid;grid-template-columns:1fr 110px;gap:14px;align-items:center;border:1px solid var(--cs-line);border-radius:18px;padding:16px;margin:10px 0}.attendee-card{border:1px dashed var(--cs-line);padding:14px;border-radius:16px;margin-top:10px}@media(max-width:650px){.ticket-choice{grid-template-columns:1fr}}</style></head><body><main class="public-shell"><section class="public-hero"><h1 id="title">Tickets</h1><p id="meta"></p><p id="desc"></p></section><section class="card" style="margin-top:16px"><h2>1. Choose tickets</h2><div id="types"></div><h2>2. Your information</h2><div class="grid cols-2"><div class="field"><label>Name</label><input id="buyerName"></div><div class="field"><label>Email</label><input id="buyerEmail" type="email"></div><div class="field" id="phoneWrap"><label>Phone</label><input id="buyerPhone"></div><div class="field" id="orgWrap"><label>Organization</label><input id="organization"></div><div class="field"><label>Promo code</label><input id="promo"></div></div><h2>3. Who is attending?</h2><div id="attendees"></div><button class="btn primary" style="margin-top:16px" onclick="checkout()">Continue</button><p id="msg" class="muted"></p></section></main><script src="/assets/app.js"></script><script>
const sp=new URLSearchParams(location.search),eventToken=sp.get('event_token'),token=sp.get('token');let data;const qs=()=>eventToken?'event_token='+encodeURIComponent(eventToken):'token='+encodeURIComponent(token);async function load(){try{data=await WLP.api('registration-public?'+qs());const s=data.settings,b=s.tenants?.branding||{};for(const[k,v]of [['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);title.textContent=s.title||s.tenant_events?.title||'Event Tickets';meta.textContent=[WLP.fmtDate(s.tenant_events?.event_date),s.tenant_events?.venue,s.tenants?.business_name].filter(Boolean).join(' · ');desc.textContent=s.description||'';phoneWrap.style.display=s.require_phone?'block':'none';orgWrap.style.display=s.collect_organization?'block':'none';types.innerHTML=data.types.map(t=>`<div class="ticket-choice"><div><strong>${WLP.esc(t.name)}</strong><br><small>${WLP.esc(t.description||'')}</small><div><b>${Number(t.price)>0?'$'+Number(t.price).toFixed(2):'Free'}</b>${t.remaining!=null?' · '+t.remaining+' left':''}</div></div><input data-type="${t.id}" type="number" min="0" max="${t.remaining==null?20:Math.min(20,t.remaining)}" value="0"></div>`).join('')||'<div class="empty">No tickets are available.</div>';document.querySelectorAll('[data-type]').forEach(x=>x.oninput=buildAttendees)}catch(e){msg.textContent=e.message}}function buildAttendees(){attendees.innerHTML='';for(const t of data.types){const n=Math.max(0,Number(document.querySelector(`[data-type="${t.id}"]`)?.value||0));for(let i=0;i<n;i++)attendees.insertAdjacentHTML('beforeend',`<div class="attendee-card" data-attendee data-type="${t.id}"><strong>${WLP.esc(t.name)} · Person ${i+1}</strong><div class="grid cols-2"><div class="field"><label>First name</label><input data-first></div><div class="field"><label>Last name</label><input data-last></div><div class="field"><label>Email</label><input data-email type="email"></div><div class="field"><label>Phone</label><input data-phone></div></div></div>`)}}async function checkout(){try{msg.textContent='';const rows=[...document.querySelectorAll('[data-attendee]')].map(x=>({registration_type_id:x.dataset.type,first_name:x.querySelector('[data-first]').value,last_name:x.querySelector('[data-last]').value,email:x.querySelector('[data-email]').value,phone:x.querySelector('[data-phone]').value}));if(!rows.length)throw new Error('Choose at least one ticket.');const d=await WLP.api('registration-public?'+qs(),{method:'POST',body:JSON.stringify({buyer_name:buyerName.value,buyer_email:buyerEmail.value,buyer_phone:buyerPhone.value,organization:organization.value,promo_code:promo.value,attendees:rows})});location.href=d.url}catch(e){msg.textContent=e.message}}load();
</script></body></html>
