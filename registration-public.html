<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Event Registration</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><section class="public-hero"><h1 id="title">Register</h1><p id="meta"></p></section><section class="card" style="margin-top:16px"><h2 id="typeName"></h2><p id="price"></p><p id="availability" class="muted"></p><div class="grid cols-2"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Quantity</label><input id="qty" type="number" min="1" max="20" value="1"></div></div><button class="btn primary" style="margin-top:14px" onclick="registerNow()">Continue</button><p id="msg" class="muted"></p></section></main><script src="/assets/app.js"></script><script>
const sp=new URLSearchParams(location.search),token=sp.get('token');let type;async function load(){const d=await WLP.api('registration-public?token='+encodeURIComponent(token));type=d.type;const t=type.tenants||{},b=t.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);title.textContent=type.tenant_events?.title||'Event Registration';meta.textContent=`${WLP.fmtDate(type.tenant_events?.event_date)} · ${type.tenant_events?.venue||''} · ${t.business_name||''}`;typeName.textContent=type.name;price.textContent=Number(type.price||0)>0?'$'+Number(type.price).toFixed(2)+' each':'Free registration';availability.textContent=d.remaining==null?'Registration open':d.remaining+' spaces remaining';if(sp.get('paid')&&sp.get('session_id')){try{const v=await WLP.api('registration-verify?session_id='+encodeURIComponent(sp.get('session_id')));if(v.ok)msg.textContent='Payment confirmed. Your registration is complete.'}catch(e){msg.textContent=e.message}}}async function registerNow(){try{const d=await WLP.api('registration-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({full_name:name.value,email:email.value,quantity:qty.value})});if(d.url)location=d.url;else msg.textContent='Registration complete.'}catch(e){msg.textContent=e.message}}load();
</script></body></html>
