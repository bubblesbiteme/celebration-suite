<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Proposals & Contracts</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">P</span></div><div><div class="brand-title">Proposals & Contracts</div><small>Sales documents</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="newProposal">+ Proposal</button><button class="btn" id="newContract">+ Contract</button></div></header><main><div class="grid cols-2"><section><div class="page-head"><div><h1>Proposals</h1></div></div><div id="proposalList" class="grid"></div></section><section><div class="page-head"><div><h1>Contracts</h1></div></div><div id="contractList" class="grid"></div></section></div></main>
<div id="proposalModal" class="modal"><div class="modal-card"><button class="btn close" onclick="proposalModal.classList.remove('open')">Close</button><h2>Create Proposal</h2><form id="proposalForm" class="grid"><div class="field"><label>Title</label><input name="title" required value="Event Planning Proposal"></div><div class="grid cols-2"><div class="field"><label>Client name</label><input name="client_name"></div><div class="field"><label>Client email</label><input name="client_email" type="email"></div></div><div class="grid cols-3"><div class="field"><label>Proposal total</label><input name="amount" type="number" step="0.01"></div><div class="field"><label>Deposit</label><input name="deposit_amount" type="number" step="0.01"></div><div class="field"><label>Valid until</label><input name="valid_until" type="date"></div></div><div class="field"><label>Summary</label><textarea name="summary"></textarea></div><div class="field"><label>Scope of work</label><textarea name="scope"></textarea></div><div class="field"><label>Terms</label><textarea name="terms"></textarea></div><button class="btn primary">Create Proposal</button><div id="proposalMsg"></div></form></div></div>
<div id="contractModal" class="modal"><div class="modal-card"><button class="btn close" onclick="contractModal.classList.remove('open')">Close</button><h2>Create Contract</h2><form id="contractForm" class="grid"><input type="hidden" name="proposal_id"><div class="field"><label>Title</label><input name="title" required value="Event Planning Agreement"></div><div class="grid cols-2"><div class="field"><label>Client name</label><input name="client_name"></div><div class="field"><label>Client email</label><input name="client_email" type="email"></div></div><div class="field"><label>Agreement</label><textarea name="body" style="min-height:300px" placeholder="Enter the complete agreement terms here."></textarea></div><button class="btn primary">Create Contract</button><div id="contractMsg"></div></form></div></div>
<script src="/assets/app.js"></script><script>let proposals=[],contracts=[];const status=x=>`<span class="badge status-${x}">${WLP.esc(x)}</span>`;function render(){proposalList.innerHTML=proposals.length?proposals.map(p=>`<div class="card"><div class="event-meta">${status(p.status)}</div><h3>${WLP.esc(p.title)}</h3><p>${WLP.esc(p.client_name||'No client')} · ${WLP.esc(p.client_email||'')}</p><strong>$${Number(p.amount||0).toFixed(2)}</strong><div class="toolbar"><button class="btn primary" onclick="sendProposal('${p.id}')">Send</button><button class="btn" onclick="copyLink('/proposal-public.html?token=${p.public_token}')">Copy Link</button><button class="btn accent" onclick="contractFromProposal('${p.id}')">Create Contract</button></div></div>`).join(''):'<div class="empty">No proposals yet.</div>';contractList.innerHTML=contracts.length?contracts.map(c=>`<div class="card"><div class="event-meta">${status(c.status)}</div><h3>${WLP.esc(c.title)}</h3><p>${WLP.esc(c.client_name||'No client')} · ${WLP.esc(c.client_email||'')}</p>${c.signed_at?`<p class="muted">Signed ${new Date(c.signed_at).toLocaleString()} by ${WLP.esc(c.signature_name||'')}</p>`:''}<div class="toolbar"><button class="btn primary" onclick="sendContract('${c.id}')">Send</button><button class="btn" onclick="copyLink('/contract-public.html?token=${c.public_token}')">Copy Link</button></div></div>`).join(''):'<div class="empty">No contracts yet.</div>'}async function load(){const [p,c]=await Promise.all([WLP.api('proposals'),WLP.api('contracts')]);proposals=p.proposals||[];contracts=c.contracts||[];render()}newProposal.onclick=()=>proposalModal.classList.add('open');newContract.onclick=()=>contractModal.classList.add('open');proposalForm.onsubmit=async e=>{e.preventDefault();proposalMsg.textContent='Creating…';try{await WLP.api('proposals',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(proposalForm)))});proposalModal.classList.remove('open');proposalForm.reset();await load()}catch(err){proposalMsg.textContent=err.message}};contractForm.onsubmit=async e=>{e.preventDefault();contractMsg.textContent='Creating…';try{await WLP.api('contracts',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(contractForm)))});contractModal.classList.remove('open');contractForm.reset();await load()}catch(err){contractMsg.textContent=err.message}};async function sendProposal(id){try{await WLP.api('proposals?action=send',{method:'POST',body:JSON.stringify({id})});alert('Proposal sent.');load()}catch(e){alert(e.message)}}async function sendContract(id){try{await WLP.api('contracts?action=send',{method:'POST',body:JSON.stringify({id})});alert('Contract sent.');load()}catch(e){alert(e.message)}}function copyLink(path){navigator.clipboard.writeText(location.origin+path);alert('Link copied.')}function contractFromProposal(id){const p=proposals.find(x=>x.id===id);contractForm.client_name.value=p.client_name||'';contractForm.client_email.value=p.client_email||'';contractForm.body.value=`This agreement incorporates the accepted proposal: ${p.title}.\n\nScope:\n${p.content?.scope||''}\n\nTerms:\n${p.content?.terms||''}`;contractForm.proposal_id.value=id;contractModal.classList.add('open')}load().catch(e=>{alert(e.message);location='/app.html'});</script><script src="/assets/ui-v019.js"></script></body></html>
