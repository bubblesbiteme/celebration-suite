<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Scheduling</title><link rel="stylesheet" href="/assets/app.css"><style>.shift{display:grid;grid-template-columns:1.5fr 1.2fr 1fr 1fr .8fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.staff-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:900px){.shift{grid-template-columns:1fr 1fr}.staff-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Staff Scheduling</div><small>People, shifts, availability and labor cost</small></div><div class="top-actions"><a class="btn" href="/team.html">Team</a><a class="btn" href="/time-tracking.html">Time</a><button class="btn primary" onclick="openShift()">+ Assign Staff</button></div></header><main style="max-width:1250px;margin:auto"><div class="page-head"><div><h1>Staff Operations</h1><p class="muted">Schedule the right people, catch conflicts, and keep labor cost synced to each event.</p></div></div><div class="grid cols-4" id="stats"></div><div class="staff-grid"><section class="card"><h2>Upcoming Shifts</h2><div id="shifts"></div></section><section class="card"><h2>Availability</h2><p class="muted">Block unavailable time or add an availability override.</p><div class="grid cols-2"><select id="avUser"></select><select id="avType"><option value="unavailable">Unavailable</option><option value="available_override">Available override</option></select><input id="avStart" type="datetime-local"><input id="avEnd" type="datetime-local"></div><button class="btn primary" style="margin-top:10px" onclick="addAvailability()">Add Availability Block</button><div id="availability" style="margin-top:12px"></div></section></div></main>
<div class="modal" id="shiftModal"><div class="modal-card"><button class="btn close" onclick="shiftModal.classList.remove('open')">Close</button><h2>Assign Staff to Event</h2><form id="shiftForm" class="grid"><input type="hidden" name="id"><div class="grid cols-2"><div class="field"><label>Event</label><select name="event_id" required></select></div><div class="field"><label>Staff member</label><select name="user_id" required></select></div><div class="field"><label>Role</label><input name="assignment_role" placeholder="Lead planner, setup, check-in…"></div><div class="field"><label>Hourly rate override</label><input name="hourly_rate_override" type="number" step="0.01" min="0"></div><div class="field"><label>Call time</label><input name="call_time" type="datetime-local"></div><div class="field"><label>Shift end</label><input name="shift_end" type="datetime-local"></div><div class="field"><label>Actual hours</label><input name="actual_hours" type="number" step="0.25" min="0"></div><label class="notice"><input name="is_lead" type="checkbox"> Lead for this event</label></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Save Shift</button><div id="shiftMsg"></div></form></div></div>
<script src="/assets/app.js"></script><script>let data={users:[],events:[],assignments:[],availability:[],expenses:[]};const dt=v=>v?new Date(v).toLocaleString():'—';const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});async function load(){data=await WLP.api('staff-operations');render()}function render(){const now=new Date(),up=data.assignments.filter(x=>!x.shift_end||new Date(x.shift_end)>=now);const labor=(data.expenses||[]).reduce((s,x)=>s+Number(x.actual_amount||x.estimated_amount||0),0);stats.innerHTML=`<div class="card stat"><small>Team</small><strong>${data.users.length}</strong></div><div class="card stat"><small>Upcoming shifts</small><strong>${up.length}</strong></div><div class="card stat"><small>Lead assignments</small><strong>${data.assignments.filter(x=>x.is_lead).length}</strong></div><div class="card stat"><small>Labor planned/actual</small><strong>${money(labor)}</strong></div>`;shifts.innerHTML=up.length?up.map(a=>`<div class="shift"><div><strong>${WLP.esc(a.tenant_users?.full_name||a.tenant_users?.email||'Staff')}</strong><small class="muted">${WLP.esc(a.assignment_role||'Team')}</small></div><div>${WLP.esc(a.tenant_events?.title||'Event')}</div><div>${dt(a.call_time)}</div><div>${dt(a.shift_end)}</div><div>${a.actual_hours||a.planned_hours||'—'} hrs</div><button class="btn" onclick="editShift('${a.id}')">Edit</button></div>`).join(''):'<div class="empty">No staff shifts yet.</div>';avUser.innerHTML=data.users.map(u=>`<option value="${u.id}">${WLP.esc(u.full_name||u.email)}</option>`).join('');availability.innerHTML=data.availability.length?data.availability.map(x=>`<div class="notice"><strong>${WLP.esc(data.users.find(u=>u.id===x.user_id)?.full_name||'Staff')}</strong> · ${WLP.esc(x.availability_type)}<br><small>${dt(x.starts_at)} → ${dt(x.ends_at)}</small> <button class="btn" onclick="removeAvailability('${x.id}')">Remove</button></div>`).join(''):'<div class="empty">No availability blocks.</div>'}function openShift(a){shiftForm.reset();shiftForm.elements.id.value=a?.id||'';shiftForm.elements.event_id.innerHTML=data.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)} ${e.event_date?'· '+WLP.fmtDate(e.event_date):''}</option>`).join('');shiftForm.elements.user_id.innerHTML=data.users.map(u=>`<option value="${u.id}">${WLP.esc(u.full_name||u.email)}</option>`).join('');if(a){for(const k of ['event_id','user_id','assignment_role','hourly_rate_override','actual_hours','notes'])if(shiftForm.elements[k])shiftForm.elements[k].value=a[k]??'';for(const k of ['call_time','shift_end'])shiftForm.elements[k].value=a[k]?new Date(a[k]).toISOString().slice(0,16):'';shiftForm.elements.is_lead.checked=!!a.is_lead}shiftModal.classList.add('open')}window.editShift=id=>openShift(data.assignments.find(x=>x.id===id));shiftForm.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(shiftForm));d.is_lead=shiftForm.elements.is_lead.checked;d.call_time=d.call_time?new Date(d.call_time).toISOString():null;d.shift_end=d.shift_end?new Date(d.shift_end).toISOString():null;try{let r=await WLP.api('staff-operations?action=assignment',{method:d.id?'PATCH':'POST',body:JSON.stringify(d)});if(r.needs_override&&confirm((r.conflicts||[]).map(x=>x.message).join('\n')+'\n\nAssign anyway?')){d.conflict_override=true;r=await WLP.api('staff-operations?action=assignment',{method:d.id?'PATCH':'POST',body:JSON.stringify(d)})}shiftModal.classList.remove('open');await load()}catch(err){shiftMsg.textContent=err.message}};async function addAvailability(){if(!avStart.value||!avEnd.value)return alert('Choose a start and end.');await WLP.api('staff-operations?action=availability',{method:'POST',body:JSON.stringify({user_id:avUser.value,availability_type:avType.value,starts_at:new Date(avStart.value).toISOString(),ends_at:new Date(avEnd.value).toISOString()})});await load()}window.removeAvailability=async id=>{await WLP.api('staff-operations?action=availability&id='+encodeURIComponent(id),{method:'DELETE'});load()};load().catch(()=>location='/login.html');</script><script src="/assets/ui-v019.js"></script></body></html>
