<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory Reservation Calendar</title><link rel="stylesheet" href="/assets/app.css"><style>.cal{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow:auto}.day{min-height:150px}.res{padding:7px;border-radius:10px;background:#edf2e8;margin:5px 0;font-size:12px}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Inventory Calendar</div><small>See where every item is committed</small></div><div class="top-actions"><a class="btn" href="/inventory.html">Inventory</a><a class="btn primary" href="/inventory-scan.html">Scan QR</a></div></header><main><div class="page-head"><div><h1>Reservation Calendar</h1><p class="muted">Prevent double-booking by seeing event reservations by date.</p></div><div class="toolbar"><input type="month" id="month"><input id="search" placeholder="Search item or event"></div></div><div class="cal" id="calendar"></div></main><script src="/assets/app.js"></script><script>let data={events:[],reservations:[],items:[]};const itemMap=()=>Object.fromEntries(data.items.map(x=>[x.id,x])),eventMap=()=>Object.fromEntries(data.events.map(x=>[x.id,x]));async function load(){data=await WLP.api('inventory-operations?action=calendar');month.value=month.value||new Date().toISOString().slice(0,7);render()}function render(){const [y,m]=month.value.split('-').map(Number),days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay(),im=itemMap(),em=eventMap(),q=search.value.toLowerCase();let html='';for(let i=0;i<start;i++)html+='<div></div>';for(let d=1;d<=days;d++){const date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=data.events.filter(e=>e.event_date===date);const rows=data.reservations.filter(r=>events.some(e=>e.id===r.event_id)).filter(r=>!q||((im[r.inventory_item_id]?.name||'')+' '+(em[r.event_id]?.title||'')).toLowerCase().includes(q));html+=`<div class="card day"><strong>${d}</strong>${rows.map(r=>`<div class="res"><b>${WLP.esc(im[r.inventory_item_id]?.name||'Item')}</b> × ${r.quantity}<br>${WLP.esc(em[r.event_id]?.title||'Event')}</div>`).join('')}</div>`}calendar.innerHTML=html}month.onchange=render;search.oninput=render;load().catch(()=>location='/login.html');</script><script src="/assets/ui-v019.js"></script></body></html>
