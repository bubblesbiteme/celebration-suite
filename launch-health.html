<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Launch Health | Celebration Suite</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt="Celebration Suite"></div><div><div class="brand-title">Celebration Suite</div><small>Launch Health</small></div></div><div class="top-actions"><a class="btn" href="/platform-admin.html">Platform Admin</a></div></header><main style="max-width:1000px;margin:auto"><div class="page-head"><div><h1>Launch Health</h1><p class="muted">Safe configuration checks only. No credentials or secret values are displayed.</p></div><button class="btn primary" id="refresh">Refresh</button></div><div id="summary" class="notice">Checking…</div><div id="grid" class="grid cols-3" style="margin-top:16px"></div></main><script src="/assets/app.js"></script><script>const labels={site_url:'Site URL',supabase_url:'Supabase URL',supabase_service_key:'Supabase server key',supabase_connection:'Supabase connection',session_secret:'Session security',integration_encryption_key:'Integration encryption',platform_admin_key:'Owner recovery key',stripe_secret_key:'Stripe secret key',stripe_single_price:'Single Event price',stripe_monthly_price:'Monthly price',stripe_annual_price:'Annual price',stripe_webhook_secret:'Stripe webhook',google_client_id:'Google client ID',google_client_secret:'Google client secret',google_state_secret:'Google state security',platform_email:'Transactional email',support_email:'Support email'};async function load(){try{const r=await fetch('/.netlify/functions/launch-health',{credentials:'same-origin'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load health checks.');summary.className='notice '+(d.ok?'good':'warn');summary.innerHTML=d.ok?'<strong>Launch configuration is complete.</strong>':'<strong>Setup still has missing items.</strong> Fix the red checks before public launch.';grid.innerHTML=Object.entries(d.checks).map(([k,v])=>`<div class="card"><div class="badge">${v?'READY':'NEEDS SETUP'}</div><h3>${WLP.esc(labels[k]||k)}</h3><p class="muted">${v?'Configured':'Missing or not reachable'}</p></div>`).join('')}catch(e){summary.className='notice warn';summary.textContent=e.message}}refresh.onclick=load;load();</script><script src="/assets/ui-v019.js"></script></body></html>
