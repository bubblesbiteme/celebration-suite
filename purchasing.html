<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Purchasing & Rental Gaps</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">P</span></div><div><div id="biz" class="brand-title">Purchasing & Rental Gaps</div><small>Source what inventory cannot cover</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addGap()">+ Add Need</button></div></header><main><div class="page-head"><div><h1>Purchasing & Rental Gaps</h1><p class="muted">Track what must be purchased, rented, or borrowed for upcoming events.</p></div><select id="eventFilter"><option value="">All events</option></select></div><div id="stats" class="kpi-row"></div><div class="card"><div class="toolbar"><select id="statusFilter"><option value="">All statuses</option><option>needed</option><option>quoted</option><option>ordered</option><option>received</option><option>cancelled</option></select><input id="search" placeholder="Search item or vendor"></div><div id="list" class="table-wrap"></div></div></main><script src="/assets/app.js"></script><script>
let tenant,events=[],gaps=[];const money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:'USD'}).format(Number(n||0));function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Purchasing'}function render(){const eid=eventFilter.value,s=statusFilter.value,q=search.value.toLowerCase();const rows=gaps.filter(x=>(!eid||x.event_id===eid)&&(!s||x.status===s)&&(!q||(x.item_name+' '+(x.vendor_name||'')).toLowerCase().includes(q)));const open=rows.filter(x=>!['received','cancelled'].includes(x.status)),est=open.reduce((a,x)=>a+Number(x.quantity_gap||0)*Number(x.estimated_unit_cost||0),0);stats.innerHTML=`<div class="card stat"><small>Open needs</small><strong>${open.length}</strong></div><div class="card stat"><small>Units short</small><strong>${open.reduce((a,x)=>a+Number(x.quantity_gap||0),0)}</strong></div><div class="card stat"><small>Estimated sourcing</small><strong>${money(est)}</strong></div>`;list.innerHTML=rows.length?`<table class="table"><thead><tr><th>Need</th><th>Event</th><th>Gap</th><th>Source</th><th>Estimate</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${WLP.esc(x.item_name)}</strong><br><small>${WLP.esc(x.category||'')} · ${WLP.esc(x.acquisition_type)}</small></td><td>${WLP.esc(events.find(e=>e.id===x.event_id)?.title||'General')}</td><td>${Number(x.quantity_gap||0)} / ${Number(x.quantity_needed||0)}</td><td>${WLP.esc(x.vendor_name||'TBD')}${x.source_url?`<br><a href="${WLP.esc(x.source_url)}" target="_blank">Source</a>`:''}</td><td>${money(Number(x.quantity_gap||0)*Number(x.estimated_unit_cost||0))}</td><td><span class="badge">${WLP.esc(x.status)}</span></td><td><button class="btn" onclick="editGap('${x.id}')">Update</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No sourcing gaps tracked.</div>'}async function addGap(x={}){const item_name=prompt('Item needed',x.item_name||'');if(!item_name)return;const quantity_needed=Number(prompt('Quantity needed',x.quantity_needed||1)||1),quantity_owned=Number(prompt('Quantity already owned',x.quantity_owned||0)||0),acquisition_type=prompt('Acquisition type: purchase, rental, borrow',x.acquisition_type||'purchase'),vendor_name=prompt('Vendor/source',x.vendor_name||''),estimated_unit_cost=Number(prompt('Estimated unit cost',x.estimated_unit_cost||0)||0),status=prompt('Status: needed, quoted, ordered, received, cancelled',x.status||'needed'),source_url=prompt('Source URL',x.source_url||'');const body={item_name,quantity_needed,quantity_owned,acquisition_type,vendor_name,estimated_unit_cost,status,source_url,event_id:eventFilter.value||x.event_id||null};if(x.id)body.id=x.id;await WLP.api('purchasing',{method:x.id?'PATCH':'POST',body:JSON.stringify(body)});await load()}function editGap(id){addGap(gaps.find(x=>x.id===id)||{})}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');gaps=(await WLP.api('purchasing')).gaps||[];render()}[eventFilter,statusFilter].forEach(x=>x.onchange=render);search.oninput=render;load();
</script><script src="/assets/ui-v019.js"></script></body></html>
