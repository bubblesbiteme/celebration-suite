<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Closeout & Archive</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Event Closeout & Archive</div><small>Financial snapshot, returns, reviews, follow-up and historical archive</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main><div class="page-head"><div><h1>Closeout Center</h1><p class="muted">Past events automatically enter closeout. Finalize only after inventory returns and vendor reviews are complete.</p></div><div class="toolbar"><select id="eventSel"></select><button class="btn primary" onclick="prepare()">Prepare / Refresh Closeout</button></div></div><div id="list" class="grid cols-2"></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let data={closeouts:[],events:[]};const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});function ev(id){return data.events.find(x=>x.id===id)||{}}function render(){eventSel.innerHTML='<option value="">Choose event</option>'+data.events.filter(e=>e.event_date&&new Date(e.event_date+'T12:00:00')<=new Date()).map(e=>`<option value="${e.id}">${WLP.esc(e.title)} · ${WLP.fmtDate(e.event_date)}</option>`).join('');if(requestedEvent&&[...eventSel.options].some(o=>o.value===requestedEvent))eventSel.value=requestedEvent;list.innerHTML=data.closeouts.length?data.closeouts.map(c=>{const e=ev(c.event_id),p=c.pnl_snapshot||{},g=c.gates||{};return`<div class="card"><div class="page-head"><div><span class="badge">${WLP.esc(c.status)}</span>${e.archived_at?'<span class="badge">Archived</span>':''}<h2>${WLP.esc(e.title||'Event')}</h2><p class="muted">${WLP.fmtDate(e.event_date)}</p></div><a class="btn" href="/event-book.html?event_id=${c.event_id}">Event Book</a></div><div class="grid cols-3"><div><small>Billed</small><strong>${money(p.billed)}</strong></div><div><small>Paid</small><strong>${money(p.paid)}</strong></div><div><small>Est. Profit</small><strong>${money(p.estimated_profit)}</strong></div></div><div style="margin:14px 0"><p>${g.inventory?'✅':'⬜'} Inventory returned & verified</p><p>${g.vendor_reviews?'✅':'⬜'} Vendor reviews complete</p><p>${g.financials?'✅':'⚠️'} Client balance ${g.financials?'settled':'still open'}</p><p>${c.review_request_sent?'✅':'⬜'} Client review requested</p><p>${c.portfolio_request_sent?'✅':'⬜'} Portfolio permission requested</p></div><div class="toolbar"><button class="btn" onclick="refreshOne('${c.id}')">Refresh Gates</button><button class="btn" onclick="follow('${c.id}','review')">Review Request</button><button class="btn" onclick="follow('${c.id}','portfolio')">Portfolio Request</button>${c.status!=='completed'?`<button class="btn primary" onclick="finalize('${c.id}')">Finalize & Archive</button>`:`<button class="btn" onclick="toggle('${c.id}','completed')">Reopen</button>`}</div></div>`}).join(''):'<div class="empty">No closeouts yet. Choose a past event and prepare its closeout.</div>'}async function load(){data=await WLP.api('closeouts');render()}async function prepare(){if(!eventSel.value)return alert('Choose a past event.');await WLP.api('closeouts?action=prepare',{method:'POST',body:JSON.stringify({event_id:eventSel.value})});await load()}async function refreshOne(id){await WLP.api('closeouts?action=refresh',{method:'PATCH',body:JSON.stringify({id})});await load()}async function follow(id,kind){await WLP.api('closeouts?action=followup',{method:'PATCH',body:JSON.stringify({id,kind})});await load()}async function finalize(id){if(!confirm('Finalize this closeout and archive the event?'))return;try{await WLP.api('closeouts?action=finalize',{method:'PATCH',body:JSON.stringify({id})});await load()}catch(e){alert(e.message)}}async function toggle(id){await WLP.api('closeouts',{method:'PATCH',body:JSON.stringify({id,status:'reopened'})});await load()}load().catch(()=>location='/login.html');
</script><script src="/assets/ui-v019.js"></script></body></html>
