<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Event Closeouts</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">EP</span></div><div><div class="brand-title">Event Closeout</div><small>Post-event archive & review</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/automations.html">Automations</a></div></header><main><div class="page-head"><div><h1>Closeouts</h1><p class="muted">Automatically completed events remain reviewable and can be reopened if work continues.</p></div></div><div id="list" class="grid cols-2"></div></main><script src="/assets/app.js"></script><script>
let data={};const event=id=>data.events.find(x=>x.id===id)||{};function render(){list.innerHTML=data.closeouts.length?data.closeouts.map(c=>{const e=event(c.event_id),s=c.summary||{};return `<div class="card"><div class="event-meta"><span class="badge">${WLP.esc(c.status)}</span><span class="badge">${e.event_date?WLP.fmtDate(e.event_date):'Date unavailable'}</span></div><h3>${WLP.esc(e.title||'Event')}</h3><div class="grid cols-3"><div><strong>${s.guest_count||0}</strong><br><span class="muted">Guests</span></div><div><strong>${s.registration_count||0}</strong><br><span class="muted">Registrations</span></div><div><strong>${s.vendor_count||0}</strong><br><span class="muted">Vendors</span></div></div><p class="muted">Completed ${c.completed_at?new Date(c.completed_at).toLocaleString():'—'}</p><button class="btn ${c.status==='reopened'?'primary':''}" onclick="toggle('${c.id}','${c.status}')">${c.status==='reopened'?'Mark Completed':'Reopen Event'}</button></div>`}).join(''):'<div class="empty">No automated closeouts yet.</div>'}async function load(){data=await WLP.api('closeouts');render()}window.toggle=async(id,status)=>{await WLP.api('closeouts',{method:'PATCH',body:JSON.stringify({id,status:status==='reopened'?'completed':'reopened'})});await load()};load();
</script></body></html>
