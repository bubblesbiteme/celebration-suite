<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document & Agreement Vault</title><link rel="stylesheet" href="/assets/app.css"><style>.doc-expired{border-left:5px solid #a76565}.doc-expiring{border-left:5px solid #d9be8c}.doc-locked:before{content:'🔒 ';}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Document & Agreement Vault</div><small>Permanent agreements, vendor compliance, client files and event records</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main><div class="page-head"><div><h1>Document & Agreement Vault</h1><p class="muted">Upload files, manage versions, track expiration dates, lock signed records, and control client visibility.</p></div><div class="toolbar"><select id="filterEvent"><option value="">All events</option></select><select id="filterType"><option value="">All categories</option><option>Contract</option><option>Certificate of Insurance</option><option>W-9</option><option>License / permit</option><option>Deposit receipt</option><option>Design</option></select></div></div><div class="grid cols-3"><form id="form" class="card grid"><h2>Add / Upload Document</h2><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Event</label><select name="event_id" id="eventSel"><option value="">Business-wide</option></select></div><div class="field"><label>Vendor</label><select name="vendor_id" id="vendorSel"><option value="">None</option></select></div><div class="field"><label>Category</label><input name="category" list="cats" placeholder="Contract, COI, W-9…"><datalist id="cats"><option>Contract</option><option>Certificate of Insurance</option><option>W-9</option><option>License / permit</option><option>Deposit receipt</option><option>Design</option></datalist></div><div class="field"><label>Upload file</label><input id="file" type="file"></div><div class="field"><label>Or existing file URL</label><input name="file_url" type="url" placeholder="https://…"></div><div class="grid cols-2"><div class="field"><label>Issue date</label><input name="issue_date" type="date"></div><div class="field"><label>Expiration</label><input name="expiration_date" type="date"></div></div><div class="field"><label>Visibility</label><select name="visibility"><option value="internal">Internal only</option><option value="client">Client visible</option></select></div><label class="chip"><input name="locked" type="checkbox"> Lock permanent record</label><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Add to Vault</button><span id="msg"></span></form><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>
let d={documents:[],events:[],vendors:[]};function render(){eventSel.innerHTML='<option value="">Business-wide</option>'+d.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');filterEvent.innerHTML='<option value="">All events</option>'+d.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');vendorSel.innerHTML='<option value="">None</option>'+d.vendors.map(v=>`<option value="${v.id}">${WLP.esc(v.business_name)}</option>`).join('');const em=Object.fromEntries(d.events.map(e=>[e.id,e.title])),vm=Object.fromEntries(d.vendors.map(v=>[v.id,v.business_name])),fe=filterEvent.value,ft=filterType.value,rows=d.documents.filter(x=>(!fe||x.event_id===fe)&&(!ft||x.category===ft));list.innerHTML=rows.length?rows.map(x=>`<div class="notice ${x.computed_status==='expired'?'doc-expired':x.computed_status==='expiring'?'doc-expiring':''}" style="margin-bottom:10px"><div class="toolbar"><span class="badge">${WLP.esc(x.category||'Document')}</span><span class="badge">v${x.version_number||1}</span><span class="badge">${WLP.esc(x.visibility)}</span>${x.locked?'<span class="badge">Locked</span>':''}${x.computed_status&&x.computed_status!=='active'?`<span class="badge">${WLP.esc(x.computed_status)}</span>`:''}</div><h3 class="${x.locked?'doc-locked':''}">${WLP.esc(x.title)}</h3><div class="muted">${WLP.esc(em[x.event_id]||'Business-wide')}${x.vendor_id?' · '+WLP.esc(vm[x.vendor_id]||'Vendor'):''}${x.expiration_date?' · expires '+WLP.fmtDate(x.expiration_date):''}</div><p>${WLP.esc(x.notes||'')}</p><div class="toolbar"><a class="btn primary" href="${x.storage_path?'/.netlify/functions/document-open?id='+encodeURIComponent(x.id):WLP.esc(x.file_url)}" target="_blank" rel="noopener">Open</a>${!x.locked?`<button class="btn" onclick="versionDoc('${x.id}')">New Version</button><button class="btn" onclick="removeDoc('${x.id}')">Remove</button>`:''}<button class="btn" onclick="toggleVisibility('${x.id}','${x.visibility}')">${x.visibility==='client'?'Make Internal':'Share with Client'}</button></div></div>`).join(''):'<div class="empty">No documents match the filters.</div>'}async function load(){d=await WLP.api('documents');render()}async function uploadFile(f,eventId){const r=await fetch('/.netlify/functions/file-upload?event_id='+encodeURIComponent(eventId||'')+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'content-type':f.type||'application/octet-stream'},body:f});const j=await r.json();if(!r.ok)throw new Error(j.error||'Upload failed');return j}async function removeDoc(id){if(!confirm('Remove this document record?'))return;await WLP.api('documents?id='+encodeURIComponent(id),{method:'DELETE'});load()}async function toggleVisibility(id,v){await WLP.api('documents',{method:'PATCH',body:JSON.stringify({id,visibility:v==='client'?'internal':'client'})});load()}async function versionDoc(id){const original=d.documents.find(x=>x.id===id),f=document.createElement('input');f.type='file';f.onchange=async()=>{const file=f.files[0];if(!file)return;const up=await uploadFile(file,original.event_id||'');await WLP.api('documents',{method:'POST',body:JSON.stringify({parent_document_id:id,event_id:original.event_id,vendor_id:original.vendor_id,title:original.title,category:original.category,file_url:up.file_url,storage_path:up.path,file_name:up.file_name,mime_type:up.mime_type,visibility:original.visibility,notes:'New version of '+original.title})});load()};f.click()}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{const body=Object.fromEntries(new FormData(form));body.locked=form.locked.checked;if(!body.event_id)body.event_id=null;if(!body.vendor_id)body.vendor_id=null;if(file.files[0]){msg.textContent='Uploading…';const up=await uploadFile(file.files[0],body.event_id||'');body.file_url=up.file_url;body.storage_path=up.path;body.file_name=up.file_name;body.mime_type=up.mime_type}if(!body.file_url)throw new Error('Choose a file or enter a URL.');await WLP.api('documents',{method:'POST',body:JSON.stringify(body)});form.reset();msg.textContent='Saved.';await load()}catch(err){msg.textContent=err.message}};filterEvent.onchange=render;filterType.onchange=render;load().catch(()=>location='/login.html');
</script></body></html>
