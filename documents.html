<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Vault</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Celebration Suite</div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Document Vault</h1><p class="muted">Organize contracts, inspiration files, vendor documents and client-shareable links.</p></div></div><div class="grid cols-3"><form id="form" class="card grid"><h2>Add Document</h2><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Event</label><select name="event_id" id="eventSel"><option value="">Business-wide</option></select></div><div class="field"><label>Vendor (optional)</label><select name="vendor_id" id="vendorSel"><option value="">None</option></select></div><div class="field"><label>Category</label><input name="category" placeholder="Contract, design, vendor…"></div><div class="field"><label>File URL</label><input name="file_url" type="url" required placeholder="https://…"></div><div class="field"><label>Visibility</label><select name="visibility"><option value="internal">Internal only</option><option value="client">Client visible</option></select></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Add to Vault</button><span id="msg"></span></form><div class="card" style="grid-column:span 2"><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>let d={documents:[],events:[]},vendors=[];function render(){eventSel.innerHTML='<option value="">Business-wide</option>'+d.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');vendorSel.innerHTML='<option value="">None</option>'+vendors.map(v=>`<option value="${v.id}">${WLP.esc(v.business_name)}</option>`).join('');const em=Object.fromEntries(d.events.map(e=>[e.id,e.title])),vm=Object.fromEntries(vendors.map(v=>[v.id,v.business_name]));list.innerHTML=d.documents.length?d.documents.map(x=>`<div class="notice" style="margin-bottom:10px"><div class="toolbar"><span class="badge">${WLP.esc(x.category||'Document')}</span><span class="badge">${WLP.esc(x.visibility)}</span></div><h3>${WLP.esc(x.title)}</h3><div class="muted">${WLP.esc(em[x.event_id]||'Business-wide')}${x.vendor_id?' · '+WLP.esc(vm[x.vendor_id]||'Vendor'):''}</div><p>${WLP.esc(x.notes||'')}</p><div class="toolbar"><a class="btn primary" href="${WLP.esc(x.file_url)}" target="_blank" rel="noopener">Open file</a><button class="btn" onclick="removeDoc('${x.id}')">Remove</button></div></div>`).join(''):'<div class="empty">No documents yet.</div>'}async function load(){d=await WLP.api('documents');vendors=(await WLP.api('vendors')).vendors||[];render()}async function removeDoc(id){if(!confirm('Remove this document record?'))return;await WLP.api('documents?id='+encodeURIComponent(id),{method:'DELETE'});load()}form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';try{const body=Object.fromEntries(new FormData(form));if(!body.event_id)body.event_id=null;if(!body.vendor_id)body.vendor_id=null;await WLP.api('documents',{method:'POST',body:JSON.stringify(body)});form.reset();msg.textContent='Saved.';load()}catch(err){msg.textContent=err.message}};load().catch(()=>location='/login.html');</script></body></html>
