<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Getting Started · Celebration Suite</title><link rel="stylesheet" href="/assets/app.css"><style>.gs{max-width:1150px;margin:auto;padding:30px 22px 60px}.hero{padding:30px;border-radius:24px;background:linear-gradient(135deg,#f7f3ed,#fff);border:1px solid #e5ded7}.path{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.step{border:1px solid #e6ded8;border-radius:18px;padding:18px;background:#fff}.step-num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8efe1;font-weight:900;margin-bottom:10px}.step h3{margin:0 0 5px}.quick{margin-top:24px}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick a{display:block;padding:16px;border:1px solid #e5ddd6;border-radius:16px;background:white;text-decoration:none;color:inherit;font-weight:800}.quick small{display:block;font-weight:400;color:#766b72;margin-top:4px}@media(max-width:800px){.path,.quick-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt="Celebration Suite"></div><div><div class="brand-title">Getting Started</div><small>Your setup path</small></div></div><div class="top-actions"><a class="btn" href="/knowledge-base.html">Knowledge Base</a><a class="btn" href="/app.html">← Dashboard</a></div></header><main class="gs"><section class="hero"><div class="eyebrow">WELCOME</div><h1>Set up Celebration Suite in the right order</h1><p class="muted">You can start planning immediately. Work through these steps as you need each feature.</p></section><section class="path" id="path"></section><section class="quick"><div class="page-head"><div><h2>Jump to a common task</h2><p class="muted">Open the detailed how-to guide for exactly what you want to do.</p></div></div><div class="quick-grid" id="quick"></div></section></main><script src="/assets/app.js"></script><script src="/assets/knowledge-base.js"></script><script>
const pathEl=document.getElementById('path'),quickEl=document.getElementById('quick');
const steps=[['Brand your account','Add your business name, logo, colors and email identity.','branding','/settings.html'],['Secure your account','Enable planner/admin 2FA and understand password recovery.','security','/security.html'],['Connect your calendar','Connect Google Calendar and set appointment availability.','calendar','/calendar.html'],['Connect communications','Set up email and SMS so replies stay with the client/event.','communications','/settings.html#integrations'],['Connect payments/accounting','Connect Stripe and, if used, QuickBooks Online.','stripe','/settings.html'],['Add your team','Invite staff and choose their access/roles.','team','/team.html'],['Build your inventory','Add owned décor, photos, storage locations and QR labels.','inventory-master','/inventory.html'],['Create your first event','Create an event and open its Event Workspace.','dashboard-events','/app.html'],['Set up the client journey','Preview the Client Portal, permissions, questionnaires and approvals.','client-portal','/portal.html'],['Prepare for event day','Finish timeline, floor plan, vendors, staff, guests, inventory and Event Book.','event-day','/event-day-command.html']];

const quickIds=['event-workspace','design-studio','floor-plan','inventory-bulk-upload','inventory-qr','guests','rsvp-settings','financials','vendors','communications','event-day','support'];quickEl.innerHTML=quickIds.map(id=>{const a=CSKnowledgeBase.find(x=>x.id===id);return `<a href="/knowledge-base.html?article=${id}">${WLP.esc(a.title)}<small>${WLP.esc(a.summary)}</small></a>`}).join('');
</script><script src="/assets/runtime-compat.js"></script><script src="/assets/ui-v019.js"></script></body></html>
