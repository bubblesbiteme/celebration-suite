<!doctype html><html lang="en"><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Notifications</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/tenant-branding.js"></script>  <link rel="stylesheet" href="/assets/premium-experience.css">
</head><body><header class="topbar"><div class="brand"><div class="brand-title">Notification Center</div><small>What needs your attention</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="markAll">Mark all read</button></div></header><main><div class="page-head"><div><h1>Notifications</h1><p class="muted" id="count"></p></div></div><section class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">Browser alerts</h2><p class="muted" id="pushStatus" style="margin-bottom:0">Checking this browser…</p></div><div class="toolbar"><button class="btn primary" id="enablePush">Enable alerts</button><button class="btn" id="testPush">Send test</button><button class="btn" id="disablePush">Turn off</button></div></div></section><div id="list" class="grid cols-2"></div></main><script src="/assets/app.js"></script><script src="/assets/tenant-branding.js"></script><script src="/assets/runtime-compat.js"></script><script src="/assets/push-notifications.js"></script><script>
const {api,esc}=WLP;async function load(){const d=await api('notifications');count.textContent=`${d.unread||0} unread`;list.innerHTML=(d.notifications||[]).length?d.notifications.map(n=>`<div class="card" style="opacity:${n.read_at?.75:1}"><div style="display:flex;justify-content:space-between;gap:12px"><span class="badge">${esc(n.kind)}</span><span class="muted">${new Date(n.created_at).toLocaleString()}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body||'')}</p><div class="toolbar">${n.link_url?`<a class="btn" href="${esc(n.link_url)}">Open</a>`:''}${!n.read_at?`<button class="btn" onclick="mark('${n.id}')">Mark read</button>`:''}</div></div>`).join(''):'<div class="empty">You are all caught up.</div>'}async function mark(id){await api('notifications?id='+encodeURIComponent(id),{method:'PATCH',body:'{}'});load()}markAll.onclick=async()=>{await api('notifications',{method:'PATCH',body:JSON.stringify({all:true})});load()};load().catch(e=>alert(e.message));
async function refreshPush(){try{const s=await CSPush.status();pushStatus.textContent=!s.supported?'Push notifications are not supported in this browser.':!s.enabled?'Push is available after VAPID keys are configured on the deployment.':s.subscribed?'Alerts are enabled on this browser.':`Alerts are off. Browser permission: ${s.permission}.`;enablePush.disabled=!s.supported||!s.enabled||s.subscribed;disablePush.disabled=!s.subscribed;testPush.disabled=!s.subscribed}catch(e){pushStatus.textContent=e.message}}
enablePush.onclick=async()=>{try{await CSPush.enable();await refreshPush()}catch(e){alert(e.message)}};disablePush.onclick=async()=>{try{await CSPush.disable();await refreshPush()}catch(e){alert(e.message)}};testPush.onclick=async()=>{try{const r=await api('push-test',{method:'POST',body:'{}'});alert(r.sent?`Test sent to ${r.sent} browser${r.sent===1?'':'s'}.`:'No active browser subscriptions were available.')}catch(e){alert(e.message)}};refreshPush();
</script><script src="/assets/ui-v019.js"></script>  <script src="/assets/premium-experience.js" defer></script>
</body></html>
