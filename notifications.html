<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Notifications</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-title">Notification Center</div><small>What needs your attention</small></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" id="markAll">Mark all read</button></div></header><main><div class="page-head"><div><h1>Notifications</h1><p class="muted" id="count"></p></div></div><div id="list" class="grid cols-2"></div></main><script src="/assets/app.js"></script><script>
const {api,esc}=WLP;async function load(){const d=await api('notifications');count.textContent=`${d.unread||0} unread`;list.innerHTML=(d.notifications||[]).length?d.notifications.map(n=>`<div class="card" style="opacity:${n.read_at?.75:1}"><div style="display:flex;justify-content:space-between;gap:12px"><span class="badge">${esc(n.kind)}</span><span class="muted">${new Date(n.created_at).toLocaleString()}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body||'')}</p><div class="toolbar">${n.link_url?`<a class="btn" href="${esc(n.link_url)}">Open</a>`:''}${!n.read_at?`<button class="btn" onclick="mark('${n.id}')">Mark read</button>`:''}</div></div>`).join(''):'<div class="empty">You are all caught up.</div>'}async function mark(id){await api('notifications?id='+encodeURIComponent(id),{method:'PATCH',body:'{}'});load()}markAll.onclick=async()=>{await api('notifications',{method:'PATCH',body:JSON.stringify({all:true})});load()};load().catch(e=>alert(e.message));</script></body></html>
