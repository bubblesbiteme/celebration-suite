<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Print Event Photo</title><style>html,body{margin:0;background:#fff}main{min-height:100vh;display:grid;place-items:center;padding:20px}img{max-width:100%;max-height:94vh;object-fit:contain}@media print{main{padding:0}img{max-height:100vh}}</style><link rel="stylesheet" href="/assets/ultra-luxury.css"></head><body><main><img id="photo" alt="Event guest photo"></main><script>const id=new URLSearchParams(location.search).get('id');photo.onload=()=>setTimeout(()=>window.print(),120);photo.onerror=()=>document.body.textContent='Unable to load this photo.';photo.src='/.netlify/functions/guest-photo-open?id='+encodeURIComponent(id||'');</script><script src="/assets/ultra-luxury.js"></script></body></html>
