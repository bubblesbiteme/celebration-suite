<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Appointments</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">A</span></div><div><div id="biz" class="brand-title">Appointments</div><small>Consultations, walkthroughs, design reviews and meetings</small></div></div><div class="top-actions"><a class="btn" href="/scheduling.html">Scheduling Settings</a><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addAppointment()">+ Appointment</button></div></header><main><div class="page-head"><div><h1>Appointments</h1><p class="muted">Manage planner-created and client-booked meetings from one schedule.</p></div></div><div class="grid cols-4" id="stats"></div><div class="card"><div class="toolbar"><select id="eventFilter"><option value="">All events</option></select><select id="statusFilter"><option value="">All statuses</option><option>scheduled</option><option>completed</option><option>canceled</option><option>no_show</option></select></div><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],rows=[],types=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Appointments'}async function refresh(){const d=await WLP.api('appointments'+(eventFilter.value?'?event_id='+encodeURIComponent(eventFilter.value):''));rows=d.appointments||[];types=d.types||[];render()}function render(){const sf=statusFilter.value,a=rows.filter(x=>!sf||x.status===sf),future=a.filter(x=>x.status==='scheduled'&&Date.parse(x.starts_at)>Date.now());stats.innerHTML=[['Upcoming',future.length],['Client Booked',a.filter(x=>x.booked_by_client).length],['Completed',a.filter(x=>x.status==='completed').length],['Canceled',a.filter(x=>x.status==='canceled').length]].map(([k,v])=>`<div class="card"><small class="muted">${k}</small><strong style="display:block;font-size:30px">${v}</strong></div>`).join('');list.innerHTML=a.length?'<div class="timeline-list">'+a.map(x=>`<div class="timeline-item"><div class="page-head"><div><strong>${WLP.esc(x.title)}</strong> ${x.booked_by_client?'<span class="badge">Client booked</span>':''}<br>${new Date(x.starts_at).toLocaleString()}${x.ends_at?' → '+new Date(x.ends_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''}${x.location?' · '+WLP.esc(x.location):''}<br><small>${WLP.esc(x.attendee_name||'')} ${WLP.esc(x.attendee_email||'')} · ${WLP.esc(x.meeting_mode||'')} · ${WLP.esc(x.status)}</small></div><div class="toolbar"><button class="btn" onclick="status('${x.id}','completed')">Complete</button><button class="btn" onclick="status('${x.id}','canceled')">Cancel</button></div></div></div>`).join('')+'</div>':'<div class="empty">No appointments scheduled.</div>'}async function addAppointment(){const type=types[0]||{},title=prompt('Appointment title/type',type.name||'Consultation');if(!title)return;const starts_at=prompt('Start date/time (ISO or browser-readable)','');if(!starts_at)return;const duration=Number(prompt('Duration in minutes',type.duration_minutes||30))||30;const start=new Date(starts_at);const ends_at=new Date(start.getTime()+duration*60000).toISOString();const location=prompt('Location or meeting link',type.location||'');const attendee_name=prompt('Attendee name','');const attendee_email=prompt('Attendee email','');await WLP.api('appointments',{method:'POST',body:JSON.stringify({event_id:eventFilter.value||null,title,starts_at:start.toISOString(),ends_at,location,attendee_name,attendee_email,meeting_mode:type.meeting_mode||'video'})});await refresh()}async function status(id,status){await WLP.api('appointments',{method:'PATCH',body:JSON.stringify({id,status})});refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent)eventFilter.value=requestedEvent;await refresh()}eventFilter.onchange=refresh;statusFilter.onchange=render;load();
</script></body></html>
