<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Appointments</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">A</span></div><div><div id="biz" class="brand-title">Appointments</div><small>Consultations, walkthroughs, tastings, rehearsals</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addAppointment()">+ Appointment</button></div></header><main><div class="page-head"><div><h1>Appointments</h1><p class="muted">Keep event meetings and vendor appointments in one schedule.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"><option value="">All events</option></select></div><div id="list"></div></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],rows=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Appointments'}async function refresh(){rows=(await WLP.api('appointments'+(eventFilter.value?'?event_id='+encodeURIComponent(eventFilter.value):''))).appointments||[];render()}function render(){list.innerHTML=rows.length?'<div class="timeline-list">'+rows.map(a=>`<div class="timeline-item"><strong>${WLP.esc(a.title)}</strong><br>${new Date(a.starts_at).toLocaleString()}${a.location?' · '+WLP.esc(a.location):''}<br><small>${WLP.esc(a.attendee_name||'')} ${WLP.esc(a.attendee_email||'')} · ${WLP.esc(a.status)}</small></div>`).join('')+'</div>':'<div class="empty">No appointments scheduled.</div>'}async function addAppointment(){const title=prompt('Appointment title');if(!title)return;const starts_at=prompt('Start date/time (example 2026-11-01T14:00:00-08:00)');if(!starts_at)return;const location=prompt('Location or meeting link','');const attendee_name=prompt('Attendee name','');const attendee_email=prompt('Attendee email','');await WLP.api('appointments',{method:'POST',body:JSON.stringify({event_id:eventFilter.value||null,title,starts_at,location,attendee_name,attendee_email})});await refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');await refresh()}eventFilter.onchange=refresh;load();
</script></body></html>
