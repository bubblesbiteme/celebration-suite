<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Launch Readiness · Celebration Suite</title><style>body{font:14px system-ui;margin:0;background:#f6f5f2;color:#242024}.top{background:#37243F;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}.shell{max-width:1200px;margin:24px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.big{font-size:28px;font-weight:800}table{width:100%;border-collapse:collapse;background:#fff;margin-top:18px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;vertical-align:top}.good{color:#18794e}.bad{color:#b42318}.warn{color:#9a6700}.btn{border:1px solid #ccc;border-radius:10px;padding:8px 11px;background:#fff;text-decoration:none;color:inherit}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}table{font-size:12px}}</style>  



  <link rel="stylesheet" href="/assets/premium-experience.css">
  <link rel="stylesheet" href="/assets/ultra-luxury.css">
</head><body><header class="top"><b>Celebration Suite · Launch Readiness</b><a class="btn" href="/beta-validation.html">Beta Validation</a> <a class="btn" href="/platform-admin.html">Platform Admin</a></header><main class="shell"><div class="cards"><div class="card"><div>Tenants</div><div class="big" id="tenants">—</div></div><div class="card"><div>Safe to activate</div><div class="big good" id="safe">—</div></div><div class="card"><div>Blocked</div><div class="big bad" id="blocked">—</div></div><div class="card"><div>Needs attention</div><div class="big warn" id="attention">—</div></div></div><div id="out"></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/.netlify/functions/platform-launch-readiness');if(r.status===401){location='/platform-login.html';return}const d=await r.json();if(!r.ok){out.textContent=d.error||'Unable to load';return}for(const k of ['tenants','safe','blocked','attention'])document.getElementById(k).textContent=d.summary[k];out.innerHTML='<table><thead><tr><th>Business</th><th>Ready</th><th>License</th><th>Blockers</th><th>Warnings</th><th>Owner</th></tr></thead><tbody>'+d.tenants.map(x=>`<tr><td><b>${esc(x.business_name)}</b><br><small>${esc(x.status)}</small></td><td class="${x.safe_to_activate?'good':'bad'}"><b>${x.safe_to_activate?'YES':'NO'}</b></td><td>${esc(x.license?.plan_type||'None')}<br><small>${esc(x.license?.status||'')}</small></td><td class="bad">${esc((x.blockers||[]).join(' · ')||'None')}</td><td class="warn">${esc((x.warnings||[]).join(' · ')||'None')}</td><td>${esc(x.owner?.email||'Missing')}</td></tr>`).join('')+'</tbody></table>'}load()</script>  



  <script src="/assets/premium-experience.js" defer></script>
  <script src="/assets/ultra-luxury.js" defer></script>
</body></html>
