<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Vendor CRM</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">V</span></div><div><div id="biz" class="brand-title">Vendor CRM</div><small>Preferred vendors and event assignments</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/vendor-quotes.html">Quote Comparison</a><a class="btn" href="/vendor-reviews.html">Reviews</a><button class="btn primary" onclick="addVendor()">+ Vendor</button></div></header><main><div class="page-head"><div><h1>Vendor CRM</h1><p class="muted">Track prospects, quotes, bookings, spend, and event assignments.</p></div></div><div class="card"><div class="toolbar"><select id="eventFilter"><option value="">All events</option></select><input id="search" placeholder="Search vendors"></div><div id="list" class="table-wrap"></div></div></main><script src="/assets/app.js"></script><script>
let tenant,events=[],vendors=[];function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Vendor CRM'}function render(){const q=search.value.toLowerCase(),eid=eventFilter.value;const rows=vendors.filter(v=>(!eid||v.event_id===eid)&&(!q||(v.business_name+' '+(v.category||'')+' '+(v.contact_name||'')).toLowerCase().includes(q)));list.innerHTML=rows.length?`<table class="table"><thead><tr><th>Vendor</th><th>Category</th><th>Status</th><th>Event</th><th>Contracted</th><th>Paid</th><th></th></tr></thead><tbody>${rows.map(v=>`<tr><td><strong>${WLP.esc(v.business_name)}</strong><br><small>${WLP.esc(v.email||v.phone||'')}</small></td><td>${WLP.esc(v.category||'')}</td><td><span class="badge">${WLP.esc(v.status)}</span></td><td>${WLP.esc(events.find(e=>e.id===v.event_id)?.title||'General')}</td><td>$${Number(v.contracted_amount||0).toFixed(2)}</td><td>$${Number(v.paid_amount||0).toFixed(2)}</td><td><button class="btn" onclick="editVendor('${v.id}')">Edit</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No vendors yet.</div>'}async function addVendor(v={}){const business_name=prompt('Business name',v.business_name||'');if(!business_name)return;const category=prompt('Category',v.category||'');const contact_name=prompt('Contact name',v.contact_name||'');const email=prompt('Email',v.email||'');const phone=prompt('Phone',v.phone||'');const contracted_amount=prompt('Contracted amount',v.contracted_amount||'');const status=prompt('Status: prospect, contacted, quoted, booked, completed, declined',v.status||'prospect');const event_id=prompt('Event ID (leave blank for general vendor)',v.event_id||'');const body={business_name,category,contact_name,email,phone,contracted_amount,status,event_id:event_id||null};if(v.id)body.id=v.id;await WLP.api('vendors',{method:v.id?'PATCH':'POST',body:JSON.stringify(body)});await load()}function editVendor(id){addVendor(vendors.find(x=>x.id===id))}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');vendors=(await WLP.api('vendors')).vendors||[];render()}search.oninput=render;eventFilter.onchange=render;load();
</script><script src="/assets/ui-v019.js"></script></body></html>
