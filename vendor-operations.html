<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Operations</title><link rel="stylesheet" href="/assets/app.css"><style>.ops-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}.ops-card{border:1px solid var(--line,#ddd);border-radius:16px;padding:16px;background:#fff}.ops-card.in{border-left:5px solid var(--brand-primary)}.ops-card.out{opacity:.65}.status-row{display:flex;justify-content:space-between;gap:10px;align-items:start}.meta{display:flex;gap:8px 14px;flex-wrap:wrap;margin:8px 0}.meta small{color:#666}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}@media(max-width:800px){.ops-grid,.summary{grid-template-columns:1fr 1fr}}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Vendor Operations</div><small>Arrival, load-in, compliance and day-of contacts</small></div><div class="top-actions"><a class="btn" id="back">← Event</a><button class="btn primary" onclick="addOperation()">+ Vendor Operation</button></div></header><main style="max-width:1200px;margin:auto"><div class="page-head"><div><h1 id="title">Vendor Operations</h1><p class="muted">Know who is arriving, where they belong, what they need, and whether their paperwork is current.</p></div></div><div class="summary" id="summary"></div><div class="grid cols-2"><section class="card"><div class="page-head"><h2>Day-of Vendor Roster</h2><button class="btn" onclick="addOperation()">Add vendor</button></div><div class="ops-grid" id="ops"></div></section><aside><div class="card"><div class="page-head"><h2>Emergency Contacts</h2><button class="btn" onclick="addContact()">+ Contact</button></div><div id="contacts"></div></div><div class="card"><h2>Compliance</h2><div id="compliance"></div></div></aside></div></main><script src="/assets/app.js"></script><script>
const eventId=new URLSearchParams(location.search).get('event_id');let data=null;const fmt=x=>x?new Date(x).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'TBD';const esc=WLP.esc;
async function load(){back.href='/event.html?id='+encodeURIComponent(eventId);const e=(await WLP.api('events?id='+encodeURIComponent(eventId))).event;title.textContent=e.title+' · Vendor Operations';data=await WLP.api('vendor-operations?event_id='+encodeURIComponent(eventId));render()}
function render(){const now=new Date(),opsRows=data.operations||[],docs=data.documents||[];const expired=docs.filter(x=>x.expiration_date&&new Date(x.expiration_date+'T23:59:59')<now),soon=docs.filter(x=>x.expiration_date&&new Date(x.expiration_date+'T23:59:59')>=now&&new Date(x.expiration_date+'T23:59:59')-now<30*86400000);summary.innerHTML=[['Vendors',opsRows.length],['Checked in',opsRows.filter(x=>x.checked_in_at&&!x.checked_out_at).length],['Checked out',opsRows.filter(x=>x.checked_out_at).length],['Compliance alerts',expired.length+soon.length]].map(([a,b])=>`<div class="card"><small>${a}</small><strong style="font-size:1.8rem;display:block">${b}</strong></div>`).join('');ops.innerHTML=opsRows.length?opsRows.map(x=>`<article class="ops-card ${x.checked_out_at?'out':x.checked_in_at?'in':''}"><div class="status-row"><div><strong>${esc(x.vendor_name||'Vendor')}</strong><div class="muted">${esc(x.role||'')}</div></div><span class="badge">${esc(x.status||'scheduled')}</span></div><div class="meta"><small>Arrival ${fmt(x.scheduled_arrival)}</small><small>${esc(x.assigned_area||'Area TBD')}</small></div>${x.contact_name||x.contact_phone?`<p><b>Contact:</b> ${esc(x.contact_name||'')} ${esc(x.contact_phone||'')}</p>`:''}${x.responsibilities?`<p><b>Responsibilities:</b> ${esc(x.responsibilities)}</p>`:''}${x.access_instructions?`<p><b>Access:</b> ${esc(x.access_instructions)}</p>`:''}${x.day_of_notes?`<p><b>Notes:</b> ${esc(x.day_of_notes)}</p>`:''}<div class="quick">${!x.checked_in_at?`<button class="btn primary" onclick="status('${x.id}','checkin')">Check In</button>`:''}${x.checked_in_at&&!x.checked_out_at?`<button class="btn primary" onclick="status('${x.id}','checkout')">Check Out</button>`:''}${x.checked_in_at?`<button class="btn" onclick="status('${x.id}','reset')">Reset</button>`:''}</div></article>`).join(''):'<div class="empty">No vendor operations yet. Add vendors with arrival times and day-of instructions.</div>';contacts.innerHTML=(data.contacts||[]).length?(data.contacts||[]).map(x=>`<p><strong>${esc(x.label)}</strong><br>${esc(x.name||'')} ${esc(x.phone||'')}<br><small>${esc(x.notes||'')}</small></p>`).join(''):'<p class="muted">Add venue security, building engineer, planner lead, medical contact, or other emergency numbers.</p>';compliance.innerHTML=docs.filter(x=>x.vendor_id&&x.expiration_date).length?docs.filter(x=>x.vendor_id&&x.expiration_date).map(x=>{const exp=new Date(x.expiration_date+'T23:59:59'),state=exp<now?'Expired':exp-now<30*86400000?'Expires soon':'Current';return`<p><strong>${esc(x.title||x.category||'Vendor document')}</strong><br><small>${state} · ${WLP.fmtDate(x.expiration_date)}</small></p>`}).join(''):'<p class="muted">No dated vendor compliance documents. Add COIs, permits or W-9s in Documents and assign them to a vendor.</p>'}
async function addOperation(){const vendor_id=prompt('Vendor ID (optional; leave blank for manual vendor)','');const vendor_name=prompt('Vendor/business name','');if(!vendor_name&&!vendor_id)return;const role=prompt('Role/category','');const scheduled_arrival=prompt('Arrival date/time (YYYY-MM-DDTHH:MM)','');const assigned_area=prompt('Assigned area','');const responsibilities=prompt('Responsibilities','');const access_instructions=prompt('Load-in/access instructions','');const day_of_notes=prompt('Day-of notes','');await WLP.api('vendor-operations?event_id='+encodeURIComponent(eventId),{method:'POST',body:JSON.stringify({vendor_id:vendor_id||null,vendor_name,role,scheduled_arrival:scheduled_arrival?new Date(scheduled_arrival).toISOString():null,assigned_area,responsibilities,access_instructions,day_of_notes})});await load()}
async function addContact(){const label=prompt('Contact label','Venue emergency');if(!label)return;const name=prompt('Name',''),phone=prompt('Phone',''),notes=prompt('Notes','');await WLP.api('vendor-operations?event_id='+encodeURIComponent(eventId),{method:'POST',body:JSON.stringify({kind:'contact',label,name,phone,notes})});await load()}
async function status(id,action){await WLP.api('vendor-operations?event_id='+encodeURIComponent(eventId),{method:'PATCH',body:JSON.stringify({id,action})});await load()}load().catch(e=>alert(e.message));
</script></body></html>
