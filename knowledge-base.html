<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Knowledge Base · Celebration Suite</title><link rel="stylesheet" href="/assets/app.css"><style>
.kb-shell{max-width:1280px;margin:auto;padding:28px 22px 60px}.kb-hero{padding:28px;border:1px solid var(--line,#e6ddd5);border-radius:24px;background:linear-gradient(135deg,#fff,#f7f3ed);box-shadow:0 18px 50px rgba(57,35,64,.07)}.kb-search{display:flex;gap:10px;margin-top:18px}.kb-search input{font-size:16px;padding:15px 16px}.kb-grid{display:grid;grid-template-columns:250px 1fr;gap:22px;margin-top:22px}.kb-side,.kb-main{background:#fff;border:1px solid var(--line,#e6ddd5);border-radius:20px;padding:18px}.kb-cat{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:700;cursor:pointer}.kb-cat.active,.kb-cat:hover{background:#f1eee8}.article-card{border:1px solid #e8e2dc;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}.article-card:hover{box-shadow:0 8px 24px rgba(57,35,64,.08);transform:translateY(-1px)}.article-card h3{margin:0 0 6px}.kb-article h1{margin-top:0}.kb-steps{counter-reset:step;list-style:none;padding:0}.kb-steps li{counter-increment:step;position:relative;padding:13px 14px 13px 52px;border:1px solid #ece6df;border-radius:14px;margin:10px 0;background:#fff}.kb-steps li:before{content:counter(step);position:absolute;left:13px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eaf0e2;font-weight:800}.kb-note{padding:14px 16px;border-radius:14px;background:#f7f3ed;margin:12px 0}.kb-back{margin-bottom:16px}.kb-empty{padding:45px;text-align:center;color:#776c74}@media(max-width:850px){.kb-grid{grid-template-columns:1fr}.kb-side{display:flex;gap:6px;overflow:auto}.kb-cat{white-space:nowrap;width:auto}}
</style></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt="Celebration Suite"></div><div><div class="brand-title">Knowledge Base</div><small>How-to guides and troubleshooting</small></div></div><div class="top-actions"><a class="btn" href="/getting-started.html">Getting Started</a><a class="btn" href="/support.html">Support</a><a class="btn" href="/app.html">← Dashboard</a></div></header><main class="kb-shell"><section class="kb-hero"><div class="eyebrow">HELP CENTER</div><h1>How can we help?</h1><p class="muted">Search by task, page, feature, integration, or problem. Every guide includes step-by-step instructions.</p><div class="kb-search"><input id="q" placeholder="Try: add inventory, Google Calendar, RSVP, floor plan, client portal…" autocomplete="off"><button id="clear" class="btn">Clear</button></div></section><div class="kb-grid"><aside class="kb-side" id="cats"></aside><section class="kb-main" id="view"></section></div></main><script src="/assets/app.js"></script><script src="/assets/tenant-branding.js"></script><script src="/assets/knowledge-base.js"></script><script>
const q=document.getElementById('q'),cats=document.getElementById('cats'),view=document.getElementById('view'),clear=document.getElementById('clear');let cat='All';
const categories=['All',...new Set(CSKnowledgeBase.map(a=>a.category))];
function renderCats(){cats.innerHTML=categories.map(c=>`<button class="kb-cat ${c===cat?'active':''}" data-cat="${WLP.esc(c)}">${WLP.esc(c)}</button>`).join('');cats.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderCats();renderList()})}
function searchable(a){return [a.title,a.summary,a.category,...(a.keywords||[]),...(a.steps||[]),...(a.tips||[]),...(a.troubleshoot||[])].join(' ').toLowerCase()}
function renderList(){const term=q.value.trim().toLowerCase();const rows=CSKnowledgeBase.filter(a=>(cat==='All'||a.category===cat)&&(!term||searchable(a).includes(term)));view.innerHTML=rows.length?rows.map(a=>`<article class="article-card" data-id="${a.id}"><span class="badge">${WLP.esc(a.category)}</span><h3>${WLP.esc(a.title)}</h3><p class="muted">${WLP.esc(a.summary)}</p></article>`).join(''):'<div class="kb-empty"><h2>No matching guide</h2><p>Try a broader word or open Support if you still cannot find what you need.</p></div>';view.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>showArticle(el.dataset.id))}
function showArticle(id){const a=CSKnowledgeBase.find(x=>x.id===id);if(!a)return renderList();history.replaceState(null,'',`/knowledge-base.html?article=${encodeURIComponent(id)}`);view.innerHTML=`<div class="kb-article"><button class="btn kb-back" id="back">← All guides</button><span class="badge">${WLP.esc(a.category)}</span><h1>${WLP.esc(a.title)}</h1><p>${WLP.esc(a.summary)}</p>${a.steps?.length?`<h2>Step by step</h2><ol class="kb-steps">${a.steps.map(s=>`<li>${WLP.esc(s)}</li>`).join('')}</ol>`:''}${a.tips?.length?`<h2>Helpful tips</h2>${a.tips.map(t=>`<div class="kb-note">💡 ${WLP.esc(t)}</div>`).join('')}`:''}${a.troubleshoot?.length?`<h2>Troubleshooting</h2>${a.troubleshoot.map(t=>`<div class="kb-note">${WLP.esc(t)}</div>`).join('')}`:''}<div class="toolbar" style="margin-top:22px"><a class="btn" href="/support.html">Still need help? Create a support ticket</a></div></div>`;document.getElementById('back').onclick=()=>{history.replaceState(null,'','/knowledge-base.html');renderList()}}
q.oninput=renderList;clear.onclick=()=>{q.value='';cat='All';renderCats();renderList();q.focus()};renderCats();const id=new URLSearchParams(location.search).get('article');if(id)showArticle(id);else renderList();
</script><script src="/assets/runtime-compat.js"></script><script src="/assets/ui-v019.js"></script></body></html>
