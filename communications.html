<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Communications Center</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt=""></div><div><div class="brand-title">Celebration Suite</div><small>Unified Communications Center</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/settings.html#integrations">Integrations</a></div></header><main style="max-width:1400px;margin:auto"><div class="page-head"><div><h1>Communications</h1><p class="muted">Outbound email/SMS, inbound replies, portal context and internal notes in one searchable timeline.</p></div></div><div id="stats" class="grid cols-4"></div><div class="grid cols-3"><form id="compose" class="card grid"><h2>New Message</h2><div class="field"><label>Channel</label><select name="channel"><option value="email">Email</option><option value="sms">SMS</option><option value="note">Internal note</option></select></div><div class="field"><label>Event</label><select name="event_id" id="eventSelect"><option value="">No event</option></select></div><div class="field"><label>Recipient</label><input name="recipient" placeholder="email or +1 phone"></div><div class="field"><label>Subject</label><input name="subject"></div><div class="field"><label>Message</label><textarea name="body" rows="9" required></textarea></div><button class="btn primary">Send / Save</button><div id="msg"></div></form><div class="card" style="grid-column:span 2"><div class="page-head"><div><h2>Conversation Timeline</h2></div><div class="toolbar"><input id="search" placeholder="Search messages"><select id="filter"><option value="">All channels</option><option>email</option><option>sms</option><option>note</option></select><select id="direction"><option value="">All directions</option><option>inbound</option><option>outbound</option><option>internal</option></select><select id="match"><option value="">All matching</option><option value="unmatched">Unmatched</option><option value="ambiguous">Ambiguous</option><option value="matched">Matched</option></select></div></div><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>
let rows=[],events=[];function draw(){const q=search.value.toLowerCase(),a=rows.filter(x=>(!filter.value||x.channel===filter.value)&&(!direction.value||x.direction===direction.value)&&(!match.value||x.match_status===match.value)&&(!q||`${x.sender||''} ${x.recipient||''} ${x.subject||''} ${x.body||''}`.toLowerCase().includes(q)));stats.innerHTML=[['Messages',rows.length],['Inbound',rows.filter(x=>x.direction==='inbound').length],['Unmatched',rows.filter(x=>x.match_status==='unmatched').length],['Ambiguous',rows.filter(x=>x.match_status==='ambiguous').length]].map(([k,v])=>`<div class="card"><small class="muted">${k}</small><strong style="display:block;font-size:28px">${v}</strong></div>`).join('');list.innerHTML=a.length?a.map(x=>`<div class="notice" style="margin-bottom:10px"><div class="toolbar"><span class="badge">${WLP.esc(x.channel)}</span><span class="badge">${WLP.esc(x.direction)}</span><span class="badge">${WLP.esc(x.match_status||'matched')}</span><span class="muted">${new Date(x.received_at||x.sent_at||x.created_at).toLocaleString()}</span></div><strong>${WLP.esc(x.subject||x.sender||x.recipient||'Internal note')}</strong><div class="muted">${WLP.esc(x.sender||'')} ${x.recipient?'→ '+WLP.esc(x.recipient):''}</div><p>${WLP.esc(x.body||'').replaceAll('\n','<br>')}</p>${['unmatched','ambiguous'].includes(x.match_status)?`<div class="toolbar"><button class="btn" onclick="resolve('${x.id}')">Resolve Match</button><button class="btn" onclick="ignoreMsg('${x.id}')">Ignore</button></div>`:''}</div>`).join(''):'<div class="empty">No matching communications.</div>'}async function resolve(id){const event_id=prompt('Event ID to attach (leave blank if resolving to lead/client)');const lead_id=event_id?'':prompt('Lead ID (optional)','');const client_id=event_id||lead_id?'':prompt('Client ID (optional)','');if(!event_id&&!lead_id&&!client_id)return;await WLP.api('communications',{method:'PATCH',body:JSON.stringify({id,event_id:event_id||null,lead_id:lead_id||null,client_id:client_id||null,match_status:'matched'})});load()}async function ignoreMsg(id){await WLP.api('communications',{method:'PATCH',body:JSON.stringify({id,match_status:'ignored'})});load()}async function load(){try{const [d,e]=await Promise.all([WLP.api('communications'),WLP.api('events')]);rows=d.messages||[];events=e.events||[];eventSelect.innerHTML='<option value="">No event</option>'+events.map(x=>`<option value="${x.id}">${WLP.esc(x.title)}</option>`).join('');draw()}catch(e){if(e.message==='Unauthorized')location='/login.html';else list.innerHTML=`<div class="notice warn">${WLP.esc(e.message)}</div>`}}[filter,direction,match].forEach(x=>x.onchange=draw);search.oninput=draw;compose.onsubmit=async e=>{e.preventDefault();msg.textContent='Working…';try{await WLP.api('communications',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(compose)))});compose.reset();msg.textContent='Saved.';load()}catch(err){msg.textContent=err.message}};load();
</script></body></html>
