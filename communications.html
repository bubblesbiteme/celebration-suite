<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Communications Center</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg" alt=""></div><div><div class="brand-title">Celebration Suite</div><small>Communications Center</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/settings.html#integrations">Integrations</a></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Communications</h1><p class="muted">Email, SMS and internal notes in one timeline.</p></div></div><div class="grid cols-3"><form id="compose" class="card grid" style="grid-column:span 1"><h2>New Message</h2><div class="field"><label>Channel</label><select name="channel"><option value="email">Email</option><option value="sms">SMS</option><option value="note">Internal note</option></select></div><div class="field"><label>Event ID (optional)</label><input name="event_id"></div><div class="field"><label>Recipient</label><input name="recipient" placeholder="email or +1 phone"></div><div class="field"><label>Subject</label><input name="subject"></div><div class="field"><label>Message</label><textarea name="body" rows="9" required></textarea></div><button class="btn primary">Send / Save</button><div id="msg"></div></form><div class="card" style="grid-column:span 2"><div class="page-head"><div><h2>Message History</h2></div><div class="toolbar"><select id="filter"><option value="">All channels</option><option>email</option><option>sms</option><option>note</option></select></div></div><div id="list"></div></div></div></main><script src="/assets/app.js"></script><script>let rows=[];const render=()=>{const f=filter.value;const a=rows.filter(x=>!f||x.channel===f);list.innerHTML=a.length?a.map(x=>`<div class="notice" style="margin-bottom:10px"><div class="toolbar"><span class="badge">${WLP.esc(x.channel)}</span><span class="badge">${WLP.esc(x.status)}</span><span class="muted">${new Date(x.created_at).toLocaleString()}</span></div><strong>${WLP.esc(x.subject||x.recipient||'Internal note')}</strong><p>${WLP.esc(x.body).replaceAll('\n','<br>')}</p></div>`).join(''):'<div class="empty">No messages yet.</div>'};async function load(){try{const d=await WLP.api('communications');rows=d.messages||[];render()}catch(e){if(e.message==='Unauthorized')location='/login.html';else list.innerHTML=`<div class="notice warn">${WLP.esc(e.message)}</div>`}}filter.onchange=render;compose.onsubmit=async e=>{e.preventDefault();msg.textContent='Working…';try{await WLP.api('communications',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(compose)))});compose.reset();msg.textContent='Saved.';load()}catch(err){msg.textContent=err.message}};load();</script></body></html>
