<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Payment</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:720px;margin:60px auto;padding:20px"><div class="card"><h1>Invoice Payment</h1><p class="muted">This payment link was created by your event planner.</p><div id="content"><div class="empty">Loading invoice…</div></div></div></main><script>
const token=new URLSearchParams(location.search).get('token');(async()=>{try{const r=await fetch('/.netlify/functions/invoice-public?token='+encodeURIComponent(token||''));const j=await r.json();if(!r.ok)throw new Error(j.error||'Invoice unavailable');content.innerHTML=`<h2>${j.invoice.invoice_number}</h2><p>${j.invoice.client_name||''}</p><p style="font-size:32px;font-weight:800">${Number(j.invoice.amount||0).toLocaleString(undefined,{style:'currency',currency:'USD'})}</p><p>Status: <b>${j.invoice.status}</b></p>${j.invoice.due_date?`<p>Due ${j.invoice.due_date}</p>`:''}${j.checkout_url?`<a class="btn primary" href="${j.checkout_url}">Pay securely</a>`:'<p class="muted">Online payment is not configured for this invoice. Contact your planner for payment instructions.</p>'}`}catch(e){content.innerHTML='<div class="empty">'+e.message+'</div>'}})();</script></body></html>
