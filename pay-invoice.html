<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Payment</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><div class="card"><div class="brand" style="margin-bottom:18px"><div class="brand-mark"><img id="brandLogo" src="/assets/celebration-suite-mark.svg" alt="Celebration Suite"></div><div><div id="brandName" class="brand-title">Celebration Suite</div><small>Secure invoice payment</small></div></div><div id="content"><div class="empty">Loading invoice…</div></div></div></main><script src="/assets/app.js"></script><script src="/assets/tenant-branding.js"></script><script src="/assets/runtime-compat.js"></script><script>
const token=new URLSearchParams(location.search).get('token'),paid=new URLSearchParams(location.search).get('paid'),canceled=new URLSearchParams(location.search).get('canceled');let state=null;
async function load(){try{state=await WLP.api('invoice-public?token='+encodeURIComponent(token||''));const brand=CSBrand.apply(state.tenant||{},{replaceShell:false});brandLogo.src=brand.logo_url;brandLogo.alt=brand.business_name+' logo';brandName.textContent=brand.business_name;const i=state.invoice;content.innerHTML=`${paid?'<div class="notice good"><strong>Thank you.</strong> Your payment was submitted successfully.</div>':''}${canceled?'<div class="notice warn">Payment was canceled. You can try again below.</div>':''}<h1>${WLP.esc(i.invoice_number||'Invoice')}</h1><p>${WLP.esc(i.client_name||'')}</p><p style="font-size:32px;font-weight:800">${Number(i.amount||0).toLocaleString(undefined,{style:'currency',currency:'USD'})}</p><p>Status: <b>${WLP.esc(i.status||'sent')}</b></p>${i.due_date?`<p>Due ${WLP.esc(i.due_date)}</p>`:''}${i.notes?`<p>${WLP.esc(i.notes)}</p>`:''}${i.status==='paid'?'<div class="notice good">Paid</div>':'<button id="payBtn" class="btn primary">Pay securely</button> <span id="payMsg" class="muted"></span>'}`;if(document.getElementById('payBtn'))payBtn.onclick=checkout}catch(e){content.innerHTML='<div class="empty">'+WLP.esc(e.message)+'</div>'}}
async function checkout(){payBtn.disabled=true;payMsg.textContent='Opening secure checkout…';try{const d=await WLP.api('invoice-public?token='+encodeURIComponent(token||''),{method:'POST',body:'{}'});location.href=d.url}catch(e){payMsg.textContent=e.message;payBtn.disabled=false}}
load();
</script></body></html>
