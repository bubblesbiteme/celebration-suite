<!doctype html><html lang="en"><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Client Security</title><link rel="stylesheet" href="/assets/app.css">  



  <link rel="stylesheet" href="/assets/premium-experience.css">
  <link rel="stylesheet" href="/assets/ultra-luxury.css">
</head><body><main style="max-width:680px;margin:50px auto;padding:20px"><div class="card grid"><div><h1>Client Security</h1><p class="muted">Optional authenticator-based two-factor authentication for your client login.</p></div><div id="status" class="badge">Checking…</div><button id="setup" class="btn primary">Set up 2FA</button><div id="enroll" class="grid" hidden><div class="field"><label>Setup key</label><input id="secret" readonly></div><div class="field"><label>Authenticator URI</label><textarea id="uri" rows="4" readonly></textarea></div><div class="field"><label>6-digit code</label><input id="code" inputmode="numeric" maxlength="6"></div><button id="enable" class="btn primary">Verify & Enable</button></div><div id="disableBox" class="grid" hidden><div class="field"><label>Current code</label><input id="disableCode" inputmode="numeric" maxlength="6"></div><button id="disable" class="btn">Disable 2FA</button></div><div id="msg"></div><div class="card" style="padding:16px"><h2>Change password</h2><form id="passwordForm" class="grid"><div class="field"><label>New password</label><input name="password" type="password" minlength="10" autocomplete="new-password" required></div><div class="field"><label>Confirm new password</label><input name="confirm" type="password" minlength="10" autocomplete="new-password" required></div><button class="btn primary">Update password</button><div id="passwordMsg"></div></form></div><button class="btn" onclick="history.back()">← Back to portal</button></div></main><script src="/assets/app.js"></script><script src="/assets/tenant-branding.js"></script><script src="/assets/runtime-compat.js"></script><script>const statusEl=document.getElementById('status');async function load(){try{const d=await WLP.api('client-security');statusEl.textContent=d.enabled?'2FA enabled':'2FA not enabled';setup.hidden=d.enabled;disableBox.hidden=!d.enabled}catch(e){location='/client-login.html'}}setup.onclick=async()=>{try{const d=await WLP.api('client-security',{method:'POST',body:JSON.stringify({action:'begin'})});secret.value=d.secret;uri.value=d.uri;enroll.hidden=false}catch(e){msg.textContent=e.message}};enable.onclick=async()=>{try{await WLP.api('client-security',{method:'POST',body:JSON.stringify({action:'enable',code:code.value})});enroll.hidden=true;msg.textContent='2FA enabled.';load()}catch(e){msg.textContent=e.message}};disable.onclick=async()=>{try{await WLP.api('client-security',{method:'POST',body:JSON.stringify({action:'disable',code:disableCode.value})});msg.textContent='2FA disabled.';load()}catch(e){msg.textContent=e.message}};passwordForm.onsubmit=async e=>{e.preventDefault();passwordMsg.textContent='Updating…';try{await WLP.api('client-change-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(passwordForm)))});passwordMsg.textContent='Password updated.';passwordForm.reset()}catch(err){passwordMsg.textContent=err.message}};load();</script><script src="/assets/ui-v019.js"></script>  



  <script src="/assets/premium-experience.js" defer></script>
  <script src="/assets/ultra-luxury.js" defer></script>
</body></html>
