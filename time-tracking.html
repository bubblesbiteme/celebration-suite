<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Labor & Time Tracking</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">EP</span></div><div><div class="brand-title">Labor & Time</div><small>Team operations</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><a class="btn" href="/team.html">Team</a></div></header><main><div class="page-head"><div><h1>Time Tracking</h1><p class="muted">Clock in/out by event and review labor cost.</p></div><button class="btn primary" id="clockBtn">Clock In</button></div><div id="summary" class="grid cols-4"></div><section class="card" style="margin-top:16px"><h2>Time Entries</h2><div class="table-wrap"><table class="table"><thead><tr><th>Team member</th><th>Event</th><th>Clock in</th><th>Clock out</th><th>Hours</th><th>Labor cost</th><th></th></tr></thead><tbody id="body"></tbody></table></div></section></main><div id="clockModal" class="modal"><div class="modal-card"><button class="btn close" onclick="clockModal.classList.remove('open')">Close</button><h2>Clock In</h2><form id="clockForm" class="grid"><div class="field"><label>Event</label><select name="event_id" id="eventSelect"><option value="">General / office work</option></select></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><button class="btn primary">Start Time</button><div id="clockMsg"></div></form></div></div><script src="/assets/app.js"></script><script>
let data={},me=null;const hrs=e=>{const end=e.clock_out?new Date(e.clock_out):new Date();return Math.max(0,(end-new Date(e.clock_in))/36e5-(Number(e.break_minutes||0)/60))};const name=id=>data.users.find(x=>x.id===id)?.full_name||'Team';const ev=id=>data.events.find(x=>x.id===id)?.title||'General';function render(){const total=data.entries.reduce((s,e)=>s+hrs(e),0),cost=data.entries.reduce((s,e)=>s+hrs(e)*Number(e.hourly_cost||0),0),open=data.entries.filter(x=>!x.clock_out);summary.innerHTML=`<div class="card stat"><span class="muted">Entries</span><strong>${data.entries.length}</strong></div><div class="card stat"><span class="muted">Open clocks</span><strong>${open.length}</strong></div><div class="card stat"><span class="muted">Hours</span><strong>${total.toFixed(1)}</strong></div><div class="card stat"><span class="muted">Labor cost</span><strong>$${cost.toFixed(2)}</strong></div>`;body.innerHTML=data.entries.map(e=>`<tr><td>${WLP.esc(name(e.user_id))}</td><td>${WLP.esc(ev(e.event_id))}</td><td>${new Date(e.clock_in).toLocaleString()}</td><td>${e.clock_out?new Date(e.clock_out).toLocaleString():'<span class="badge">Clocked in</span>'}</td><td>${hrs(e).toFixed(2)}</td><td>$${(hrs(e)*Number(e.hourly_cost||0)).toFixed(2)}</td><td>${!e.clock_out&&e.user_id===me?.id?`<button class="btn primary" onclick="clockOut('${e.id}')">Clock Out</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">No time entries.</td></tr>';eventSelect.innerHTML='<option value="">General / office work</option>'+data.events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('')}
async function load(){const b=await WLP.api('bootstrap');me=b.user;data=await WLP.api('time-entries?mine='+(b.user.role==='owner'||b.user.role==='admin'?'0':'1'));render()}clockBtn.onclick=()=>clockModal.classList.add('open');clockForm.onsubmit=async e=>{e.preventDefault();clockMsg.textContent='Starting…';try{await WLP.api('time-entries',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(clockForm)))});clockModal.classList.remove('open');clockForm.reset();await load()}catch(err){clockMsg.textContent=err.message}};window.clockOut=async id=>{await WLP.api('time-entries',{method:'PATCH',body:JSON.stringify({id,action:'clock_out'})});await load()};load();
</script><script src="/assets/ui-v019.js"></script></body></html>
