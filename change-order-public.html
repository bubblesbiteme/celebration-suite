<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Order Review</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:760px;margin:50px auto"><div id="content" class="card">Loading…</div></main><script src="/assets/app.js"></script><script>const token=new URLSearchParams(location.search).get('token');let row;const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});async function load(){try{const d=await WLP.api('change-order-public?token='+encodeURIComponent(token));row=d.change_order;content.innerHTML=`<h1>${WLP.esc(d.tenant?.business_name||'Change Order')}</h1><span class="badge">${WLP.esc(row.status)}</span><h2>${WLP.esc(row.title)}</h2><p>${WLP.esc(row.description||'').replaceAll('\n','<br>')}</p><div class="card stat"><span class="muted">Price adjustment</span><strong>${money(row.amount_delta)}</strong></div>${['sent','draft'].includes(row.status)?`<div class="field"><label>Client note (optional)</label><textarea id="note"></textarea></div><div class="toolbar"><button class="btn primary" onclick="decide('approved')">Approve</button><button class="btn" onclick="decide('declined')">Decline</button></div>`:`<p>This change order has been ${WLP.esc(row.status)}.</p>`}`}catch(e){content.textContent=e.message}}async function decide(status){await WLP.api('change-order-public?token='+encodeURIComponent(token),{method:'POST',body:JSON.stringify({status,client_note:note.value})});load()}load();</script></body></html>
