<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Sign In</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/custom-domain-context.js"></script></head><body><main class="public-shell"><div class="card"><div class="brand" style="margin-bottom:18px"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><h2 id="business" style="margin:0">Client Portal</h2><div id="eventTitle" class="muted">Loading…</div></div></div><div id="loading">Loading invitation…</div><div id="auth" hidden><a id="googleBtn" class="btn" style="width:100%;justify-content:center;margin-bottom:14px">Continue with Google</a><div style="text-align:center" class="muted">or use email and password</div><form id="loginForm" class="grid" style="margin-top:14px"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><div class="field" id="otpWrap" hidden><label>Authenticator code</label><input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><button class="btn primary">Sign In</button><div id="loginMsg"></div><div id="forgotWrap" class="muted" style="margin-top:10px"><a id="forgotLink" href="#">Forgot password?</a></div></form><details id="firstTime" style="margin-top:20px"><summary><strong>First time here? Create your client password</strong></summary><p class="muted">Use the email address your planner invited. You can also use Google above with that same email.</p><form id="setupForm" class="grid"><div class="field"><label>Your name</label><input name="full_name"></div><div class="field"><label>Create password</label><input name="password" type="password" minlength="10" required></div><button class="btn">Create Client Login</button><div id="setupMsg"></div></form></details></div></div></main><script src="/assets/app.js"></script><script src="/assets/tenant-branding.js"></script><script src="/assets/runtime-compat.js"></script><script>const qs=new URLSearchParams(location.search),token=qs.get('token')||'';let tenantSlug=qs.get('tenant')||'';const oauthError=qs.get('error')||'';const inviteMode=!!token;const portal=()=>inviteMode?'/portal.html?token='+encodeURIComponent(token):'/my-events.html';function apply(t){const brand=CSBrand.apply(t,{replaceShell:false});business.textContent=t.business_name||'Celebration Suite Client Portal';logo.src=brand.logo_url;logo.hidden=false;fallback.hidden=true;document.documentElement.style.setProperty('--primary',brand.primary);document.documentElement.style.setProperty('--secondary',brand.secondary);document.documentElement.style.setProperty('--accent',brand.accent)}async function init(){if(!tenantSlug&&!token&&window.CSCustomDomain){const t=await CSCustomDomain.resolve();tenantSlug=t?.slug||''}if(oauthError)loading.textContent=oauthError;try{const qp=inviteMode?'token='+encodeURIComponent(token):'tenant='+encodeURIComponent(tenantSlug);const s=await WLP.api('client-auth-session?'+qp).catch(()=>null);if(s?.authenticated){location=portal();return}const d=await WLP.api('client-auth-info?'+qp);apply(d.tenant);eventTitle.textContent=inviteMode?(d.event?.title||'Your Event'):'Client Planning Portal';loading.hidden=true;auth.hidden=false;if(inviteMode){googleBtn.hidden=false;googleBtn.href='/.netlify/functions/google-auth-start?audience=client&token='+encodeURIComponent(token)+'&return='+encodeURIComponent(portal());firstTime.hidden=false;forgotLink.href='/forgot-password.html?type=client&portal='+encodeURIComponent(token);forgotLink.textContent='Forgot password?';if(d.account_exists)firstTime.open=false}else{googleBtn.hidden=true;firstTime.hidden=true;forgotLink.removeAttribute('href');forgotLink.textContent='Need to reset access? Use your event invitation link or contact your planner.';forgotLink.style.pointerEvents='none'}}catch(e){loading.textContent=e.message}}loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.textContent='Signing in…';const d=Object.fromEntries(new FormData(loginForm));if(inviteMode)d.token=token;else d.tenant=tenantSlug;try{await WLP.api('client-auth-login',{method:'POST',body:JSON.stringify(d)});location=portal()}catch(er){loginMsg.textContent=er.message;if(/Authenticator code required/i.test(er.message)){otpWrap.hidden=false;loginForm.elements.otp.required=true;loginForm.elements.otp.focus()}}};setupForm.onsubmit=async e=>{e.preventDefault();if(!inviteMode)return;setupMsg.textContent='Creating login…';const d=Object.fromEntries(new FormData(setupForm));d.token=token;try{await WLP.api('client-auth-setup',{method:'POST',body:JSON.stringify(d)});location=portal()}catch(er){setupMsg.textContent=er.message}};init();</script></body></html>
