<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Client Sign In</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="public-shell"><div class="card"><div class="brand" style="margin-bottom:18px"><div class="brand-mark"><img id="logo" alt=""><span id="fallback" class="brand-fallback">EP</span></div><div><h2 id="business" style="margin:0">Client Portal</h2><div id="eventTitle" class="muted">Loading…</div></div></div><div id="loading">Loading invitation…</div><div id="auth" hidden><a id="googleBtn" class="btn" style="width:100%;justify-content:center;margin-bottom:14px">Continue with Google</a><div style="text-align:center" class="muted">or use email and password</div><form id="loginForm" class="grid" style="margin-top:14px"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn primary">Sign In</button><div id="loginMsg"></div></form><details id="firstTime" style="margin-top:20px"><summary><strong>First time here? Create your client password</strong></summary><p class="muted">Use the email address your planner invited. You can also use Google above with that same email.</p><form id="setupForm" class="grid"><div class="field"><label>Your name</label><input name="full_name"></div><div class="field"><label>Create password</label><input name="password" type="password" minlength="10" required></div><button class="btn">Create Client Login</button><div id="setupMsg"></div></form></details></div></div></main><script src="/assets/app.js"></script><script>const qs=new URLSearchParams(location.search),token=qs.get('token')||'',oauthError=qs.get('error')||'';const portal=()=>'/portal.html?token='+encodeURIComponent(token);function apply(t){const b=t.branding||{};business.textContent=t.business_name||'Client Portal';if(b.logo_url){logo.src=b.logo_url;logo.hidden=false;fallback.hidden=true}else{logo.hidden=true;fallback.hidden=false}}async function init(){if(oauthError)loading.textContent=oauthError;try{const s=await WLP.api('client-auth-session?token='+encodeURIComponent(token)).catch(()=>null);if(s?.authenticated){location=portal();return}const d=await WLP.api('client-auth-info?token='+encodeURIComponent(token));apply(d.tenant);eventTitle.textContent=d.event.title||'Your Event';loading.hidden=true;auth.hidden=false;googleBtn.href='/.netlify/functions/google-auth-start?audience=client&token='+encodeURIComponent(token)+'&return='+encodeURIComponent(portal());if(d.account_exists)firstTime.open=false}catch(e){loading.textContent=e.message}}loginForm.onsubmit=async e=>{e.preventDefault();loginMsg.textContent='Signing in…';const d=Object.fromEntries(new FormData(loginForm));d.token=token;try{await WLP.api('client-auth-login',{method:'POST',body:JSON.stringify(d)});location=portal()}catch(er){loginMsg.textContent=er.message}};setupForm.onsubmit=async e=>{e.preventDefault();setupMsg.textContent='Creating login…';const d=Object.fromEntries(new FormData(setupForm));d.token=token;try{await WLP.api('client-auth-setup',{method:'POST',body:JSON.stringify(d)});location=portal()}catch(er){setupMsg.textContent=er.message}};init();</script></body></html>
