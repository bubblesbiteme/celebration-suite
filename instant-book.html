<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Online</title><link rel="stylesheet" href="/assets/app.css"><style>
body{background:#f7f4ef}.store{max-width:1000px;margin:auto;padding:24px}.head{display:flex;gap:16px;align-items:center}.logo{width:64px;height:64px;object-fit:contain;border-radius:14px;background:#fff;padding:5px}.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.pkg{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.pkg.selected{outline:3px solid var(--primary,#A9B89A)}.success{background:#eef8ef;border:1px solid #bddcbe;padding:18px;border-radius:16px}.addon{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
</style></head><body><main class="store"><div id="app">Loading booking storefront…</div></main><script src="/assets/app.js"></script><script>
const app=document.getElementById('app'),q=new URLSearchParams(location.search),tenant=q.get('tenant'),token=q.get('token'),session_id=q.get('session_id');let d,selected=null;const esc=WLP.esc,money=n=>'$'+Number(n||0).toFixed(2);
function brand(t){const b=t.branding||{};document.documentElement.style.setProperty('--primary',b.primary||'#A9B89A');document.documentElement.style.setProperty('--secondary',b.secondary||'#37243F');document.title=`Book Online — ${t.business_name}`}
function head(){const b=d.tenant.branding||{},logo=b.logo_url||'/assets/celebration-suite-mark.svg';return `<div class="head"><img class="logo" src="${esc(logo)}"><div><h1 style="margin:0">${esc(d.tenant.business_name)}</h1><div class="muted">Instant Booking</div></div></div>`}
async function load(){try{const p=new URLSearchParams();if(token)p.set('token',token);else p.set('tenant',tenant||'');if(session_id)p.set('session_id',session_id);d=await WLP.api('instant-book-public?'+p);brand(d.tenant);token?renderOrder():render()}catch(e){app.innerHTML=`<div class="card"><h1>Online Booking</h1><p>${esc(e.message)}</p></div>`}}
function renderOrder(){const o=d.order;app.innerHTML=head()+`<div class="success"><h2>${d.booked?'You’re booked':'Booking checkout'}</h2><p>${esc(o.customer_name)}, your ${esc(d.package?.name||'event')} for <strong>${esc(o.event_date)}</strong> is ${d.booked?'confirmed':'not yet complete'}.</p><p>Total: <strong>${money(o.subtotal)}</strong> · Due now: <strong>${money(o.amount_due_now)}</strong></p>${d.booked?'<p>Your planner now has an event workspace for your booking and will follow up with next steps.</p>':'<p>If payment was canceled, return to the booking page and submit again. The date is only temporarily held.</p>'}</div>`}
function render(){app.innerHTML=head()+`<div class="card"><p>${esc(d.settings.booking_intro||'Choose a package and event date to book online.')}</p></div><div class="packages">${d.packages.map(p=>`<button type="button" class="pkg" data-id="${p.id}"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><strong>${money(p.price)}</strong><div class="muted">${p.deposit_type==='full'?'Full payment due':p.deposit_type==='fixed'?money(p.deposit_value)+' due now':p.deposit_value+'% due now'}</div></button>`).join('')}</div><form id="form" class="card" style="margin-top:16px"><h2>Booking details</h2><input type="hidden" name="package_id" id="packageId"><div class="grid cols-2"><div class="field"><label>Event date</label><input name="event_date" id="eventDate" type="date" required></div><div class="field"><label>Name</label><input name="customer_name" required></div><div class="field"><label>Email</label><input name="customer_email" type="email" required></div><div class="field"><label>Phone</label><input name="customer_phone"></div><div class="field"><label>Venue / location</label><input name="venue"></div><div class="field"><label>Notes</label><input name="notes"></div></div><h3>Add-ons</h3>${d.addons.map(a=>`<label class="addon"><input type="checkbox" name="addon" value="${a.id}"><span><strong>${esc(a.name)}</strong> — ${money(a.price)}<br><span class="muted">${esc(a.description||'')}</span></span></label>`).join('')||'<p class="muted">No add-ons available.</p>'}<p class="muted">${esc(d.settings.booking_terms||'Your date is held temporarily during checkout and confirmed when payment succeeds.')}</p><button class="btn primary">Book now</button> <span id="msg"></span></form>`;document.querySelectorAll('.pkg').forEach(x=>x.onclick=()=>{document.querySelectorAll('.pkg').forEach(y=>y.classList.remove('selected'));x.classList.add('selected');selected=x.dataset.id;document.getElementById('packageId').value=selected});document.getElementById('form').onsubmit=submit}
async function submit(e){e.preventDefault();const msg=document.getElementById('msg');if(!selected){msg.textContent='Choose a package first.';return}try{msg.textContent='Checking date…';const f=Object.fromEntries(new FormData(e.target)),addon_ids=[...e.target.querySelectorAll('input[name=addon]:checked')].map(x=>x.value);const r=await WLP.api('instant-book-public?tenant='+encodeURIComponent(tenant),{method:'POST',body:JSON.stringify({...f,addon_ids})});location.href=r.url||`/instant-book.html?token=${encodeURIComponent(r.token)}`;}catch(err){msg.textContent=err.message}}
load();
</script></body></html>
