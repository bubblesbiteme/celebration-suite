<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Reset Password | Celebration Suite</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:560px;margin:55px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"></div><div class="card"><div class="badge">ACCOUNT SECURITY</div><h1>Reset Your Password</h1><p class="muted">Enter the email used for your Celebration Suite account. Reset links expire after 24 hours.</p><form id="form" class="grid"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div><button class="btn primary">Send Reset Link</button><div id="msg"></div></form><div style="margin-top:18px"><a href="/login.html">Back to planner sign in</a></div></div></main><script>const q=new URLSearchParams(location.search),type=q.get('type')||'tenant',portal=q.get('portal')||'';form.onsubmit=async e=>{e.preventDefault();msg.textContent='Sending…';const d=Object.fromEntries(new FormData(form));d.account_type=type;d.portal_token=portal;try{const r=await fetch('/.netlify/functions/password-reset-request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)}),o=await r.json();if(!r.ok)throw new Error(o.error||'Unable to send reset link.');msg.textContent=o.message||'Check your email for the reset link.'}catch(err){msg.textContent=err.message}};</script></body></html>
