<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Choose New Password | Celebration Suite</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:560px;margin:55px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"></div><div class="card"><div class="badge">SECURE RESET</div><h1>Choose a New Password</h1><p class="muted">Use at least 10 characters.</p><form id="form" class="grid"><div class="field"><label>New password</label><input name="password" type="password" minlength="10" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="10" required autocomplete="new-password"></div><button class="btn primary">Update Password</button><div id="msg"></div></form></div></main><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',type=q.get('type')||'tenant',portal=q.get('portal')||'';if(!token)msg.textContent='This reset link is invalid.';form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));if(d.password!==d.confirm){msg.textContent='Passwords do not match.';return}msg.textContent='Updating…';try{const r=await fetch('/.netlify/functions/password-reset-complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:d.password})}),o=await r.json();if(!r.ok)throw new Error(o.error||'Unable to reset password.');msg.textContent='Password updated. Redirecting…';setTimeout(()=>{if(type==='platform')location='/platform-login.html';else if(type==='client')location='/client-login.html?token='+encodeURIComponent(portal||o.context?.portal_token||'');else location='/login.html'},800)}catch(err){msg.textContent=err.message}};</script></body></html>
