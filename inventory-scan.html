<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Inventory Scan</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark product-mark"><img src="/assets/celebration-suite-mark.svg"></div><div><div class="brand-title">Celebration Suite</div><small>Inventory Scan</small></div></div><div class="top-actions"><a class="btn" href="/inventory.html">← Inventory</a></div></header><main style="max-width:760px;margin:auto"><div class="page-head"><div><h1>Scan / Look Up Inventory</h1><p class="muted">Enter or scan a QR/barcode value to see the item, photo and storage location.</p></div></div><div class="card grid"><div class="field"><label>QR / barcode / SKU</label><div class="toolbar"><input id="code" style="flex:1" autofocus><button id="lookup" class="btn primary">Look up</button></div></div><div id="result"></div></div></main><script src="/assets/app.js"></script><script>async function find(){result.innerHTML='Searching…';try{const d=await WLP.api('inventory?action=lookup&code='+encodeURIComponent(code.value));const x=d.item;if(!x){result.innerHTML='<p>No matching inventory item.</p>';return}result.innerHTML=`<div class="grid cols-2">${x.image_url?`<img src="${WLP.esc(x.image_url)}" style="width:100%;max-height:330px;object-fit:contain;border-radius:14px">`:''}<div><h2>${WLP.esc(x.name)}</h2><p><strong>Storage:</strong> ${WLP.esc(x.storage_location||'Not assigned')}</p><p><strong>Available quantity:</strong> ${Number(x.quantity||0)}</p><p><strong>Condition:</strong> ${WLP.esc(x.condition||'good')}</p><p><strong>SKU:</strong> ${WLP.esc(x.sku||'—')}</p><p><strong>Code:</strong> ${WLP.esc(x.barcode||'—')}</p></div></div>`}catch(e){result.textContent=e.message}}lookup.onclick=find;code.onkeydown=e=>{if(e.key==='Enter')find()};const q=new URLSearchParams(location.search).get('code');if(q){code.value=q;find()}</script></body></html>
