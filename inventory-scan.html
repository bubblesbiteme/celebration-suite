<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#3a2340"><title>Inventory Scan | Celebration Suite</title><style>:root{--ink:#251a2a;--cream:#fbf8f2;--sage:#9eb18f;--lime:#d8f45f;--muted:#6f6871}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif}.top{background:#3a2340;color:white;border-top:4px solid #6d2eb8;padding:14px 18px;font-weight:900}.wrap{max-width:620px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #ddd5df;border-radius:22px;padding:20px;box-shadow:0 14px 34px rgba(45,30,48,.09)}h1{margin:0 0 4px;font:700 1.8rem Georgia,serif}.muted{color:var(--muted)}.code{display:inline-block;background:var(--lime);border-radius:999px;padding:7px 11px;font-weight:900;font-family:monospace}.photo{width:100%;max-height:340px;aspect-ratio:4/3;object-fit:contain;background:#f6f6f2;border:1px solid #d9ded7;border-radius:16px;margin:12px 0 4px}.location{background:#eff5e9;border:1px solid #9eb18f;border-radius:15px;padding:16px;margin:14px 0}.location span{display:block;color:#42563d;font-size:.9rem;font-weight:700}.location strong{display:block;font-size:1.35rem;overflow-wrap:anywhere;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.field{border:1px solid #ddd5df;border-radius:15px;padding:13px;background:#fffaf2}.field b{display:block;margin-top:3px;font-size:1.08rem}.wide{grid-column:1/-1}.btn{display:inline-block;border:1px solid #ddd5df;border-radius:10px;padding:10px 15px;background:white;color:var(--ink);text-decoration:none;font-weight:900;margin-top:14px}.hidden{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div class="top">Celebration Suite · Inventory Scan</div><main class="wrap"><section class="card"><div id="loading"><h1>Loading inventory…</h1><p class="muted">Checking the scanned inventory code.</p></div><div id="result" class="hidden"></div><div id="error" class="hidden"></div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const code=new URLSearchParams(location.search).get('code')||'';if(!code){loading.classList.add('hidden');error.classList.remove('hidden');error.innerHTML='<h1>No inventory code found</h1><p class="muted">Scan an inventory QR label again.</p><a class="btn" href="/inventory.html">Open Master Inventory</a>';return}try{const r=await fetch('/.netlify/functions/inventory?action=lookup&code='+encodeURIComponent(code),{credentials:'same-origin'});const j=await r.json();if(!r.ok)throw new Error(j.error||'Inventory item not found.');const i=j.item;if(!i)throw new Error('Inventory item not found.');const sku=i.qr_code||i.sku||code;loading.classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<h1>${esc(i.name)}</h1><p><span class="code">${esc(sku)}</span></p>${i.image_url?`<img class="photo" src="${esc(i.image_url)}" alt="Photo of ${esc(i.name)}">`:'<p class="muted">No item photo uploaded yet.</p>'}<div class="location"><span>📍 STORAGE LOCATION</span><strong>${esc(i.storage_location||'Not assigned yet')}</strong></div><div class="grid"><div class="field"><span class="muted">SKU / Internal ID</span><b>${esc(i.sku||sku)}</b></div><div class="field"><span class="muted">Category</span><b>${esc(i.category||'—')}</b></div><div class="field"><span class="muted">Quantity Owned</span><b>${esc(i.quantity)} ${esc(i.unit||'each')}</b></div><div class="field"><span class="muted">Condition</span><b>${esc(i.condition||'good')}</b></div><div class="field wide"><span class="muted">Status</span><b>${i.is_active===false?'Archived':'Active'}</b></div>${i.notes?`<div class="field wide"><span class="muted">Notes</span><b>${esc(i.notes)}</b></div>`:''}</div><a class="btn" href="/inventory.html">Open Master Inventory</a>`}catch(e){loading.classList.add('hidden');error.classList.remove('hidden');error.innerHTML=`<h1>Could not load item</h1><p class="muted">${esc(e.message)}</p><a class="btn" href="/inventory.html">Open Master Inventory</a>`}})();
</script></body></html>
