<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><title>Inventory QR Scanner</title><link rel="stylesheet" href="/assets/app.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>main{max-width:820px;margin:auto}#reader{max-width:520px;margin:12px auto}.scan-card{text-align:center}.item-photo{width:100%;max-height:350px;object-fit:contain;border-radius:16px}</style></head><body><header class="topbar"><div class="brand"><div class="brand-title">Inventory QR Scanner</div><small>Scan a label to find, reserve, check out, or return inventory</small></div><div class="top-actions"><a class="btn" href="/inventory.html">← Inventory</a></div></header><main><div class="card scan-card"><h1>Scan Inventory</h1><p class="muted">Use your phone camera or the scanner below. The item photo and storage location appear immediately.</p><div id="reader"></div><div class="toolbar" style="justify-content:center"><button id="start" class="btn primary" onclick="startScan()">Start Camera</button><button id="stop" class="btn" hidden onclick="stopScan()">Stop Camera</button></div><div class="toolbar" style="justify-content:center;margin-top:12px"><input id="code" placeholder="QR / barcode / SKU" autofocus><button class="btn primary" onclick="find()">Look Up</button></div></div><div id="result" class="card" style="margin-top:14px"><div class="empty">Scan an item to begin.</div></div></main><script src="/assets/app.js"></script><script>
let scanner;async function startScan(){if(!window.Html5Qrcode)return alert('Camera scanner could not load.');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},txt=>{const v=txt.includes('inventory-scan.html?code=')?new URL(txt).searchParams.get('code'):txt;code.value=v;find();stopScan()},()=>{});start.hidden=true;stop.hidden=false}async function stopScan(){try{await scanner?.stop()}catch{}start.hidden=false;stop.hidden=true}
async function find(){result.innerHTML='Searching…';try{const d=await WLP.api('inventory?action=lookup&code='+encodeURIComponent(code.value));const x=d.item;if(!x){result.innerHTML='<div class="empty">No matching inventory item.</div>';return}const rs=d.reservations||[];result.innerHTML=`<div class="grid cols-2">${x.image_url?`<img class="item-photo" src="${WLP.esc(x.image_url)}">`:'<div class="empty">No item photo yet.</div>'}<div><h2>${WLP.esc(x.name)}</h2><p><strong>Storage location:</strong><br>${WLP.esc(x.storage_location||'Not assigned')}</p><p><strong>Quantity owned:</strong> ${Number(x.quantity||0)}</p><p><strong>Condition:</strong> ${WLP.esc(x.condition||'good')}</p><p><strong>SKU:</strong> ${WLP.esc(x.sku||'—')}</p><p><strong>QR:</strong> ${WLP.esc(x.qr_code||'—')}</p></div></div><hr><h3>Reservations</h3>${rs.length?rs.map(r=>`<div class="notice"><strong>${WLP.esc(r.tenant_events?.title||'Event')}</strong> · ${r.tenant_events?.event_date?WLP.fmtDate(r.tenant_events.event_date):''}<br><span class="badge">${r.quantity} reserved</span> <span class="badge">Manual ${Number(r.manual_quantity||0)}</span> <span class="badge">Design ${Number(r.design_quantity||0)}</span> <span class="badge">${WLP.esc(r.reservation_status||'reserved')}</span></div>`).join(''):'<p class="muted">No current reservations.</p>'}`;}catch(e){result.textContent=e.message}}
code.onkeydown=e=>{if(e.key==='Enter')find()};const q=new URLSearchParams(location.search).get('code');if(q){code.value=q;find()}
</script><script src="/assets/ui-v019.js"></script></body></html>
