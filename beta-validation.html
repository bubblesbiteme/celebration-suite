<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beta Validation · Celebration Suite</title><style>body{font:14px system-ui;margin:0;background:#f6f5f2;color:#242024}.top{background:#37243F;color:white;padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.shell{max-width:1250px;margin:22px auto;padding:0 16px}.btn,input,select,textarea{font:inherit}.btn{border:1px solid #cfcac4;background:white;color:#242024;padding:8px 11px;border-radius:9px;text-decoration:none;cursor:pointer}.primary{background:#37243F;color:white;border-color:#37243F}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#6b656a}.big{font-size:28px;font-weight:800}.GO{color:#18794e}.CONDITIONAL{color:#9a6700}.NO-GO{color:#b42318}.check{border-top:1px solid #eee;padding:12px 0}.sev{font-weight:800}.P0{color:#b42318}.P1{color:#9a6700}.P2{color:#566}.status-pass{color:#18794e}.status-fail,.status-blocked{color:#b42318}textarea{width:100%;min-height:58px;box-sizing:border-box;margin-top:7px}.issue{border-left:4px solid #ddd;padding:10px 12px;background:#fafafa;margin:8px 0}.issue.P0{border-color:#b42318}.issue.P1{border-color:#9a6700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar>*{min-height:36px}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}}</style>  <link rel="stylesheet" href="/assets/premium-experience.css">
</head><body><header class="top"><div><b>Celebration Suite · Beta Validation</b><div style="opacity:.75;font-size:12px">Deployment acceptance, issue triage and launch decision</div></div><div><a class="btn" href="/launch-readiness.html">Launch Readiness</a> <a class="btn" href="/platform-admin.html">Platform Admin</a></div></header><main class="shell"><div class="grid"><section class="card"><h2>Validation runs</h2><div class="toolbar"><select id="tenant"></select><select id="env"><option>staging</option><option>production</option></select></div><input id="runName" style="width:100%;box-sizing:border-box" placeholder="Run name" value="First paying customer acceptance"><p><button class="btn primary" id="create">Start validation run</button></p><div id="runs"></div></section><section class="card"><div id="detail"><h2>Select or create a validation run</h2><p class="muted">Each run includes the complete planner → client → event → payment → event-day launch journey.</p></div></section></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let base={},current=null;
async function api(url,opt){const r=await fetch(url,{headers:{'content-type':'application/json',...(opt?.headers||{})},...opt});if(r.status===401){location='/platform-login.html';throw Error('Unauthorized')}const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){base=await api('/.netlify/functions/platform-beta-validation');tenant.innerHTML=(base.tenants||[]).map(t=>`<option value="${esc(t.id)}">${esc(t.business_name)}${t.launch_blocked?' · BLOCKED':''}</option>`).join('');runs.innerHTML=(base.runs||[]).map(r=>`<p><button class="btn" onclick="openRun('${esc(r.id)}')"><b>${esc(r.name)}</b></button><br><span class="muted">${esc(r.environment)} · ${new Date(r.started_at).toLocaleString()}</span></p>`).join('')||'<p class="muted">No validation runs yet.</p>'}
create.onclick=async()=>{try{const d=await api('/.netlify/functions/platform-beta-validation',{method:'POST',body:JSON.stringify({action:'create_run',tenant_id:tenant.value,environment:env.value,name:runName.value,release_version:'1.0.1'})});await load();render(d)}catch(e){alert(e.message)}};
window.openRun=async id=>render(await api('/.netlify/functions/platform-beta-validation?run_id='+encodeURIComponent(id)));
function render(d){current=d;const s=d.summary,r=d.run;detail.innerHTML=`<div class="row" style="justify-content:space-between"><div><h2 style="margin-bottom:4px">${esc(r.name)}</h2><div class="muted">${esc(r.environment)} · Release ${esc(r.release_version)}</div></div><div class="big ${esc(s.decision)}">${esc(s.decision)}</div></div><div class="row" style="margin:14px 0"><b>${s.passed}/${s.total} passed</b><span>· ${s.pending} pending</span><span class="P0">· ${s.p0_blockers} P0 blockers</span><span class="P1">· ${s.p1_open} P1 open</span></div><div class="row"><button class="btn" onclick="addIssue()">Log issue</button><a class="btn" target="_blank" href="/.netlify/functions/platform-beta-report?run_id=${esc(r.id)}">Open launch report</a><button class="btn" onclick="finishRun()">Mark run complete</button></div><h3>Acceptance checks</h3>${d.checks.map(ch=>`<div class="check"><div class="row"><span class="sev ${esc(ch.severity)}">${esc(ch.severity)}</span><b>${esc(ch.category)} · ${esc(ch.title)}</b><select onchange="setCheck('${esc(ch.id)}',this.value)"><option value="pending" ${ch.status==='pending'?'selected':''}>Pending</option><option value="pass" ${ch.status==='pass'?'selected':''}>Pass</option><option value="fail" ${ch.status==='fail'?'selected':''}>Fail</option><option value="blocked" ${ch.status==='blocked'?'selected':''}>Blocked</option><option value="not_applicable" ${ch.status==='not_applicable'?'selected':''}>N/A</option></select></div><div class="muted">${esc(ch.description||'')}</div><textarea id="ev_${esc(ch.id)}" placeholder="Evidence, test account, URL, transaction/session ID…">${esc(ch.evidence||'')}</textarea><textarea id="nt_${esc(ch.id)}" placeholder="Notes">${esc(ch.notes||'')}</textarea><button class="btn" onclick="saveNotes('${esc(ch.id)}')">Save evidence</button></div>`).join('')}<h3>Issues</h3><div id="issues">${d.issues.map(x=>`<div class="issue ${esc(x.severity)}"><div class="row"><b>${esc(x.severity)} · ${esc(x.title)}</b><select onchange="setIssue('${esc(x.id)}',this.value)"><option ${x.status==='open'?'selected':''}>open</option><option ${x.status==='in_progress'?'selected':''}>in_progress</option><option ${x.status==='fixed'?'selected':''}>fixed</option><option ${x.status==='deferred'?'selected':''}>deferred</option><option ${x.status==='wont_fix'?'selected':''}>wont_fix</option></select></div><div>${esc(x.description||'')}</div><div class="muted">${esc(x.resolution||'')}</div></div>`).join('')||'<p class="muted">No issues recorded.</p>'}</div>`}
async function refresh(){if(current)render(await api('/.netlify/functions/platform-beta-validation?run_id='+encodeURIComponent(current.run.id)))}
window.setCheck=async(id,status)=>{await api('/.netlify/functions/platform-beta-validation',{method:'PATCH',body:JSON.stringify({kind:'check',id,status})});await refresh()};
window.saveNotes=async id=>{await api('/.netlify/functions/platform-beta-validation',{method:'PATCH',body:JSON.stringify({kind:'check',id,evidence:document.getElementById('ev_'+id).value,notes:document.getElementById('nt_'+id).value})});await refresh()};
window.setIssue=async(id,status)=>{let resolution=null;if(['fixed','wont_fix'].includes(status))resolution=prompt('Resolution / reason:','')||'';await api('/.netlify/functions/platform-beta-validation',{method:'PATCH',body:JSON.stringify({kind:'issue',id,status,resolution})});await refresh()};
window.addIssue=async()=>{if(!current)return;const title=prompt('Issue title:');if(!title)return;const severity=(prompt('Severity: P0, P1 or P2','P1')||'P1').toUpperCase(),description=prompt('What happened / impact:','')||'';await api('/.netlify/functions/platform-beta-validation',{method:'POST',body:JSON.stringify({action:'issue',run_id:current.run.id,severity,title,description})});await refresh()};
window.finishRun=async()=>{if(!current)return;if(!confirm('Mark this validation run complete?'))return;await api('/.netlify/functions/platform-beta-validation',{method:'PATCH',body:JSON.stringify({kind:'run',id:current.run.id,status:'completed'})});await refresh()};
load().catch(e=>detail.textContent=e.message);
</script>  <script src="/assets/premium-experience.js" defer></script>
</body></html>
