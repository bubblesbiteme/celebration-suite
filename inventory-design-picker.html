<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose Inventory for Inspiration | Celebration Suite</title>
<style>
:root{--ink:#251a2a;--plum:#3a2340;--sage:#70866a;--cream:#fbf8f2;--paper:#fff;--muted:#746b75;--line:#ddd5df}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Inter,system-ui,Arial,sans-serif}.top{background:var(--plum);color:#fff;padding:20px 26px}.top h1{margin:0 0 5px;font:700 1.7rem Georgia,serif}.top p{margin:0;color:#eadfeb}.wrap{max-width:1120px;margin:auto;padding:24px}.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:800;text-decoration:none;margin-bottom:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 28px rgba(45,30,48,.06)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.toolbar label{font-weight:800}.toolbar input{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}.count{color:var(--muted);font-weight:700;padding-bottom:10px}.msg{min-height:24px;color:var(--muted);font-weight:700;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.photo{aspect-ratio:4/3;background:#f0ece6;display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.no-photo{color:#8b838b;font-weight:800}.body{padding:12px;display:flex;flex-direction:column;gap:7px;flex:1}.body h3{margin:0;font-size:1rem}.meta{color:var(--muted);font-size:.82rem;line-height:1.35}.qtyrow{display:flex;align-items:center;gap:8px;margin-top:auto}.qtyrow input{width:74px;border:1px solid var(--line);border-radius:9px;padding:9px}.add{border:0;background:var(--sage);color:#fff;border-radius:9px;padding:10px 12px;font-weight:850;cursor:pointer;flex:1}.add:disabled{opacity:.55;cursor:wait}.empty{grid-column:1/-1;border:1px dashed #cfc5d1;border-radius:14px;padding:36px;text-align:center;color:var(--muted)}@media(max-width:620px){.toolbar{grid-template-columns:1fr}.wrap{padding:16px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style>  



  <link rel="stylesheet" href="/assets/premium-experience.css">
  <link rel="stylesheet" href="/assets/ultra-luxury.css">
</head><body>
<header class="top"><h1>Choose inventory for the inspiration board</h1><p>Propose an item and quantity to your client. Adding it here does not reserve stock until the design is approved.</p></header>
<main class="wrap"><a id="back" class="back" href="/app.html">← Back to event workspace</a><section class="panel"><div class="toolbar"><label>Search inventory<input id="filter" type="search" placeholder="SKU, item name, category, storage location"></label><div id="count" class="count"></div></div><div id="msg" class="msg" role="status"></div><div id="items" class="grid"></div></section></main>
<script src="/assets/runtime-compat.js"></script><script src="/assets/tenant-branding.js"></script><script>
const params=new URLSearchParams(location.search);const eventId=params.get('booking_id')||params.get('event_id')||params.get('id')||'';const requestedReturn=params.get('return_to')||'';function safeReturn(){try{const u=new URL(requestedReturn||('/event-workspace.html?id='+encodeURIComponent(eventId)+'&tab=design'),location.origin);if(u.origin!==location.origin)return '/event-workspace.html?id='+encodeURIComponent(eventId)+'&tab=design';return u.pathname+u.search+u.hash}catch{return '/event-workspace.html?id='+encodeURIComponent(eventId)+'&tab=design'}}
const root=document.getElementById('items'),msg=document.getElementById('msg'),filter=document.getElementById('filter'),count=document.getElementById('count'),back=document.getElementById('back');
back.href=eventId?'/event-workspace.html?id='+encodeURIComponent(eventId)+'&tab=design':'/app.html';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let inventory=[];
async function api(url,opts){const r=await fetch(url,{credentials:'include',...opts});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{throw Error(t||'Unexpected server response.')}if(!r.ok)throw Error(d.error||d.message||('Request failed ('+r.status+')'));return d}
function draw(){const q=filter.value.trim().toLowerCase();const rows=inventory.filter(x=>[x.name,x.sku,x.category,x.storage_location].join(' ').toLowerCase().includes(q));count.textContent=rows.length+' item'+(rows.length===1?'':'s');root.innerHTML=rows.length?rows.map(x=>{const owned=Number(x.quantity??x.quantity_owned??0)||0;return `<article class="item"><div class="photo">${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}">`:'<div class="no-photo">No photo</div>'}</div><div class="body"><h3>${esc(x.name)}</h3><div class="meta">${esc(x.sku||'No SKU')}${x.category?' · '+esc(x.category):''}<br>Owned: ${owned}${x.storage_location?' · '+esc(x.storage_location):''}</div><div class="qtyrow"><label>Qty <input type="number" min="1" max="${Math.max(1,owned)}" value="1" data-qty="${x.id}"></label><button class="add" data-add="${x.id}" ${owned<1?'disabled':''}>Add to board</button></div></div></article>`}).join(''):'<div class="empty">No inventory items match this search.</div>';root.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>addItem(btn));}
async function addItem(btn){const item=inventory.find(x=>x.id===btn.dataset.add);if(!item)return;const input=root.querySelector(`[data-qty="${CSS.escape(item.id)}"]`);const quantity=Math.max(1,Math.round(Number(input?.value)||1));btn.disabled=true;const old=btn.textContent;btn.textContent='Adding…';msg.textContent='Adding '+item.name+' to the inspiration board…';try{const existing=await api('/.netlify/functions/inspiration?event_id='+encodeURIComponent(eventId));const found=(existing.items||[]).find(x=>x.inventory_item_id===item.id);let out;if(found){out={item:found,already_added:true};}else{out=await api('/.netlify/functions/inspiration?event_id='+encodeURIComponent(eventId),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({inventory_item_id:item.id,image_url:item.image_url||'',title:item.name,category:item.category||'overall',status:'idea',is_client_visible:true,requested_quantity:quantity})});}
msg.textContent=out.already_added?'Already on board. Returning to the existing item…':'Added. Returning to your inspiration board…';try{sessionStorage.removeItem('sage_event_workspace_'+eventId+'_v2')}catch{}const focus=out.item?.id||'',dest=new URL(safeReturn(),location.origin);if(focus)dest.searchParams.set('focus_item',focus);location.assign(dest.pathname+dest.search+dest.hash);}catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent=old;}}
filter.addEventListener('input',draw);
(async()=>{if(!eventId){msg.textContent='Open this page from a specific event workspace.';return}msg.textContent='Loading inventory…';try{const d=await api('/.netlify/functions/inventory?event_id='+encodeURIComponent(eventId));inventory=(d.items||[]).filter(x=>x.is_active!==false);draw();msg.textContent='';}catch(e){msg.textContent=e.message;root.innerHTML='<div class="empty">Inventory could not be loaded.</div>';}})();
</script>  



  <script src="/assets/premium-experience.js" defer></script>
  <script src="/assets/ultra-luxury.js" defer></script>
</body></html>
