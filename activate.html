<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Activate License</title><link rel="stylesheet" href="/assets/app.css"></head><body><main style="max-width:700px;margin:50px auto;padding:20px"><div class="auth-product-brand"><img src="/assets/celebration-suite-logo.svg" alt="Celebration Suite"><span>by Sage &amp; Celebration</span></div><div class="card"><div class="badge">LICENSE ACTIVATION</div><h1>Activate Your Access</h1><p>Enter the license code supplied with a Single Event or Annual marketplace purchase. Monthly Unlimited is purchased directly through secure recurring checkout.</p><form id="form" class="grid"><div class="field"><label>License code</label><input name="code" required style="text-transform:uppercase"></div><div class="field"><label>Event date <span class="muted">(Single Event only)</span></label><input name="event_date" type="date"></div><button class="btn primary">Activate License</button><div id="msg"></div></form><hr style="margin:28px 0;border:0;border-top:2px solid #111"><h2>Or Purchase Online</h2><div class="field"><label>Event date for Single Event purchase</label><input id="buyEventDate" type="date"></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="buySingle" type="button">Buy Single Event</button><button class="btn" id="buyMonthly" type="button">Buy Monthly Unlimited</button><button class="btn" id="buyAnnual" type="button">Buy Annual Unlimited</button></div><div id="buyMsg"></div><div id="checkoutStatus" class="notice" style="margin-top:14px">Checking secure checkout…</div></div></main><script src="/assets/app.js"></script><script>const params=new URLSearchParams(location.search),presetCode=params.get('code')||sessionStorage.getItem('pending_license_code')||'',presetPlan=params.get('plan')||sessionStorage.getItem('pending_plan')||'';if(presetCode)form.elements.code.value=presetCode;if(presetPlan==='annual_unlimited')buyMsg.textContent='Annual Unlimited selected.';if(presetPlan==='monthly_unlimited')buyMsg.textContent='Monthly Unlimited selected.';if(presetPlan==='single_event')buyMsg.textContent='Single Event selected. Enter the event date before purchase.';form.onsubmit=async e=>{e.preventDefault();msg.textContent='Activating…';try{await WLP.api('redeem-license',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});sessionStorage.removeItem('pending_license_code');sessionStorage.removeItem('pending_plan');location='/onboarding.html'}catch(err){msg.textContent=err.message}};async function buy(plan){buyMsg.textContent='Opening secure checkout…';try{const d=await WLP.api('checkout-create',{method:'POST',body:JSON.stringify({plan_type:plan,event_date:buyEventDate.value})});location=d.url}catch(e){buyMsg.textContent=e.message}}buySingle.onclick=()=>buy('single_event');buyMonthly.onclick=()=>buy('monthly_unlimited');buyAnnual.onclick=()=>buy('annual_unlimited');async function checkCheckout(){try{const r=await WLP.api('checkout-readiness'),p=r.plans||{},missing=[];if(!r.stripe_key_configured)missing.push('Stripe connection');if(!p.single_event)missing.push('Single Event price');if(!p.monthly_unlimited)missing.push('Monthly price');if(!p.annual_unlimited)missing.push('Annual price');checkoutStatus.className='notice '+(r.configured?'good':'warn');checkoutStatus.textContent=r.configured?'Secure online checkout is ready.':'Checkout setup incomplete: '+missing.join(', ')+'.';buySingle.disabled=!r.stripe_key_configured||!p.single_event;buyMonthly.disabled=!r.stripe_key_configured||!p.monthly_unlimited;buyAnnual.disabled=!r.stripe_key_configured||!p.annual_unlimited}catch(e){checkoutStatus.className='notice warn';checkoutStatus.textContent='Unable to verify checkout configuration.'}};checkCheckout();</script></body></html>
