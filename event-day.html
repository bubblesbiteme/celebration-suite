<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Event Day</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">D</span></div><div><div id="biz" class="brand-title">Event Day</div><small id="sub">Command center</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><span id="syncStatus" class="muted" aria-live="polite">Connecting…</span><button class="btn" onclick="addTask()">+ Task</button><button class="btn" onclick="addIncident()">+ Incident</button><button class="btn primary" onclick="refresh(true)">Refresh</button></div></header><main><div class="page-head"><div><h1 id="title">Event Day</h1><p id="meta" class="muted"></p></div><select id="eventFilter"></select></div><div id="stats" class="kpi-row"></div><div class="grid cols-2" style="margin-top:16px"><section class="card"><h2>Run of Show / Tasks</h2><div id="tasks"></div></section><section class="card"><h2>Incident Log</h2><div id="incidents"></div></section><section class="card"><h2>Guest Check-In</h2><div id="guests"></div></section><section class="card"><div class="page-head"><h2>Guest & Ticket Check-In</h2><a id="scanQr" class="btn primary" href="#">Scan QR</a></div><div id="regs"></div></section><section class="card"><h2>Appointments / Timeline</h2><div id="appointments"></div></section><section class="card"><h2>Team on the Clock</h2><div id="labor"></div></section><section class="card"><h2>Vendors</h2><div id="vendors"></div></section><section class="card"><h2>Reserved Inventory</h2><div id="inventory"></div></section></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],data=null;function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Event Day'}async function refresh(manual=false){if(!eventFilter.value)return;if(!navigator.onLine){syncStatus.textContent='Offline';return}syncStatus.textContent='Syncing…';try{data=await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value));render();syncStatus.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){syncStatus.textContent='Sync failed';if(manual)alert(e.message)}}function render(){const e=data.event;title.textContent=e.title;meta.textContent=`${WLP.fmtDate(e.event_date)} · ${e.venue||'Venue TBD'}`;const gIn=data.guests.filter(x=>x.checked_in_at).length,rIn=(data.ticket_attendees||[]).filter(x=>x.checked_in_at).length,done=data.tasks.filter(x=>x.status==='completed').length,openInc=data.incidents.filter(x=>x.status!=='resolved').length,onClock=data.time_entries.filter(x=>x.clock_in&&!x.clock_out).length;stats.innerHTML=`<div class="card stat"><small>Guests In</small><strong>${gIn}/${data.guests.length}</strong></div><div class="card stat"><small>Tasks Complete</small><strong>${done}/${data.tasks.length}</strong></div><div class="card stat"><small>Open Incidents</small><strong>${openInc}</strong></div><div class="card stat"><small>Staff On Clock</small><strong>${onClock}</strong></div><div class="card stat"><small>Pending Approvals</small><strong>${data.approvals.filter(x=>x.status==='pending').length}</strong></div>`;tasks.innerHTML=data.tasks.length?data.tasks.map(t=>`<div class="checkin-row ${t.status==='completed'?'checked':''}"><div><strong>${WLP.esc(t.title)}</strong><br><small>${t.task_time?new Date(t.task_time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'No time'} · ${WLP.esc(t.owner_name||'Unassigned')} · ${WLP.esc(t.priority)}</small></div><button class="btn ${t.status==='completed'?'primary':''}" onclick="taskStatus('${t.id}','${t.status==='completed'?'pending':'completed'}')">${t.status==='completed'?'Done':'Complete'}</button></div>`).join(''):'<div class="empty">No event-day tasks yet.</div>';incidents.innerHTML=data.incidents.length?data.incidents.map(i=>`<div class="card" style="margin:8px 0"><div class="page-head"><div><strong>${WLP.esc(i.title)}</strong><br><small>${WLP.esc(i.severity)} · ${WLP.esc(i.status)}</small></div>${i.status==='resolved'?'':'<button class="btn" onclick="resolveIncident(\''+i.id+'\')">Resolve</button>'}</div><p>${WLP.esc(i.description||'')}</p>${i.resolution?`<small>Resolution: ${WLP.esc(i.resolution)}</small>`:''}</div>`).join(''):'<div class="empty">No incidents reported.</div>';guests.innerHTML=data.guests.length?data.guests.map(g=>`<div class="checkin-row ${g.checked_in_at?'checked':''}"><div><strong>${WLP.esc(g.full_name)}</strong><br><small>${g.party_size} guest${g.party_size===1?'':'s'} · ${WLP.esc(g.table_name||'No table')}</small></div><button class="btn ${g.checked_in_at?'primary':''}" onclick="checkin('guest','${g.id}',${g.checked_in_at?'false':'true'})">${g.checked_in_at?'In':'Check In'}</button></div>`).join(''):'<div class="empty">No guest list.</div>';regs.innerHTML=(data.ticket_attendees||[]).length?(data.ticket_attendees||[]).map(r=>`<div class="checkin-row ${r.checked_in_at?'checked':''}"><div><strong>${WLP.esc([r.first_name,r.last_name].filter(Boolean).join(' '))}</strong><br><small>${WLP.esc(r.ticket_code)} · Ticket</small></div><button class="btn ${r.checked_in_at?'primary':''}" onclick="checkin('ticket','${r.id}',${r.checked_in_at?'false':'true'})">${r.checked_in_at?'In':'Check In'}</button></div>`).join(''):'<div class="empty">No ticket holders.</div>';appointments.innerHTML=data.appointments.length?'<div class="timeline-list">'+data.appointments.map(a=>`<div class="timeline-item"><strong>${new Date(a.starts_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${WLP.esc(a.title)}</strong><br><small>${WLP.esc(a.location||'')} ${WLP.esc(a.attendee_name||'')}</small></div>`).join('')+'</div>':'<div class="empty">No appointments.</div>';labor.innerHTML=data.time_entries.length?data.time_entries.map(x=>`<p><strong>${WLP.esc(x.user_name||x.employee_name||'Team member')}</strong> · ${x.clock_out?'Clocked out':'On clock'}<br><small>${x.clock_in?new Date(x.clock_in).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):''}</small></p>`).join(''):'<p class="muted">No labor entries yet.</p>';vendors.innerHTML=data.vendors.length?data.vendors.map(v=>`<p><strong>${WLP.esc(v.category||'Vendor')}:</strong> ${WLP.esc(v.business_name)}<br><small>${WLP.esc(v.phone||v.email||'')}</small></p>`).join(''):'<p class="muted">No vendors assigned.</p>';const itemMap=Object.fromEntries(data.items.map(i=>[i.id,i]));inventory.innerHTML=data.reservations.length?data.reservations.map(r=>`<p>${r.quantity} × ${WLP.esc(itemMap[r.inventory_item_id]?.name||'Inventory item')}<br><small>${r.checked_out_at?'Checked out':'Not checked out'}${r.checked_in_at?' · Returned':''}</small></p>`).join(''):'<p class="muted">No inventory reserved.</p>'}async function checkin(kind,id,checked){await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'PATCH',body:JSON.stringify({kind,id,checked_in:checked})});await refresh()}async function taskStatus(id,status){await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'PATCH',body:JSON.stringify({kind:'task',id,status})});await refresh()}async function resolveIncident(id){const resolution=prompt('Resolution / action taken');if(resolution===null)return;await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'PATCH',body:JSON.stringify({kind:'incident',id,status:'resolved',resolution})});await refresh()}async function addTask(){if(!eventFilter.value)return alert('Choose an event first.');const title=prompt('Task');if(!title)return;const time=prompt('Time (HH:MM, optional)',''),owner_name=prompt('Owner / staff member',''),location=prompt('Location',''),priority=prompt('Priority: low, normal, high, urgent','normal'),notes=prompt('Notes','');let task_time=null;if(time&&data?.event?.event_date)task_time=new Date(data.event.event_date+'T'+time+':00').toISOString();await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'POST',body:JSON.stringify({kind:'task',title,task_time,owner_name,location,priority,notes})});await refresh()}async function addIncident(){if(!eventFilter.value)return alert('Choose an event first.');const title=prompt('Incident title');if(!title)return;const severity=prompt('Severity: low, medium, high, critical','low'),description=prompt('What happened?','');await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'POST',body:JSON.stringify({kind:'incident',title,severity,description})});await refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh();scanQr.href='/guest-checkin.html?event_id='+encodeURIComponent(eventFilter.value)}eventFilter.onchange=()=>refresh(true);window.addEventListener('focus',()=>refresh());window.addEventListener('online',()=>refresh());window.addEventListener('offline',()=>syncStatus.textContent='Offline');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)refresh()},45000);load();
</script><script src="/assets/ui-v019.js"></script></body></html>
