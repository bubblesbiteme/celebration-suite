<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Event Day</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">D</span></div><div><div id="biz" class="brand-title">Event Day</div><small id="sub">Command center</small></div></div><div class="top-actions"><a class="btn" href="/app.html">← Dashboard</a><span id="syncStatus" class="muted" aria-live="polite">Connecting…</span><button class="btn primary" onclick="refresh(true)">Refresh</button></div></header><main><div class="page-head"><div><h1 id="title">Event Day</h1><p id="meta" class="muted"></p></div><select id="eventFilter"></select></div><div id="stats" class="kpi-row"></div><div class="grid cols-2" style="margin-top:16px"><section class="card"><h2>Guest Check-In</h2><div id="guests"></div></section><section class="card"><h2>Registration Check-In</h2><div id="regs"></div></section><section class="card"><h2>Appointments / Timeline</h2><div id="appointments"></div></section><section class="card"><h2>Vendors & Inventory</h2><div id="ops"></div></section></div></main><script src="/assets/app.js"></script><script>
const requestedEvent=new URLSearchParams(location.search).get('event_id');let tenant,events=[],data=null;function brand(){const b=tenant.branding||{};for(const[k,v]of[['--brand-primary',b.primary],['--brand-secondary',b.secondary],['--brand-accent',b.accent]])if(v)document.documentElement.style.setProperty(k,v);biz.textContent=tenant.business_name+' · Event Day'}async function refresh(manual=false){if(!eventFilter.value)return;if(!navigator.onLine){syncStatus.textContent='Offline';return}syncStatus.textContent='Syncing…';try{data=await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value));render();syncStatus.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){syncStatus.textContent='Sync failed';if(manual)alert(e.message)}}function render(){const e=data.event;title.textContent=e.title;meta.textContent=`${WLP.fmtDate(e.event_date)} · ${e.venue||'Venue TBD'}`;const gIn=data.guests.filter(x=>x.checked_in_at).length,rIn=data.registrations.filter(x=>x.checked_in_at).length;stats.innerHTML=`<div class="card stat"><small>Guests In</small><strong>${gIn}/${data.guests.length}</strong></div><div class="card stat"><small>Registrations In</small><strong>${rIn}/${data.registrations.length}</strong></div><div class="card stat"><small>Appointments</small><strong>${data.appointments.length}</strong></div><div class="card stat"><small>Vendors</small><strong>${data.vendors.length}</strong></div><div class="card stat"><small>Pending Approvals</small><strong>${data.approvals.filter(x=>x.status==='pending').length}</strong></div>`;guests.innerHTML=data.guests.length?data.guests.map(g=>`<div class="checkin-row ${g.checked_in_at?'checked':''}"><div><strong>${WLP.esc(g.full_name)}</strong><br><small>${g.party_size} guest${g.party_size===1?'':'s'} · ${WLP.esc(g.table_name||'No table')}</small></div><button class="btn ${g.checked_in_at?'primary':''}" onclick="checkin('guest','${g.id}',${g.checked_in_at?'false':'true'})">${g.checked_in_at?'In':'Check In'}</button></div>`).join(''):'<div class="empty">No guest list.</div>';regs.innerHTML=data.registrations.length?data.registrations.map(r=>`<div class="checkin-row ${r.checked_in_at?'checked':''}"><div><strong>${WLP.esc(r.full_name)}</strong><br><small>${r.quantity} ticket${r.quantity===1?'':'s'} · ${WLP.esc(r.payment_status)}</small></div><button class="btn ${r.checked_in_at?'primary':''}" onclick="checkin('registration','${r.id}',${r.checked_in_at?'false':'true'})">${r.checked_in_at?'In':'Check In'}</button></div>`).join(''):'<div class="empty">No registrations.</div>';appointments.innerHTML=data.appointments.length?'<div class="timeline-list">'+data.appointments.map(a=>`<div class="timeline-item"><strong>${new Date(a.starts_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${WLP.esc(a.title)}</strong><br><small>${WLP.esc(a.location||'')} ${WLP.esc(a.attendee_name||'')}</small></div>`).join('')+'</div>':'<div class="empty">No appointments.</div>';const itemMap=Object.fromEntries(data.items.map(i=>[i.id,i]));ops.innerHTML=`<h3>Vendors</h3>${data.vendors.length?data.vendors.map(v=>`<p><strong>${WLP.esc(v.category||'Vendor')}:</strong> ${WLP.esc(v.business_name)}</p>`).join(''):'<p class="muted">No vendors assigned.</p>'}<h3>Reserved Inventory</h3>${data.reservations.length?data.reservations.map(r=>`<p>${r.quantity} × ${WLP.esc(itemMap[r.inventory_item_id]?.name||'Inventory item')}</p>`).join(''):'<p class="muted">No inventory reserved.</p>'}`}async function checkin(kind,id,checked){await WLP.api('event-day?event_id='+encodeURIComponent(eventFilter.value),{method:'PATCH',body:JSON.stringify({kind,id,checked_in:checked})});await refresh()}async function load(){const b=await WLP.api('bootstrap');tenant=b.tenant;brand();events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">Choose event</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');if(requestedEvent&&events.some(e=>e.id===requestedEvent))eventFilter.value=requestedEvent;else if(events[0])eventFilter.value=events[0].id;await refresh()}eventFilter.onchange=()=>refresh(true);window.addEventListener('focus',()=>refresh());window.addEventListener('online',()=>refresh());window.addEventListener('offline',()=>syncStatus.textContent='Offline');document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)refresh()},45000);load();
</script></body></html>
