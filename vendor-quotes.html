<!doctype html><html><head><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#38223f"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><title>Vendor Quote Comparison</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark"><span class="brand-fallback">Q</span></div><div><div class="brand-title">Vendor Quote Comparison</div><small>Compare true costs and book the best fit</small></div></div><div class="top-actions"><a class="btn" href="/vendors.html">Vendor CRM</a><a class="btn" href="/app.html">← Dashboard</a><button class="btn primary" onclick="addQuote()">+ Quote</button></div></header><main style="max-width:1300px;margin:auto"><div class="page-head"><div><h1>Vendor Quotes</h1><p class="muted">Compare base pricing, fees, deposit requirements and validity before selecting a vendor.</p></div><select id="eventFilter"><option value="">All events</option></select></div><div id="summary" class="grid cols-4"></div><div id="groups"></div></main><script src="/assets/app.js"></script><script>
let events=[],quotes=[],vendors=[];const money=n=>Number(n||0).toLocaleString(undefined,{style:'currency',currency:'USD'});async function load(){events=(await WLP.api('events')).events||[];eventFilter.innerHTML='<option value="">All events</option>'+events.map(e=>`<option value="${e.id}">${WLP.esc(e.title)}</option>`).join('');await refresh()}async function refresh(){const d=await WLP.api('vendor-quotes'+(eventFilter.value?'?event_id='+encodeURIComponent(eventFilter.value):''));quotes=d.quotes||[];vendors=d.vendors||[];draw()}function draw(){summary.innerHTML=[['Quotes',quotes.length],['Selected',quotes.filter(q=>q.status==='selected').length],['Visible to Client',quotes.filter(q=>q.client_visible).length],['Total Selected',money(quotes.filter(q=>q.status==='selected').reduce((s,q)=>s+q.total_amount,0))]].map(([k,v])=>`<div class="card"><small class="muted">${k}</small><strong style="display:block;font-size:28px">${v}</strong></div>`).join('');const cats=[...new Set(quotes.map(q=>q.category||'Uncategorized'))];groups.innerHTML=cats.map(cat=>`<section class="card"><div class="page-head"><div><h2>${WLP.esc(cat)}</h2><p class="muted">${quotes.filter(q=>(q.category||'Uncategorized')===cat).length} quote(s)</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Vendor</th><th>Base</th><th>Fees</th><th>Total</th><th>Deposit</th><th>Valid Until</th><th>Status</th><th></th></tr></thead><tbody>${quotes.filter(q=>(q.category||'Uncategorized')===cat).map(q=>`<tr><td><strong>${WLP.esc(vendors.find(v=>v.id===q.vendor_id)?.business_name||q.label||'Vendor')}</strong><br><small>${WLP.esc(q.notes||'')}</small></td><td>${money(q.base_amount)}</td><td>${money(Number(q.tax_amount)+Number(q.service_fee)+Number(q.delivery_fee)+Number(q.other_fees))}</td><td><strong>${money(q.total_amount)}</strong></td><td>${money(q.deposit_amount)}</td><td>${WLP.fmtDate(q.valid_until)}</td><td><span class="badge">${WLP.esc(q.status)}</span>${q.recommended?' <span class="badge">Recommended</span>':''}</td><td>${q.status!=='selected'?`<button class="btn primary" onclick="selectQuote('${q.id}')">Select & Book</button>`:'Booked'}</td></tr>`).join('')}</tbody></table></div></section>`).join('')||'<div class="card"><div class="empty">No vendor quotes yet.</div></div>'}async function addQuote(){const event_id=eventFilter.value||prompt('Event ID','');if(!event_id)return;const vendor_id=prompt('Vendor ID (copy from Vendor CRM)','');const category=prompt('Category','Catering');const label=prompt('Quote label','');const base_amount=prompt('Base quote','0');const tax_amount=prompt('Tax','0');const service_fee=prompt('Service fee','0');const delivery_fee=prompt('Delivery fee','0');const other_fees=prompt('Other fees','0');const deposit_amount=prompt('Deposit required','0');const valid_until=prompt('Valid until YYYY-MM-DD','');const notes=prompt('Notes','');await WLP.api('vendor-quotes',{method:'POST',body:JSON.stringify({event_id,vendor_id:vendor_id||null,category,label,base_amount,tax_amount,service_fee,delivery_fee,other_fees,deposit_amount,valid_until,notes,client_visible:true})});refresh()}async function selectQuote(id){if(!confirm('Select this quote, mark the vendor booked, and add the committed amount to the event budget?'))return;await WLP.api('vendor-quotes?action=select',{method:'POST',body:JSON.stringify({id})});refresh()}eventFilter.onchange=refresh;load();
</script><script src="/assets/ui-v019.js"></script></body></html>
